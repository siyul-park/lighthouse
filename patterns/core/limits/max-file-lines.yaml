id: core/max-file-lines
title: Files stay below a line limit
intent: Large files tend to mix responsibilities.
scope: file
requirement: "A file SHOULD stay at or below the configured line limit (option `max`)."
enforcement: heuristic
evidence: [lines, max]
options:
  max:
    type: int
    default: 1000
    description: Largest number of lines a file may have.
implementation:
  builtin: core/max-file-lines
examples:
  - name: over-limit
    language: text
    kind: invalid
    options:
      max: 2
    files:
      - path: big.txt
        body: |-
          a
          b
          c
    expect:
      - line: 3
  - name: within-limit
    language: text
    kind: valid
    options:
      max: 2
    files:
      - path: small.txt
        body: |-
          a
          b
