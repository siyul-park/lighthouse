id: testing/standard-assertions
title: Assertions use the standard library
intent: >-
  A hand-written compare-and-fail repeats what the project's assertion library
  already states, with worse failure output.
scope: test
requirement: >-
  Tests SHOULD assert through the project's standard assertion library, and a
  test helper SHOULD NOT reimplement a comparison and failure that the library
  already provides.
enforcement: heuristic
evidence: [symbol, manual_assertions]
tuning:
  go: >-
    The library is `github.com/stretchr/testify/require`. A function of a test
    file that has an `if` with no `else` whose condition compares or negates
    and whose only effect is `t.Fatal`, `t.Fatalf`, `t.Error`, `t.Errorf`,
    `t.Fail` or `t.FailNow` is reported with the number of such checks. A check
    that does more than fail, such as one that also returns, is not a plain
    assertion.
  rust: >-
    Use `assert_eq!`, `assert_ne!` and `assert!` with a message instead of
    helpers that compare and `panic!`. Not enforced for Rust, whose provider
    does not count hand-written checks.
implementation:
  builtin: testing/standard-assertions
examples:
  - name: hand-written-comparison
    language: go
    kind: invalid
    files:
      - path: go.mod
        body: |-
          module example.com/store

          go 1.26
      - path: store.go
        body: |-
          package store

          func Get() int { return 1 }
      - path: store_test.go
        body: |-
          package store_test

          import (
          	"testing"

          	"example.com/store"
          )

          func TestGet(t *testing.T) {
          	if got := store.Get(); got != 1 {
          		t.Fatalf("got %d", got)
          	}
          }
    expect:
      - line: 9
  - name: check-that-does-more
    language: go
    kind: valid
    canonical: true
    files:
      - path: go.mod
        body: |-
          module example.com/store

          go 1.26
      - path: store.go
        body: |-
          package store

          func Get() int { return 1 }
      - path: store_test.go
        body: |-
          package store_test

          import (
          	"testing"

          	"example.com/store"
          )

          func TestGet(t *testing.T) {
          	got := store.Get()
          	if got != 1 {
          		t.Errorf("got %d", got)
          		return
          	}
          }
  - name: rust-assert-macros
    language: rust
    kind: valid
    canonical: true
    files:
      - path: src/lib.rs
        body: |-
          pub fn get() -> i32 {
              1
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn get_returns_one() {
                  assert_eq!(get(), 1);
              }
          }
