id: testing/table-for-same-behavior
title: Tables for one behavior over many inputs
intent: A table says the behavior is the same and only the data differs.
scope: test
requirement: >-
  Same behavior over many inputs MUST use one inline table of named inputs and
  expected outputs, each entry one case; cases that specify the same behavior
  MUST be merged into one case or one table.
enforcement: judgment
tuning:
  go: Use an inline anonymous struct table.
