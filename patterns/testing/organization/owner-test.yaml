id: testing/owner-test
title: Every public symbol has an owner test
intent: >-
  A contract without an owner test has no place to read or extend its
  specification.
scope: test
requirement: >-
  Each public symbol SHOULD have one top-level test function, and exported
  contracts MUST have an owning test.
enforcement: heuristic
evidence: [symbol]
options:
  test_prefix:
    type: string
    default: Test
    description: Prefix of the name of an owner test; a test without it is not one.
    per_language:
      rust: ""
  snake_case:
    type: bool
    default: false
    description: Compare names in snake case, as Rust tests are written.
    per_language:
      rust: true
  variant_tests:
    type: bool
    default: true
    description: >-
      Count `TestGet_Missing` as a second owner of `Get`; a name that adds a
      suffix to the symbol's own name restates the same contract.
    per_language:
      rust: false
  kinds:
    type: list
    default: [function, method, type]
    description: >-
      Kinds of public symbols that need an owner test. Interfaces are tested
      through their implementations and are left out by default.
  include_internal:
    type: bool
    default: false
    description: Also require owner tests for symbols public only inside the project.
  include_data_types:
    type: bool
    default: false
    description: >-
      Also require owner tests for types that declare no method; such a type
      is specified by the functions that build and read it.
  exempt_methods:
    type: list
    default: [String, Error, Unwrap, GoString]
    description: Method names that implement well-known interfaces.
    per_language:
      rust: [fmt, source, from, try_from, from_str, default, drop, clone, eq, ne, partial_cmp, cmp, hash, deref, deref_mut, as_ref, as_mut, borrow, next, into_iter, index, index_mut, serialize, deserialize]
tuning:
  go: >-
    The owner of a function or type is `TestName`, of a method
    `TestType_Method`. A symbol that no test names and no test code calls or
    references is reported; a type counts as tested when one of its members is.
    Only modules that have tests are judged. Types without methods and
    interfaces are not required to have one.
  rust: >-
    The owner of a function or type is the test named after it in snake case
    (`get`, `store`), of a method `type_method`. A public item that no test
    code, in `tests/` or inline, calls or references is reported, in crates
    that have tests. Methods of trait impls and types without methods are not
    required to have one.
implementation:
  builtin: testing/owner-test
examples:
  - name: invalid
    language: go
    kind: invalid
    files:
      - path: go.mod
        body: |-
          module example.com/store

          go 1.26
      - path: store.go
        body: |-
          package store

          func Get() int { return 1 }

          func Put() int { return 2 }
      - path: store_test.go
        body: |-
          package store_test

          import (
          	"testing"

          	"example.com/store"
          )

          func TestGet(t *testing.T) {
          	if store.Get() != 1 {
          		t.Fatal("get")
          	}
          }
    expect:
      - line: 5
  - name: valid
    language: go
    kind: valid
    files:
      - path: go.mod
        body: |-
          module example.com/store

          go 1.26
      - path: store.go
        body: |-
          package store

          func Get() int { return 1 }

          func Put() int { return 2 }
      - path: store_test.go
        body: |-
          package store_test

          import (
          	"testing"

          	"example.com/store"
          )

          func TestGet(t *testing.T) {
          	if store.Get() != 1 {
          		t.Fatal("get")
          	}
          }

          func TestPutFlow(t *testing.T) {
          	if store.Put() != 2 {
          		t.Fatal("put")
          	}
          }
  - name: no-tests-at-all
    language: go
    kind: valid
    files:
      - path: store.go
        body: |-
          package store

          func Get() int { return 1 }
  - name: rust-invalid
    language: rust
    kind: invalid
    files:
      - path: src/lib.rs
        body: |-
          pub fn get() -> u8 {
              1
          }

          pub fn put() -> u8 {
              2
          }
      - path: tests/store.rs
        body: |-
          #[test]
          fn get() {
              assert_eq!(workspace::get(), 1);
          }
    expect:
      - line: 5
  - name: rust-valid
    language: rust
    kind: valid
    files:
      - path: src/lib.rs
        body: |-
          pub fn get() -> u8 {
              1
          }
      - path: tests/store.rs
        body: |-
          #[test]
          fn get() {
              assert_eq!(workspace::get(), 1);
          }
