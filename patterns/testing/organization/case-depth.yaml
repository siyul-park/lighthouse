id: testing/case-depth
title: Cases are at most two levels deep
intent: Deep nesting hides which behavior a case specifies.
scope: test
requirement: >-
  Test structure MUST have at most two levels: the test function and its
  direct cases.
enforcement: mechanical
evidence: [test, depth]
tuning:
  go: "Counts `t.Run` nesting."
  typescript: "Counts `describe` and `it` nesting."
  python: Counts class and function nesting.
