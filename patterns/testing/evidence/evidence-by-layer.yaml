id: testing/evidence-by-layer
title: Each layer proves its own facts
intent: Using the wrong layer either over-claims or leaves facts unproven.
scope: project
requirement: >-
  Each required fact MUST be proven by the layer that owns it: public tests
  prove exported behavior, errors, and lifecycle; parity tests prove
  equivalent public behavior across distinct execution paths; golden tests
  prove exact low-level output for a specified input shape; async tests prove
  publication, shutdown, and race behavior; fuzz tests prove bounded
  trust-boundary or differential properties; integration tests prove public
  end-to-end behavior.
enforcement: doc
