id: design/declaration-groups
title: Declarations follow ownership groups
intent: A fixed group order makes every file predictable.
scope: file
requirement: >-
  Top-level declarations in a file MUST follow the language's ownership-group
  order, from public contract to private mechanics. Initializers MUST stay
  together and MUST precede non-initializer functions and methods. Within one
  type, constructors MUST precede other behavior.
enforcement: mechanical
evidence: [declaration, group, expected_after]
options:
  groups:
    type: list
    default:
      - public-type
      - private-type
      - public-const
      - private-const
      - var
      - init
      - public-function
      - constructor
      - public-method
      - hook
      - private-function
    description: >-
      The group order of a file, first to last. A declaration belongs to the
      first of its candidate groups that this list names; one the list does
      not name is not ordered. Groups: `public-type`, `private-type`, `type`
      (types and the members of a type together), `public-const`,
      `private-const`, `const`, `var`, `init`, `public-function`,
      `constructor`, `public-method`, `hook`, `private-function` (private
      functions and, where `type` is not listed, private methods).
    per_language:
      rust: [const, var, type, public-function, private-function]
  constructor_prefixes:
    type: list
    default: [New]
    description: >-
      A public function whose name is one of these, or one of these followed
      by a word (`New`, `NewStore`; not `Newton`), is a constructor.
    per_language:
      rust: [new]
  hook_names:
    type: list
    default:
      - Clone
      - String
      - GoString
      - Error
      - Unwrap
      - MarshalJSON
      - UnmarshalJSON
      - MarshalText
      - UnmarshalText
      - MarshalBinary
      - UnmarshalBinary
    description: >-
      Public methods that implement clone, conversion or interface hooks; they
      follow the other public methods. Names are kept to ones that are never
      ordinary behavior.
    per_language:
      rust: []
  constructors_first:
    type: bool
    default: false
    description: >-
      A constructor method (a public method named like a constructor) must
      precede the other methods of its type in the file. Go constructors are
      functions, ordered by the `constructor` group instead.
    per_language:
      rust: true
tuning:
  go: >-
    Order: public types; private types; public constants; private constants;
    variables; all `init` functions; public options and functions; public
    constructors; public methods; clone, conversion and interface hooks; private
    functions and methods.
  rust: >-
    The same principle, from the concepts to the machinery, with a type kept
    next to its impl blocks because that is how Rust code reads. Order:
    constants; statics; types, traits and their impl blocks (types and impls
    are one group, `owner-contiguity` keeps an owner's impls together);
    public free functions; private free functions. Associated functions named
    `new` come before the other methods of their type. Items of `#[cfg(test)]`
    modules are not ordered. Visibility counts as public when it is `pub` or
    `pub(crate)`.
implementation:
  builtin: design/declaration-groups
examples:
  - name: invalid
    language: go
    kind: invalid
    files:
      - path: example.go
        body: |-
          package sample

          func helper() int { return 1 }

          type Service struct{}

          func (s *Service) Run() int { return helper() }
    expect:
      - line: 3
  - name: valid
    language: go
    kind: valid
    files:
      - path: example.go
        body: |-
          package sample

          type Service struct{}

          func (s *Service) Run() int { return helper() }

          func helper() int { return 1 }
  - name: private-method-before-public
    language: go
    kind: invalid
    files:
      - path: example.go
        body: |-
          package sample

          type Service struct{}

          func (s *Service) run() int { return 1 }

          func (s *Service) Run() int { return s.run() }
    expect:
      - line: 7
  - name: init-after-functions
    language: go
    kind: invalid
    files:
      - path: example.go
        body: |-
          package sample

          var ready bool

          func Run() bool { return ready }

          func init() { ready = true }
    expect:
      - line: 7
  - name: groups-in-order
    language: go
    kind: valid
    files:
      - path: example.go
        body: |-
          package sample

          type Service struct{ ok bool }

          type state int

          const Limit = 3

          const floor = 1

          var ready bool

          func init() { ready = true }

          func Open() *Service { return NewService() }

          func NewService() *Service { return &Service{ok: true} }

          func (s *Service) Run() int { return floor + int(state(Limit)) }

          func (s *Service) String() string { return "service" }

          func (s *Service) check() bool { return s.ok }
  - name: rust-invalid
    language: rust
    kind: invalid
    files:
      - path: src/lib.rs
        body: |-
          pub fn run() -> u8 {
              1
          }

          pub struct Store;
    expect:
      - line: 5
  - name: rust-valid
    language: rust
    kind: valid
    files:
      - path: src/lib.rs
        body: |-
          const LIMIT: u8 = 3;

          pub struct Store;

          impl Store {
              pub fn new() -> Self {
                  Store
              }

              pub fn get(&self) -> u8 {
                  LIMIT
              }
          }

          pub fn run() -> u8 {
              helper()
          }

          fn helper() -> u8 {
              1
          }
  - name: rust-constructor-after-behavior
    language: rust
    kind: invalid
    files:
      - path: src/lib.rs
        body: |-
          pub struct Store;

          impl Store {
              pub fn get(&self) -> u8 {
                  1
              }

              pub fn new() -> Self {
                  Store
              }
          }
    expect:
      - line: 8
