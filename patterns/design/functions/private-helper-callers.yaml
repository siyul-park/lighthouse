id: design/private-helper-callers
title: Private helpers have two callers
intent: A private helper with one caller is usually part of that caller.
scope: symbol
requirement: A private helper SHOULD have at least two callers.
enforcement: heuristic
severity: review
evidence: [caller, callers, statements]
tuning:
  go: >-
    A review item, not an error: a helper with one caller may be justified by
    naming a policy or isolating an abstraction level. Test callers do not
    count. Forwarding wrappers are reported by `design/single-use-wrapper`,
    and a function used as a value is not judged.
  rust: >-
    Private free functions and methods that have exactly one caller outside
    test code and are never named as a value. A method that some call may
    reach through a receiver of unknown type is not judged.
implementation:
  builtin: design/private-helper-callers
examples:
  - name: invalid
    language: go
    kind: invalid
    files:
      - path: example.go
        body: |-
          package sample

          func Run(x int) int { return clamp(x) + 1 }

          func clamp(x int) int {
          	if x > 10 {
          		return 10
          	}
          	return x
          }
    expect:
      - line: 5
  - name: valid
    language: go
    kind: valid
    files:
      - path: example.go
        body: |-
          package sample

          func Run(x int) int { return clamp(x) + 1 }

          func Other(x int) int { return clamp(x) + 2 }

          func clamp(x int) int {
          	if x > 10 {
          		return 10
          	}
          	return x
          }
  - name: rust-invalid
    language: rust
    kind: invalid
    files:
      - path: src/lib.rs
        body: |-
          pub fn run(x: u8) -> u8 {
              clamp(x) + 1
          }

          fn clamp(x: u8) -> u8 {
              if x > 10 { 10 } else { x }
          }
    expect:
      - line: 5
  - name: rust-valid
    language: rust
    kind: valid
    files:
      - path: src/lib.rs
        body: |-
          pub fn run(x: u8) -> u8 {
              clamp(x) + 1
          }

          pub fn other(x: u8) -> u8 {
              clamp(x) + 2
          }

          fn clamp(x: u8) -> u8 {
              if x > 10 { 10 } else { x }
          }
