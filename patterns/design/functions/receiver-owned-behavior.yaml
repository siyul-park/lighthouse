id: design/receiver-owned-behavior
title: Behavior lives with its owner
intent: Where a function lives tells readers who owns the behavior.
scope: symbol
requirement: >-
  Methods SHOULD express receiver-owned behavior; free functions SHOULD
  express construction or behavior with no natural receiver.
enforcement: heuristic
evidence: [owner, callers, takes_owner_param, uses_owner]
options:
  constructor_prefixes:
    type: list
    default: [New, new]
    description: >-
      A function named like one of these, or one of these followed by a word,
      is a constructor and has no receiver yet.
    per_language:
      rust: [new]
  require_owner_param:
    type: bool
    default: false
    description: >-
      Report only functions that take a value of the owner type as a
      parameter, the strongest sign that the owner should be the receiver. By
      default a function that takes one or calls or references the owner or
      one of its members is reported; a function that does neither is a
      helper with no more to do with the owner than with any other type.
tuning:
  go: >-
    A private package function with at least one production caller, every
    caller being a method of one type, never used as a value and not named like
    a constructor, is reported. Test callers do not count. A function called by
    any other function, or by methods of two types, is not judged.
  rust: >-
    The same for a private free function and the methods of one `impl` target
    type. Parameter types are not resolved for Rust, so `takes_owner_param` is
    always false there.
implementation:
  builtin: design/receiver-owned-behavior
examples:
  - name: only-one-owner-calls
    language: go
    kind: invalid
    files:
      - path: example.go
        body: |-
          package sample

          type Store struct{ items []int }

          func (s *Store) Total() int { return sum(s) }

          func (s *Store) Count() int { return len(s.items) + sum(s) - sum(s) }

          func sum(s *Store) int {
          	total := 0
          	for _, i := range s.items {
          		total += i
          	}
          	return total
          }
    expect:
      - line: 9
  - name: shared-by-a-free-function
    language: go
    kind: valid
    files:
      - path: example.go
        body: |-
          package sample

          type Store struct{ items []int }

          func (s *Store) Total() int { return sum(s) }

          func Sum(s *Store) int { return sum(s) }

          func sum(s *Store) int {
          	total := 0
          	for _, i := range s.items {
          		total += i
          	}
          	return total
          }
  - name: helper-unrelated-to-the-owner
    language: go
    kind: valid
    files:
      - path: example.go
        body: |-
          package sample

          type Store struct{ items []int }

          func (s *Store) Total() int { return sum(s.items) }

          func sum(items []int) int {
          	total := 0
          	for _, i := range items {
          		total += i
          	}
          	return total
          }
  - name: constructor-called-by-method
    language: go
    kind: valid
    files:
      - path: example.go
        body: |-
          package sample

          type Store struct{ items []int }

          func (s *Store) Reset() *Store { return newStore() }

          func newStore() *Store { return &Store{items: []int{}} }
  - name: rust-only-one-owner-calls
    language: rust
    kind: invalid
    files:
      - path: src/lib.rs
        body: |-
          pub struct Store {
              items: Vec<i32>,
          }

          impl Store {
              pub fn total(&self) -> i32 {
                  sum(self)
              }

              pub fn count(&self) -> i32 {
                  self.items.len() as i32 + sum(self)
              }
          }

          fn sum(store: &Store) -> i32 {
              let mut total = 0;
              for i in &store.items {
                  total += i;
              }
              total
          }
    expect:
      - line: 15
  - name: rust-shared-by-a-free-function
    language: rust
    kind: valid
    files:
      - path: src/lib.rs
        body: |-
          pub struct Store {
              items: Vec<i32>,
          }

          impl Store {
              pub fn total(&self) -> i32 {
                  sum(self)
              }
          }

          pub fn total_of(store: &Store) -> i32 {
              sum(store)
          }

          fn sum(store: &Store) -> i32 {
              let mut total = 0;
              for i in &store.items {
                  total += i;
              }
              total
          }
