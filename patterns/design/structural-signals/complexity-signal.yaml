id: design/complexity-signal
title: Complexity is a review signal
intent: High complexity often marks a symbol doing too much.
scope: symbol
requirement: >-
  Complexity SHOULD be judged from cyclomatic complexity together with
  statement count and nesting depth, against deliberately high thresholds.
  Cyclomatic complexity is one path plus each `if`, `else if`, loop, error
  handler clause, non-default switch arm and boolean operator (`&&`, `||`);
  nesting counts the deepest level of nested constructs, a flat body being 0,
  and nested functions count as a level.
enforcement: heuristic
exceptions: >-
  A body that is one switch whose every arm is a single return is a table in
  code form and is not reported. A body whose only top-level branching is
  one switch of any arms, nested at most two levels, is a flat dispatch: its many paths do not make
  it hard to follow, so only cognitive complexity can report it.
evidence: [cyclomatic, cognitive, statements, nesting]
options:
  cyclomatic:
    type: int
    default: 15
    description: Cyclomatic complexity that, with `statements`, marks high complexity.
  statements:
    type: int
    default: 30
    description: Statement count that, with `cyclomatic`, marks high complexity.
  structural_cyclomatic:
    type: int
    default: 10
    description: Cyclomatic complexity of the structural signal.
  structural_statements:
    type: int
    default: 25
    description: Statement count of the structural signal.
  structural_nesting:
    type: int
    default: 5
    description: Nesting depth of the structural signal; a flat body is 0.
  cognitive:
    type: int
    default: 30
    description: Cognitive complexity that, with `cognitive_statements`, marks a hard-to-follow body.
  cognitive_statements:
    type: int
    default: 30
    description: Statement count of the cognitive signal.
citation: "McCabe 1976; Campbell, Cognitive Complexity (SonarSource 2018)"
tuning:
  rust: >-
    `if`, `else if`, `if let`, `let ... else`, `while`, `for` and `loop` count as
    in other languages; a `match` counts its arms other than a wildcard or
    binding arm; `?` adds nothing; closures and `async` blocks nest what they
    contain. A function that is one `match` whose arms are single values (in
    return position) or `return`s is a table in code form and is not reported.
implementation:
  builtin: design/complexity-signal
examples:
  - name: many-branches
    language: go
    kind: invalid
    options:
      cyclomatic: 4
      statements: 7
    files:
      - path: sample.go
        body: |-
          package sample

          func classify(n int) string {
          	if n < 0 {
          		return "negative"
          	}
          	if n == 0 {
          		return "zero"
          	}
          	if n < 10 {
          		return "small"
          	}
          	return "large"
          }
    expect:
      - line: 3
  - name: deep-loops
    language: go
    kind: invalid
    options:
      cognitive: 6
      cognitive_statements: 6
    files:
      - path: sample.go
        body: |-
          package sample

          func scan(rows [][]int) int {
          	total := 0
          	for _, row := range rows {
          		for _, v := range row {
          			if v > 0 {
          				total += v
          			}
          		}
          	}
          	return total
          }
    expect:
      - line: 3
  - name: below-thresholds
    language: go
    kind: valid
    files:
      - path: sample.go
        body: |-
          package sample

          func classify(n int) string {
          	if n < 0 {
          		return "negative"
          	}
          	if n == 0 {
          		return "zero"
          	}
          	return "positive"
          }
  - name: dispatcher
    language: go
    kind: valid
    options:
      cyclomatic: 1
      statements: 1
    files:
      - path: sample.go
        body: |-
          package sample

          func name(k int) string {
          	switch k {
          	case 0:
          		return "zero"
          	case 1:
          		return "one"
          	default:
          		return "many"
          	}
          }
  - name: rust-many-branches
    language: rust
    kind: invalid
    options:
      cyclomatic: 4
      statements: 7
    files:
      - path: src/lib.rs
        body: |-
          pub fn classify(n: i32) -> &'static str {
              if n < 0 {
                  return "negative";
              }
              if n == 0 {
                  return "zero";
              }
              if n < 10 {
                  return "small";
              }
              "large"
          }
    expect:
      - line: 1
  - name: rust-deep-loops
    language: rust
    kind: invalid
    options:
      cognitive: 6
      cognitive_statements: 6
    files:
      - path: src/lib.rs
        body: |-
          pub fn scan(rows: &[Vec<i32>]) -> i32 {
              let mut total = 0;
              for row in rows {
                  for v in row {
                      if *v > 0 {
                          total += *v;
                      }
                  }
              }
              total
          }
    expect:
      - line: 1
  - name: rust-below-thresholds
    language: rust
    kind: valid
    files:
      - path: src/lib.rs
        body: |-
          pub fn classify(n: i32) -> &'static str {
              if n < 0 {
                  return "negative";
              }
              if n == 0 {
                  return "zero";
              }
              "positive"
          }
  - name: rust-dispatcher
    language: rust
    kind: valid
    options:
      cyclomatic: 1
      statements: 1
    files:
      - path: src/lib.rs
        body: |-
          pub fn name(k: u8) -> &'static str {
              match k {
                  0 => "zero",
                  1 => "one",
                  _ => "many",
              }
          }
  - name: rust-closure-and-question-mark
    language: rust
    kind: valid
    options:
      cyclomatic: 3
      statements: 4
    files:
      - path: src/lib.rs
        body: |-
          pub fn parse_all(items: &[&str]) -> Result<Vec<u32>, std::num::ParseIntError> {
              let mut out = Vec::new();
              for item in items {
                  out.push(item.parse::<u32>()?);
              }
              Ok(out)
          }
  - name: rust-inline-test-module
    language: rust
    kind: valid
    options:
      cyclomatic: 2
      statements: 2
    files:
      - path: src/lib.rs
        body: |-
          pub fn add(a: i32, b: i32) -> i32 {
              a + b
          }

          #[cfg(test)]
          mod tests {
              fn helper(n: i32) -> i32 {
                  if n > 0 {
                      return n;
                  }
                  if n < 0 {
                      return -n;
                  }
                  0
              }
          }
  - name: flat-dispatch
    language: go
    kind: valid
    options:
      cyclomatic: 4
      statements: 1
    files:
      - path: sample.go
        body: |-
          package sample

          type visitor struct{ ifs, elses, loops, calls int }

          func (v *visitor) visit(n any) *visitor {
          	switch n := n.(type) {
          	case *ifStmt:
          		v.ifs++
          		if n.hasElse {
          			v.elses++
          		}
          	case *forStmt:
          		v.loops++
          	case *callExpr:
          		v.calls++
          	}
          	return v
          }

          type ifStmt struct{ hasElse bool }
          type forStmt struct{}
          type callExpr struct{}
  - name: dispatch-among-other-statements
    language: go
    kind: invalid
    options:
      cyclomatic: 4
      statements: 1
    files:
      - path: sample.go
        body: |-
          package sample

          type visitor struct{ ifs, elses, loops, calls, seen int }

          func (v *visitor) visit(n any) {
          	if n == nil {
          		return
          	}
          	switch n := n.(type) {
          	case *ifStmt:
          		v.ifs++
          		if n.hasElse {
          			v.elses++
          		}
          	case *forStmt:
          		v.loops++
          	case *callExpr:
          		v.calls++
          	}
          }

          type ifStmt struct{ hasElse bool }
          type forStmt struct{}
          type callExpr struct{}
    expect:
      - line: 5
  - name: rust-flat-dispatch
    language: rust
    kind: valid
    options:
      cyclomatic: 4
      statements: 1
    files:
      - path: src/lib.rs
        body: |-
          pub enum Node {
              If { has_else: bool },
              For,
              Call,
              Other,
          }

          #[derive(Default)]
          pub struct Counts {
              ifs: u32,
              elses: u32,
              loops: u32,
              calls: u32,
          }

          impl Counts {
              pub fn visit(&mut self, node: &Node) {
                  match node {
                      Node::If { has_else } => {
                          self.ifs += 1;
                          if *has_else {
                              self.elses += 1;
                          }
                      }
                      Node::For => self.loops += 1,
                      Node::Call => self.calls += 1,
                      Node::Other => {}
                  }
              }
          }
