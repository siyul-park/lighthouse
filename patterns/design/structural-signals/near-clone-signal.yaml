id: design/near-clone-signal
title: Near-clones are a review signal
intent: Near-identical bodies often hide one concept implemented twice.
scope: symbol
requirement: >-
  Near-clone analysis SHOULD require meaningful body size and a semantic or
  naming relation; syntax similarity alone MUST NOT require abstraction.
enforcement: heuristic
evidence: [peer, similarity, statements]
citation: "Jiang et al., Deckard 2007; Roy and Cordy 2007"
