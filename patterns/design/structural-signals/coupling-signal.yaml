id: design/coupling-signal
title: Coupling is a review signal
intent: A dependency hub changes for many reasons.
scope: symbol
requirement: >-
  Coupling SHOULD be judged from direct intra-package fan-in and fan-out,
  that is the functions and methods of the same package that call a symbol or
  are called by it, against deliberately high thresholds. Calls from other
  packages and from tests do not count: a widely used public function is a
  service, not a hub.
enforcement: heuristic
evidence: [fan_in, fan_out, statements]
options:
  hub_fan_in:
    type: int
    default: 8
    description: Callers that, with `hub_fan_out` and `hub_statements`, mark a dependency hub.
  hub_fan_out:
    type: int
    default: 6
    description: Callees of a dependency hub.
  hub_statements:
    type: int
    default: 20
    description: Statement count of a dependency hub.
  coordinator_fan_out:
    type: int
    default: 12
    description: Callees that, with the other `coordinator_*` options, mark a coordinator.
  coordinator_max_fan_in:
    type: int
    default: 1
    description: Most callers a coordinator may have.
  coordinator_statements:
    type: int
    default: 15
    description: Statement count of a coordinator.
citation: Henry and Kafura 1981, information flow
implementation:
  builtin: design/coupling-signal
examples:
  - name: hub
    language: go
    kind: invalid
    options:
      hub_fan_in: 2
      hub_fan_out: 2
      hub_statements: 1
    files:
      - path: sample.go
        body: |-
          package sample

          func hub() {
          	left()
          	right()
          }

          func left()  {}
          func right() {}

          func a() { hub() }
          func b() { hub() }
    expect:
      - line: 3
  - name: coordinator
    language: go
    kind: invalid
    options:
      hub_fan_in: 100
      coordinator_fan_out: 3
      coordinator_max_fan_in: 0
      coordinator_statements: 3
    files:
      - path: sample.go
        body: |-
          package sample

          func run() {
          	one()
          	two()
          	three()
          }

          func one()   {}
          func two()   {}
          func three() {}
    expect:
      - line: 3
  - name: ordinary-fan
    language: go
    kind: valid
    files:
      - path: sample.go
        body: |-
          package sample

          func hub() {
          	left()
          	right()
          }

          func left()  {}
          func right() {}

          func a() { hub() }
          func b() { hub() }
