id: types-and-apis
title: Types and APIs
intro: >-
  Public APIs are stable contracts: expose the minimum caller-facing
  abstraction and keep implementation state behind its owner.
patterns:
  - interface-at-consumer
  - narrow-inputs-concrete-outputs
  - no-private-types-in-public-api
  - contract-not-state
  - validated-constructors
  - required-args-optional-options
  - no-speculative-api
