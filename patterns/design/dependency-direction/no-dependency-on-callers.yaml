id: design/no-dependency-on-callers
title: Lower-level code does not depend on its callers
intent: A dependency cycle makes both sides unusable alone.
scope: module
requirement: >-
  Higher-level code MAY depend on lower-level code when that code is general
  and context-independent; lower-level code MUST NOT depend on its callers.
enforcement: heuristic
evidence: [from, to, cycle]
citation: Tarjan 1972, strongly connected components
