id: design/exported-doc
title: Exported symbols are documented
intent: Public API changes need facts callers cannot read from the code.
scope: symbol
requirement: >-
  Exported symbols SHOULD have doc comments in the language's standard form.
  Public API changes SHOULD document user-visible behavior, constraints,
  ownership, or other facts the code cannot express.
enforcement: heuristic
evidence: [symbol]
options:
  kinds:
    type: list
    default: [function, method, type, interface, const, var]
    description: Symbol kinds that must be documented when exported.
  include_internal:
    type: bool
    default: false
    description: Also require docs for symbols exported only inside the project, such as under an internal path.
  exempt_interface_methods:
    type: bool
    default: false
    description: Do not require docs on a method that implements a documented method of an interface (or trait) the project declares, since it is documented where the interface declares it.
    per_language:
      rust: true
  exempt_methods:
    type: list
    default: [String, Error, Unwrap]
    description: Method names that implement well-known interfaces and need no doc comment of their own.
    per_language:
      rust: [fmt, source, from, try_from, from_str, default, drop, clone, eq, ne, partial_cmp, cmp, hash, deref, deref_mut, as_ref, as_mut, borrow, next, into_iter, index, index_mut, serialize, deserialize]
tuning:
  go: Normal Go doc comments beginning with the symbol name.
  rust: >-
    Doc comments (`///`, `#[doc]`) on items reachable from outside the
    library crate: `pub` items whose modules are all `pub` or that a `pub use`
    re-exports. Items in binary crates, in tests and in `pub(crate)` positions
    are not exported. A trait impl method without docs of its own shows the
    documentation of the trait's method, as rustdoc does; a method that
    implements a method of a trait declared in the project is documented where
    the trait declares it, and the methods of the standard traits (`fmt`,
    `from`, `default`, `drop`, ...) need none. The public items of a library
    that cannot be published (`publish = false`) are importable only inside the
    project and count as internal, unless another package of the project depends
    on the library: then its public items are a contract between packages and stay
    public (`[languages.rust] unpublished = "auto" | "public" | "internal"`).
    Code in an inline `#[cfg(test)]` module is test code.
implementation:
  builtin: design/exported-doc
examples:
  - name: undocumented
    language: go
    kind: invalid
    files:
      - path: sample.go
        body: |-
          package sample

          type Store struct{}

          func (s *Store) Get() int { return 0 }

          func New() *Store { return &Store{} }

          const Limit = 3

          var Default = New()
    expect:
      - line: 3
      - line: 5
      - line: 7
      - line: 9
      - line: 11
  - name: well-known-methods
    language: go
    kind: valid
    files:
      - path: sample.go
        body: |-
          package sample

          // Code is a failure code.
          type Code int

          func (c Code) String() string { return "code" }

          func (c Code) Error() string { return "code" }
  - name: generated-file
    language: go
    kind: valid
    files:
      - path: sample.go
        body: |-
          // Code generated by tool. DO NOT EDIT.

          package sample

          func Generated() {}
  - name: test-file
    language: go
    kind: valid
    files:
      - path: sample_test.go
        body: |-
          package sample

          func Helper() {}
  - name: documented
    language: go
    kind: valid
    files:
      - path: sample.go
        body: |-
          package sample

          // Store keeps values.
          type Store struct{}

          // Get returns the stored value.
          func (s *Store) Get() int { return 0 }

          type hidden struct{}

          func (h hidden) Run() {}

          // Limits bound the store.
          const (
          	Min = 1
          	Max = 3
          )

          func helper() {}
  - name: rust-undocumented
    language: rust
    kind: invalid
    files:
      - path: src/lib.rs
        body: |-
          pub struct Store;

          impl Store {
              pub fn get(&self) -> i32 {
                  0
              }
          }

          pub fn make() -> Store {
              Store
          }

          pub trait Source {
              fn read(&self) -> i32;
          }

          pub const LIMIT: u32 = 3;

          pub static DEFAULT: u32 = 4;
    expect:
      - line: 1
      - line: 4
      - line: 9
      - line: 13
      - line: 17
      - line: 19
  - name: rust-well-known-trait-methods
    language: rust
    kind: valid
    files:
      - path: src/lib.rs
        body: |-
          use std::fmt;

          /// A failure code.
          pub struct Code(pub u32);

          impl fmt::Display for Code {
              fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                  write!(f, "{}", self.0)
              }
          }

          impl std::error::Error for Code {}

          impl Default for Code {
              fn default() -> Self {
                  Code(0)
              }
          }
  - name: rust-trait-impl-shows-trait-docs
    language: rust
    kind: valid
    files:
      - path: src/lib.rs
        body: |-
          /// Something that can be read.
          pub trait Source {
              /// Reads the next value.
              fn read(&self) -> i32;
          }

          /// A constant source.
          pub struct Fixed;

          impl Source for Fixed {
              fn read(&self) -> i32 {
                  1
              }
          }
  - name: rust-generated-file
    language: rust
    kind: valid
    files:
      - path: src/lib.rs
        body: |-
          // @generated by a tool. DO NOT EDIT.

          pub fn generated() {}
  - name: rust-test-file
    language: rust
    kind: valid
    files:
      - path: tests/helper.rs
        body: |-
          pub fn helper() {}
  - name: rust-documented
    language: rust
    kind: valid
    files:
      - path: src/lib.rs
        body: |-
          /// Store keeps values.
          pub struct Store;

          impl Store {
              /// Get returns the stored value.
              pub fn get(&self) -> i32 {
                  0
              }

              fn hidden(&self) {}
          }

          struct Private;

          impl Private {
              pub fn run(&self) {}
          }

          pub(crate) fn crate_wide() {}

          mod inner {
              pub fn unreachable_from_outside() {}
          }

          /// Limits bound the store.
          pub const MIN: u32 = 1;

          fn helper() {}
  - name: rust-binary-crate
    language: rust
    kind: valid
    files:
      - path: src/main.rs
        body: |-
          pub fn exposed_in_name_only() {}

          fn main() {
              exposed_in_name_only();
          }
  - name: rust-project-trait-impl
    language: rust
    kind: valid
    files:
      - path: src/lib.rs
        body: |-
          /// Something that can be read.
          pub trait Source {
              /// Reads the next value.
              fn read(&self) -> i32;
          }

          /// A constant source.
          pub struct Fixed;

          impl Source for Fixed {
              fn read(&self) -> i32 {
                  1
              }
          }
  - name: rust-impl-of-an-undocumented-trait-method
    language: rust
    kind: invalid
    files:
      - path: src/lib.rs
        body: |-
          /// Something that can be read.
          pub trait Source {
              fn read(&self) -> i32;
          }

          /// A constant source.
          pub struct Fixed;

          impl Source for Fixed {
              fn read(&self) -> i32 {
                  1
              }
          }
    expect:
      - line: 10
  - name: rust-inline-test-module
    language: rust
    kind: valid
    files:
      - path: src/lib.rs
        body: |-
          /// Adds.
          pub fn add(a: i32, b: i32) -> i32 {
              a + b
          }

          #[cfg(test)]
          mod tests {
              pub fn helper() {}

              pub struct Fixture;
          }
  - name: rust-publish-false
    language: rust
    kind: valid
    files:
      - path: Cargo.toml
        body: |-
          [package]
          name = "sample"
          version = "0.1.0"
          publish = false
      - path: src/lib.rs
        body: |-
          pub struct Internal;

          pub fn only_inside_the_project() {}
