id: design/exported-doc
title: Exported symbols are documented
intent: Public API changes need facts callers cannot read from the code.
scope: symbol
requirement: >-
  Exported symbols SHOULD have doc comments in the language's standard form.
  Public API changes SHOULD document user-visible behavior, constraints,
  ownership, or other facts the code cannot express.
enforcement: heuristic
evidence: [symbol]
options:
  kinds:
    type: list
    default: [function, method, type, interface, const, var]
    description: Symbol kinds that must be documented when exported.
  include_internal:
    type: bool
    default: false
    description: Also require docs for symbols exported only inside the project, such as under an internal path.
  exempt_methods:
    type: list
    default: [String, Error, Unwrap]
    description: Method names that implement well-known interfaces and need no doc comment of their own.
tuning:
  go: Normal Go doc comments beginning with the symbol name.
implementation:
  builtin: design/exported-doc
examples:
  - name: undocumented
    language: go
    kind: invalid
    files:
      - path: sample.go
        body: |-
          package sample

          type Store struct{}

          func (s *Store) Get() int { return 0 }

          func New() *Store { return &Store{} }

          const Limit = 3

          var Default = New()
    expect:
      - line: 3
      - line: 5
      - line: 7
      - line: 9
      - line: 11
  - name: well-known-methods
    language: go
    kind: valid
    files:
      - path: sample.go
        body: |-
          package sample

          // Code is a failure code.
          type Code int

          func (c Code) String() string { return "code" }

          func (c Code) Error() string { return "code" }
  - name: generated-file
    language: go
    kind: valid
    files:
      - path: sample.go
        body: |-
          // Code generated by tool. DO NOT EDIT.

          package sample

          func Generated() {}
  - name: test-file
    language: go
    kind: valid
    files:
      - path: sample_test.go
        body: |-
          package sample

          func Helper() {}
  - name: documented
    language: go
    kind: valid
    files:
      - path: sample.go
        body: |-
          package sample

          // Store keeps values.
          type Store struct{}

          // Get returns the stored value.
          func (s *Store) Get() int { return 0 }

          type hidden struct{}

          func (h hidden) Run() {}

          // Limits bound the store.
          const (
          	Min = 1
          	Max = 3
          )

          func helper() {}
