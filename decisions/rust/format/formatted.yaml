# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: rust/formatted
  uid: e7ac16fb-5c39-4376-baed-653c2682b1f7
spec:
  title: A Rust file is as rustfmt writes it
  context: >-
    Vertical and horizontal openness, indentation and the placement of braces
    are team rules, and a team keeps them by letting one tool decide, not by
    reviewing them (Martin, Clean Code ch. 5 Team rules). The check is the
    tool's own list mode: one finding per file it would change, at line 1,
    that names the file. The fix is the tool as a filter, which writes the
    file as it formats it; it has the lowest priority, so the fix of any other
    decision wins an overlap and the formatting follows it as a safe follow-up
    of the change. The check is run once over the project because rustfmt
    formats the files a `mod` declares along with the file it is given, so
    what it finds in one file depends on others. rustfmt does not read
    `Cargo.toml`, and the edition decides what it accepts and how it writes
    some items, so both programs pass it the edition of the crate that holds
    the file, which the Rust provider states for every file as its `edition`
    fact (`{file.edition}`): the one the nearest package sets, in its manifest
    or in the workspace it inherits from, else Cargo's default, 2015. The check
    runs once per edition over the files that have it. `cargo fmt` does the same,
    but it formats every target of a package, not the files it is given, and it
    needs a manifest at the root of the project, so it cannot be a filter over
    one file. The programs are the bundled catalog's own, so they run in a
    project nobody trusted.
  scope:
    subject: project
    generated: false
    tests: include
  requirement: >-
    A Rust file MUST equal the output of rustfmt.
  severity: error
  check:
    type: command
    command:
    - rustfmt
    - --edition
    - "{file.edition}"
    - --check
    - -l
    - "{files}"
    output: lines
    files: ["**/*.rs"]
  fix:
    type: command
    safety: safe
    priority: -100
    command:
    - rustfmt
    - --edition
    - "{file.edition}"
    - --emit
    - stdout
    stdin: file
    output: stdout
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G24 Follow Standard Conventions
    - Martin, Clean Code (2008), ch. 5 Vertical openness and density
    - Martin, Clean Code (2008), ch. 5 Horizontal openness and indentation
    - Martin, Clean Code (2008), ch. 5 Team rules
    - 'rustfmt: https://rust-lang.github.io/rustfmt/'
  examples:
  - name: unformatted
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |
        pub fn run()->i32{1}
    expect:
    - line: 1
    fixed:
    - path: src/lib.rs
      body: |
        pub fn run() -> i32 {
            1
        }
  - name: edition-of-the-crate
    language: rust
    kind: valid
    files:
    - path: Cargo.toml
      body: |
        [package]
        name = "demo"
        version = "0.1.0"
        edition = "2021"
    - path: src/lib.rs
      body: |
        use std::{b, A};
  - name: no-edition-is-2015
    language: rust
    kind: valid
    files:
    - path: Cargo.toml
      body: |
        [package]
        name = "demo"
        version = "0.1.0"
    - path: src/lib.rs
      body: |
        use std::{b, A};
  - name: formatted
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |
        pub fn run() -> i32 {
            1
        }
