# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/advisory-signals
  uid: fe68cde0-4d76-4231-91cb-5698d7c44407
  labels:
    lighthouse/pack: design
    lighthouse/section: structural-signals
  annotations:
    lighthouse/was-names: design/signals-are-advisory
spec:
  title: Signals stay advisory
  context: >-
    Metrics approximate design quality; treating them as proof produces
    harmful churn.
  scope:
    domain: code
    subject: project
  requirement: >-
    Metrics MUST NOT define universal declaration order, justify automatic
    reordering, or prove single responsibility. Mechanical checks SHOULD be
    preferred for directly expressible rules; heuristic signals SHOULD remain
    advisory and use deliberately high thresholds.
