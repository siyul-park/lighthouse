# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/complexity
  uid: 374c95b6-7892-4e6b-a8db-d25efe157aab
  labels:
    lighthouse/pack: design
    lighthouse/section: structural-signals
spec:
  title: Cyclomatic complexity is a review signal
  context: >-
    High cyclomatic complexity often marks a symbol doing too much. The
    default is gocyclo's `min-complexity` (30) for Go and Rust, where
    clippy's cyclomatic lint was removed. ESLint `complexity` (20), Sonar
    S1541 (10) and cyclop `max-complexity` (10) are lower, which fits a
    review signal less well than a deliberately high limit.

    Rust: `if`, `else if`, `if let`, `let ... else`, `while`, `for` and
    `loop` count as in other languages; a `match` counts its arms other than
    a wildcard or binding arm; `?` adds nothing; closures and `async` blocks
    nest what they contain.

    A function that is one `match` whose arms are single values (in return
    position) or `return`s is a table in code form, and a body whose only
    top-level branching is one switch of any arms, nested at most two
    levels, is a flat dispatch: its many paths do not make it hard to
    follow. `ignoreDispatch` (on by default) leaves both out, because
    counting them reports tables and visitors that read linearly; cognitive
    complexity still judges a flat dispatch.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A function SHOULD NOT have more cyclomatic complexity than the limit of
    its role. Cyclomatic complexity is one path plus each `if`, `else if`,
    loop, error handler clause, non-default switch arm and boolean operator
    (`&&`, `||`). The split is by responsibility: the remedy is smaller
    functions, never moving the same body elsewhere.
  severity: warn
  options:
    type: object
    properties:
      max:
        $ref: '#/$defs/limit'
        default: 30
        description: >-
          Most cyclomatic complexity (paths) a function may have: an integer
          for every role, or an object with `default` and one entry per role
          (`function`, `method`, `constructor`, `implementation`,
          `entrypoint`, `test`); a role left out takes `default`, and null
          is no limit.
      ignoreDispatch:
        type: boolean
        default: true
        description: >-
          Leave out a function that is a table in code form or a flat dispatch (see the context); `false` counts them like any other function.
    additionalProperties: false
  check:
    type: cel
    select: function
    with:
      - name: m
        expr: metrics(func)
      - name: cap
        expr: limit(func, options.max)
    where: >-
      (func.kind == 'function' || func.kind == 'method')
      && m.measured && cap != null && m.cyclomatic > cap
      && !(options.ignoreDispatch && (m.dispatcher || m.flat_dispatch))
    message: >-
      {{ counted(func, m.cyclomatic, 'decision paths') }} (max {{ cap }}):
      split decisions into smaller functions
    evidence:
      value: m.cyclomatic
      max: cap
      role: func.role
    identity:
      subject: func.id
  provenance:
    wasDerivedFrom:
      - "McCabe 1976, A Complexity Measure"
      - "gocyclo min-complexity 30: https://golangci-lint.run/usage/linters/#gocyclo"
      - "ESLint complexity: https://eslint.org/docs/latest/rules/complexity"
      - "Sonar S1541, cyclop"
  examples:
    - name: many-branches
      language: go
      kind: invalid
      options:
        max: 3
      files:
        - path: sample.go
          body: |-
            package sample

            func classify(n int) string {
                if n < 0 {
                    return "negative"
                }
                if n == 0 {
                    return "zero"
                }
                if n < 10 {
                    return "small"
                }
                return "large"
            }
      expect:
        - line: 3
    - name: below-the-limit
      language: go
      kind: valid
      canonical: true
      options:
        max: 3
      files:
        - path: sample.go
          body: |-
            package sample

            func classify(n int) string {
                if n < 0 {
                    return "negative"
                }
                if n == 0 {
                    return "zero"
                }
                return "positive"
            }
    - name: default-limit-is-high
      language: go
      kind: valid
      files:
        - path: sample.go
          body: |-
            package sample

            func classify(n int) string {
                if n < 0 {
                    return "negative"
                }
                if n == 0 {
                    return "zero"
                }
                if n < 10 {
                    return "small"
                }
                return "large"
            }
    - name: role-limit
      language: go
      kind: invalid
      options:
        max: {default: 9, function: 3}
      files:
        - path: sample.go
          body: |-
            package sample

            func classify(n int) string {
                if n < 0 {
                    return "negative"
                }
                if n == 0 {
                    return "zero"
                }
                if n < 10 {
                    return "small"
                }
                return "large"
            }
      expect:
        - line: 3
    - name: role-without-default-is-unlimited
      language: go
      kind: valid
      options:
        max: {constructor: 3}
      files:
        - path: sample.go
          body: |-
            package sample

            func classify(n int) string {
                if n < 0 {
                    return "negative"
                }
                if n == 0 {
                    return "zero"
                }
                if n < 10 {
                    return "small"
                }
                return "large"
            }
    - name: dispatcher
      language: go
      kind: valid
      options:
        max: 1
      files:
        - path: sample.go
          body: |-
            package sample

            func name(k int) string {
                switch k {
                case 0:
                    return "zero"
                case 1:
                    return "one"
                default:
                    return "many"
                }
            }
    - name: dispatcher-counted
      language: go
      kind: invalid
      options:
        max: 1
        ignoreDispatch: false
      files:
        - path: sample.go
          body: |-
            package sample

            func name(k int) string {
                switch k {
                case 0:
                    return "zero"
                case 1:
                    return "one"
                default:
                    return "many"
                }
            }
      expect:
        - line: 3
    - name: flat-dispatch
      language: go
      kind: valid
      options:
        max: 3
      files:
        - path: sample.go
          body: |-
            package sample

            type visitor struct{ ifs, elses, loops, calls int }

            func (v *visitor) visit(n any) *visitor {
                switch n := n.(type) {
                case *ifStmt:
                    v.ifs++
                    if n.hasElse {
                        v.elses++
                    }
                case *forStmt:
                    v.loops++
                case *callExpr:
                    v.calls++
                }
                return v
            }

            type ifStmt struct{ hasElse bool }
            type forStmt struct{}
            type callExpr struct{}
    - name: dispatch-among-other-statements
      language: go
      kind: invalid
      options:
        max: 3
      files:
        - path: sample.go
          body: |-
            package sample

            type visitor struct{ ifs, elses, loops, calls, seen int }

            func (v *visitor) visit(n any) {
                if n == nil {
                    return
                }
                switch n := n.(type) {
                case *ifStmt:
                    v.ifs++
                    if n.hasElse {
                        v.elses++
                    }
                case *forStmt:
                    v.loops++
                case *callExpr:
                    v.calls++
                }
            }

            type ifStmt struct{ hasElse bool }
            type forStmt struct{}
            type callExpr struct{}
      expect:
        - line: 5
    - name: rust-many-branches
      language: rust
      kind: invalid
      options:
        max: 3
      files:
        - path: src/lib.rs
          body: |-
            pub fn classify(n: i32) -> &'static str {
                if n < 0 {
                    return "negative";
                }
                if n == 0 {
                    return "zero";
                }
                if n < 10 {
                    return "small";
                }
                "large"
            }
      expect:
        - line: 1
    - name: rust-below-the-limit
      language: rust
      kind: valid
      canonical: true
      options:
        max: 3
      files:
        - path: src/lib.rs
          body: |-
            pub fn classify(n: i32) -> &'static str {
                if n < 0 {
                    return "negative";
                }
                if n == 0 {
                    return "zero";
                }
                "positive"
            }
    - name: rust-dispatcher
      language: rust
      kind: valid
      options:
        max: 1
      files:
        - path: src/lib.rs
          body: |-
            pub fn name(k: u8) -> &'static str {
                match k {
                    0 => "zero",
                    1 => "one",
                    _ => "many",
                }
            }
    - name: rust-flat-dispatch
      language: rust
      kind: valid
      options:
        max: 3
      files:
        - path: src/lib.rs
          body: |-
            pub enum Node {
                If { has_else: bool },
                For,
                Call,
                Other,
            }

            #[derive(Default)]
            pub struct Counts {
                ifs: u32,
                elses: u32,
                loops: u32,
                calls: u32,
            }

            impl Counts {
                pub fn visit(&mut self, node: &Node) {
                    match node {
                        Node::If { has_else } => {
                            self.ifs += 1;
                            if *has_else {
                                self.elses += 1;
                            }
                        }
                        Node::For => self.loops += 1,
                        Node::Call => self.calls += 1,
                        Node::Other => {}
                    }
                }
            }
    - name: rust-inline-test-module
      language: rust
      kind: valid
      options:
        max: 2
      files:
        - path: src/lib.rs
          body: |-
            pub fn add(a: i32, b: i32) -> i32 {
                a + b
            }

            #[cfg(test)]
            mod tests {
                fn helper(n: i32) -> i32 {
                    if n > 0 {
                        return n;
                    }
                    if n < 0 {
                        return -n;
                    }
                    0
                }
            }
