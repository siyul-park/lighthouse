# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/coupling-signal
  uid: 1ae7149a-00cf-402a-acba-6fd404e91fde
  labels:
    lighthouse/pack: design
    lighthouse/section: structural-signals
  annotations:
    lighthouse/was-builtin: design/coupling-signal
spec:
  title: Coupling is a review signal
  context: >-
    A dependency hub changes for many reasons.

    Rust: The unit is the Rust module (a `mod` and every inline module are
    distinct units). Methods count with their impl's type; calls through a
    receiver whose type is not written in the code are not seen, so fan
    counts are lower bounds.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Coupling SHOULD be judged from direct intra-package fan-in and fan-out, that
    is the functions and methods of the same package that call a symbol or are
    called by it, against deliberately high thresholds. Calls from other
    packages and from tests do not count: a widely used public function is a
    service, not a hub.
  severity: warn
  options:
    type: object
    properties:
      hubFanIn:
        type: integer
        default: 8
        description: >-
          Callers that, with `hubFanOut` and `hubStatements`, mark a
          dependency hub.
      hubFanOut:
        type: integer
        default: 6
        description: Callees of a dependency hub.
      hubStatements:
        type: integer
        default: 20
        description: Statement count of a dependency hub.
      coordinatorFanOut:
        type: integer
        default: 12
        description: >-
          Callees that, with the other `coordinator_*` options, mark a
          coordinator.
      coordinatorMaxFanIn:
        type: integer
        default: 1
        description: Most callers a coordinator may have.
      coordinatorStatements:
        type: integer
        default: 15
        description: Statement count of a coordinator.
    additionalProperties: false
  check:
    type: cel
    select: function
    with:
      - name: m
        expr: metrics(func)
      - name: role
        expr: >-
          (m.fan_in >= options.hubFanIn && m.fan_out >= options.hubFanOut
           && m.statements >= options.hubStatements)
          ? 'a dependency hub'
          : (m.fan_out >= options.coordinatorFanOut
             && m.fan_in <= options.coordinatorMaxFanIn
             && m.statements >= options.coordinatorStatements)
          ? 'a high fan-out coordinator' : ''
    where: >-
      (func.kind == 'function' || func.kind == 'method')
      && m.measured && !m.dispatcher && role != ''
    message: "function {{ func.name }} is {{ role }}: fan-in={{ m.fan_in }} fan-out={{ m.fan_out }}"
    evidence:
      fan_in: m.fan_in
      fan_out: m.fan_out
      statements: m.statements
    identity:
      subject: func.id
  provenance:
    wasDerivedFrom:
      - "Henry and Kafura 1981, information flow"
  examples:
    - name: hub
      language: go
      kind: invalid
      options:
        hubFanIn: 2
        hubFanOut: 2
        hubStatements: 1
      files:
        - path: sample.go
          body: "package sample\n\nfunc hub() {\n\tleft()\n\tright()\n}\n\nfunc left()  {}\nfunc right() {}\n\nfunc a() { hub() }\nfunc b() { hub() }"
      expect:
        - line: 3
    - name: coordinator
      language: go
      kind: invalid
      options:
        hubFanIn: 100
        coordinatorFanOut: 3
        coordinatorMaxFanIn: 0
        coordinatorStatements: 3
      files:
        - path: sample.go
          body: "package sample\n\nfunc run() {\n\tone()\n\ttwo()\n\tthree()\n}\n\nfunc one()   {}\nfunc two()   {}\nfunc three() {}"
      expect:
        - line: 3
    - name: ordinary-fan
      language: go
      kind: valid
      canonical: true
      files:
        - path: sample.go
          body: "package sample\n\nfunc hub() {\n\tleft()\n\tright()\n}\n\nfunc left()  {}\nfunc right() {}\n\nfunc a() { hub() }\nfunc b() { hub() }"
    - name: rust-hub
      language: rust
      kind: invalid
      options:
        hubFanIn: 2
        hubFanOut: 2
        hubStatements: 1
      files:
        - path: src/lib.rs
          body: |-
            fn hub() {
                left();
                right();
            }

            fn left() {}
            fn right() {}

            fn a() {
                hub();
            }
            fn b() {
                hub();
            }
      expect:
        - line: 1
    - name: rust-coordinator
      language: rust
      kind: invalid
      options:
        hubFanIn: 100
        coordinatorFanOut: 3
        coordinatorMaxFanIn: 0
        coordinatorStatements: 3
      files:
        - path: src/lib.rs
          body: |-
            fn run() {
                one();
                two();
                three();
            }

            fn one() {}
            fn two() {}
            fn three() {}
      expect:
        - line: 1
    - name: rust-ordinary-fan
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            fn hub() {
                left();
                right();
            }

            fn left() {}
            fn right() {}

            fn a() {
                hub();
            }
            fn b() {
                hub();
            }
    - name: rust-service-used-across-modules
      language: rust
      kind: valid
      options:
        hubFanIn: 2
        hubFanOut: 2
        hubStatements: 1
      files:
        - path: src/lib.rs
          body: |-
            mod service {
                pub fn serve() {
                    super::left();
                    super::right();
                }
            }

            fn left() {}
            fn right() {}

            pub fn a() {
                service::serve();
            }
            pub fn b() {
                service::serve();
            }
