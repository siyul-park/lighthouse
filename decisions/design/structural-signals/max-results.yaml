# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/max-results
  uid: 6d0c2b5a-cf52-4582-8af0-c9625832b24b
  labels:
    lighthouse/pack: design
    lighthouse/section: structural-signals
spec:
  title: Functions return a bounded number of results
  context: >-
    Many results usually mean the function returns a record that was never
    named. The default (3) is revive's `function-result-limit`; gocritic's
    `tooManyResultsChecker` allows 5. Go counts every result, a trailing
    `error` included. Rust counts the arity of the returned tuple (1 for a
    single value, 0 for `()`), and looks inside a `Result<T, E>` at `T`. A
    constructor that returns its type with a result or an error is not
    counted, nor is a function that implements an interface or trait method,
    or a test. A struct that exists only for the function (nothing else
    takes or returns it, and only the function and its callers touch it or
    its fields) is a result list in disguise, so its fields count instead of
    the struct.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A function SHOULD NOT return more results than the limit of its role.
    The remedy is to split the function by responsibility, or to name what
    it returns.
  severity: warn
  options:
    type: object
    properties:
      max:
        $ref: '#/$defs/limit'
        default: {default: 3, constructor: null, implementation: null, test: null}
        description: >-
          Most results a function may have: an integer for every role, or an
          object with `default` and one entry per role (`function`,
          `method`, `constructor`, `implementation`, `entrypoint`, `test`);
          a role left out takes `default`, and null is no limit.
      allowSuffixes:
        type: array
        items: {type: string}
        default: [Options, Opts, Config]
        description: >-
          Name endings of a struct that only carries settings: when a struct
          used only by one function ends in one of these, only its required
          fields (not a pointer, slice, map, function, channel or interface in
          Go; not an `Option`, `Vec` or map, or `#[serde(default)]`, in Rust)
          count toward the limit.
    additionalProperties: false
  check:
    type: cel
    select: function
    with:
      - name: m
        expr: metrics(func)
      - name: cap
        expr: limit(func, options.max)
      - name: eff
        expr: func.effective
      - name: hidden
        expr: eff.hidden.filter(h, h.side == 'results')
      - name: note
        expr: >-
          size(hidden) == 0 ? '' : ' (' + hidden.map(h, string(h.fields) + ' in ' + h.struct).join(', ') + ' counted from structs used only here)'
    where: >-
      (func.kind == 'function' || func.kind == 'method')
      && m.measured && cap != null && eff.results > cap
    message: >-
      {{ counted(func, eff.results, 'results') }} (max {{ cap }}){{ note }}:
      split by responsibility
    evidence:
      value: eff.results
      max: cap
      role: func.role
      hidden: hidden
    identity:
      subject: func.id
  provenance:
    wasDerivedFrom:
      - "revive function-result-limit 3: https://revive.run/r#function-result-limit"
      - "gocritic tooManyResultsChecker 5: https://go-critic.com/overview.html#toomanyresultschecker"
  examples:
    - name: too-many-results
      language: go
      kind: invalid
      files:
        - path: sample.go
          body: |-
            package sample

            func split() (int, int, int, int) {
                return 0, 0, 0, 0
            }
      expect:
        - line: 3
    - name: within-the-limit
      language: go
      kind: valid
      canonical: true
      files:
        - path: sample.go
          body: |-
            package sample

            func split() (int, int, int) {
                return 0, 0, 0
            }
    - name: constructor-is-not-limited
      language: go
      kind: valid
      files:
        - path: sample.go
          body: |-
            package sample

            type Parser struct{}

            func NewParser() (*Parser, int, int, error) {
                return &Parser{}, 0, 0, nil
            }
    - name: interface-implementation
      language: go
      kind: valid
      files:
        - path: sample.go
          body: |-
            package sample

            type Reader interface {
                Read() (int, int, int, error)
            }

            type file struct{}

            func (file) Read() (int, int, int, error) {
                return 0, 0, 0, nil
            }
    - name: rust-too-many-results
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub fn split() -> (i32, i32, i32, i32) {
                (0, 0, 0, 0)
            }
      expect:
        - line: 1
    - name: rust-within-the-limit
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            pub fn split() -> (i32, i32, i32) {
                (0, 0, 0)
            }
    - name: rust-result-counts-its-ok-value
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub fn split() -> Result<(i32, i32, i32, i32), String> {
                Ok((0, 0, 0, 0))
            }
      expect:
        - line: 1
    - name: rust-result-with-a-pair
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub fn split() -> Result<(i32, i32), String> {
                Ok((0, 0))
            }
    - name: rust-constructor-is-not-limited
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Parser;

            impl Parser {
                pub fn new() -> Result<(Self, i32, i32, i32), String> {
                    Ok((Parser, 0, 0, 0))
                }
            }
    - name: single-use-struct-counts-its-fields
      language: go
      kind: invalid
      files:
        - path: sample.go
          body: |-
            package sample

            type Pair struct{ A, B, C int }

            func split() (int, int, Pair) {
                return 0, 0, Pair{}
            }
      expect:
        - line: 5
    - name: struct-shared-by-two-functions
      language: go
      kind: valid
      files:
        - path: sample.go
          body: |-
            package sample

            type Pair struct{ A, B, C int }

            func split() (int, int, Pair) {
                return 0, 0, Pair{}
            }

            func other() Pair {
                return Pair{}
            }
    - name: rust-single-use-struct-counts-its-fields
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Pair {
                pub a: i32,
                pub b: i32,
                pub c: i32,
            }

            pub fn split() -> (i32, i32, Pair) {
                (0, 0, Pair { a: 0, b: 0, c: 0 })
            }
      expect:
        - line: 7
    - name: rust-struct-shared-by-two-functions
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Pair {
                pub a: i32,
                pub b: i32,
                pub c: i32,
            }

            pub fn split() -> (i32, i32, Pair) {
                (0, 0, Pair { a: 0, b: 0, c: 0 })
            }

            pub fn other() -> Pair {
                Pair { a: 0, b: 0, c: 0 }
            }
