# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/max-params
  uid: a8c094cf-597d-4bfa-bc8d-a1fc1b9f03f9
  labels:
    lighthouse/pack: design
    lighthouse/section: structural-signals
spec:
  title: Functions take a bounded number of parameters
  context: >-
    A long parameter list usually hides a missing type, or a function that
    does several things. The default limit is 6 for a function and 7 for a
    constructor: Sonar S107 and clippy `too_many_arguments` allow 7, revive
    `argument-limit` allows 8, detekt `LongParameterList` allows 5 for a
    function and 6 for a constructor, and ESLint `max-params` allows 3; this
    is a deliberately high limit between them. A constructor may take one
    more because it assembles a type. A function that implements an
    interface or trait method, an entrypoint and a test do not choose their
    signature, so they have no limit. The receiver is not counted. A struct
    that exists only for the function (nothing else takes or returns it, and
    only the function and its callers touch it or its fields) is a parameter
    list in disguise, so its fields count instead of the struct.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A function SHOULD NOT take more parameters than the limit of its role.
    The remedy is to split the function by responsibility; a constructor
    that is over its limit builds a type that should be split.
  severity: warn
  options:
    type: object
    properties:
      max:
        $ref: '#/$defs/limit'
        default: {default: 6, constructor: 7, implementation: null, entrypoint: null, test: null}
        description: >-
          Most parameters a function may have: an integer for every role, or
          an object with `default` and one entry per role (`function`,
          `method`, `constructor`, `implementation`, `entrypoint`, `test`);
          a role left out takes `default`, and null is no limit.
      allowSuffixes:
        type: array
        items: {type: string}
        default: [Options, Opts, Config]
        description: >-
          Name endings of a struct that only carries settings: when a struct
          used only by one function ends in one of these, only its required
          fields (not a pointer, slice, map, function, channel or interface in
          Go; not an `Option`, `Vec` or map, or `#[serde(default)]`, in Rust)
          count toward the limit.
    additionalProperties: false
  check:
    type: cel
    select: function
    with:
      - name: m
        expr: metrics(func)
      - name: cap
        expr: limit(func, options.max)
      - name: eff
        expr: func.effective
      - name: hidden
        expr: eff.hidden.filter(h, h.side == 'params')
      - name: note
        expr: >-
          size(hidden) == 0 ? '' : ' (' + hidden.map(h, string(h.fields) + ' in ' + h.struct).join(', ') + ' counted from structs used only here)'
    where: >-
      (func.kind == 'function' || func.kind == 'method')
      && m.measured && cap != null && eff.params > cap
    message: >-
      {{ counted(func, eff.params, 'parameters') }} (max {{ cap }}){{ note }}:
      {{ func.role == 'constructor' ? 'split ' + func.built : 'split by responsibility' }}
    evidence:
      value: eff.params
      max: cap
      role: func.role
      hidden: hidden
    identity:
      subject: func.id
  provenance:
    wasDerivedFrom:
      - "revive argument-limit 8: https://revive.run/r#argument-limit"
      - "clippy too_many_arguments 7: https://doc.rust-lang.org/clippy/lint_configuration.html"
      - "Sonar S107 7; detekt LongParameterList 5 and 6; ESLint max-params 3"
  examples:
    - name: too-many-parameters
      language: go
      kind: invalid
      files:
        - path: sample.go
          body: |-
            package sample

            func build(a, b, c, d, e, f, g int) int {
                return a
            }
      expect:
        - line: 3
    - name: within-the-limit
      language: go
      kind: valid
      canonical: true
      files:
        - path: sample.go
          body: |-
            package sample

            func build(a, b, c, d, e, f int) int {
                return a
            }
    - name: constructor-at-its-limit
      language: go
      kind: valid
      files:
        - path: sample.go
          body: |-
            package sample

            type Server struct{}

            func NewServer(a, b, c, d, e, f, g int) *Server {
                return &Server{}
            }
    - name: constructor-over-its-limit
      language: go
      kind: invalid
      files:
        - path: sample.go
          body: |-
            package sample

            type Server struct{}

            func NewServer(a, b, c, d, e, f, g, h int) *Server {
                return &Server{}
            }
      expect:
        - line: 5
    - name: interface-implementation
      language: go
      kind: valid
      files:
        - path: sample.go
          body: |-
            package sample

            type Writer interface {
                Write(a, b, c, d, e, f, g int)
            }

            type file struct{}

            func (file) Write(a, b, c, d, e, f, g int) {}
    - name: rust-too-many-parameters
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub fn build(a: i32, b: i32, c: i32, d: i32, e: i32, f: i32, g: i32) -> i32 {
                a
            }
      expect:
        - line: 1
    - name: rust-within-the-limit
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            pub fn build(a: i32, b: i32, c: i32, d: i32, e: i32, f: i32) -> i32 {
                a
            }
    - name: rust-constructor-at-its-limit
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Server;

            impl Server {
                pub fn new(a: i32, b: i32, c: i32, d: i32, e: i32, f: i32, g: i32) -> Self {
                    Server
                }
            }
    - name: rust-constructor-over-its-limit
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Server;

            impl Server {
                pub fn new(a: i32, b: i32, c: i32, d: i32, e: i32, f: i32, g: i32, h: i32) -> Self {
                    Server
                }
            }
      expect:
        - line: 4
    - name: rust-trait-implementation
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub trait Sink {
                fn write(&mut self, a: i32, b: i32, c: i32, d: i32, e: i32, f: i32, g: i32);
            }

            pub struct File;

            impl Sink for File {
                fn write(&mut self, a: i32, b: i32, c: i32, d: i32, e: i32, f: i32, g: i32) {}
            }
    - name: rust-the-receiver-is-not-counted
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Server;

            impl Server {
                pub fn handle(&self, a: i32, b: i32, c: i32, d: i32, e: i32, f: i32) {}
            }
    - name: rust-method-over-the-limit
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Server;

            impl Server {
                pub fn handle(&self, a: i32, b: i32, c: i32, d: i32, e: i32, f: i32, g: i32) {}
            }
      expect:
        - line: 4
    - name: single-use-struct-counts-its-fields
      language: go
      kind: invalid
      files:
        - path: sample.go
          body: |-
            package sample

            type Request struct{ A, B, C int }

            func build(a, b, c, d int, r Request) int {
                return a + r.A
            }
      expect:
        - line: 5
    - name: struct-shared-by-two-functions
      language: go
      kind: valid
      files:
        - path: sample.go
          body: |-
            package sample

            type Request struct{ A, B, C int }

            func build(a, b, c, d int, r Request) int {
                return a + r.A
            }

            func other(r Request) int {
                return r.B
            }
    - name: options-struct-of-optional-fields
      language: go
      kind: valid
      files:
        - path: sample.go
          body: |-
            package sample

            type BuildOptions struct{ A, B, C *int }

            func build(a, b, c, d, e int, o BuildOptions) int {
                return a + *o.A
            }
    - name: rust-single-use-struct-counts-its-fields
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Request {
                pub a: i32,
                pub b: i32,
                pub c: i32,
            }

            pub fn build(a: i32, b: i32, c: i32, d: i32, r: Request) -> i32 {
                a + r.a
            }
      expect:
        - line: 7
    - name: rust-struct-shared-by-two-functions
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Request {
                pub a: i32,
                pub b: i32,
                pub c: i32,
            }

            pub fn build(a: i32, b: i32, c: i32, d: i32, r: Request) -> i32 {
                a + r.a
            }

            pub fn other(r: Request) -> i32 {
                r.b
            }
    - name: rust-options-struct-of-optional-fields
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub struct BuildOptions {
                pub a: Option<i32>,
                pub b: Vec<i32>,
                pub c: Option<String>,
            }

            pub fn build(a: i32, b: i32, c: i32, d: i32, e: i32, o: BuildOptions) -> i32 {
                a + o.b.len() as i32
            }
