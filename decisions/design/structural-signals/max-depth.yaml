# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/max-depth
  uid: 88c3bdb2-f35a-44d1-89c7-ea9f605252e0
  labels:
    lighthouse/pack: design
    lighthouse/section: structural-signals
spec:
  title: Control flow is nested a bounded number of levels
  context: >-
    Deeply nested blocks hide the path a reader follows. The default (4) is
    ESLint's `max-depth`; Sonar S134 (3) is lower, and Go's nestif measures
    the complexity of nested `if`s, not their depth. The depth is the
    deepest level of nested constructs (`if`, loops, `switch`, `match`,
    `try`) in the body: a flat body is 0, and a nested function (a closure)
    counts as a level here, unlike ESLint, and an `else if` chain is one
    level, not one per branch.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A function SHOULD NOT nest control flow deeper than the limit of its
    role. The remedy is to extract the nested block or return early.
  severity: warn
  options:
    type: object
    properties:
      max:
        $ref: '#/$defs/limit'
        default: 4
        description: >-
          Deepest nesting a function may have: an integer for every role, or
          an object with `default` and one entry per role (`function`,
          `method`, `constructor`, `implementation`, `entrypoint`, `test`);
          a role left out takes `default`, and -1 is no limit. A project
          that sets an object keeps the roles it does not name.
    additionalProperties: false
  check:
    type: cel
    select: function
    with:
      - name: m
        expr: metrics(func)
      - name: cap
        expr: limit(func, options.max)
    where: >-
      (func.kind == 'function' || func.kind == 'method')
      && m.measured && cap >= 0 && m.nesting > cap
    message: >-
      {{ counted(func, m.nesting, 'levels of nesting') }} (max {{ cap }}):
      extract nested blocks or return early
    evidence:
      value: m.nesting
      max: cap
      role: func.role
    identity:
      subject: func.id
  provenance:
    wasDerivedFrom:
      - "ESLint max-depth 4: https://eslint.org/docs/latest/rules/max-depth"
      - "Sonar S134"
  examples:
    - name: deeply-nested
      language: go
      kind: invalid
      options:
        max: 2
      files:
        - path: sample.go
          body: |-
            package sample

            func scan(rows [][]int) int {
                total := 0
                for _, row := range rows {
                    for _, v := range row {
                        if v > 0 {
                            total += v
                        }
                    }
                }
                return total
            }
      expect:
        - line: 3
    - name: within-the-limit
      language: go
      kind: valid
      canonical: true
      options:
        max: 3
      files:
        - path: sample.go
          body: |-
            package sample

            func scan(rows [][]int) int {
                total := 0
                for _, row := range rows {
                    for _, v := range row {
                        if v > 0 {
                            total += v
                        }
                    }
                }
                return total
            }
    - name: rust-deeply-nested
      language: rust
      kind: invalid
      options:
        max: 2
      files:
        - path: src/lib.rs
          body: |-
            pub fn scan(rows: &[Vec<i32>]) -> i32 {
                let mut total = 0;
                for row in rows {
                    for v in row {
                        if *v > 0 {
                            total += *v;
                        }
                    }
                }
                total
            }
      expect:
        - line: 1
    - name: rust-within-the-limit
      language: rust
      kind: valid
      canonical: true
      options:
        max: 3
      files:
        - path: src/lib.rs
          body: |-
            pub fn scan(rows: &[Vec<i32>]) -> i32 {
                let mut total = 0;
                for row in rows {
                    for v in row {
                        if *v > 0 {
                            total += *v;
                        }
                    }
                }
                total
            }
    - name: else-if-is-one-level
      language: go
      kind: valid
      options:
        max: 1
      files:
        - path: sample.go
          body: |-
            package sample

            func grade(n int) string {
                if n < 0 {
                    return "negative"
                } else if n == 0 {
                    return "zero"
                } else if n < 10 {
                    return "small"
                } else if n < 100 {
                    return "medium"
                }
                return "large"
            }
    - name: closure-is-a-level
      language: go
      kind: invalid
      options:
        max: 1
      files:
        - path: sample.go
          body: |-
            package sample

            func run(items []int) {
                each := func(f func(int)) {
                    for _, i := range items {
                        f(i)
                    }
                }
                each(func(int) {})
            }
      expect:
        - line: 3
    - name: rust-else-if-is-one-level
      language: rust
      kind: valid
      options:
        max: 1
      files:
        - path: src/lib.rs
          body: |-
            pub fn grade(n: i32) -> &'static str {
                if n < 0 {
                    "negative"
                } else if n == 0 {
                    "zero"
                } else if n < 10 {
                    "small"
                } else if n < 100 {
                    "medium"
                } else {
                    "large"
                }
            }
    - name: rust-closure-is-a-level
      language: rust
      kind: invalid
      options:
        max: 1
      files:
        - path: src/lib.rs
          body: |-
            pub fn run(items: &[i32]) -> i32 {
                let each = |f: &dyn Fn(i32) -> i32| {
                    let mut total = 0;
                    for i in items {
                        total += f(*i);
                    }
                    total
                };
                each(&|x| x)
            }
      expect:
        - line: 1
