# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/cognitive-complexity
  uid: c3c1fa01-8354-4c80-b73a-c7d49d0155f2
  labels:
    lighthouse/pack: design
    lighthouse/section: structural-signals
spec:
  title: Cognitive complexity is a review signal
  context: >-
    Cognitive complexity (Campbell, SonarSource 2018) grows with nesting, so
    it marks the bodies that are hard to follow even when they have few
    paths. The default is gocognit's `min-complexity` (30) for Go and
    clippy's `cognitive-complexity-threshold` (25) for Rust; Sonar S3776
    (15) is lower. A function that is one `match` or `switch` whose arms are
    single values is a table in code form; `ignoreDispatch` (on by default)
    leaves it out. A flat dispatch is still judged here.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A function SHOULD NOT have more cognitive complexity than the limit of
    its role. The remedy is to flatten the control flow or split the
    function by responsibility.
  severity: warn
  options:
    type: object
    properties:
      max:
        $ref: '#/$defs/limit'
        default: 30
        description: >-
          Most cognitive complexity a function may have: an integer for
          every role, or an object with `default` and one entry per role
          (`function`, `method`, `constructor`, `implementation`,
          `entrypoint`, `test`); a role left out takes `default`, and -1 is
          no limit. A project that sets an object keeps the roles it does
          not name.
      ignoreDispatch:
        type: boolean
        default: true
        description: >-
          Leave out a function that is a table in code form (one switch or match whose arms are single values); `false` counts it.
    additionalProperties: false
  languages:
    rust:
      options:
        max: 25
  check:
    type: cel
    select: function
    with:
      - name: m
        expr: metrics(func)
      - name: cap
        expr: limit(func, options.max)
    where: >-
      (func.kind == 'function' || func.kind == 'method')
      && m.measured && cap >= 0 && m.cognitive > cap
      && !(options.ignoreDispatch && m.dispatcher)
    message: >-
      {{ counted(func, m.cognitive, 'cognitive complexity points') }} (max {{ cap }}):
      flatten or split the control flow
    evidence:
      value: m.cognitive
      max: cap
      role: func.role
    identity:
      subject: func.id
  provenance:
    wasDerivedFrom:
      - "Campbell 2018, Cognitive Complexity (SonarSource)"
      - "gocognit min-complexity 30: https://golangci-lint.run/usage/linters/#gocognit"
      - "clippy cognitive_complexity 25: https://doc.rust-lang.org/clippy/lint_configuration.html"
      - "Sonar S3776"
  examples:
    - name: deep-loops
      language: go
      kind: invalid
      options:
        max: 5
      files:
        - path: sample.go
          body: |-
            package sample

            func scan(rows [][]int) int {
                total := 0
                for _, row := range rows {
                    for _, v := range row {
                        if v > 0 {
                            total += v
                        }
                    }
                }
                return total
            }
      expect:
        - line: 3
    - name: below-the-limit
      language: go
      kind: valid
      canonical: true
      options:
        max: 6
      files:
        - path: sample.go
          body: |-
            package sample

            func scan(rows [][]int) int {
                total := 0
                for _, row := range rows {
                    for _, v := range row {
                        if v > 0 {
                            total += v
                        }
                    }
                }
                return total
            }
    - name: dispatcher
      language: go
      kind: valid
      options:
        max: 0
      files:
        - path: sample.go
          body: |-
            package sample

            func name(k int) string {
                switch k {
                case 0:
                    return "zero"
                case 1:
                    return "one"
                default:
                    return "many"
                }
            }
    - name: rust-deep-loops
      language: rust
      kind: invalid
      options:
        max: 5
      files:
        - path: src/lib.rs
          body: |-
            pub fn scan(rows: &[Vec<i32>]) -> i32 {
                let mut total = 0;
                for row in rows {
                    for v in row {
                        if *v > 0 {
                            total += *v;
                        }
                    }
                }
                total
            }
      expect:
        - line: 1
    - name: rust-below-the-limit
      language: rust
      kind: valid
      canonical: true
      options:
        max: 6
      files:
        - path: src/lib.rs
          body: |-
            pub fn scan(rows: &[Vec<i32>]) -> i32 {
                let mut total = 0;
                for row in rows {
                    for v in row {
                        if *v > 0 {
                            total += *v;
                        }
                    }
                }
                total
            }
    - name: rust-dispatcher
      language: rust
      kind: valid
      options:
        max: 0
      files:
        - path: src/lib.rs
          body: |-
            pub fn name(k: u8) -> &'static str {
                match k {
                    0 => "zero",
                    1 => "one",
                    _ => "many",
                }
            }
