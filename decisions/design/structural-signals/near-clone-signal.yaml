# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/near-clone-signal
  labels:
    lighthouse/pack: design
    lighthouse/section: structural-signals
spec:
  title: Near-clones are a review signal
  context: >-
    Near-identical bodies often hide one concept implemented twice.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Near-clone analysis SHOULD require meaningful body size and a semantic or
    naming relation; syntax similarity alone MUST NOT require abstraction.
  severity: warn
  check:
    type: model
  provenance:
    wasDerivedFrom:
      - "Jiang et al., Deckard 2007; Roy and Cordy 2007"
