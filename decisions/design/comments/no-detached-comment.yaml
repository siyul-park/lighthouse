---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/no-detached-comment
  uid: 0def0213-f4c8-4a64-8a6c-3be8e1f4ac54
spec:
  title: Comments stay attached to declarations
  context: Detached comments can be dropped from Go documentation or left behind when
    a declaration moves. A blank line between a comment and the declaration it describes
    is misleading. Rust `///` followed by a blank line still attaches to the item,
    but the blank line is misleading there too (clippy `empty_line_after_doc_comments`).
    Reported only when blank lines alone separate the comment from the next declaration;
    a comment on the file's first line (a license header, package documentation or
    build constraint), an inner `//!` documentation comment, a directive, a banner,
    a comment followed by code or by another comment, and one without a following
    declaration are not candidates. TypeScript and JavaScript attach only a `/** */`
    comment to the declaration after it (TSDoc, JSDoc), so only those are judged; a
    `//` comment there labels a section or explains a block, and may stand apart. The fix deletes the blank lines. It is unsafe
    because the comment may have been meant for the section rather than the declaration.
  scope:
    subject: file
  languages:
    go: {}
    rust: {}
    typescript:
      options:
        docPrefix: "/**"
  options:
    properties:
      docPrefix:
        type: string
        default: ""
        description: What a comment starts with to document the declaration after it;
          comments that start otherwise are not judged. Empty judges every comment.
    additionalProperties: false
  requirement: A comment that describes a declaration SHOULD be adjacent to it, without
    intervening blank lines.
  severity: warn
  check:
    type: cel
    select: comment
    where: comment.standalone && comment.gap > 0 && !comment.top && !comment.generated
      && !comment.banner && !comment.directive && comment.text.startsWith(options.docPrefix)
      && !comment.text.startsWith('//!')
      && !comment.text.startsWith('/*!')
    message: comment above {{ comment.next_name }} is separated from it by {{ string(comment.gap)
      }} blank line(s)
    evidence:
      comment: comment.text
      next: comment.next
      gap: comment.gap
      blank: comment.blank
    identity:
      subject: comment.file
      snippet: comment.text
  fix:
    safety: unsafe
    type: cel
    edits: "[remove(finding.evidence.blank)]"
  provenance:
    wasDerivedFrom:
    - clippy empty_line_after_doc_comments
    - clippy empty_line_after_outer_attr
    - 'Go documentation comments: https://go.dev/doc/comment'
    - 'TSDoc: https://tsdoc.org/pages/spec/overview/ (a doc comment is a `/** */` block)'
  examples:
  - name: detached-go-invalid
    language: go
    kind: invalid
    files:
    - path: sample.go
      body: |
        package sample

        // Load reads a record.

        func Load() {}
    expect:
    - line: 3
    fixed:
    - path: sample.go
      body: |
        package sample

        // Load reads a record.
        func Load() {}
  - name: detached-go-valid
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample.go
      body: |
        // Package sample loads records.
        package sample

        // Load reads a record.
        func Load() {}
  - name: header-and-directive-go-valid
    language: go
    kind: valid
    files:
    - path: sample.go
      body: |
        // Copyright 2026 The Sample Authors.

        package sample

        //go:noinline

        func Load() {}
  - name: detached-rust-invalid
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |
        pub fn before() {}

        /// Opens the store.

        pub fn open() {}
    expect:
    - line: 3
    fixed:
    - path: src/lib.rs
      body: |
        pub fn before() {}

        /// Opens the store.
        pub fn open() {}
  - name: detached-rust-valid
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |
        //! Stores records.

        /// Opens the store.
        pub fn open() {}
    canonical: true
  - name: detached-typescript-invalid
    language: typescript
    kind: invalid
    files:
    - path: sample.ts
      body: |
        export const before = 1;

        /** Opens the store. */

        export function open(): void {}
    expect:
    - line: 3
    fixed:
    - path: sample.ts
      body: |
        export const before = 1;

        /** Opens the store. */
        export function open(): void {}
  - name: detached-typescript-valid
    language: typescript
    kind: valid
    canonical: true
    files:
    - path: sample.ts
      body: |
        /** Opens the store. */
        export function open(): void {}
  - name: header-typescript-valid
    language: typescript
    kind: valid
    files:
    - path: sample.ts
      body: |
        // Copyright 2026 The Sample Authors.

        import { open } from "./store";

        export const run = open;
  - name: detached-javascript-invalid
    language: typescript
    kind: invalid
    files:
    - path: sample.js
      body: |
        const before = 1;

        /** Opens the store. */

        function open() {}

        module.exports = { before, open };
    expect:
    - line: 3
  - name: section-comment-typescript-valid
    language: typescript
    kind: valid
    files:
    - path: sample.ts
      body: |
        export const before = 1;

        // Opens the store.

        export function open(): void {}
