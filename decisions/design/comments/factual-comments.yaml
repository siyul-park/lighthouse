# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/factual-comments
  uid: 43b5db9f-6a87-4e3f-8119-a28c1563f5af
  labels:
    lighthouse/pack: design
    lighthouse/section: comments
spec:
  title: Comments preserve facts
  context: >-
    A comment is justified only by a fact the code cannot say.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Comments MAY be added only when clearly necessary to preserve invariants and
    consequences, external or cross-package constraints, rejected alternatives
    with evidence, or external contracts or specifications. A necessary comment
    MUST state the smallest sufficient fact, constraint, invariant, or
    consequence.
  severity: info
  check:
    type: model
