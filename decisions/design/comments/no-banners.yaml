# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/no-banners
  uid: 38a41dfc-93d7-4634-ab1c-ccf00b3c242d
  labels:
    lighthouse/pack: design
    lighthouse/section: comments
spec:
  title: Comments do not label sections
  context: >-
    A banner restates structure that names and file layout already carry.

    Go: Reported when every non-blank line of a comment group is a banner
    line. A group that mixes banner lines with prose (a table, a diagram)
    is documentation and passes.

    Rust: Doc comments (`///`, `//!`) are Markdown and never banners; a
    plain `//` or block comment made only of banner lines is reported.
  scope:
    domain: code
    subject: file
    tests: include
  requirement: >-
    A comment MUST NOT only label a section of code: banner lines such as `//
    ---- Helpers ----`, `// ====` rules and `// MARK:` markers are a substitute
    for splitting, naming or ordering, and SHOULD be replaced by one of them.
  severity: warn
  options:
    type: object
    properties:
      minRun:
        type: integer
        default: 3
        description: Rule characters in a row that make a banner line.
      ruleChars:
        type: string
        default: "-=*~_+"
        description: Characters a banner rule is drawn with.
      labels:
        type: array
        default: ["MARK:", "#region", "#endregion"]
        description: Line prefixes that label a section on their own.
    additionalProperties: false
  check:
    type: cel
    select: comment
    with:
      - name: documentation
        expr: >-
          lines(comment.text).exists(l,
            (trim(l).startsWith('///') && !trim(l).startsWith('////'))
            || trim(l).startsWith('//!'))
      - name: bodies
        expr: >-
          lines(comment.text)
            .map(l, trim(trimLeft(trimSuffixes(trimPrefixes(trimPrefixes(trim(l), '//'), '/*'), '*/'), '#')))
            .filter(b, b != '')
      - name: labelled
        expr: bodies.map(b, options.labels.exists(m, b.startsWith(m)))
      - name: texts
        expr: >-
          bodies.map(b,
            options.labels.exists(m, b.startsWith(m))
            ? trim(drop(b, size(options.labels.filter(m, b.startsWith(m))[0])))
            : trim(trimRight(trim(drop(b, leadingRun(b, options.ruleChars))), options.ruleChars)))
      - name: named
        expr: texts.filter(t, t != '')
    where: >-
      comment.standalone && !documentation && size(bodies) > 0
      && bodies.all(b, options.labels.exists(m, b.startsWith(m))
                       || leadingRun(b, options.ruleChars) >= options.minRun)
    message: "comment labels a section instead of stating a fact; name the code or split it instead"
    evidence:
      comment: comment.text
      label: "size(named) > 0 ? named[0] : ''"
    identity:
      subject: comment.file
      snippet: comment.text
  fix:
    safety: suggested
    type: ops
    ops:
      - op: delete
        file: finding.file
        span: finding.span
  examples:
    - name: invalid
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            func helper() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            // ---- Helpers ----

            func helper() int { return 1 }
      expect:
        - line: 3
    - name: marker
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            func helper() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            // MARK: - Helpers

            func helper() int { return 1 }
      expect:
        - line: 3
    - name: valid
      language: go
      kind: valid
      canonical: true
      files:
        - path: example.go
          body: "package sample\n\n// Parse reads the header.\n//\n// The layout is\n//\n//\t---\n//\tname: value\n//\t---\nfunc Parse() int { return 1 }\n\nvar x = 1 // --- not a banner: it trails code"
    - name: rust-invalid
      language: rust
      kind: invalid
      fixed:
        - path: src/lib.rs
          body: "pub struct Store;"
      files:
        - path: src/lib.rs
          body: |-
            // ===== Types =====

            pub struct Store;
      expect:
        - line: 1
    - name: rust-valid
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            /// Store of values.
            ///
            /// ---
            pub struct Store;
