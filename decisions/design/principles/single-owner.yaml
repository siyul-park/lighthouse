# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/single-owner
  labels:
    lighthouse/pack: design
    lighthouse/section: principles
spec:
  title: "One implementation, one owner"
  intent: "Duplicated behavior drifts; a single owner keeps it consistent."
  scope:
    domain: code
    subject: project
  requirement: >-
    Each behavior MUST have one implementation and each semantic rule MUST have
    one owner.
  severity: info
  evidence: [owner, duplicates]
  check:
    type: model
