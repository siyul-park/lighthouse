# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/responsibility
  uid: 064e4160-8da3-4079-9674-aaeab16151ee
spec:
  title: One responsibility per symbol, and a boundary for every split
  context: >-
    A symbol with one responsibility and a narrow contract is easy to name,
    test and reuse; a split without a real difference in lifecycle or
    invariant only adds navigation cost, and a small module that a single
    other module uses is that user's detail (Martin, Clean Code ch. 10: a
    class has one reason to change; Ousterhout, A Philosophy of Software
    Design ch. 4 and 9: deep modules, better together). Reuse bought by
    merging unrelated roles couples things that change for different reasons.
    The limits measure the design, not its packaging: the remedy is simpler
    code or a concept that is reused, never relocation (Fowler, Refactoring
    2nd ed.: Inline Function, Lazy Element, Middle Man).

    Kinds, off by default and on in the strict project, one finding per module,
    the kind being the first match, at its first type that matches.
    `members`: a type has more public methods than `maxMembers` (Sonar S1448,
    classes should not have too many methods; methods that implement an
    interface are not counted). `cohesion`: a type with at least `minMethods`
    methods whose methods fall in more than one connected group, where two
    methods are joined by a field they both use or by a call between them
    (LCOM4, Hitz and Montazeri 1995). A type that implements an interface
    keeps its implementing methods in the groups.

    Judged by agent review: `conjoined`, an opt-in review route (lead decision
    8): a module whose parent module is its only production user, uses
    private functions, methods or fields of the parent, and is used by the
    parent in turn, so the two may share private implementation and the split
    may separate nothing (a Go package cannot reach the private items of its
    parent, so only Rust modules are put to a model); and a small module with a single dependent, no
    dependents or no declarations of its own, whether it is a real boundary or
    its user's detail; the requirement and the examples are the question.
  scope:
    subject: module
  requirement: >-
    Each symbol MUST have one coherent responsibility, a narrow contract, and
    sufficient scope for every legitimate caller. Symbols MUST be separated
    only when responsibility, invariant, ownership, lifecycle, or abstraction
    level differs. Physical separation MUST represent a real responsibility,
    ownership, or abstraction boundary: a module separated from its only user
    MUST be that kind of boundary, or be merged into the user; modules that
    share private implementation are no boundary and MUST be merged, or what
    both use moved behind one owner. Unrelated roles MUST NOT be combined
    merely to force reuse.
  severity: info
  options:
    properties:
      kinds:
        type: array
        items: { type: string, enum: [members, cohesion, conjoined] }
        default: []
        description: What to report.
      maxMembers:
        type: integer
        default: 10
        description: Most public methods a type may have.
      minMethods:
        type: integer
        default: 4
        description: Fewest methods a type has to have for its cohesion to be judged.
    additionalProperties: false
  check:
    type: cel
    select: module
    with:
      - name: crowded
        expr: >-
          'members' in options.kinds
          ? module.types.filter(t, t.public_methods > options.maxMembers)
          : []
      - name: split
        expr: >-
          'cohesion' in options.kinds
          ? module.types.filter(t, t.methods >= options.minMethods && t.lcom4 > 1)
          : []
      - name: tied
        expr: >-
          'conjoined' in options.kinds && module.parent != null && module.parent.sole_user
          && module.parent.called && size(module.parent.reaches) > 0
      - name: more
        expr: >-
          size(crowded) + size(split.filter(t, !crowded.exists(c, c.id == t.id))) - 1
    where: size(crowded) + size(split) > 0
    # Recall-oriented: modules under 600 lines with a single dependent or
    # nothing declared, and modules nobody imports unless they are an entry
    # module (a Go `main` package or a Rust binary target).
    review: >-
      tied
      || (module.lines < 600
          && (size(module.dependents) == 1 || module.declares == 0
              || (size(module.dependents) == 0 && module.name != 'main'
                  && !module.path.contains('[bin:'))))
    message: >-
      {{ (size(crowded) > 0
          ? crowded[0].name + ' has ' + string(crowded[0].public_methods) + ' public methods (max '
            + string(options.maxMembers) + '): it likely has several responsibilities; split it by responsibility'
          : size(split) > 0
          ? split[0].name + "'s methods form " + string(split[0].lcom4) + ' unrelated groups ('
            + split[0].groups.map(g, g.join(', ')).join(' | ')
            + '); split ' + split[0].name + ' along them'
          : tied
          ? module.name + ' and ' + module.parent.path + ' share private implementation ('
            + module.parent.reaches[0].name + '): merge them, or move what both use behind one owner'
          : '')
         + (more > 0 ? ' (+' + string(more) + ' more types)' : '') }}
    evidence:
      kind: "size(crowded) > 0 ? 'members' : size(split) > 0 ? 'cohesion' : tied ? 'conjoined' : ''"
      kinds: "(size(crowded) > 0 ? ['members'] : []) + (size(split) > 0 ? ['cohesion'] : []) + (tied ? ['conjoined'] : [])"
      types: "(crowded + split.filter(t, !crowded.exists(c, c.id == t.id))).map(t, t.id)"
      reaches: "tied ? module.parent.reaches.map(r, r.id) : []"
    at:
      symbol: "size(crowded) > 0 ? crowded[0].id : size(split) > 0 ? split[0].id : module.parent.reaches[0].id"
    identity:
      subject: module.path
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), ch. 10 Classes should be small
    - Martin, Clean Code (2008), ch. 10 Single responsibility and cohesion
    - Martin, Clean Code (2008), ch. 10 Organize for change
    - Martin, Clean Code (2008), G30 Functions Should Do One Thing
    - 'Hitz and Montazeri, Measuring Coupling and Cohesion in Object-Oriented Systems (1995): LCOM4'
    - Ousterhout, A Philosophy of Software Design (2018), chs. 4 and 9
    - Fowler, Refactoring (2nd ed., 2018), Inline Function, Lazy Element, Middle Man
  examples:
  - name: members-go-invalid
    language: go
    kind: invalid
    options: { kinds: [members], maxMembers: 2 }
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct{}

        func (s *Store) Get() int { return 1 }

        func (s *Store) Put() int { return 2 }

        func (s *Store) Drop() int { return 3 }
    expect:
    - line: 3
  - name: members-go-valid
    language: go
    kind: valid
    options: { kinds: [members], maxMembers: 3 }
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct{}

        func (s *Store) Get() int { return 1 }

        func (s *Store) Put() int { return 2 }

        func (s *Store) Drop() int { return 3 }
  - name: members-rust-invalid
    language: rust
    kind: invalid
    options: { kinds: [members], maxMembers: 2 }
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store;

        impl Store {
            pub fn get(&self) -> i32 { 1 }
            pub fn put(&self) -> i32 { 2 }
            pub fn drop_all(&self) -> i32 { 3 }
        }
    expect:
    - line: 1
  - name: members-rust-valid
    language: rust
    kind: valid
    options: { kinds: [members], maxMembers: 3 }
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store;

        impl Store {
            pub fn get(&self) -> i32 { 1 }
            pub fn put(&self) -> i32 { 2 }
            pub fn drop_all(&self) -> i32 { 3 }
        }
  - name: cohesion-go-invalid
    language: go
    kind: invalid
    options: { kinds: [cohesion] }
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct {
        	items []int
        	names []string
        }

        func (s *Store) AddItem(x int)    { s.items = append(s.items, x) }
        func (s *Store) CountItems() int  { return len(s.items) }
        func (s *Store) AddName(n string) { s.names = append(s.names, n) }
        func (s *Store) CountNames() int  { return len(s.names) }
    expect:
    - line: 3
  - name: cohesion-go-valid
    language: go
    kind: valid
    canonical: true
    options: { kinds: [cohesion] }
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct {
        	items []int
        }

        func (s *Store) Add(x int)   { s.items = append(s.items, x) }
        func (s *Store) Count() int  { return len(s.items) }
        func (s *Store) First() int  { return s.items[0] }
        func (s *Store) Last() int   { return s.items[len(s.items)-1] }
  - name: cohesion-rust-invalid
    language: rust
    kind: invalid
    options: { kinds: [cohesion] }
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            items: Vec<i32>,
            names: Vec<String>,
        }

        impl Store {
            fn add_item(&mut self, x: i32) { self.items.push(x); }
            fn count_items(&self) -> usize { self.items.len() }
            fn add_name(&mut self, n: String) { self.names.push(n); }
            fn count_names(&self) -> usize { self.names.len() }
        }
    expect:
    - line: 1
  - name: cohesion-rust-valid
    language: rust
    kind: valid
    canonical: true
    options: { kinds: [cohesion] }
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            items: Vec<i32>,
        }

        impl Store {
            fn add(&mut self, x: i32) { self.items.push(x); }
            fn count(&self) -> usize { self.items.len() }
            fn first(&self) -> i32 { self.items[0] }
            fn last(&self) -> i32 { self.items[self.items.len() - 1] }
        }
  - name: conjoined-rust-put-to-a-model
    language: rust
    kind: valid
    options: { kinds: [conjoined] }
    files:
    - path: src/lib.rs
      body: |-
        mod part;

        fn secret() -> i32 { 1 }

        pub fn run() -> i32 { part::work() }
    - path: src/part.rs
      body: |-
        pub fn work() -> i32 { super::secret() + 1 }
  - name: conjoined-rust-public-parts-only
    language: rust
    kind: valid
    options: { kinds: [conjoined] }
    files:
    - path: src/lib.rs
      body: |-
        mod part;

        pub fn api() -> i32 { 1 }

        pub fn run() -> i32 { part::work() }
    - path: src/part.rs
      body: |-
        pub fn work() -> i32 { super::api() + 1 }
