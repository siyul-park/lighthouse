# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/coherent-responsibility
  uid: 064e4160-8da3-4079-9674-aaeab16151ee
  labels:
    lighthouse/pack: design
    lighthouse/section: principles
spec:
  title: Coherent symbol responsibility
  context: >-
    A symbol with one responsibility and a narrow contract is easy to
    name, test and reuse.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Each symbol MUST have one coherent responsibility, a narrow contract, and
    sufficient scope for every legitimate caller.
  severity: info
  check:
    type: model
