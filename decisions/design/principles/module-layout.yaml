# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/module-layout
  uid: fcfc3715-5445-4f50-bc32-2d68f605c10c
spec:
  title: A module groups code at one abstraction level
  context: >-
    A directory should make one cohesive concept easy to find. Mixing
    high-level orchestration with implementation-specific files beside a
    subdirectory for that implementation often leaves two competing ways to
    navigate the same concept. A module root may remain a small public facade
    or composition root; the concern is a sustained mixture of peer roles, not
    the mere presence of a child directory (Martin, Clean Code (2008), G34;
    Ousterhout, A Philosophy of Software Design, chs. 4 and 9). A parent module
    that keeps direct code beside a nested `language` directory is a concrete
    warning candidate, because the language implementation is usually a separate
    responsibility; other mixed layouts need review rather than an automatic
    warning, since a small facade or composition root may legitimately assemble
    its children.
  scope:
    subject: module
    examples: exclude
  languages:
    go: {}
    rust: {}
  requirement: >-
    A module's direct implementation files and its child modules SHOULD form
    one coherent abstraction level.
  severity: warn
  options:
    properties:
      limits:
        type: object
        properties:
          directDeclarations: { type: integer }
        default: { directDeclarations: 3 }
        description: >-
          Direct declaration count above which code beside a language directory
          is a warning rather than a model-review candidate.
  check:
    type: cel
    select: module
    where: "module.lang != 'cel' && module.declares > (type(options.limits.directDeclarations) == int ? options.limits.directDeclarations : 3) && module.children.exists(child, child == 'language' || child == 'languages' || child.endsWith('/language') || child.endsWith('/languages'))"
    abstain: "module.lang != 'cel' && module.declares > 0 && size(module.children) > 0 && !(module.declares > (type(options.limits.directDeclarations) == int ? options.limits.directDeclarations : 3) && module.children.exists(child, child == 'language' || child == 'languages' || child.endsWith('/language') || child.endsWith('/languages')))"
    message: "Review whether {{ module.path }} mixes direct declarations with child modules"
    evidence:
      module: module.path
      children: module.children
    identity:
      subject: module.path
  examples:
  - name: mixed-level-go-package
    language: go
    kind: invalid
    files:
    - path: go.mod
      body: |-
        module example.com/sample
        go 1.26
    - path: engine.go
      body: |-
        package sample

        import "example.com/sample/language"

        type Engine struct{}
        type Config struct{}
        const Version = "1"
        var Defaults = map[string]string{}
        func Run() int { return language.Analyze() }
    - path: language/language.go
      body: |-
        package language

        func Analyze() int { return parse() }
        func parse() int { return 1 }
    options:
      limits:
        directDeclarations: 3
    expect:
    - line: 1
  - name: facade-package
    language: go
    kind: valid
    canonical: true
    files:
    - path: go.mod
      body: |-
        module example.com/sample
        go 1.26
    - path: language/language.go
      body: |-
        package language

        func Analyze() int { return parse() }
        func parse() int { return 1 }
  - name: mixed-level-implementation
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub mod language;
        pub struct Engine;
        pub struct Config;
        pub const VERSION: &str = "1";
        pub static DEFAULTS: &[&str] = &[];
        pub fn run() -> usize { language::analyze() }
    - path: src/language/mod.rs
      body: |-
        pub fn analyze() -> usize { parse() }
        fn parse() -> usize { 1 }
    options:
      limits:
        directDeclarations: 3
    expect:
    - line: 1
  - name: facade-over-subsystem
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |-
        pub mod language;
    - path: src/language/mod.rs
      body: |-
        pub fn analyze() -> usize { parse() }
        fn parse() -> usize { 1 }
  provenance:
    wasDerivedFrom:
      - Ousterhout, A Philosophy of Software Design, chs. 4 and 9
