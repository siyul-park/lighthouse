---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/meaningful-separation
  uid: 41496cc6-b32e-4ca0-842e-acf25e8426c7
spec:
  title: Modules represent meaningful boundaries
  context: A small module with one user may be a real abstraction or merely that user’s
    implementation detail. Evaluate the contract and dependencies, not size alone.
  scope:
    subject: module
  requirement: A module SHOULD be separate from its users only when it provides an
    independent responsibility, invariant, lifecycle, or reusable abstraction.
  severity: info
  check:
    type: cel
    select: module
    where: 'false'
    abstain: 'module.lines < 600 && (size(module.dependents) == 1 || module.declares
      == 0 || (size(module.dependents) == 0 && module.name != ''main'' && !module.path.contains(''[bin:''))) '
    message: "{{ 'review whether module ' + module.path + ' is an independent boundary
      or merely its user’s implementation detail' }}"
    evidence:
      module: module.path
      lines: module.lines
      dependents: module.dependents
      declares: module.declares
    identity:
      subject: module.path
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, coding-patterns#structural-rules-dbd77a89'
    - 'Lighthouse, coding-patterns#physical-cohesion-9cf2f03b'
    - 'Martin, Clean Code (2008), ch. 10 Single responsibility and cohesion'
  examples:
  - name: cohesion-go-invalid
    language: go
    kind: invalid
    files:
    - path: example.go
      body: "package sample\n\ntype Store struct {\n\titems []int\n\tnames []string\n}\n\nfunc
        (s *Store) AddItem(x int)    { s.items = append(s.items, x) }\nfunc (s *Store)
        CountItems() int  { return len(s.items) }\nfunc (s *Store) AddName(n string)
        { s.names = append(s.names, n) }\nfunc (s *Store) CountNames() int  { return
        len(s.names) }"
    expect: []
  - name: cohesion-go-valid
    language: go
    kind: valid
    canonical: true
    files:
    - path: example.go
      body: "package sample\n\ntype Store struct {\n\titems []int\n}\n\nfunc (s *Store)
        Add(x int)   { s.items = append(s.items, x) }\nfunc (s *Store) Count() int
        \ { return len(s.items) }\nfunc (s *Store) First() int  { return s.items[0]
        }\nfunc (s *Store) Last() int   { return s.items[len(s.items)-1] }"
  - name: cohesion-rust-invalid
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            items: Vec<i32>,
            names: Vec<String>,
        }

        impl Store {
            fn add_item(&mut self, x: i32) { self.items.push(x); }
            fn count_items(&self) -> usize { self.items.len() }
            fn add_name(&mut self, n: String) { self.names.push(n); }
            fn count_names(&self) -> usize { self.names.len() }
        }
    expect: []
  - name: cohesion-rust-valid
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            items: Vec<i32>,
        }

        impl Store {
            fn add(&mut self, x: i32) { self.items.push(x); }
            fn count(&self) -> usize { self.items.len() }
            fn first(&self) -> i32 { self.items[0] }
            fn last(&self) -> i32 { self.items[self.items.len() - 1] }
        }
  options:
    properties: {}
    additionalProperties: false
