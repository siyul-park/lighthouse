# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/minimal-symbols
  labels:
    lighthouse/pack: design
    lighthouse/section: principles
spec:
  title: Fewest necessary symbols
  intent: Keep the conceptual surface small so readers hold less in their head.
  scope:
    domain: code
    subject: project
  requirement: >-
    Required behavior MUST use the fewest necessary symbols and the least
    necessary code without weakening ownership or responsibility boundaries.
  enforcement: judgment
  evidence: [symbols, candidates]
