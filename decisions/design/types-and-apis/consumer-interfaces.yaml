apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/consumer-interfaces
  uid: fa92f6a4-faf0-4d39-9d90-6339604a33f8
  labels:
    lighthouse/pack: design
    lighthouse/section: types-and-apis
spec:
  title: Interfaces live at the consumer
  context: >-
    An interface describes what a caller needs, so it belongs to the
    caller.

    Go: Declare the interface in the consuming package, not beside its
    only implementation.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Interfaces MUST be used only when callers supply behavior and MUST be
    defined where that behavior is consumed.
  severity: warn
  check:
    type: model
