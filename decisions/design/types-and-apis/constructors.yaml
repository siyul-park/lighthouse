# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/constructors
  uid: f6846150-05e4-4842-b174-b80feffdc818
spec:
  title: Constructors validate, required arguments, optional options
  context: >-
    A constructed value should be valid or not exist, and the signature shows
    what is mandatory (Martin, Clean Code ch. 11: separate construction from
    use).

    Go: Optional values are injected through functional options.
  scope:
    subject: symbol
  requirement: >-
    Constructors MUST require inputs with no safe default and MUST validate
    required dependencies and shape; `Build` MUST validate a complete builder.
    Required constructor values MUST be passed as arguments; optional values
    MUST be injected through options.
  severity: info
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), ch. 11 Separate construction from use
    - Martin, Clean Code (2008), ch. 11 Dependency injection
