# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/ownership
  uid: 61a20af8-1053-4e04-bfbe-8512d7595901
  labels:
    lighthouse/pack: design
    lighthouse/section: types-and-apis
spec:
  title: State, generated code and platform code have one owner
  context: >-
    State that any importer can assign has no owner and no invariant, state
    reachable from anywhere cannot keep an invariant, and two writers without
    a protocol mean races and broken invariants (Martin, Clean Code ch. 6 and
    ch. 11: data/object anti-symmetry, globals and singletons; G36 Avoid
    Transitive Navigation). Hand edits to a generated file are lost on the
    next run, and platform differences leak when they are not fenced.

    Kind `global` (Go; `gochecknoglobals`): an exported package-level
    variable, which anyone can assign. Sentinel errors, by the `Err` name
    prefix, are exported variables by convention and are not reported. Rust
    statics are judged.

    Everything else is judged: a type or package-level variable that holds
    mutable state is put to a model, with the requirement and the examples as
    the question.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    An exported package-level variable MUST NOT hold mutable state: state
    belongs to an owner that guards it, and a global that never changes
    SHOULD be a constant or a function. Sentinel errors, by the `Err` name
    prefix, are exported variables by convention and are not reported. One
    symbol MUST own each mutable state and its transitions; shared mutable
    state MUST have one owner and one synchronization strategy. Private state
    belongs to its owner: an implementation component of an owner MAY access
    that owner's private state when it implements the owner's
    responsibility; unrelated code in the same package MUST use the owner's
    contract. Exported types SHOULD expose contract rather than mutable
    implementation state; data-only values and ABI bridge types MAY expose
    their fields. Retain/release and resource transitions MUST have one
    owner, and each resource MUST be released exactly once. Borrowed values
    MUST NOT cross or outlive their ownership boundary. Layout-only
    declarations MAY name private members but MUST NOT access runtime state.
    Generated files MUST change only through their generator. Platform
    mechanics MUST stay behind matching build constraints and owner packages.
  severity: warn
  check:
    type: cel
    select: symbol
    where: >-
      symbol.kind == "var" && symbol.owner == "" && symbol.visibility != "private"
      && symbol.lang == "go" && !symbol.name.startsWith("Err")
    review: >-
      !symbol.test && !symbol.generated
      && ((symbol.kind == 'var' && symbol.owner == '')
          || (symbol.kind == 'type' && symbol.members > 0 && !symbol.data_only))
    message: >-
      exported variable {{ symbol.name }} is mutable package state anyone can assign;
      keep it private and expose it through its owner
    evidence:
      kind: "'global'"
      kinds: "['global']"
      symbol: symbol.id
      module: symbol.module
  provenance:
    wasDerivedFrom:
    - 'gochecknoglobals: https://github.com/leighmcculloch/gochecknoglobals'
    - Martin, Clean Code (2008), ch. 6 Data/object anti-symmetry
    - Martin, Clean Code (2008), ch. 6 DTOs, active records
    - Martin, Clean Code (2008), ch. 11 Globals, singletons
  examples:
  - name: global-invalid
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package config

        var Defaults = map[string]string{}
    expect:
    - line: 3
  - name: global-valid
    language: go
    kind: valid
    canonical: true
    files:
    - path: example.go
      body: |-
        package config

        import "errors"

        var ErrMissing = errors.New("missing")

        var defaults = map[string]string{}

        const Limit = 3
  - name: global-rust-valid
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: 'pub static LIMIT: u8 = 3;'
