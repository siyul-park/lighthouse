---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/no-mutable-globals
  uid: 4d4d9ed4-61c3-42b6-a609-80a12af81871
spec:
  title: Mutable state has an explicit owner
  context: Mutable globals hide who owns lifecycle and concurrency. A local or instance
    owner makes mutation and synchronization explicit.
  scope:
    subject: symbol
  requirement: Mutable global variables SHOULD NOT be used for application state;
    state should be owned by an instance with a clear synchronization strategy.
  severity: warn
  check:
    type: cel
    select: symbol
    where: symbol.kind == "var" && symbol.owner == null && symbol.visibility != "private"
      && symbol.lang == "go" && !symbol.name.startsWith("Err")
    abstain: |-
      !symbol.test && !symbol.generated && ((symbol.kind == 'var' && symbol.owner == null)
          || (symbol.kind == 'type' && size(symbol.members) > 0 && !symbol.data_only))
    message: exported variable {{ symbol.name }} is mutable package state anyone can
      assign; keep it private and expose it through its owner
    evidence:
      kind: "'global'"
      kinds: "['global']"
      symbol: symbol.id
      module: symbol.module
  provenance:
    wasDerivedFrom:
    - 'gochecknoglobals: https://github.com/leighmcculloch/gochecknoglobals'
    - Martin, Clean Code (2008), ch. 6 Data/object anti-symmetry
    - Martin, Clean Code (2008), ch. 6 DTOs, active records
    - Martin, Clean Code (2008), ch. 6 Hybrids
    - Martin, Clean Code (2008), ch. 11 Globals, singletons
  examples:
  - name: global-invalid
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package config

        var Defaults = map[string]string{}
    expect:
    - line: 3
  - name: global-valid
    language: go
    kind: valid
    canonical: true
    files:
    - path: example.go
      body: |-
        package config

        import "errors"

        var ErrMissing = errors.New("missing")

        var defaults = map[string]string{}

        const Limit = 3
  - name: global-rust-valid
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: 'pub static LIMIT: u8 = 3;'
