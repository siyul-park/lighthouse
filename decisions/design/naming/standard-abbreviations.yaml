spec:
  title: Keep standard abbreviations
  context: >-
    Conventional abbreviations are recognized faster than their
    expansions.

    Go: Initialisms keep a uniform case, for example `ID` and `IP`.
  scope:
    domain: code
    subject: symbol
  requirement: Standard abbreviations MUST be kept in their conventional form.
  severity: warn
  check:
    type: model
