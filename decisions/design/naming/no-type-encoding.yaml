---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/no-type-encoding
  uid: '0219682f-3eb7-4361-b438-6a9765ea0b48'
spec:
  title: Names do not encode representation
  context: Hungarian prefixes, member prefixes and `I`-prefixed interface names duplicate
    information available from types and declarations. Project-specific patterns can
    opt into the check under the strict preset.
  scope:
    subject: symbol
  languages:
    go: {}
    rust: {}
    cel: {}
  requirement: A name SHOULD NOT encode its type, scope, or interface status in a
    prefix when the declaration already supplies that information.
  severity: warn
  options:
    properties:
      enabled:
        type: boolean
        default: false
        strictDefault: true
        description: Enable type-encoding findings in the strict project.
      encodings:
        type: array
        items:
          type: object
          properties:
            pattern:
              type: string
            kinds:
              type: array
              items:
                type: string
          required:
          - pattern
        default:
        - pattern: "^m_[A-Za-z]"
        - pattern: "^(str|sz|psz|lp|lpsz|arr|dw)[A-Z]"
        - pattern: "^I[A-Z][a-z]"
          kinds:
          - interface
        description: 'Prefixes that encode the type or scope of a name: a `pattern`,
          and the `kinds` of symbol it applies to (all when absent).'
    additionalProperties: false
  check:
    type: cel
    select: symbol
    where: options.enabled && options.encodings.exists(e, symbol.name.matches(e.pattern)
      && (!has(e.kinds) || symbol.kind in e.kinds))
    message: "{{ symbol.name + ' encodes its type or scope in its name; drop the prefix'
      }}"
    evidence:
      name: symbol.name
    identity:
      subject: symbol.id
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G20 Function Names Should Say What They Do
    - Martin, Clean Code (2008), N1 Choose Descriptive Names
    - Martin, Clean Code (2008), N2 Choose Names at the Appropriate Level of Abstraction
    - Martin, Clean Code (2008), N3 Use Standard Nomenclature Where Possible
    - Martin, Clean Code (2008), N4 Unambiguous Names
    - Martin, Clean Code (2008), N6 Avoid Encodings
  examples:
  - name: encoding-go-invalid
    language: go
    kind: invalid
    options:
      enabled: true
    files:
    - path: example.go
      body: |-
        package sample

        type IReader interface{ Read() }
    expect:
    - line: 3
  - name: encoding-go-valid
    language: go
    kind: valid
    options:
      enabled: true
    files:
    - path: example.go
      body: |-
        package sample

        type Reader interface{ Read() }

        type Item struct{}
    canonical: true
  - name: encoding-rust-invalid
    language: rust
    kind: invalid
    options:
      enabled: true
    files:
    - path: src/lib.rs
      body: pub fn m_total() {}
    expect:
    - line: 1
  - name: encoding-rust-valid
    language: rust
    kind: valid
    options:
      enabled: true
    files:
    - path: src/lib.rs
      body: pub fn total() {}
    canonical: true
  - name: cel-type-prefix
    language: cel
    kind: invalid
    options: { enabled: true }
    files:
    - path: decisions/example.yaml
      body: |-
        apiVersion: lighthouse/v1alpha1
        kind: Decision
        metadata: { name: example/decision }
        spec:
          title: Example
          context: Example
          scope: { subject: symbol }
          requirement: Names stay clear.
          severity: warn
          check:
            type: cel
            select: symbol
            variables:
            - name: m_total
              expression: '1'
            where: symbol.name == 'example'
            message: Example
    expect: [{ line: 14 }]
  - name: cel-unencoded-name
    language: cel
    kind: valid
    canonical: true
    options: { enabled: true }
    files:
    - path: decisions/example.yaml
      body: |-
        apiVersion: lighthouse/v1alpha1
        kind: Decision
        metadata: { name: example/decision }
        spec:
          title: Example
          context: Example
          scope: { subject: symbol }
          requirement: Names stay clear.
          severity: warn
          check:
            type: cel
            select: symbol
            variables:
            - name: total
              expression: '1'
            where: symbol.name == 'example'
            message: Example
