# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/unique-type-names
  uid: 5ba3dce6-bc33-41da-adaa-1fcbef119d82
  labels:
    lighthouse/pack: design
    lighthouse/section: naming
    lighthouse/preset: strict
spec:
  title: One type name, one concept
  context: >-
    The deterministic companion of `design/terminology`: two public types of
    one name in different modules make a reader suspect they are the same
    concept, or hide that they are not. No tool checks this exactly; Sonar's
    S101 (type names follow a convention) is the nearest naming-consistency
    rule.

    A public type of production code is reported when another module of the
    project declares a public type of the same name, one finding for each
    declaration. The names in `allow` are idiomatic in every module and are
    not judged. Types of tests and of generated files are not compared, and
    only types of one language are: a type mirrored in another language is
    not a homonym.

    Go: `Error`, `Result`, `Options` and `Config` are the usual per-package
    names. Interfaces are not compared.

    Rust: `Error` and `Result` are idiomatic in every module.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A public type name SHOULD name one concept in the project; two modules
    SHOULD NOT export types of the same name.
  severity: info
  options:
    type: object
    properties:
      allow:
        type: array
        items:
          type: string
        default: [Error, Result, Options, Config]
        description: Type names that are idiomatic in every module.
    additionalProperties: false
  check:
    type: cel
    with:
      - name: others
        expr: symbol.homonyms
    where: >-
      symbol.kind == 'type' && symbol.visibility == 'public'
      && size(others) > 0 && !(symbol.name in options.allow)
    message: >-
      type {{ symbol.name }} is also declared in
      {{ others.map(h, h.module).join(', ') }}; one name, one concept
    evidence:
      others: others.map(h, h.id)
    identity:
      subject: symbol.id
  provenance:
    wasDerivedFrom:
      - "Sonar, S101 naming conventions"
  examples:
    - name: go-same-name-in-two-packages
      language: go
      kind: invalid
      files:
        - path: go.mod
          body: "module example.com/app\n\ngo 1.26\n"
        - path: billing/billing.go
          body: "package billing\n\ntype Account struct{}\n"
        - path: users/users.go
          body: "package users\n\ntype Account struct{}\n"
      expect:
        - line: 3
        - line: 3
    - name: go-distinct-names
      language: go
      kind: valid
      canonical: true
      files:
        - path: go.mod
          body: "module example.com/app\n\ngo 1.26\n"
        - path: billing/billing.go
          body: "package billing\n\ntype Invoice struct{}\n"
        - path: users/users.go
          body: "package users\n\ntype Account struct{}\n"
    - name: go-idiomatic-name
      language: go
      kind: valid
      files:
        - path: go.mod
          body: "module example.com/app\n\ngo 1.26\n"
        - path: billing/billing.go
          body: "package billing\n\ntype Config struct{}\n"
        - path: users/users.go
          body: "package users\n\ntype Config struct{}\n"
    - name: rust-same-name-in-two-modules
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub mod billing;
            pub mod users;
        - path: src/billing.rs
          body: |-
            pub struct Account;
        - path: src/users.rs
          body: |-
            pub struct Account;
      expect:
        - line: 1
        - line: 1
    - name: rust-distinct-names
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            pub mod billing;
            pub mod users;
        - path: src/billing.rs
          body: |-
            pub struct Invoice;
        - path: src/users.rs
          body: |-
            pub struct Account;
