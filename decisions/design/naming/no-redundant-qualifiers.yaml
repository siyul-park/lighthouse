# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/no-redundant-qualifiers
  labels:
    lighthouse/pack: design
    lighthouse/section: naming
  annotations:
    lighthouse/was-builtin: design/no-redundant-qualifiers
    lighthouse/was-exceptions: " A name equal to its package or module name (`provider.Provider`, `list.List`, `time.Time`) is the package's primary concept; repeating it has meaning and is never reported."
spec:
  title: No redundant qualifiers
  context: >-
    Context already names the package, receiver, phase, or representation.

    Go: The package name, as the importing code writes it, repeated at the
    start of a longer exported name: `provider.ProviderOptions`,
    `sdk.SDKFrame`. Whole words only (`provider.Providence` is fine).

    Rust: Off by default (`kinds` is empty): the path callers write is the
    crate's public path, and the provider cannot say whether a public item
    is reached through its module (`store::StoreHandle`) or re-exported
    from the crate root (`crate::StoreHandle`), where the module name is
    not repeated. Set `kinds` to check the name of the module, the last
    component of its path, as a prefix or suffix of a longer public item
    name; the root module of a crate is matched by the crate name as a
    whole.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Package, receiver, phase, or representation MUST NOT be repeated in a
    name without meaning. A name equal to its package or module name
    (`provider.Provider`, `list.List`, `time.Time`) is the package's
    primary concept; repeating it has meaning and is never reported.
  severity: warn
  options:
    type: object
    properties:
      kinds:
        type: array
        default: [function, type, interface, const, var]
        description: >-
          Kinds of exported top-level symbols whose names are checked. Empty for
          Rust: see its tuning.
    additionalProperties: false
  languages:
    rust:
      options:
        kinds: []
  check:
    type: cel
    with:
      - name: repeated
        expr: >-
          symbol.module_forms.filter(f, f.key != ''
            && (symbol.name_key.startsWith(f.key + '_') || symbol.name_key.endsWith('_' + f.key)))
    where: >-
      symbol.owner == '' && symbol.visibility != 'private'
      && options.kinds.exists(k, k == symbol.kind)
      && !(symbol.kind == 'function' && symbol.name == 'main')
      && size(repeated) > 0
    message: >-
      {{ symbol.kind }} {{ symbol.name }} repeats its module name
      `{{ repeated[0].name }}`; callers already write it
    evidence:
      name: symbol.name
      repeated: repeated[0].name
    identity:
      subject: symbol.id
  examples:
    - name: invalid
      language: go
      kind: invalid
      files:
        - path: example.go
          body: |-
            package provider

            type ProviderOptions struct{}
      expect:
        - line: 3
    - name: suffix
      language: go
      kind: invalid
      files:
        - path: example.go
          body: |-
            package provider

            type OptionsProvider struct{}
      expect:
        - line: 3
    - name: valid
      language: go
      kind: valid
      files:
        - path: example.go
          body: |-
            package provider

            type Config struct{}

            type Providence struct{}

            type providerState struct{}
    - name: primary-concept
      language: go
      kind: valid
      canonical: true
      files:
        - path: example.go
          body: |-
            package provider

            type Provider struct{}
    - name: rust-invalid
      language: rust
      kind: invalid
      options:
        kinds: [type]
      files:
        - path: src/lib.rs
          body: "pub mod store;"
        - path: src/store.rs
          body: "pub struct StoreHandle;"
      expect:
        - line: 1
    - name: rust-valid
      language: rust
      kind: valid
      canonical: true
      options:
        kinds: [type]
      files:
        - path: src/lib.rs
          body: "pub mod store;"
        - path: src/store.rs
          body: "pub struct Handle;"
    - name: rust-primary-concept
      language: rust
      kind: valid
      options:
        kinds: [type]
      files:
        - path: src/lib.rs
          body: "pub mod store;"
        - path: src/store.rs
          body: "pub struct Store;"
    - name: rust-off-by-default
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            mod store;
            pub use store::StoreHandle;
        - path: src/store.rs
          body: "pub struct StoreHandle;"
