---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/no-redundant-qualifier
  uid: 469e6d33-f94a-4bff-96cf-c78a5afa1938
spec:
  title: Names do not repeat their owner or module
  context: Names already inherit the package, module or receiver in ordinary use.
    The primary concept may equal its package name; a member may repeat its owner
    only when an external wire name or implementation contract requires it. Members
    that all share one prefix or suffix word repeat their owner's context the same
    way (kind `affix`, reported once at the owner); three members is the default
    threshold, following clippy's `struct_field_names` and `enum_variant_names`.
  scope:
    subject: symbol
  requirement: A symbol name SHOULD NOT repeat its package, module, or owner name
    when the caller already supplies that context; an owner-equal primary concept
    is exempt.
  severity: warn
  options:
    properties:
      symbols:
        type: array
        items:
          type: string
          enum:
          - function
          - type
          - interface
          - const
          - var
        default:
        - function
        - type
        - interface
        - const
        - var
        description: 'Kinds of exported top-level symbols whose names are checked
          for a repeated qualifier. Empty for Rust: see its tuning.'
      members:
        type: array
        items:
          type: string
          enum:
          - field
          - method
          - variant
        default:
        - variant
        strictDefault: true
        description: Member kinds checked for a repeated owner name and for a shared
          affix; strict enables fields and methods.
      affix:
        type: boolean
        default: false
        strictDefault: true
        description: Report an owner whose members all share one prefix or suffix word.
      minMembers:
        type: integer
        default: 3
        description: Minimum number of members an owner needs before a shared affix
          is reported.
    additionalProperties: false
  languages:
    go: {}
    rust:
      options:
        symbols: []
    cel: {}
    typescript:
      options:
        symbols: []
  check:
    type: cel
    select: symbol
    variables:
    - name: repeated
      expression: symbol.module_forms.filter(f, f.key != '' && (symbol.name_key.startsWith(f.key
        + '_') || symbol.name_key.endsWith('_' + f.key)))
    - name: owner_key
      expression: 'symbol.owner != null ? symbol.owner.name_key : '''''
    - name: member_repeated
      expression: symbol.owner != null && symbol.kind in options.members && owner_key
        != '' && symbol.name_key != owner_key && (symbol.name_key.startsWith(owner_key
        + '_') || symbol.name_key.endsWith('_' + owner_key))
    - name: members
      expression: symbol.members.filter(m, m.kind in options.members)
    - name: prefix
      expression: members.map(m, m.name_key.split('_')[0]).filter(w, w != '' && size(members.filter(m,
        m.name_key.startsWith(w + '_'))) == size(members))
    - name: suffix
      expression: members.map(m, m.name_key.split('_')[size(m.name_key.split('_'))
        - 1]).filter(w, w != '' && size(members.filter(m, m.name_key.endsWith('_'
        + w))) == size(members))
    - name: affixed
      expression: options.affix && symbol.kind in ['type', 'interface'] && size(members)
        >= options.minMembers && (size(prefix) > 0 || size(suffix) > 0)
    - name: matched
      expression: >-
        (symbol.owner == null
          && (symbol.visibility != 'private' || symbol.lang == 'cel')
          && options.symbols.exists(k, k == symbol.kind)
          && !(symbol.kind == 'function' && symbol.name == 'main')
          && size(repeated) > 0 ? ['qualifier'] : [])
        + (member_repeated ? ['member'] : [])
        + (affixed ? ['affix'] : [])
    where: size(matched)>0
    message: "{{ matched[0] == 'qualifier' ? symbol.kind + ' ' + symbol.name + ' repeats
      its module name `' + repeated[0].name + '`; callers already write it' : matched[0]
      == 'member' ? symbol.kind + ' ' + symbol.name + ' repeats its owner name; callers
      already write it' : symbol.name + ' has ' + string(size(members)) + ' members
      sharing the ' + (size(prefix) > 0 ? 'prefix ' + prefix[0] : 'suffix ' + suffix[0])
      + '; use distinct names instead' }}"
    evidence:
      kind: matched[0]
      name: symbol.name
      owner: 'symbol.owner != null ? symbol.owner.name : ""'
      members: "matched[0] == 'affix' ? members.map(m, m.id) : []"
      affix: "matched[0] != 'affix' ? '' : size(prefix) > 0 ? prefix[0] : suffix[0]"
    identity:
      subject: symbol.id
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G20 Function Names Should Say What They Do
    - Martin, Clean Code (2008), N1 Choose Descriptive Names
    - Martin, Clean Code (2008), N2 Choose Names at the Appropriate Level of Abstraction
    - Martin, Clean Code (2008), N3 Use Standard Nomenclature Where Possible
    - Martin, Clean Code (2008), N4 Unambiguous Names
    - Martin, Clean Code (2008), N6 Avoid Encodings
  examples:
  - name: invalid
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package provider

        type ProviderOptions struct{}
    expect:
    - line: 3
  - name: suffix
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package provider

        type OptionsProvider struct{}
    expect:
    - line: 3
  - name: valid
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package provider

        type Config struct{}

        type Providence struct{}

        type providerState struct{}
    canonical: true
  - name: primary-concept
    language: go
    kind: valid
    canonical: false
    files:
    - path: example.go
      body: |-
        package provider

        type Provider struct{}
  - name: rust-invalid
    language: rust
    kind: invalid
    options:
      symbols:
      - type
    files:
    - path: src/lib.rs
      body: pub mod store;
    - path: src/store.rs
      body: pub struct StoreHandle;
    expect:
    - line: 1
  - name: rust-valid
    language: rust
    kind: valid
    canonical: true
    options:
      symbols:
      - type
    files:
    - path: src/lib.rs
      body: pub mod store;
    - path: src/store.rs
      body: pub struct Handle;
  - name: rust-primary-concept
    language: rust
    kind: valid
    options:
      symbols:
      - type
    files:
    - path: src/lib.rs
      body: pub mod store;
    - path: src/store.rs
      body: pub struct Store;
    canonical: false
  - name: affix-go
    language: go
    kind: invalid
    options:
      members:
      - field
      affix: true
    files:
    - path: sample.go
      body: "package sample\n\ntype Options struct {\n\toptA int\n\toptB int\n\toptC
        int\n}\n"
    expect:
    - line: 3
  - name: affix-go-distinct
    language: go
    kind: valid
    options:
      members:
      - field
      affix: true
    files:
    - path: sample.go
      body: "package sample\n\ntype Options struct {\n\tname string\n\tpath string\n\tmode
        int\n}\n"
  - name: affix-rust
    language: rust
    kind: invalid
    options:
      members:
      - variant
      affix: true
    files:
    - path: src/lib.rs
      body: |
        pub enum Kind {
            LinkFile,
            LinkDir,
            LinkSym,
        }
    expect:
    - line: 1
  - name: affix-rust-distinct
    language: rust
    kind: valid
    options:
      members:
      - variant
      affix: true
    files:
    - path: src/lib.rs
      body: |
        pub enum Kind {
            File,
            Dir,
            Link,
        }
  - name: cel-repeated-module-name
    language: cel
    kind: invalid
    files:
    - path: decisions/example.yaml
      body: |-
        apiVersion: lighthouse/v1alpha1
        kind: Decision
        metadata: { name: example/decision }
        spec:
          title: Example
          context: Example
          scope: { subject: symbol }
          requirement: Names stay clear.
          severity: warn
          check:
            type: cel
            select: symbol
            variables:
            - name: celValue
              expression: 'true'
            where: symbol.name == 'example'
            message: Example
    expect: [{ line: 14 }]
  - name: cel-unqualified-name
    language: cel
    kind: valid
    canonical: true
    files:
    - path: decisions/example.yaml
      body: |-
        apiVersion: lighthouse/v1alpha1
        kind: Decision
        metadata: { name: example/decision }
        spec:
          title: Example
          context: Example
          scope: { subject: symbol }
          requirement: Names stay clear.
          severity: warn
          check:
            type: cel
            select: symbol
            variables:
            - name: value
              expression: 'true'
            where: symbol.name == 'example'
            message: Example
  - name: typescript-enum-member-repeats-its-enum
    language: typescript
    kind: invalid
    files:
    - path: provider.ts
      body: |-
        export enum Kind {
          KindA,
          KindB,
          KindC,
        }
    expect:
    - line: 2
    - line: 3
    - line: 4
  - name: typescript-named-import-supplies-the-context
    language: typescript
    kind: valid
    files:
    - path: provider.ts
      body: |-
        export class ProviderOptions {}

        export function providerFor(): ProviderOptions {
          return new ProviderOptions();
        }
  - name: typescript-enum-valid
    language: typescript
    kind: valid
    files:
    - path: provider.ts
      body: |-
        export enum Kind {
          Local,
          Remote,
          Hybrid,
        }
  fix:
    safety: unsafe
    type: model
