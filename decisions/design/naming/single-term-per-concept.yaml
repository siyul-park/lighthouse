# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/single-term-per-concept
  labels:
    lighthouse/pack: design
    lighthouse/section: naming
spec:
  title: "One term, one concept"
  intent: Synonyms make readers suspect a difference that is not there.
  scope:
    domain: code
    subject: project
  requirement: One term MUST represent one concept across packages.
  enforcement: judgment
  evidence: [term, locations]
