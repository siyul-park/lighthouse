# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/reserved-action-verbs
  labels:
    lighthouse/pack: design
    lighthouse/section: naming
spec:
  title: Action verbs are reserved
  intent: A verb that names an action must not hide a value or a query.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Configured action verbs, by default `Build`, `Compile`, `Publish`,
    `Capture`, and `Use`, MUST be reserved for actions or transitions.
  enforcement: judgment
