# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/reserved-verbs
  uid: 2eeeddc2-7944-4824-9caf-415ff2ea92bf
  labels:
    lighthouse/pack: design
    lighthouse/section: naming
  annotations:
    lighthouse/was-names: design/reserved-action-verbs
spec:
  title: Action verbs are reserved
  context: >-
    A verb that names an action must not hide a value or a query.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Configured action verbs, by default `Build`, `Compile`, `Publish`,
    `Capture`, and `Use`, MUST be reserved for actions or transitions.
  severity: info
  check:
    type: model
