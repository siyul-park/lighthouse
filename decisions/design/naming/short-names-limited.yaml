# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/short-names-limited
  labels:
    lighthouse/pack: design
    lighthouse/section: naming
spec:
  title: One-letter names stay small
  context: >-
    One-letter names are only readable where context is a few lines.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    One-letter names MUST be limited to conventional receivers, indexes, and
    tiny scopes.
  severity: warn
  check:
    type: model
