# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/predicate-names
  labels:
    lighthouse/pack: design
    lighthouse/section: naming
spec:
  title: Predicate names state their form
  intent: The prefix tells callers what kind of question a predicate answers.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Predicates MUST name their form: `HasX` for containing or registering X,
    `IsX` for a state predicate, `MatchX` for comparison or validation against
    X, and a bare `X` for a direct boolean value. `At` MUST be used for position
    or time predicates.
  severity: warn
  evidence: [name, expected_form]
  languages:
    go:
      tuning: >-
        Spelled as shown for exported names; unexported names use lower camel
        case.
  check:
    type: model
