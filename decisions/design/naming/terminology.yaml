# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/terminology
  uid: c348ab03-6a31-4158-a81d-37e3a2f64b9e
  labels:
    lighthouse/pack: design
    lighthouse/section: naming
spec:
  title: "One term, one concept"
  context: >-
    Synonyms make readers suspect a difference that is not there, and one
    name for two concepts hides a difference that is.
  scope:
    domain: code
    subject: project
  requirement: >-
    One term MUST represent one concept across packages, and one concept one
    term: modules MUST NOT export types of the same name unless they are the
    same concept.
  severity: info
  check:
    type: model
    # The old deterministic check of `design/unique-type-names` (4% of 27
    # sampled findings were right) picks what the model is asked about. Widened
    # for recall: the idiomatic names (`Error`, `Result`, `Options`, `Config`)
    # are no longer allowed, so aliases and wire mirrors reach the model too.
    select: >-
      symbol.kind == 'type' && symbol.visibility == 'public'
      && size(symbol.homonyms) > 0
