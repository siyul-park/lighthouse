# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/private-helper-callers
  uid: eeef32fa-0078-4d2c-8ae0-5c89899120b8
  labels:
    lighthouse/pack: design
    lighthouse/section: functions
    lighthouse/preset: strict
spec:
  title: Private helpers have two callers
  context: >-
    A private helper with one caller is usually part of that caller.

    Go: A review item, not an error: a helper with one caller may be
    justified by naming a policy or isolating an abstraction level. Test
    callers do not count, and neither does a package variable that calls the
    helper in its initializer: it is a table of handlers, not a caller to
    compare the helper with. Forwarding wrappers are reported by
    `design/no-single-use-wrapper`, and a function used as a value is not
    judged.

    Rust: Private free functions and methods that have exactly one caller
    outside test code and are never named as a value. A method that some
    call may reach through a receiver of unknown type is not judged.
  scope:
    domain: code
    subject: symbol
  requirement: A private helper SHOULD have at least two callers.
  severity: info
  check:
    type: cel
    select: function
    with:
      - name: production
        expr: callers(func).filter(c, !c.test)
    where: >-
      (func.kind == 'function' || func.kind == 'method')
      && func.visibility == 'private' && func.name != 'main' && func.name != 'init'
      && func.references == 0 && !func.satisfies_interface && !func.forwards_only
      && size(production) == 1 && production[0].kind != 'var'
    message: >-
      private {{ func.kind }} {{ func.name }} has one caller ({{ production[0].name }});
      review whether it is part of that caller or names a real policy
    evidence:
      caller: production[0].id
      callers: "1"
      statements: func.statements
    identity:
      subject: func.id
  examples:
    - name: invalid
      language: go
      kind: invalid
      files:
        - path: example.go
          body: "package sample\n\nfunc Run(x int) int { return clamp(x) + 1 }\n\nfunc clamp(x int) int {\n\tif x > 10 {\n\t\treturn 10\n\t}\n\treturn x\n}"
      expect:
        - line: 5
    - name: called-by-a-table
      language: go
      kind: valid
      files:
        - path: example.go
          body: "package sample\n\nvar handlers = map[string]func(int) int{\n\t\"clamp\": func(x int) int { return clamp(x) },\n}\n\nfunc clamp(x int) int {\n\tif x > 10 {\n\t\treturn 10\n\t}\n\treturn x\n}"
    - name: valid
      language: go
      kind: valid
      canonical: true
      files:
        - path: example.go
          body: "package sample\n\nfunc Run(x int) int { return clamp(x) + 1 }\n\nfunc Other(x int) int { return clamp(x) + 2 }\n\nfunc clamp(x int) int {\n\tif x > 10 {\n\t\treturn 10\n\t}\n\treturn x\n}"
    - name: rust-invalid
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub fn run(x: u8) -> u8 {
                clamp(x) + 1
            }

            fn clamp(x: u8) -> u8 {
                if x > 10 { 10 } else { x }
            }
      expect:
        - line: 5
    - name: rust-valid
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            pub fn run(x: u8) -> u8 {
                clamp(x) + 1
            }

            pub fn other(x: u8) -> u8 {
                clamp(x) + 2
            }

            fn clamp(x: u8) -> u8 {
                if x > 10 { 10 } else { x }
            }
