---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/no-redundant-symbol
  uid: 603a09cc-212a-40df-a376-34816e591436
spec:
  title: Redundant symbols are removed or consolidated
  context: 'One-use helpers are reviewed semantically: extract them only when they
    name a concept, remove duplication, isolate an abstraction level, serve as a function
    value, or provide a test seam. A private forwarding wrapper that adds no policy
    is inlined; a private interface with one implementation is replaced with the concrete
    type until another implementation exists.'
  scope:
    subject: symbol
    examples: exclude
  languages:
    go: {}
    rust: {}
    cel: {}
    typescript: {}
  requirement: A symbol SHOULD earn its existence by naming reusable behavior, a contract,
    an invariant, or a real abstraction; a forwarding wrapper or one-implementation
    private interface SHOULD be consolidated when it adds no distinct responsibility.
  severity: warn
  options:
    properties:
      kinds:
        type: array
        items:
          type: string
          enum:
          - wrapper
          - interface
        default:
        - wrapper
        - interface
        description: What to report.
    additionalProperties: false
  check:
    type: cel
    select: symbol
    variables:
    - name: callable
      expression: symbol.func != null && symbol.kind in ['function', 'method', 'var']
    - name: matched
      expression: |-
        ('wrapper' in options.kinds && callable && symbol.func.forwards_only ? ['wrapper'] : [])
        + ('interface' in options.kinds && symbol.kind == 'interface'
            && symbol.visibility == 'private' && size(symbol.members) > 0
            && size(symbol.implementers) == 1 ? ['interface'] : [])
    where: size(matched) > 0
    abstain: |-
      symbol.lang != 'cel' && symbol.visibility == 'private'
      && symbol.kind in ['function','method'] && symbol.func != null
      && size(symbol.func.callers.filter(c, !c.test)) == 1
      && !symbol.func.forwards_only && !symbol.implementation
      && !(symbol.name in ['main','init','_'])
    message: |-
      {{ size(matched) == 0 ? ''
         : matched[0] == 'wrapper'
         ? (symbol.lang == 'cel'
           ? 'private variable ' + symbol.name + ' only forwards another variable; inline it'
           : 'private helper ' + symbol.name + ' is a single-use forwarding wrapper; inline it')
         : matched[0] == 'dead'
         ? symbol.name + ' is never used; delete it'
         : symbol.name + ' has one implementation (' + symbol.implementers[0].name + '); use '
           + symbol.implementers[0].name + ' directly until a second one exists' }}
    evidence:
      kind: 'size(matched) > 0 ? matched[0] : '''''
      kinds: matched
      callee: "'wrapper' in matched ? symbol.func.forward_target : null"
      callers: "'wrapper' in matched ? size(symbol.func.callers) : null"
      implementer: "'interface' in matched ? symbol.implementers[0].id : null"
      stateless: "'interface' in matched ? symbol.implementers[0].members.filter(m,
        m.kind == 'field').size() == 0 : null"
    identity:
      subject: symbol.id
  fix:
    safety: unsafe
    type: model
    scope: symbol
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G9 Dead Code
    - Martin, Clean Code (2008), F4 Dead Function
    - Martin, Clean Code (2008), G12 Clutter
    - Martin, Clean Code (2008), ch. 12 Beck's four rules
    - Ousterhout, A Philosophy of Software Design (2018), chs. 4 and 9
    - Fowler, Refactoring (2nd ed., 2018), Inline Function, Lazy Element, Middle Man
  examples:
  - name: cel-forwarding-variable
    language: cel
    kind: invalid
    files:
    - path: decisions/example.yaml
      body: |-
        apiVersion: lighthouse/v1alpha1
        kind: Decision
        metadata: { name: example/decision }
        spec:
          title: Example
          context: Example
          scope: { subject: symbol }
          requirement: Avoid single-use forwarding variables.
          severity: warn
          check:
            type: cel
            select: symbol
            variables:
            - name: originalValue
              expression: '1'
            - name: aliasValue
              expression: originalValue
            where: aliasValue == 1
            message: Example
    expect: [{ line: 16 }]
  - name: cel-computed-variable
    language: cel
    kind: valid
    canonical: true
    files:
    - path: decisions/example.yaml
      body: |-
        apiVersion: lighthouse/v1alpha1
        kind: Decision
        metadata: { name: example/decision }
        spec:
          title: Example
          context: Example
          scope: { subject: symbol }
          requirement: Avoid single-use forwarding variables.
          severity: warn
          check:
            type: cel
            select: symbol
            variables:
            - name: originalValue
              expression: '1'
            - name: computedValue
              expression: originalValue + 1
            where: computedValue == 2
            message: Example
