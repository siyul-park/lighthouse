            fn read_one(&self, k: usize) -> u8;
        }

        pub struct Store {
            data: Vec<u8>,
        }

        impl Reader for Store {
            fn read_one(&self, k: usize) -> u8 {
                self.read(k)
            }
        }

        impl Store {
            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }
        }

        pub fn use_it(r: &dyn Reader) -> u8 {
            r.read_one(0)
        }
