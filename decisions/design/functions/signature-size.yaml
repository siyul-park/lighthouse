      body: |-
        #[serde(default)]
        pub struct BuildOptions {
            pub a: i32,
            pub b: i32,
            pub c: i32,
        }

        pub fn build(a: i32, b: i32, c: i32, d: i32, e: i32, f: i32, g: i32, o: BuildOptions) -> i32 {
            a + o.b
        }
    options:
      kinds:
      - params
    canonical: false
  - name: params-role-limits-merge-with-the-default
    language: go
    kind: invalid
    options:
      kinds:
      - params
      limits:
        params:
