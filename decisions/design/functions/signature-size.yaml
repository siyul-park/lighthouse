    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Pair {
            pub a: i32,
            pub b: i32,
            pub c: i32,
            pub d: i32,
        }

        pub fn split() -> Pair {
            Pair { a: 0, b: 0, c: 0, d: 0 }
        }
