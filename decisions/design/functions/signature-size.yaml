      - results
    canonical: false
  - name: results-a-named-struct-is-one-result
    language: go
    kind: valid
    files:
    - path: sample.go
      body: |-
        package sample

        type Pair struct{ A, B, C, D int }

        func split() Pair {
            return Pair{}
        }
    options:
      kinds:
      - results
    canonical: false
