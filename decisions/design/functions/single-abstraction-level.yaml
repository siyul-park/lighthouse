# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/single-abstraction-level
  labels:
    lighthouse/pack: design
    lighthouse/section: functions
spec:
  title: One abstraction level per function
  context: >-
    Mixed levels force readers to switch between intent and mechanics.
  scope:
    domain: code
    subject: symbol
  requirement: One function MUST stay at one abstraction level.
  severity: info
  check:
    type: model
