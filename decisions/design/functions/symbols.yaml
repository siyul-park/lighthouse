# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/symbols
  uid: 6fd6c0ba-61a7-4bc8-80b2-671c6fe78fe6
  labels:
    lighthouse/pack: design
    lighthouse/section: functions
spec:
  title: Every symbol earns its existence
  context: >-
    A symbol that earns nothing is indirection and noise (Martin, Clean Code
    G12 Clutter): a forwarding wrapper adds a name without
    adding meaning, a private helper with a single caller is part of that
    caller unless it names a concept, and every public knob has to be
    supported forever.

    Kind `wrapper`: a function or method whose whole body forwards to one
    other function with the arguments it was given, and that is called from
    one place, and not used as a value, from a test or as a trait method, is
    reported, since it can be inlined. One that adds an argument, or is
    needed as a function value, is not a wrapper.

    Helpers that are not wrappers are judged: a private function or method
    with exactly one production caller is put to a model, with the
    requirement and the examples as the question.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A simple single-use wrapper SHOULD be inlined unless its name expresses a
    real policy or mechanic; complex one-use mechanics require review rather
    than mechanical removal. A helper MUST earn its extraction: it removes
    semantic duplication, names reusable behavior or a policy, isolates an
    abstraction level, serves as a function value, or is a seam for a test;
    otherwise it stays in its caller. Every symbol MUST earn its existence
    through a distinct responsibility, invariant, ownership boundary, or
    reusable abstraction, and required behavior MUST use the fewest necessary
    symbols and the least necessary code without weakening ownership or
    responsibility boundaries. Generic parameter-group types, speculative
    options, extension points, aliases, and pass-through wrappers MUST NOT be
    exposed without a distinct contract.
  severity: warn
  check:
    type: cel
    select: function
    where: (func.kind == 'function' || func.kind == 'method') && func.forwards_only
    review: >-
      (func.kind == 'function' || func.kind == 'method')
      && func.visibility == 'private' && func.name != 'main' && func.name != 'init'
      && !func.implementation && size(callers(func).filter(c, !c.test)) == 1
    message: >-
      {{ func.forwards_only ? 'private helper ' + func.name + ' is a single-use forwarding wrapper; inline it' : '' }}
    evidence:
      kind: "'wrapper'"
      kinds: "['wrapper']"
      callee: func.forward_target
      callers: func.callers
    identity:
      subject: func.id
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G12 Clutter
    - Martin, Clean Code (2008), ch. 12 Beck's four rules
  examples:
  - name: invalid
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct{ data map[string][]byte }

        func (s *Store) load(k string) ([]byte, error) { return s.read(k) }

        func (s *Store) read(k string) ([]byte, error) { return s.data[k], nil }

        func (s *Store) Get(k string) ([]byte, error) { return s.load(k) }
    expect:
    - line: 5
  - name: valid
    language: go
    kind: valid
    files:
    - path: example.go
      body: "package sample\n\ntype Store struct {\n\tclosed bool\n\tdata   map[string][]byte\n}\n\nfunc
        (s *Store) load(k string) ([]byte, error) {\n\tif s.closed {\n\t\treturn nil,
        ErrClosed\n\t}\n\treturn s.read(k)\n}\n\nfunc (s *Store) read(k string) ([]byte,
        error) { return s.data[k], nil }\n\nfunc (s *Store) Get(k string) ([]byte, error)
        { return s.load(k) }"
  - name: used-as-value
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct{ data map[string][]byte }

        func (s *Store) load(k string) ([]byte, error) { return s.read(k) }

        func (s *Store) read(k string) ([]byte, error) { return s.data[k], nil }

        func (s *Store) Get(k string) ([]byte, error) { return s.load(k) }

        func (s *Store) Loader() func(string) ([]byte, error) { return s.load }
  - name: adds-an-argument
    language: go
    kind: valid
    canonical: true
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct{ data map[string][]byte }

        func (s *Store) load(k string) ([]byte, error) { return s.read(k, true) }

        func (s *Store) read(k string, fresh bool) ([]byte, error) { return s.data[k], nil }

        func (s *Store) Get(k string) ([]byte, error) { return s.load(k) }
  - name: called-from-a-test
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct{ data map[string][]byte }

        func (s *Store) load(k string) ([]byte, error) { return s.read(k) }

        func (s *Store) read(k string) ([]byte, error) { return s.data[k], nil }

        func (s *Store) Get(k string) ([]byte, error) { return s.load(k) }
    - path: example_test.go
      body: "package sample\n\nimport \"testing\"\n\nfunc TestLoad(t *testing.T) {\n\ts
        := &Store{}\n\ts.load(\"k\")\n}"
  - name: rust-invalid
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            data: Vec<u8>,
        }

        impl Store {
            fn load(&self, k: usize) -> u8 {
                self.read(k)
            }

            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }

            pub fn get(&self, k: usize) -> u8 {
                self.load(k)
            }
        }
    expect:
    - line: 6
  - name: rust-valid
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            closed: bool,
            data: Vec<u8>,
        }

        impl Store {
            fn load(&self, k: usize) -> u8 {
                if self.closed {
                    return 0;
                }
                self.read(k)
            }

            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }

            pub fn get(&self, k: usize) -> u8 {
                self.load(k)
            }
        }
  - name: rust-used-as-value
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            data: Vec<u8>,
        }

        impl Store {
            fn load(&self, k: usize) -> u8 {
                self.read(k)
            }

            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }

            pub fn get(&self, k: usize) -> u8 {
                self.load(k)
            }

            pub fn loader(&self) -> fn(&Store, usize) -> u8 {
                Store::load
            }
        }
  - name: rust-adds-an-argument
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            data: Vec<u8>,
        }

        impl Store {
            fn load(&self, k: usize) -> u8 {
                self.read(k, true)
            }

            fn read(&self, k: usize, fresh: bool) -> u8 {
                if fresh { self.data[k] } else { 0 }
            }

            pub fn get(&self, k: usize) -> u8 {
                self.load(k)
            }
        }
  - name: rust-called-from-a-test
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            data: Vec<u8>,
        }

        impl Store {
            fn load(&self, k: usize) -> u8 {
                self.read(k)
            }

            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }

            pub fn get(&self, k: usize) -> u8 {
                self.load(k)
            }
        }

        #[cfg(test)]
        mod tests {
            use super::*;

            #[test]
            fn loads() {
                let s = Store { data: vec![1] };
                s.load(0);
            }
        }
  - name: rust-trait-method
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub trait Reader {
            fn read_one(&self, k: usize) -> u8;
        }

        pub struct Store {
            data: Vec<u8>,
        }

        impl Reader for Store {
            fn read_one(&self, k: usize) -> u8 {
                self.read(k)
            }
        }

        impl Store {
            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }
        }

        pub fn use_it(r: &dyn Reader) -> u8 {
            r.read_one(0)
        }
  - name: rust-caller-through-unknown-receiver
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            data: Vec<u8>,
        }

        impl Store {
            fn load(&self, k: usize) -> u8 {
                self.read(k)
            }

            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }

            pub fn get(&self, k: usize) -> u8 {
                self.load(k)
            }
        }

        pub fn elsewhere(store: &external::Handle) -> u8 {
            store.load(0)
        }
