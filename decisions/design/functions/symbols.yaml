# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/symbols
  uid: 6fd6c0ba-61a7-4bc8-80b2-671c6fe78fe6
spec:
  title: Every symbol earns its existence
  context: >-
    A symbol that earns nothing is indirection and noise (Martin, Clean Code
    G12 Clutter): a forwarding wrapper adds a name without adding meaning, a
    private helper with a single caller is part of that caller unless it names
    a concept, and every public knob has to be supported forever. The limits
    measure the design, not its packaging: the remedy is simpler code or a
    concept that is reused, never relocation (Ousterhout, A Philosophy of
    Software Design chs. 4 and 9; Fowler, Refactoring 2nd ed.: Inline
    Function, Lazy Element, Middle Man).

    Kind `wrapper`: a function or method whose whole body forwards to one
    other function with the arguments it was given, and that is called from
    one place, and not used as a value, from a test or as a trait method, is
    reported, since it can be inlined. One that adds an argument, or is
    needed as a function value, is not a wrapper.

    Kind `dead` (on by default; Rust is off through `deadKinds`): a private
    function, method or variable that nothing calls and nothing refers to,
    that does not implement an interface, is no test fixture and is not
    `main`, `init` or `_`: delete it (Martin, Clean Code G9 and F4). Members
    of an interface or trait are declarations, not code, and functions without
    a body are implemented elsewhere (Go assembly), so neither is reported.
    The option `deadKinds` names the kinds of symbol it reports; types are
    left out by default because a type used only in type positions has no
    reference edge, and constants because a constant group counts as used when
    any member is (staticcheck U1000) and iota sentinels are never
    referenced. One that only tests use is left to agent review. Rust leaves
    dead code to rustc's `dead_code` lint, which sees type positions and
    macro arguments the index does not, so `deadKinds` is empty there.

    Kind `interface` (off by default and on in the strict project): a private
    interface with members and exactly one implementing type, tests included:
    use the type directly until a second implementation exists. An exported
    interface with one implementation is left to agent review, since callers
    outside the project may implement it.

    Helpers that are not wrappers are judged: a private function or method
    with exactly one production caller is put to a model, with the
    requirement and the examples as the question.
  scope:
    subject: symbol
  requirement: >-
    A simple single-use wrapper SHOULD be inlined unless its name expresses a
    real policy or mechanic; complex one-use mechanics require review rather
    than mechanical removal. A helper MUST earn its extraction: it removes
    semantic duplication, names reusable behavior or a policy, isolates an
    abstraction level, serves as a function value, or is a seam for a test;
    otherwise it stays in its caller. Every symbol MUST earn its existence
    through a distinct responsibility, invariant, ownership boundary, or
    reusable abstraction, and required behavior MUST use the fewest necessary
    symbols and the least necessary code without weakening ownership or
    responsibility boundaries. Generic parameter-group types, speculative
    options, extension points, aliases, and pass-through wrappers MUST NOT be
    exposed without a distinct contract.
  severity: warn
  options:
    properties:
      kinds:
        type: array
        items: { type: string, enum: [wrapper, dead, interface] }
        default: [wrapper, dead]
        description: What to report.
      deadKinds:
        type: array
        items: { type: string, enum: [function, method, type, interface, const, var] }
        default: [function, method, var]
        description: Symbol kinds the dead kind reports; types are left out because a type used only in type positions has no reference edge, and constants because a constant group is used when any member is and iota sentinels are never referenced.
    additionalProperties: false
  languages:
    rust:
      options:
        deadKinds: []
  check:
    type: cel
    select: symbol
    variables:
      - name: callable
        expression: "symbol.func != null && (symbol.kind == 'function' || symbol.kind == 'method')"
      - name: declared
        expression: "symbol.owner_kind == 'interface' || (symbol.func == null && symbol.kind in ['function', 'method'])"
      - name: matched
        expression: >-
          ('wrapper' in options.kinds && callable && symbol.func.forwards_only ? ['wrapper'] : [])
          + ('dead' in options.kinds && symbol.visibility == 'private'
              && symbol.kind in options.deadKinds && !declared
              && symbol.callers == 0 && symbol.references == 0 && !symbol.implementation
              && symbol.test_role == '' && !(symbol.name in ['main', 'init', '_'])
             ? ['dead'] : [])
          + ('interface' in options.kinds && symbol.kind == 'interface'
              && symbol.visibility == 'private' && symbol.members > 0
              && size(symbol.implementers) == 1
             ? ['interface'] : [])
    where: size(matched) > 0
    abstain: >-
      ('wrapper' in options.kinds && callable
        && symbol.visibility == 'private' && symbol.name != 'main' && symbol.name != 'init'
        && !symbol.implementation && size(callers(symbol.func).filter(c, !c.test)) == 1)
      || ('dead' in options.kinds && symbol.visibility == 'private'
          && symbol.kind in options.deadKinds && !declared
          && size(callers(symbol).filter(c, !c.test)) == 0 && symbol.callers > 0
          && symbol.references == 0)
      || ('interface' in options.kinds && symbol.kind == 'interface'
          && symbol.visibility != 'private' && symbol.members > 0
          && size(symbol.implementers) == 1)
    message: >-
      {{ size(matched) == 0 ? ''
         : matched[0] == 'wrapper'
         ? 'private helper ' + symbol.name + ' is a single-use forwarding wrapper; inline it'
         : matched[0] == 'dead'
         ? symbol.name + ' is never used; delete it'
         : symbol.name + ' has one implementation (' + symbol.implementers[0].name + '); use '
           + symbol.implementers[0].name + ' directly until a second one exists' }}
    evidence:
      kind: "size(matched) > 0 ? matched[0] : ''"
      kinds: matched
      callee: "'wrapper' in matched ? symbol.func.forward_target : null"
      callers: "'wrapper' in matched ? symbol.func.callers : null"
      implementer: "'interface' in matched ? symbol.implementers[0].id : null"
      stateless: "'interface' in matched ? symbol.implementers[0].stateless : null"
    identity:
      subject: symbol.id
  fix:
    safety: unsafe
    type: model
    scope: symbol
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G9 Dead Code
    - Martin, Clean Code (2008), F4 Dead Function
    - Martin, Clean Code (2008), G12 Clutter
    - Martin, Clean Code (2008), ch. 12 Beck's four rules
    - Ousterhout, A Philosophy of Software Design (2018), chs. 4 and 9
    - Fowler, Refactoring (2nd ed., 2018), Inline Function, Lazy Element, Middle Man
  examples:
  - name: invalid
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct{ data map[string][]byte }

        func (s *Store) load(k string) ([]byte, error) { return s.read(k) }

        func (s *Store) read(k string) ([]byte, error) { return s.data[k], nil }

        func (s *Store) Get(k string) ([]byte, error) { return s.load(k) }
    expect:
    - line: 5
  - name: valid
    language: go
    kind: valid
    files:
    - path: example.go
      body: "package sample\n\ntype Store struct {\n\tclosed bool\n\tdata   map[string][]byte\n}\n\nfunc
        (s *Store) load(k string) ([]byte, error) {\n\tif s.closed {\n\t\treturn nil,
        ErrClosed\n\t}\n\treturn s.read(k)\n}\n\nfunc (s *Store) read(k string) ([]byte,
        error) { return s.data[k], nil }\n\nfunc (s *Store) Get(k string) ([]byte, error)
        { return s.load(k) }"
  - name: used-as-value
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct{ data map[string][]byte }

        func (s *Store) load(k string) ([]byte, error) { return s.read(k) }

        func (s *Store) read(k string) ([]byte, error) { return s.data[k], nil }

        func (s *Store) Get(k string) ([]byte, error) { return s.load(k) }

        func (s *Store) Loader() func(string) ([]byte, error) { return s.load }
  - name: adds-an-argument
    language: go
    kind: valid
    canonical: true
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct{ data map[string][]byte }

        func (s *Store) load(k string) ([]byte, error) { return s.read(k, true) }

        func (s *Store) read(k string, fresh bool) ([]byte, error) { return s.data[k], nil }

        func (s *Store) Get(k string) ([]byte, error) { return s.load(k) }
  - name: called-from-a-test
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct{ data map[string][]byte }

        func (s *Store) load(k string) ([]byte, error) { return s.read(k) }

        func (s *Store) read(k string) ([]byte, error) { return s.data[k], nil }

        func (s *Store) Get(k string) ([]byte, error) { return s.load(k) }
    - path: example_test.go
      body: "package sample\n\nimport \"testing\"\n\nfunc TestLoad(t *testing.T) {\n\ts
        := &Store{}\n\ts.load(\"k\")\n}"
  - name: rust-invalid
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            data: Vec<u8>,
        }

        impl Store {
            fn load(&self, k: usize) -> u8 {
                self.read(k)
            }

            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }

            pub fn get(&self, k: usize) -> u8 {
                self.load(k)
            }
        }
    expect:
    - line: 6
  - name: rust-valid
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            closed: bool,
            data: Vec<u8>,
        }

        impl Store {
            fn load(&self, k: usize) -> u8 {
                if self.closed {
                    return 0;
                }
                self.read(k)
            }

            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }

            pub fn get(&self, k: usize) -> u8 {
                self.load(k)
            }
        }
  - name: rust-used-as-value
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            data: Vec<u8>,
        }

        impl Store {
            fn load(&self, k: usize) -> u8 {
                self.read(k)
            }

            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }

            pub fn get(&self, k: usize) -> u8 {
                self.load(k)
            }

            pub fn loader(&self) -> fn(&Store, usize) -> u8 {
                Store::load
            }
        }
  - name: rust-adds-an-argument
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            data: Vec<u8>,
        }

        impl Store {
            fn load(&self, k: usize) -> u8 {
                self.read(k, true)
            }

            fn read(&self, k: usize, fresh: bool) -> u8 {
                if fresh { self.data[k] } else { 0 }
            }

            pub fn get(&self, k: usize) -> u8 {
                self.load(k)
            }
        }
  - name: rust-called-from-a-test
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            data: Vec<u8>,
        }

        impl Store {
            fn load(&self, k: usize) -> u8 {
                self.read(k)
            }

            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }

            pub fn get(&self, k: usize) -> u8 {
                self.load(k)
            }
        }

        #[cfg(test)]
        mod tests {
            use super::*;

            #[test]
            fn loads() {
                let s = Store { data: vec![1] };
                s.load(0);
            }
        }
  - name: rust-trait-method
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub trait Reader {
            fn read_one(&self, k: usize) -> u8;
        }

        pub struct Store {
            data: Vec<u8>,
        }

        impl Reader for Store {
            fn read_one(&self, k: usize) -> u8 {
                self.read(k)
            }
        }

        impl Store {
            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }
        }

        pub fn use_it(r: &dyn Reader) -> u8 {
            r.read_one(0)
        }
  - name: rust-caller-through-unknown-receiver
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            data: Vec<u8>,
        }

        impl Store {
            fn load(&self, k: usize) -> u8 {
                self.read(k)
            }

            fn read(&self, k: usize) -> u8 {
                self.data[k]
            }

            pub fn get(&self, k: usize) -> u8 {
                self.load(k)
            }
        }

        pub fn elsewhere(store: &external::Handle) -> u8 {
            store.load(0)
        }
  - name: dead-go-invalid
    language: go
    kind: invalid
    options: { kinds: [dead] }
    files:
    - path: example.go
      body: |-
        package sample

        func Run() int { return helper() }

        func helper() int { return 1 }

        func unused() int { return 2 }
    expect:
    - line: 7
  - name: dead-go-valid
    language: go
    kind: valid
    options: { kinds: [dead] }
    files:
    - path: example.go
      body: |-
        package sample

        func Run() int { return helper() }

        func helper() int { return 1 }
  - name: dead-go-interface-member
    language: go
    kind: valid
    options: { kinds: [dead] }
    files:
    - path: example.go
      body: |-
        package sample

        type marker interface {
            isMarker()
        }

        type node struct{}

        func (node) isMarker() {}

        func Mark(m marker) bool { return m != nil }
  - name: dead-go-bodyless
    language: go
    kind: valid
    options: { kinds: [dead] }
    files:
    - path: example.go
      body: |-
        package sample

        func exit()

        func Run() int { return 1 }
  - name: dead-rust-off
    language: rust
    kind: valid
    options: { kinds: [dead] }
    files:
    - path: src/lib.rs
      body: |-
        pub fn run() -> i32 {
            helper()
        }

        fn helper() -> i32 {
            1
        }

        fn unused() -> i32 {
            2
        }
  - name: interface-go-invalid
    language: go
    kind: invalid
    options: { kinds: [interface] }
    files:
    - path: example.go
      body: |-
        package sample

        type store interface {
        	Get() int
        	Put(x int)
        }

        type memory struct{ n int }

        func (m *memory) Get() int  { return m.n }
        func (m *memory) Put(x int) { m.n = x }

        func Use() int {
        	m := &memory{}
        	m.Put(1)
        	return m.Get()
        }
    expect:
    - line: 3
  - name: interface-go-valid
    language: go
    kind: valid
    options: { kinds: [interface] }
    files:
    - path: example.go
      body: |-
        package sample

        type store interface {
        	Get() int
        	Put(x int)
        }

        type memory struct{ n int }

        func (m *memory) Get() int  { return m.n }
        func (m *memory) Put(x int) { m.n = x }

        func Use() int {
        	m := &memory{}
        	m.Put(1)
        	return m.Get()
        }

        type disk struct{ n int }

        func (d *disk) Get() int  { return d.n }
        func (d *disk) Put(x int) { d.n = x }
  - name: interface-rust-invalid
    language: rust
    kind: invalid
    options: { kinds: [interface] }
    files:
    - path: src/lib.rs
      body: |-
        trait Store {
            fn get(&self) -> i32;
            fn put(&mut self, x: i32);
        }

        struct Memory {
            n: i32,
        }

        impl Store for Memory {
            fn get(&self) -> i32 {
                self.n
            }

            fn put(&mut self, x: i32) {
                self.n = x;
            }
        }

        pub fn run() -> i32 {
            let mut m = Memory { n: 0 };
            m.put(1);
            m.get()
        }
    expect:
    - line: 1
  - name: interface-rust-valid
    language: rust
    kind: valid
    options: { kinds: [interface] }
    files:
    - path: src/lib.rs
      body: |-
        trait Store {
            fn get(&self) -> i32;
            fn put(&mut self, x: i32);
        }

        struct Memory {
            n: i32,
        }

        impl Store for Memory {
            fn get(&self) -> i32 {
                self.n
            }

            fn put(&mut self, x: i32) {
                self.n = x;
            }
        }

        pub fn run() -> i32 {
            let mut m = Memory { n: 0 };
            m.put(1);
            m.get()
        }

        struct Disk {
            n: i32,
        }

        impl Store for Disk {
            fn get(&self) -> i32 {
                self.n
            }

            fn put(&mut self, x: i32) {
                self.n = x;
            }
        }
