---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/complexity
  uid: 374c95b6-7892-4e6b-a8db-d25efe157aab
spec:
  title: Functions stay within their complexity limits
  context: Function size and control-flow metrics are signals for simplifying the
    function, not for moving the same complexity into another file or a helper used
    only once; the remedy simplifies the behavior rather than relocating it. A role-specific limit may replace the default for lines, statements,
    decision paths, cognitive complexity, and nesting.
  scope:
    subject: symbol
  requirement: A function SHOULD stay within the configured limits for lines, statements,
    decision paths, cognitive complexity, and nesting.
  severity: warn
  options:
    properties:
      kinds:
        type: array
        items:
          type: string
          enum:
          - lines
          - statements
          - cyclomatic
          - cognitive
          - nesting
        default:
        - lines
        - statements
        - cyclomatic
        - cognitive
        - nesting
        description: What to report; a function is reported once, with every kind
          that matched in the evidence.
      limits:
        type: object
        properties:
          lines:
            "$ref": "#/$defs/limit"
          statements:
            "$ref": "#/$defs/limit"
          cyclomatic:
            "$ref": "#/$defs/limit"
          cognitive:
            "$ref": "#/$defs/limit"
          nesting:
            "$ref": "#/$defs/limit"
        default:
          lines: 60
          statements: 40
          cyclomatic: 30
          cognitive: 30
          nesting: 4
        description: 'The most each measure may have: an integer for every role, or
          an object with `default` and one entry per role (`function`, `method`, `constructor`,
          `implementation`, `entrypoint`, `test`); a role left out takes `default`,
          and -1 is no limit. A project that sets an object replaces the whole option.'
      ignoreDispatch:
        type: boolean
        default: true
        description: Leave out a function that is a table in code form or a flat dispatch
          (see the context); `false` counts them like any other function.
    additionalProperties: false
  check:
    type: cel
    select: function
    variables:
    - name: m
      expression: func.metrics
    - name: u
      expression: func.unit
    - name: caps
      expression: |-
        {'lines': type(options.limits.lines) == int ? options.limits.lines : options.limits.lines[?func.role].orValue(options.limits.lines[?'default'].orValue(-1)),
          'statements': type(options.limits.statements) == int ? options.limits.statements : options.limits.statements[?func.role].orValue(options.limits.statements[?'default'].orValue(-1)),
          'cyclomatic': type(options.limits.cyclomatic) == int ? options.limits.cyclomatic : options.limits.cyclomatic[?func.role].orValue(options.limits.cyclomatic[?'default'].orValue(-1)),
          'cognitive': type(options.limits.cognitive) == int ? options.limits.cognitive : options.limits.cognitive[?func.role].orValue(options.limits.cognitive[?'default'].orValue(-1)),
          'nesting': type(options.limits.nesting) == int ? options.limits.nesting : options.limits.nesting[?func.role].orValue(options.limits.nesting[?'default'].orValue(-1))}
    - name: subject
      expression: 'func.role == ''constructor'' ? func.built + '' needs'' : func.name
        + '' has'''
    - name: rows
      expression: |-
        [{'kind': 'lines', 'what': 'lines', 'own': m.lines, 'all': u.lines,
          'max': caps.lines, 'skip': false,
          'hint': 'simplify it, or extract a concept that is reused'},
         {'kind': 'statements', 'what': 'statements', 'own': m.statements, 'all': u.statements,
          'max': caps.statements, 'skip': false,
          'hint': 'simplify it, or extract a concept that is reused'},
         {'kind': 'cyclomatic', 'what': 'decision paths', 'own': m.cyclomatic, 'all': u.cyclomatic,
          'max': caps.cyclomatic, 'skip': options.ignoreDispatch && (m.dispatcher || m.flat_dispatch),
          'hint': 'simplify the decisions'},
         {'kind': 'cognitive', 'what': 'cognitive complexity points', 'own': m.cognitive, 'all': u.cognitive,
          'max': caps.cognitive, 'skip': options.ignoreDispatch && m.dispatcher,
          'hint': 'flatten the control flow'}]
    - name: judged
      expression: 'm.measured ? rows.filter(r, r.max >= 0 && !r.skip) : []'
    - name: found
      expression: |-
        judged.filter(r, r.kind in options.kinds && r.own > r.max)
          .map(r, {'kind': r.kind, 'what': r.what, 'own': r.own, 'max': r.max,
                   'hint': r.hint, 'value': r.own})
        + (m.measured && 'nesting' in options.kinds && caps.nesting >= 0 && m.depth > caps.nesting
           ? [{'kind': 'nesting', 'what': 'levels of nesting', 'own': m.depth, 'max': caps.nesting,
               'hint': 'extract nested blocks or return early', 'value': m.depth}] : [])
    - name: first
      expression: 'size(found) > 0 ? found[0] : {''kind'': '''', ''what'': '''', ''own'':
        0, ''max'': 0, ''hint'': '''', ''value'': 0}'
    where: size(found) > 0
    message: "{{ size(found) == 0 ? '' : subject + ' ' + string(first.value) + ' '
      + first.what + ' (max ' + string(first.max) + '): ' + first.hint }}"
    evidence:
      kind: first.kind
      kinds: found.map(f, f.kind)
      value: first.value
      max: first.max
      role: func.role
    identity:
      subject: func.id
  languages:
    go: {}
    rust:
      options:
        limits:
          lines: 100
          statements: -1
          cognitive: 25
    cel:
      options:
        limits:
          lines: -1
          statements: 250
          cyclomatic: 40
          cognitive: 100
          nesting: 10
    typescript:
      options:
        limits:
          cyclomatic: 20
  provenance:
    wasDerivedFrom:
    - 'Lighthouse catalog: the CEL limits are the largest values among the expressions of the bundled decisions when CEL was first measured; lower them as those expressions are simplified'
    - 'funlen lines 60: https://golangci-lint.run/usage/linters/#funlen'
    - 'clippy too_many_lines 100: https://doc.rust-lang.org/clippy/lint_configuration.html'
    - 'ESLint max-lines-per-function: https://eslint.org/docs/latest/rules/max-lines-per-function'
    - 'funlen statements 40: https://golangci-lint.run/usage/linters/#funlen'
    - 'ESLint max-statements: https://eslint.org/docs/latest/rules/max-statements'
    - McCabe 1976, A Complexity Measure
    - 'gocyclo min-complexity 30: https://golangci-lint.run/usage/linters/#gocyclo'
    - 'ESLint complexity: https://eslint.org/docs/latest/rules/complexity'
    - Sonar S1541, cyclop
    - Campbell 2018, Cognitive Complexity (SonarSource)
    - 'gocognit min-complexity 30: https://golangci-lint.run/usage/linters/#gocognit'
    - 'clippy cognitive_complexity 25: https://doc.rust-lang.org/clippy/lint_configuration.html'
    - Sonar S3776
    - 'ESLint max-depth 4: https://eslint.org/docs/latest/rules/max-depth'
    - Sonar S134
    - Henry and Kafura 1981, information flow
    - 'funlen: https://golangci-lint.run/usage/linters/#funlen'
    - SonarSource, Cognitive Complexity (2017)
    - Martin, Clean Code (2008), G6 Code at Wrong Level of Abstraction
    - Martin, Clean Code (2008), G16 Obscured Intent
    - Martin, Clean Code (2008), G30 Functions Should Do One Thing
    - Martin, Clean Code (2008), G34 Functions Should Descend Only One Level of Abstraction
    - Martin, Clean Code (2008), ch. 3 Small functions
    - Martin, Clean Code (2008), ch. 3 Do one thing
    - Martin, Clean Code (2008), ch. 3 One level of abstraction
    - Ousterhout, A Philosophy of Software Design (2018), chs. 4 and 9
    - Fowler, Refactoring (2nd ed., 2018), Inline Function, Lazy Element, Middle Man
  examples:
  - name: lines-long-function
