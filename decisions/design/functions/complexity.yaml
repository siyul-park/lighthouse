# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/complexity
  uid: 374c95b6-7892-4e6b-a8db-d25efe157aab
spec:
  title: A function is small enough to read at one level
  context: >-
    Size and branching are signals of a function doing too much, not proof of
    it: the limits are deliberately high, and one finding is reported per
    function (the kind that matched first, in the order below; all matched
    kinds are in the evidence). The limits measure the design, not its
    packaging: the remedy is simpler code or a concept that is reused, never
    the same body moved elsewhere (Ousterhout, A Philosophy of Software Design
    chs. 4 and 9; Fowler, Refactoring 2nd ed.: Inline Function, Lazy Element,
    Middle Man; Martin, Clean Code ch. 3: small functions that do one thing at
    one level of abstraction). Metrics MUST NOT define universal declaration
    order, justify automatic reordering or prove single responsibility.

    Kinds, in report order. `lines`: a function's lines (Go `funlen`; the
    default 60 for Go, 100 for Rust). `statements`: its statements (`funlen`
    statements, 40; Rust has no default limit). `cyclomatic`: gocyclo's
    `min-complexity` (30) for Go and Rust, where clippy's cyclomatic lint was
    removed; ESLint `complexity` (20), Sonar S1541 (10) and cyclop (10) are
    lower, which fits a review signal less well than a deliberately high limit.
    `cognitive`: SonarSource cognitive complexity (30 for Go, 25 for Rust).
    `nesting`: the deepest block nesting (4). `hub`: a dependency hub (many
    callers and many callees in a long function) or a high fan-out
    coordinator. `helpers`, an opt-in review route (off by default, on in the strict
    project): a function within a limit whose unit, the function together with
    the private functions only it calls, transitively (single-use helpers,
    which can be neither reused nor read apart from their caller), is over
    it, is put to a model: is the split a concept or a relocation? It is never
    a finding by itself, and each function keeps its own findings (lead
    decision 8).

    Rust: `if`, `else if`, `if let`, `let ... else`, `while`, `for` and `loop`
    count as in other languages; a `match` counts its arms other than a
    wildcard or binding arm; `?` adds nothing; closures and `async` blocks
    nest what they contain.

    A function that is one `match` whose arms are single values (in return
    position) or `return`s is a table in code form, and a body whose only
    top-level branching is one switch of any arms, nested at most two levels,
    is a flat dispatch: its many paths do not make it hard to follow.
    `ignoreDispatch` (on by default) leaves both out of `cyclomatic`, and a
    table in code form out of `cognitive` and `hub`, because counting them
    reports tables and visitors that read linearly.

    A function that is not over a limit but has reached 60% of one is put to a
    model for the abstraction level (`abstain`); a finding on a function is
    never asked again.
  scope:
    subject: symbol
  requirement: >-
    A function SHOULD NOT exceed the limit of its role in lines, statements,
    cyclomatic complexity, cognitive complexity or nesting depth, and SHOULD
    NOT be a dependency hub or a high fan-out coordinator. Cyclomatic
    complexity is one path plus each `if`, `else if`, loop, error handler
    clause, non-default switch arm and boolean operator (`&&`, `||`). The
    remedy is simpler code or a concept that is reused, never the same body
    moved elsewhere. One function MUST stay at one abstraction level: intent
    and mechanics are not mixed in one body, so that it reads as a sequence of
    steps one level below its name. Mechanical checks SHOULD be preferred for
    directly expressible rules; heuristic signals SHOULD remain advisory and
    use deliberately high thresholds.
  severity: warn
  options:
    properties:
      kinds:
        type: array
        items:
          type: string
          enum: [lines, statements, cyclomatic, cognitive, nesting, hub, helpers]
        default: [lines, statements, cyclomatic, cognitive, nesting, hub]
        description: What to report; a function is reported once, with every kind that
          matched in the evidence.
      limits:
        type: object
        properties:
          lines: { "$ref": "#/$defs/limit" }
          statements: { "$ref": "#/$defs/limit" }
          cyclomatic: { "$ref": "#/$defs/limit" }
          cognitive: { "$ref": "#/$defs/limit" }
          nesting: { "$ref": "#/$defs/limit" }
        default: { lines: 60, statements: 40, cyclomatic: 30, cognitive: 30, nesting: 4 }
        description: 'The most each measure may have: an integer for every role, or
          an object with `default` and one entry per role (`function`, `method`, `constructor`,
          `implementation`, `entrypoint`, `test`); a role left out takes `default`,
          and -1 is no limit. A project that sets an object replaces the whole option.'
      ignoreDispatch:
        type: boolean
        default: true
        description: Leave out a function that is a table in code form or a flat dispatch
          (see the context); `false` counts them like any other function.
      hub:
        type: object
        properties:
          fanIn: { type: integer }
          fanOut: { type: integer }
          statements: { type: integer }
          coordinatorFanOut: { type: integer }
          coordinatorMaxFanIn: { type: integer }
          coordinatorStatements: { type: integer }
        default:
          fanIn: 8
          fanOut: 6
          statements: 20
          coordinatorFanOut: 12
          coordinatorMaxFanIn: 1
          coordinatorStatements: 15
        description: 'What marks a dependency hub or a high fan-out coordinator. `fanIn`:
          Callers that, with `fanOut` and `statements`, mark a dependency hub. `fanOut`:
          Callees of a dependency hub. `statements`: Statement count of a dependency
          hub. `coordinatorFanOut`: Callees that, with the other `coordinator*` options,
          mark a coordinator. `coordinatorMaxFanIn`: Most callers a coordinator may
          have. `coordinatorStatements`: Statement count of a coordinator.'
    additionalProperties: false
  check:
    type: cel
    select: function
    variables:
      - name: m
        expression: func.metrics
      - name: u
        expression: func.unit
      - name: fold
        expression: "'helpers' in options.kinds"
      - name: limits
        expression: options.limits
      - name: caps
        expression: >-
          {'lines': type(limits.lines) == int ? limits.lines : limits.lines[?func.role].orValue(limits.lines[?'default'].orValue(-1)),
            'statements': type(limits.statements) == int ? limits.statements : limits.statements[?func.role].orValue(limits.statements[?'default'].orValue(-1)),
            'cyclomatic': type(limits.cyclomatic) == int ? limits.cyclomatic : limits.cyclomatic[?func.role].orValue(limits.cyclomatic[?'default'].orValue(-1)),
            'cognitive': type(limits.cognitive) == int ? limits.cognitive : limits.cognitive[?func.role].orValue(limits.cognitive[?'default'].orValue(-1)),
            'nesting': type(limits.nesting) == int ? limits.nesting : limits.nesting[?func.role].orValue(limits.nesting[?'default'].orValue(-1))}
      - name: subject
        expression: "func.role == 'constructor' ? func.built + ' needs' : func.name + ' has'"
      - name: hub_role
        expression: >-
          (m.fan_in >= options.hub.fanIn && m.fan_out >= options.hub.fanOut
           && m.statements >= options.hub.statements)
          ? 'a dependency hub'
          : (m.fan_out >= options.hub.coordinatorFanOut
             && m.fan_in <= options.hub.coordinatorMaxFanIn
             && m.statements >= options.hub.coordinatorStatements)
          ? 'a high fan-out coordinator' : ''
      # The measures a unit adds up: own is the function's, all the unit's.
      - name: rows
        expression: >-
          [{'kind': 'lines', 'what': 'lines', 'own': m.lines, 'all': u.lines,
            'max': caps.lines, 'skip': false,
            'hint': 'simplify it, or extract a concept that is reused'},
           {'kind': 'statements', 'what': 'statements', 'own': m.statements, 'all': u.statements,
            'max': caps.statements, 'skip': false,
            'hint': 'simplify it, or extract a concept that is reused'},
           {'kind': 'cyclomatic', 'what': 'decision paths', 'own': m.cyclomatic, 'all': u.cyclomatic,
            'max': caps.cyclomatic, 'skip': options.ignoreDispatch && (m.dispatcher || m.flat_dispatch),
            'hint': 'simplify the decisions'},
           {'kind': 'cognitive', 'what': 'cognitive complexity points', 'own': m.cognitive, 'all': u.cognitive,
            'max': caps.cognitive, 'skip': options.ignoreDispatch && m.dispatcher,
            'hint': 'flatten the control flow'}]
      - name: judged
        expression: "m.measured ? rows.filter(r, r.max >= 0 && !r.skip) : []"
      - name: via
        expression: judged.filter(r, fold && r.own <= r.max && r.all > r.max)
      - name: found
        expression: >-
          judged.filter(r, r.kind in options.kinds && r.own > r.max)
            .map(r, {'kind': r.kind, 'what': r.what, 'own': r.own, 'max': r.max, 'hint': r.hint,
                     'value': r.own})
          + (m.measured && 'nesting' in options.kinds && caps.nesting >= 0 && m.depth > caps.nesting
            ? [{'kind': 'nesting', 'what': 'levels of nesting', 'own': m.depth, 'max': caps.nesting,
                'hint': 'extract nested blocks or return early', 'value': m.depth}] : [])
          + (m.measured && 'hub' in options.kinds && !m.dispatcher && hub_role != ''
            ? [{'kind': 'hub', 'what': hub_role, 'own': m.fan_in, 'max': options.hub.fanIn,
                'hint': '', 'value': m.fan_in}] : [])
      - name: first
        expression: >-
          size(found) > 0 ? found[0]
          : {'kind': '', 'what': '', 'own': 0, 'max': 0, 'hint': '', 'value': 0}
      - name: named
        expression: u.helpers.map(h, h.name)
      - name: near
        expression: >-
          m.measured && size(found) == 0
          && (rows.exists(r, r.max > 0 && r.own * 10 >= r.max * 6)
              || (caps.nesting > 0 && m.depth * 10 >= caps.nesting * 6))
    where: size(found) > 0
    abstain: near || (fold && size(via) > 0)
    message: >-
      {{ first.kind == ''
         ? (size(via) == 0 ? ''
            : subject + ' ' + string(via[0].all) + ' ' + via[0].what + ' with its single-use helpers '
              + (size(named) > 3 ? [named[0], named[1], named[2], '…'] : named).join(', ')
              + ' (max ' + string(via[0].max) + '); is the split a concept or a relocation?')
         : first.kind == 'hub'
         ? 'function ' + func.name + ' is ' + first.what + ': fan-in=' + string(m.fan_in) + ' fan-out=' + string(m.fan_out)
         : subject + ' ' + string(first.value) + ' ' + first.what + ' (max ' + string(first.max) + '): ' + first.hint }}
    evidence:
      kind: first.kind
      kinds: found.map(f, f.kind)
      value: first.value
      max: first.max
      role: func.role
      fan_in: m.fan_in
      fan_out: m.fan_out
      statements: m.statements
      helpers: "first.kind == '' && size(via) > 0 ? u.helpers.map(h, h.id) : null"
      metric: "first.kind == '' && size(via) > 0 ? via[0].kind : null"
    identity:
      subject: func.id
  languages:
    rust:
      options:
        limits:
          lines: 100
          statements: -1
          cognitive: 25
  provenance:
    wasDerivedFrom:
    - 'funlen lines 60: https://golangci-lint.run/usage/linters/#funlen'
    - 'clippy too_many_lines 100: https://doc.rust-lang.org/clippy/lint_configuration.html'
    - 'ESLint max-lines-per-function: https://eslint.org/docs/latest/rules/max-lines-per-function'
    - 'funlen statements 40: https://golangci-lint.run/usage/linters/#funlen'
    - 'ESLint max-statements: https://eslint.org/docs/latest/rules/max-statements'
    - McCabe 1976, A Complexity Measure
    - 'gocyclo min-complexity 30: https://golangci-lint.run/usage/linters/#gocyclo'
    - 'ESLint complexity: https://eslint.org/docs/latest/rules/complexity'
    - Sonar S1541, cyclop
    - Campbell 2018, Cognitive Complexity (SonarSource)
    - 'gocognit min-complexity 30: https://golangci-lint.run/usage/linters/#gocognit'
    - 'clippy cognitive_complexity 25: https://doc.rust-lang.org/clippy/lint_configuration.html'
    - Sonar S3776
    - 'ESLint max-depth 4: https://eslint.org/docs/latest/rules/max-depth'
    - Sonar S134
    - Henry and Kafura 1981, information flow
    - 'funlen: https://golangci-lint.run/usage/linters/#funlen'
    - SonarSource, Cognitive Complexity (2017)
    - Martin, Clean Code (2008), G6 Code at Wrong Level of Abstraction
    - Martin, Clean Code (2008), G16 Obscured Intent
    - Martin, Clean Code (2008), G30 Functions Should Do One Thing
    - Martin, Clean Code (2008), G34 Functions Should Descend Only One Level of Abstraction
    - Martin, Clean Code (2008), ch. 3 Small functions
    - Martin, Clean Code (2008), ch. 3 Do one thing
    - Martin, Clean Code (2008), ch. 3 One level of abstraction
    - Ousterhout, A Philosophy of Software Design (2018), chs. 4 and 9
    - Fowler, Refactoring (2nd ed., 2018), Inline Function, Lazy Element, Middle Man
  examples:
  - name: lines-long-function
    language: go
    kind: invalid
    options:
      kinds:
      - lines
      limits:
        lines: 6
    files:
    - path: sample.go
      body: |-
        package sample

        func total(a, b int) int {
            sum := a

            sum += b

            return sum
        }
    expect:
    - line: 3
  - name: lines-within-the-limit
    language: go
    kind: valid
    canonical: true
    options:
      kinds:
      - lines
      limits:
        lines: 7
    files:
    - path: sample.go
      body: |-
        package sample

        func total(a, b int) int {
            sum := a

            sum += b

            return sum
        }
  - name: lines-rust-long-function
    language: rust
    kind: invalid
    options:
      kinds:
      - lines
      limits:
        lines: 6
    files:
    - path: src/lib.rs
      body: |-
        pub fn total(a: i32, b: i32) -> i32 {
            let mut sum = a;

            sum += b;

            sum
        }
    expect:
    - line: 1
  - name: statements-many-statements
    language: go
    kind: invalid
    options:
      kinds:
      - statements
      limits:
        statements: 2
    files:
    - path: sample.go
      body: |-
        package sample

        func total(a, b int) int {
            sum := a
            sum += b
            return sum
        }
    expect:
    - line: 3
  - name: statements-within-the-limit
    language: go
    kind: valid
    options:
      kinds:
      - statements
      limits:
        statements: 3
    files:
    - path: sample.go
      body: |-
        package sample

        func total(a, b int) int {
            sum := a
            sum += b
            return sum
        }
  - name: cyclomatic-many-branches
    language: go
    kind: invalid
    options:
      kinds:
      - cyclomatic
      limits:
        cyclomatic: 3
    files:
    - path: sample.go
      body: |-
        package sample

        func classify(n int) string {
            if n < 0 {
                return "negative"
            }
            if n == 0 {
                return "zero"
            }
            if n < 10 {
                return "small"
            }
            return "large"
        }
    expect:
    - line: 3
  - name: cyclomatic-below-the-limit
    language: go
    kind: valid
    options:
      kinds:
      - cyclomatic
      limits:
        cyclomatic: 3
    files:
    - path: sample.go
      body: |-
        package sample

        func classify(n int) string {
            if n < 0 {
                return "negative"
            }
            if n == 0 {
                return "zero"
            }
            return "positive"
        }
  - name: cyclomatic-role-limit
    language: go
    kind: invalid
    options:
      kinds:
      - cyclomatic
      limits:
        cyclomatic:
          default: 9
          function: 3
    files:
    - path: sample.go
      body: |-
        package sample

        func classify(n int) string {
            if n < 0 {
                return "negative"
            }
            if n == 0 {
                return "zero"
            }
            if n < 10 {
                return "small"
            }
            return "large"
        }
    expect:
    - line: 3
  - name: cyclomatic-dispatcher
    language: go
    kind: valid
    options:
      kinds:
      - cyclomatic
      limits:
        cyclomatic: 1
    files:
    - path: sample.go
      body: |-
        package sample

        func name(k int) string {
            switch k {
            case 0:
                return "zero"
            case 1:
                return "one"
            default:
                return "many"
            }
        }
  - name: cyclomatic-rust-flat-dispatch
    language: rust
    kind: valid
    canonical: true
    options:
      kinds:
      - cyclomatic
      limits:
        cyclomatic: 3
    files:
    - path: src/lib.rs
      body: |-
        pub enum Node {
            If { has_else: bool },
            For,
            Call,
            Other,
        }

        #[derive(Default)]
        pub struct Counts {
            ifs: u32,
            elses: u32,
            loops: u32,
            calls: u32,
        }

        impl Counts {
            pub fn visit(&mut self, node: &Node) {
                match node {
                    Node::If { has_else } => {
                        self.ifs += 1;
                        if *has_else {
                            self.elses += 1;
                        }
                    }
                    Node::For => self.loops += 1,
                    Node::Call => self.calls += 1,
                    Node::Other => {}
                }
            }
        }
  - name: cognitive-deep-loops
    language: go
    kind: invalid
    options:
      kinds:
      - cognitive
      limits:
        cognitive: 5
    files:
    - path: sample.go
      body: |-
        package sample

        func scan(rows [][]int) int {
            total := 0
            for _, row := range rows {
                for _, v := range row {
                    if v > 0 {
                        total += v
                    }
                }
            }
            return total
        }
    expect:
    - line: 3
  - name: cognitive-rust-deep-loops
    language: rust
    kind: invalid
    options:
      kinds:
      - cognitive
      limits:
        cognitive: 5
    files:
    - path: src/lib.rs
      body: |-
        pub fn scan(rows: &[Vec<i32>]) -> i32 {
            let mut total = 0;
            for row in rows {
                for v in row {
                    if *v > 0 {
                        total += *v;
                    }
                }
            }
            total
        }
    expect:
    - line: 1
  - name: nesting-deeply-nested
    language: go
    kind: invalid
    options:
      kinds:
      - nesting
      limits:
        nesting: 2
    files:
    - path: sample.go
      body: |-
        package sample

        func scan(rows [][]int) int {
            total := 0
            for _, row := range rows {
                for _, v := range row {
                    if v > 0 {
                        total += v
                    }
                }
            }
            return total
        }
    expect:
    - line: 3
  - name: nesting-else-if-is-one-level
    language: go
    kind: valid
    options:
      kinds:
      - nesting
      limits:
        nesting: 1
    files:
    - path: sample.go
      body: |-
        package sample

        func grade(n int) string {
            if n < 0 {
                return "negative"
            } else if n == 0 {
                return "zero"
            } else if n < 10 {
                return "small"
            } else if n < 100 {
                return "medium"
            }
            return "large"
        }
  - name: nesting-closure-is-a-level
    language: go
    kind: invalid
    options:
      kinds:
      - nesting
      limits:
        nesting: 1
    files:
    - path: sample.go
      body: |-
        package sample

        func run(items []int) {
            each := func(f func(int)) {
                for _, i := range items {
                    f(i)
                }
            }
            each(func(int) {})
        }
    expect:
    - line: 3
  - name: hub-hub
    language: go
    kind: invalid
    options:
      kinds:
      - hub
      hub:
        fanIn: 2
        fanOut: 2
        statements: 1
    files:
    - path: sample.go
      body: "package sample\n\nfunc hub() {\n\tleft()\n\tright()\n}\n\nfunc left()  {}\nfunc
        right() {}\n\nfunc a() { hub() }\nfunc b() { hub() }"
    expect:
    - line: 3
  - name: hub-coordinator
    language: go
    kind: invalid
    options:
      kinds:
      - hub
      hub:
        fanIn: 100
        coordinatorFanOut: 3
        coordinatorMaxFanIn: 0
        coordinatorStatements: 3
    files:
    - path: sample.go
      body: "package sample\n\nfunc run() {\n\tone()\n\ttwo()\n\tthree()\n}\n\nfunc
        one()   {}\nfunc two()   {}\nfunc three() {}"
    expect:
    - line: 3
  - name: hub-ordinary-fan
    language: go
    kind: valid
    files:
    - path: sample.go
      body: "package sample\n\nfunc hub() {\n\tleft()\n\tright()\n}\n\nfunc left()  {}\nfunc
        right() {}\n\nfunc a() { hub() }\nfunc b() { hub() }"
    options:
      kinds:
      - hub
  - name: hub-rust-service-used-across-modules
    language: rust
    kind: valid
    options:
      kinds:
      - hub
      hub:
        fanIn: 2
        fanOut: 2
        statements: 1
    files:
    - path: src/lib.rs
      body: |-
        mod service {
            pub fn serve() {
                super::left();
                super::right();
            }
        }

        fn left() {}
        fn right() {}

        pub fn a() {
            service::serve();
        }
        pub fn b() {
            service::serve();
        }
  - name: helpers-go-put-to-a-model
    language: go
    kind: valid
    options:
      kinds:
      - lines
      - helpers
      limits:
        lines: 8
    files:
    - path: sample.go
      body: |-
        package sample

        func total(a, b int) int {
            sum := add(a, b)
            return scale(sum)
        }

        func add(a, b int) int {
            return a + b
        }

        func scale(n int) int {
            return n * 2
        }
  - name: helpers-go-reused-stay-apart
    language: go
    kind: valid
    options:
      kinds:
      - lines
      - helpers
      limits:
        lines: 8
    files:
    - path: sample.go
      body: |-
        package sample

        func total(a, b int) int {
            sum := add(a, b)
            return scale(sum)
        }

        func double(n int) int {
            return scale(n)
        }

        func add(a, b int) int {
            return a + b
        }

        func scale(n int) int {
            return n * 2
        }
  - name: helpers-rust-put-to-a-model
    language: rust
    kind: valid
    options:
      kinds:
      - lines
      - helpers
      limits:
        lines: 8
    files:
    - path: src/lib.rs
      body: |-
        pub fn total(a: i32, b: i32) -> i32 {
            scale(add(a, b))
        }

        fn add(a: i32, b: i32) -> i32 {
            a + b
        }

        fn scale(n: i32) -> i32 {
            n * 2
        }
