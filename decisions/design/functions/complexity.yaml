# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/complexity
  uid: 374c95b6-7892-4e6b-a8db-d25efe157aab
  labels:
    lighthouse/pack: design
    lighthouse/section: functions
spec:
  title: A function is small enough to read at one level
  context: >-
    Size and branching are signals of a function doing too much, not proof of
    it: the limits are deliberately high, one finding is reported per function
    (the kind that matched first, in the order below; all matched kinds are in
    the evidence), and the remedy is always smaller functions with one reason
    to change, never the same body moved elsewhere (Martin, Clean Code ch. 3:
    small functions that do one thing at one level of abstraction). Metrics
    MUST NOT define universal declaration order, justify automatic reordering
    or prove single responsibility.

    Kinds, in report order. `lines`: a function's lines (Go `funlen`; the
    default 60 for Go, 100 for Rust). `statements`: its statements (`funlen`
    statements, 40; Rust has no default limit). `cyclomatic`: gocyclo's
    `min-complexity` (30) for Go and Rust, where clippy's cyclomatic lint was
    removed; ESLint `complexity` (20), Sonar S1541 (10) and cyclop (10) are
    lower, which fits a review signal less well than a deliberately high limit.
    `cognitive`: SonarSource cognitive complexity (30 for Go, 25 for Rust).
    `nesting`: the deepest block nesting (4). `hub`: a dependency hub (many
    callers and many callees in a long function) or a high fan-out
    coordinator.

    Rust: `if`, `else if`, `if let`, `let ... else`, `while`, `for` and `loop`
    count as in other languages; a `match` counts its arms other than a
    wildcard or binding arm; `?` adds nothing; closures and `async` blocks
    nest what they contain.

    A function that is one `match` whose arms are single values (in return
    position) or `return`s is a table in code form, and a body whose only
    top-level branching is one switch of any arms, nested at most two levels,
    is a flat dispatch: its many paths do not make it hard to follow.
    `ignoreDispatch` (on by default) leaves both out of `cyclomatic`, and a
    table in code form out of `cognitive` and `hub`, because counting them
    reports tables and visitors that read linearly.

    A function that is not over a limit but has reached 60% of one is put to a
    model for the abstraction level (`review`); a finding on a function is
    never asked again.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A function SHOULD NOT exceed the limit of its role in lines, statements,
    cyclomatic complexity, cognitive complexity or nesting depth, and SHOULD
    NOT be a dependency hub or a high fan-out coordinator. Cyclomatic
    complexity is one path plus each `if`, `else if`, loop, error handler
    clause, non-default switch arm and boolean operator (`&&`, `||`). The
    split is by responsibility: the remedy is smaller functions, never moving
    the same body elsewhere. One function MUST stay at one abstraction level:
    intent and mechanics are not mixed in one body, so that it reads as a
    sequence of steps one level below its name. Mechanical checks SHOULD be
    preferred for directly expressible rules; heuristic signals SHOULD remain
    advisory and use deliberately high thresholds.
  severity: warn
  options:
    type: object
    properties:
      kinds:
        type: array
        items:
          type: string
          enum:
          - lines
          - statements
          - cyclomatic
          - cognitive
          - nesting
          - hub
        default:
        - lines
        - statements
        - cyclomatic
        - cognitive
        - nesting
        - hub
        description: What to report; a function is reported once, with every kind that
          matched in the evidence.
      limits:
        type: object
        properties:
          lines:
            "$ref": "#/$defs/limit"
          statements:
            "$ref": "#/$defs/limit"
          cyclomatic:
            "$ref": "#/$defs/limit"
          cognitive:
            "$ref": "#/$defs/limit"
          nesting:
            "$ref": "#/$defs/limit"
        default:
          lines: 60
          statements: 40
          cyclomatic: 30
          cognitive: 30
          nesting: 4
        description: 'The most each measure may have: an integer for every role, or
          an object with `default` and one entry per role (`function`, `method`, `constructor`,
          `implementation`, `entrypoint`, `test`); a role left out takes `default`,
          and -1 is no limit. A project that sets an object replaces the whole option. `lines`: Most lines a function may have. `statements`: Most statements
          a function may have. `cyclomatic`: Most cyclomatic complexity (paths) a function
          may have. `cognitive`: Most cognitive complexity a function may have. `nesting`:
          Deepest nesting a function may have.'
      ignoreDispatch:
        type: boolean
        default: true
        description: Leave out a function that is a table in code form or a flat dispatch
          (see the context); `false` counts them like any other function.
      hub:
        type: object
        properties:
          fanIn:
            type: integer
          fanOut:
            type: integer
          statements:
            type: integer
          coordinatorFanOut:
            type: integer
          coordinatorMaxFanIn:
            type: integer
          coordinatorStatements:
            type: integer
        default:
          fanIn: 8
          fanOut: 6
          statements: 20
          coordinatorFanOut: 12
          coordinatorMaxFanIn: 1
          coordinatorStatements: 15
        description: 'What marks a dependency hub or a high fan-out coordinator. `fanIn`:
          Callers that, with `fanOut` and `statements`, mark a dependency hub. `fanOut`:
          Callees of a dependency hub. `statements`: Statement count of a dependency
          hub. `coordinatorFanOut`: Callees that, with the other `coordinator*` options,
          mark a coordinator. `coordinatorMaxFanIn`: Most callers a coordinator may
          have. `coordinatorStatements`: Statement count of a coordinator.'
    additionalProperties: false
  check:
    type: cel
    select: function
    with:
      - name: m
        expr: metrics(func)
      - name: measured
        expr: (func.kind == 'function' || func.kind == 'method') && m.measured
      - name: caps
        expr: >-
          {'lines': limit(func, options.limits.lines),
           'statements': limit(func, options.limits.statements),
           'cyclomatic': limit(func, options.limits.cyclomatic),
           'cognitive': limit(func, options.limits.cognitive),
           'nesting': limit(func, options.limits.nesting)}
      - name: hub_role
        expr: >-
          (m.fan_in >= options.hub.fanIn && m.fan_out >= options.hub.fanOut
           && m.statements >= options.hub.statements)
          ? 'a dependency hub'
          : (m.fan_out >= options.hub.coordinatorFanOut
             && m.fan_in <= options.hub.coordinatorMaxFanIn
             && m.statements >= options.hub.coordinatorStatements)
          ? 'a high fan-out coordinator' : ''
      - name: found
        expr: >-
          (measured && 'lines' in options.kinds && caps.lines >= 0 && m.lines > caps.lines
            ? [{'kind': 'lines', 'value': m.lines, 'max': caps.lines, 'what': 'lines', 'hint': 'split by responsibility'}] : [])
          + (measured && 'statements' in options.kinds && caps.statements >= 0 && m.statements > caps.statements
            ? [{'kind': 'statements', 'value': m.statements, 'max': caps.statements, 'what': 'statements', 'hint': 'split by responsibility'}] : [])
          + (measured && 'cyclomatic' in options.kinds && caps.cyclomatic >= 0 && m.cyclomatic > caps.cyclomatic
              && !(options.ignoreDispatch && (m.dispatcher || m.flat_dispatch))
            ? [{'kind': 'cyclomatic', 'value': m.cyclomatic, 'max': caps.cyclomatic, 'what': 'decision paths', 'hint': 'split decisions into smaller functions'}] : [])
          + (measured && 'cognitive' in options.kinds && caps.cognitive >= 0 && m.cognitive > caps.cognitive
              && !(options.ignoreDispatch && m.dispatcher)
            ? [{'kind': 'cognitive', 'value': m.cognitive, 'max': caps.cognitive, 'what': 'cognitive complexity points', 'hint': 'flatten or split the control flow'}] : [])
          + (measured && 'nesting' in options.kinds && caps.nesting >= 0 && m.nesting > caps.nesting
            ? [{'kind': 'nesting', 'value': m.nesting, 'max': caps.nesting, 'what': 'levels of nesting', 'hint': 'extract nested blocks or return early'}] : [])
          + (measured && 'hub' in options.kinds && !m.dispatcher && hub_role != ''
            ? [{'kind': 'hub', 'value': m.fan_in, 'max': options.hub.fanIn, 'what': hub_role, 'hint': ''}] : [])
      - name: first
        expr: >-
          size(found) > 0 ? found[0]
          : {'kind': '', 'value': 0, 'max': 0, 'what': '', 'hint': ''}
      - name: near
        expr: >-
          measured && size(found) == 0
          && ((caps.lines > 0 && m.lines * 10 >= caps.lines * 6)
              || (caps.statements > 0 && m.statements * 10 >= caps.statements * 6)
              || (caps.cyclomatic > 0 && m.cyclomatic * 10 >= caps.cyclomatic * 6)
              || (caps.cognitive > 0 && m.cognitive * 10 >= caps.cognitive * 6)
              || (caps.nesting > 0 && m.nesting * 10 >= caps.nesting * 6))
    where: size(found) > 0
    review: near
    message: >-
      {{ first.kind == '' ? ''
         : first.kind == 'hub'
         ? 'function ' + func.name + ' is ' + first.what + ': fan-in=' + string(m.fan_in) + ' fan-out=' + string(m.fan_out)
         : counted(func, first.value, first.what) + ' (max ' + string(first.max) + '): ' + first.hint }}
    evidence:
      kind: first.kind
      kinds: found.map(f, f.kind)
      value: first.value
      max: first.max
      role: func.role
      fan_in: m.fan_in
      fan_out: m.fan_out
      statements: m.statements
    identity:
      subject: func.id
  languages:
    rust:
      options:
        limits:
          lines: 100
          statements: -1
          cognitive: 25
  provenance:
    wasDerivedFrom:
    - 'funlen lines 60: https://golangci-lint.run/usage/linters/#funlen'
    - 'clippy too_many_lines 100: https://doc.rust-lang.org/clippy/lint_configuration.html'
    - 'ESLint max-lines-per-function: https://eslint.org/docs/latest/rules/max-lines-per-function'
    - 'funlen statements 40: https://golangci-lint.run/usage/linters/#funlen'
    - 'ESLint max-statements: https://eslint.org/docs/latest/rules/max-statements'
    - McCabe 1976, A Complexity Measure
    - 'gocyclo min-complexity 30: https://golangci-lint.run/usage/linters/#gocyclo'
    - 'ESLint complexity: https://eslint.org/docs/latest/rules/complexity'
    - Sonar S1541, cyclop
    - Campbell 2018, Cognitive Complexity (SonarSource)
    - 'gocognit min-complexity 30: https://golangci-lint.run/usage/linters/#gocognit'
    - 'clippy cognitive_complexity 25: https://doc.rust-lang.org/clippy/lint_configuration.html'
    - Sonar S3776
    - 'ESLint max-depth 4: https://eslint.org/docs/latest/rules/max-depth'
    - Sonar S134
    - Henry and Kafura 1981, information flow
    - 'funlen: https://golangci-lint.run/usage/linters/#funlen'
    - SonarSource, Cognitive Complexity (2017)
    - Martin, Clean Code (2008), G6 Code at Wrong Level of Abstraction
    - Martin, Clean Code (2008), G16 Obscured Intent
    - Martin, Clean Code (2008), G30 Functions Should Do One Thing
    - Martin, Clean Code (2008), G34 Functions Should Descend Only One Level of Abstraction
    - Martin, Clean Code (2008), ch. 3 Small functions
    - Martin, Clean Code (2008), ch. 3 Do one thing
    - Martin, Clean Code (2008), ch. 3 One level of abstraction
