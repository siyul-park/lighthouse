    canonical: true
  - name: lines-rust-long-function
    language: rust
    kind: invalid
    options:
      kinds: [lines]
      limits:
        lines: 2
        statements: 40
        cyclomatic: 30
        cognitive: 30
        nesting: 4
    files:
    - path: src/lib.rs
      body: |-
        pub fn total(a: i32, b: i32) -> i32 {
            let mut sum = a;

            sum += b;

            sum
        }
    expect:
