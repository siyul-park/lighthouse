    files:
    - path: sample.go
      body: |-
        package sample

        type visitor struct{ ifs, elses, loops, calls int }

        func (v *visitor) visit(n any) *visitor {
            switch n := n.(type) {
            case *ifStmt:
                v.ifs++
                if n.hasElse {
                    v.elses++
                }
            case *forStmt:
                v.loops++
            case *callExpr:
                v.calls++
            }
            return v
        }

        type ifStmt struct{ hasElse bool }
        type forStmt struct{}
        type callExpr struct{}
