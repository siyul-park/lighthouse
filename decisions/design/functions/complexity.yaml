  - name: cyclomatic-rust-flat-dispatch
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub enum Node {
            If { has_else: bool },
            For,
            Call,
            Other,
        }

        #[derive(Default)]
        pub struct Counts {
            ifs: u32,
            elses: u32,
            loops: u32,
            calls: u32,
        }

        impl Counts {
            pub fn visit(&mut self, node: &Node) {
                match node {
                    Node::If { has_else } => {
                        self.ifs += 1;
                        if *has_else {
                            self.elses += 1;
                        }
                    }
                    Node::For => self.loops += 1,
                    Node::Call => self.calls += 1,
                    Node::Other => {}
                }
            }
        }
    canonical: true
  - name: cognitive-deep-loops
