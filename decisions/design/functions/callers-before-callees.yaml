# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/callers-before-callees
  uid: 836f3261-1d9b-4fff-b121-b191bc8dbf36
  labels:
    lighthouse/pack: design
    lighthouse/section: functions
spec:
  title: Callers before callees
  context: >-
    Readers follow behavior from intent to mechanics.

    Rust: Applies to private free functions and private methods. A
    function that some call may reach through a receiver of unknown type
    is not judged. A declaration-group order that places the callee before
    its caller (a type's methods precede the free functions of a Rust
    file) fixes the callee's position, so such a pair is not judged.
    Neither is a private method of an inherent impl called by a method of
    a trait impl: inherent impls come first.
  scope:
    domain: code
    subject: file
  requirement: >-
    Declarations MUST be ordered for reading: callers before callees, related
    symbols adjacent, and cohesive implementations together. Callers MUST
    precede their exclusive helpers, and shared leaves MUST follow the code that
    uses them.
  severity: warn
  options:
    type: object
    properties:
      sharedAfterLastCaller:
        type: boolean
        default: false
        description: >-
          Require a helper used by several functions of its file to follow all
          of them, not only the first.
    additionalProperties: false
  check:
    type: cel
    select: function
    with:
      - name: local
        expr: func.local_callers
      - name: anchor
        expr: >-
          size(local) == 0 ? func
          : options.sharedAfterLastCaller ? local[size(local) - 1] : local[0]
    where: >-
      (func.kind == 'function' || func.kind == 'method')
      && size(local) > 0 && func.pos <= anchor.pos
      && !(rank(func, 'design/group') >= 0 && rank(anchor, 'design/group') >= 0
           && rank(func, 'design/group') < rank(anchor, 'design/group'))
      && !(func.kind == 'method' && !func.implements_trait
           && anchor.kind == 'method' && anchor.implements_trait)
    message: >-
      private {{ func.kind }} {{ func.name }} is declared before its caller
      {{ anchor.name }}; callers come first
    evidence:
      caller: anchor.id
      callee: func.id
    identity:
      subject: func.id
  fix:
    safety: suggested
    requires: [extent]
    type: ops
    ops:
      - op: move
        node: finding.evidence.callee
        after: finding.evidence.caller
  examples:
    - name: invalid
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            func Run() int { return helper() }

            func helper() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            func helper() int { return 1 }

            func Run() int { return helper() }
      expect:
        - line: 3
    - name: valid
      language: go
      kind: valid
      canonical: true
      files:
        - path: example.go
          body: |-
            package sample

            func Run() int { return helper() }

            func helper() int { return 1 }
    - name: shared-leaf-between-callers
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            func First() int { return leaf() }

            func Second() int { return leaf() + 1 }

            func leaf() int { return 1 }
      options:
        sharedAfterLastCaller: true
      files:
        - path: example.go
          body: |-
            package sample

            func First() int { return leaf() }

            func leaf() int { return 1 }

            func Second() int { return leaf() + 1 }
      expect:
        - line: 5
    - name: used-elsewhere
      language: go
      kind: valid
      files:
        - path: a.go
          body: |-
            package sample

            func helper() int { return 1 }

            func Run() int { return helper() }
        - path: b.go
          body: |-
            package sample

            func Other() int { return helper() }
    - name: mutual-recursion
      language: go
      kind: valid
      files:
        - path: example.go
          body: "package sample\n\nfunc even(n int) bool {\n\tif n == 0 {\n\t\treturn true\n\t}\n\treturn odd(n - 1)\n}\n\nfunc odd(n int) bool {\n\tif n == 0 {\n\t\treturn false\n\t}\n\treturn even(n - 1)\n}\n\nfunc Run(n int) bool { return even(n) }"
    - name: rust-invalid
      language: rust
      kind: invalid
      fixed:
        - path: src/lib.rs
          body: |-
            pub fn run() -> u8 {
                helper()
            }

            fn helper() -> u8 {
                1
            }
      files:
        - path: src/lib.rs
          body: |-
            fn helper() -> u8 {
                1
            }

            pub fn run() -> u8 {
                helper()
            }
      expect:
        - line: 1
    - name: rust-valid
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            pub fn run() -> u8 {
                helper()
            }

            fn helper() -> u8 {
                1
            }
    - name: go-method-group-fixes-the-order
      language: go
      kind: valid
      files:
        - path: example.go
          body: |-
            package sample

            type Store struct{ n int }

            func Use(s *Store) int { return s.step() }

            func (s *Store) step() int { return s.n }
    - name: rust-impl-precedes-free-function
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Store {
                n: u8,
            }

            impl Store {
                fn step(&self) -> u8 {
                    self.n
                }
            }

            pub fn run(store: &Store) -> u8 {
                store.step()
            }
    - name: rust-crate-function-after-private-methods
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Store {
                n: u8,
            }

            impl Store {
                fn second(&self) -> u8 {
                    self.first() + 1
                }

                fn first(&self) -> u8 {
                    self.n
                }
            }

            pub(crate) fn run(store: &Store) -> u8 {
                store.second()
            }
    - name: rust-inherent-impl-precedes-trait-impl
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Store {
                n: u8,
            }

            impl Store {
                fn step(&self) -> u8 {
                    self.n
                }
            }

            impl Drop for Store {
                fn drop(&mut self) {
                    self.step();
                }
            }
