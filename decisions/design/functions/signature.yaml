# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/signature
  uid: a8c094cf-597d-4bfa-bc8d-a1fc1b9f03f9
  labels:
    lighthouse/pack: design
    lighthouse/section: functions
spec:
  title: A signature is short, public and narrow
  context: >-
    A long parameter list usually hides a missing type, or a function that
    does several things (Martin, Clean Code ch. 3 and F1 Too Many Arguments),
    and a public signature is the contract callers build on. One finding is
    reported per function: the first kind that matched, in the order below,
    with all of them in the evidence.

    Kinds. `params`: each language uses its dominant linter's default: revive
    `argument-limit` allows 8 in Go, clippy `too_many_arguments` allows 7 in
    Rust. A constructor may take one more because it assembles a type. A
    function that implements an interface or trait method, an entrypoint and
    a test do not choose their signature, so they have no limit. Sonar S107
    allows 7, detekt `LongParameterList` 5 (6 for a constructor) and ESLint
    `max-params` 3. The receiver is not counted. A struct that exists only for
    the function (nothing else takes it, and only the function and its callers
    touch it or its fields) is a parameter list in disguise, so its fields
    count instead of the struct. `results`: a function returns at most three
    results (none for a constructor, an implementation or a test); a Rust
    `Result` counts its ok value. `unexported` (Go only; the Rust compiler
    checks it): an exported function or a method of an exported type that
    takes or returns an unexported type of the project, which callers cannot
    name.

    Narrow inputs are judged: a public function that takes a project type is
    put to a model, with the requirement and the examples as the question.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A function SHOULD NOT take more parameters, or return more results, than
    the limit of its role. The remedy is to split the function by
    responsibility; a constructor that is over its limit builds a type that
    should be split. An exported function MUST NOT expose an unexported type
    in its signature. Public inputs SHOULD use the narrowest reusable
    abstraction that fully expresses the contract; public outputs SHOULD use
    the most concrete public type unless polymorphism is itself the contract.
  severity: warn
  options:
    type: object
    properties:
      kinds:
        type: array
        items:
          type: string
          enum:
          - params
          - results
          - unexported
        default:
        - params
        - results
        - unexported
        description: What to report; a function is reported once, with every kind that
          matched in the evidence.
      limits:
        type: object
        properties:
          params:
            "$ref": "#/$defs/limit"
          results:
            "$ref": "#/$defs/limit"
        default:
          params:
            default: 8
            constructor: 9
            implementation: -1
            entrypoint: -1
            test: -1
          results:
            default: 3
            constructor: -1
            implementation: -1
            test: -1
        description: 'The most each signature part may have: an integer for every role,
          or an object with `default` and one entry per role (`function`, `method`,
          `constructor`, `implementation`, `entrypoint`, `test`); a role left out takes
          `default`, and -1 is no limit. A project that sets an object replaces the whole option. `params`: Most parameters a function may have. `results`:
          Most results a function may have.'
      allowSuffixes:
        type: array
        items:
          type: string
        default:
        - Options
        - Opts
        - Config
        description: 'Name endings of a struct that only carries settings: when a struct
          used only by one function ends in one of these, only its required fields (not
          a pointer, slice, map, function, channel or interface in Go; not an `Option`,
          `Vec` or map, or `#[serde(default)]`, in Rust) count toward the limit.'
    additionalProperties: false
  check:
    type: cel
    select: function
    with:
      - name: m
        expr: metrics(func)
      - name: measured
        expr: (func.kind == 'function' || func.kind == 'method') && m.measured
      - name: caps
        expr: >-
          {'params': limit(func, options.limits.params),
           'results': limit(func, options.limits.results)}
      - name: eff
        expr: func.effective
      - name: hidden
        expr: eff.hidden
      - name: note
        expr: >-
          size(hidden) == 0 ? ''
          : ' (' + hidden.map(h, string(h.fields) + ' in ' + h.struct).join(', ')
            + ' counted from structs used only here)'
      - name: reachable
        expr: >-
          func.lang == 'go' && func.visibility != 'private'
          && (func.kind == 'function'
              || (func.kind == 'method' && owner(func).visibility != 'private'))
      - name: exposed
        expr: >-
          reachable
          ? (func.signature.params + func.signature.results)
              .filter(t, t.symbol != '' && !t.exported)
          : []
      - name: found
        expr: >-
          (measured && 'params' in options.kinds && caps.params >= 0 && eff.params > caps.params
            ? [{'kind': 'params', 'value': eff.params, 'max': caps.params, 'what': 'parameters',
                'hint': func.role == 'constructor' ? 'split ' + func.built : 'split by responsibility'}] : [])
          + (measured && 'results' in options.kinds && caps.results >= 0 && func.returns > caps.results
            ? [{'kind': 'results', 'value': func.returns, 'max': caps.results, 'what': 'results',
                'hint': 'split by responsibility'}] : [])
          + ('unexported' in options.kinds && size(exposed) > 0
            ? [{'kind': 'unexported', 'value': size(exposed), 'max': 0, 'what': 'unexported types', 'hint': ''}] : [])
      - name: first
        expr: >-
          size(found) > 0 ? found[0]
          : {'kind': '', 'value': 0, 'max': 0, 'what': '', 'hint': ''}
    where: size(found) > 0
    review: >-
      measured && size(found) == 0 && func.visibility != 'private'
      && (func.role == 'function' || func.role == 'method' || func.role == 'constructor')
      && func.signature.params.exists(t, t.symbol != '')
    message: >-
      {{ first.kind == '' ? ''
         : first.kind == 'unexported'
         ? 'exported ' + func.name + ' exposes unexported type ' + exposed[0].text
         : counted(func, first.value, first.what) + ' (max ' + string(first.max) + ')'
           + (first.kind == 'params' ? note : '') + ': ' + first.hint }}
    evidence:
      kind: first.kind
      kinds: found.map(f, f.kind)
      value: first.value
      max: first.max
      role: func.role
      hidden: hidden
      types: exposed.map(t, t.text)
    identity:
      subject: func.id
  languages:
    rust:
      options:
        limits:
          params:
            default: 7
            constructor: 8
            implementation: -1
            entrypoint: -1
            test: -1
  provenance:
    wasDerivedFrom:
    - 'revive argument-limit 8: https://revive.run/r#argument-limit'
    - 'clippy too_many_arguments 7: https://doc.rust-lang.org/clippy/lint_configuration.html'
    - Sonar S107 7; detekt LongParameterList 5 and 6; ESLint max-params 3
    - 'revive function-result-limit 3: https://revive.run/r#function-result-limit'
    - 'gocritic tooManyResultsChecker 5: https://go-critic.com/overview.html#toomanyresultschecker'
    - 'revive unexported-return: https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#unexported-return'
    - 'rustc private_interfaces: https://doc.rust-lang.org/rustc/lints/listing/warn-by-default.html#private-interfaces'
    - Martin, Clean Code (2008), F1 Too Many Arguments
    - Martin, Clean Code (2008), G8 Too Much Information
  examples:
  - name: params-too-many-parameters
    language: go
    kind: invalid
    files:
    - path: sample.go
      body: |-
        package sample

        func build(a, b, c, d, e, f, g, h, i int) int {
            return a
        }
    expect:
    - line: 3
    options:
      kinds:
      - params
  - name: params-within-the-limit
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample.go
      body: |-
        package sample

        func build(a, b, c, d, e, f, g, h int) int {
            return a
        }
    options:
      kinds:
      - params
  - name: params-constructor-at-its-limit
    language: go
    kind: valid
    files:
    - path: sample.go
      body: |-
        package sample

        type Server struct{}

        func NewServer(a, b, c, d, e, f, g, h, i int) *Server {
            return &Server{}
        }
    options:
      kinds:
      - params
  - name: params-constructor-over-its-limit
    language: go
    kind: invalid
    files:
    - path: sample.go
      body: |-
        package sample

        type Server struct{}

        func NewServer(a, b, c, d, e, f, g, h, i, j int) *Server {
            return &Server{}
        }
    expect:
    - line: 5
    options:
      kinds:
      - params
  - name: params-interface-implementation
    language: go
    kind: valid
    files:
    - path: sample.go
      body: |-
        package sample

        type Writer interface {
            Write(a, b, c, d, e, f, g, h, i int)
        }

        type file struct{}

        func (file) Write(a, b, c, d, e, f, g, h, i int) {}
    options:
      kinds:
      - params
  - name: params-single-use-struct-counts-its-fields
    language: go
    kind: invalid
    files:
    - path: sample.go
      body: |-
        package sample

        type Request struct{ A, B, C int }

        func build(a, b, c, d, e, f int, r Request) int {
            return a + r.A
