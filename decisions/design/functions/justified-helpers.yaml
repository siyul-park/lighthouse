spec:
  title: Helpers are justified
  context: >-
    A helper that earns nothing is indirection.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A helper MUST be extracted only to remove semantic duplication, name
    reusable behavior or policy, isolate an abstraction level, or serve as a
    function value.
