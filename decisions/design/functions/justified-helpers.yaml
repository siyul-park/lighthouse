# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/justified-helpers
  uid: 1dd76f52-b754-4fce-ae96-f2f58971c5b8
  labels:
    lighthouse/pack: design
    lighthouse/section: functions
spec:
  title: Helpers are justified
  context: >-
    A helper that earns nothing is indirection, and a private helper with a
    single caller is the usual case: it is part of that caller unless it names
    a concept. Forwarding wrappers are judged by
    `design/no-single-use-wrapper`.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A helper MUST earn its extraction: it removes semantic duplication, names
    reusable behavior or a policy, isolates an abstraction level, serves as a
    function value, or is a seam for a test; otherwise it stays in its caller.
  severity: info
  check:
    type: model
    # The old deterministic check of `design/private-helper-callers` (4% of 24
    # sampled findings were right) picks what the model is asked about. Widened
    # for recall: forwarding wrappers, functions used as a value and callers
    # that are package variables are no longer left out.
    select: >-
      (symbol.kind == 'function' || symbol.kind == 'method')
      && symbol.visibility == 'private' && symbol.name != 'main'
      && symbol.name != 'init' && !symbol.implementation
      && size(callers(symbol).filter(c, !c.test)) == 1
