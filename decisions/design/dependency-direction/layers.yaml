---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/layers
  uid: be0e8004-85e1-4b34-abb9-30dc46192e5c
spec:
  title: Dependencies point down the layers
  context: 'The project’s declared layer contract is deterministic: dependencies point
    down, and peer modules in different globs of one layer stay independent. Explicitly
    justified exceptions are listed in the project options.'
  scope:
    subject: edge
    examples: exclude
  languages:
    go: {}
    rust: {}
    typescript: {}
  requirement: A module MUST NOT depend on a module in a higher layer, and modules
    of one layer MUST remain independent when the layer contract says they are peers.
  severity: error
  options:
    properties:
      layers:
        type: array
        items:
          type: array
          items:
            type: string
        default: []
        description: The layers from the top down, each a list of module globs, such
          as `[["app/cli"], ["app/**"], ["app/model"]]`. A module imports only modules
          of its own layer or below.
      independent:
        type: boolean
        default: true
        description: Modules of one layer that match different globs do not import
          each other.
      forbidden:
        type: array
        items:
          type: object
          required:
          - from
          - to
          properties:
            from:
              type: string
            to:
              type: string
        default: []
        description: Imports that are never allowed, each an object `{from, to}` of
          the globs of the importing and the imported module.
      ignore:
        type: array
        items:
          type: object
          required:
          - from
          - to
          - reason
          properties:
            from:
              type: string
            to:
              type: string
            reason:
              type: string
        default: []
        description: 'Imports that are allowed although they break a contract, each
          an object `{from, to, reason}`: the globs of both modules and the reason
          it stays.'
    additionalProperties: false
  check:
    type: cel
    select: edge
    variables:
    - name: layer
      params: [m]
      expression: |-
        (lists.range(size(options.layers)).filter(i, options.layers[i].exists(g, glob.matches(m, g)))
          + [-1])[0]
    - name: target
      expression: >-
        edge.to.kind == 'module' ? edge.to.module
        : edge.to.module != '' ? edge.to.module : edge.to.name
    - name: from
      expression: "edge.kind == 'imports' ? layer(edge.from.module) : -1"
    - name: to
      expression: "edge.kind == 'imports' ? layer(target) : -1"
    - name: contract
      expression: |-
        edge.kind != 'imports' || target == '' ? ''
        : options.ignore.exists(i, glob.matches(edge.from.module, i.from)
            && glob.matches(target, i.to)) ? ''
        : options.forbidden.exists(f, glob.matches(edge.from.module, f.from)
            && glob.matches(target, f.to)) ? 'forbidden'
        : from >= 0 && to >= 0 && to < from ? 'layers'
        : options.independent && from >= 0 && to == from
            && !options.layers[from].exists(g, glob.matches(edge.from.module, g)
                && glob.matches(target, g)) ? 'independence'
        : ''
    where: contract != ''
    message: |-
      {{ contract == 'forbidden' ? edge.from.module + ' must not import ' + target : edge.from.module + ' (layer ' + string(from) + ') imports '
        + target + ' (layer ' + string(to) + '); '
        + (contract == 'layers' ? 'dependencies must point down'
           : 'peers in one layer stay independent') }}
    evidence:
      from: edge.from.module
      to: target
      fromLayer: from
      toLayer: to
      contract: contract
    identity:
      subject: "'imports:' + edge.from.module + '->' + target"
  provenance:
    wasDerivedFrom:
    - import-linter, layers, independence and forbidden contracts
    - ArchUnit, layeredArchitecture
    - Martin, Stable Dependencies Principle
    - Tarjan 1972, strongly connected components
    - Martin, Clean Code (2008), G13 Artificial Coupling
    - Martin, Clean Code (2008), G22 Make Logical Dependencies Physical
    - Martin, Clean Code (2008), ch. 10 Isolate from change
  examples:
  - name: go-import-points-up
    language: go
    kind: invalid
    options:
      layers:
      - - infra
      - - domain
    files:
    - path: go.mod
      body: |
        module example.com/app

        go 1.26
    - path: domain/domain.go
      body: |
        package domain

        import "example.com/app/infra"

        func Load() string { return infra.Read() }
    - path: infra/infra.go
      body: |
        package infra

        func Read() string { return "" }
    expect:
    - line: 3
  - name: go-import-points-down
    language: go
    kind: valid
    options:
      layers:
      - - domain
      - - infra
    files:
    - path: go.mod
      body: |
        module example.com/app

        go 1.26
    - path: domain/domain.go
      body: |
        package domain

        import "example.com/app/infra"

        func Load() string { return infra.Read() }
    - path: infra/infra.go
      body: |
        package infra

        func Read() string { return "" }
    canonical: true
  - name: go-peers
    language: go
    kind: invalid
    options:
      layers:
      - - http
        - grpc
    files:
    - path: go.mod
      body: |
        module example.com/app

        go 1.26
    - path: http/http.go
      body: |
        package http

        import "example.com/app/grpc"

        func Serve() string { return grpc.Serve() }
    - path: grpc/grpc.go
      body: |
        package grpc

        func Serve() string { return "" }
    expect:
    - line: 3
  - name: go-peers-may-be-dependent
    language: go
    kind: valid
    options:
      layers:
      - - http
        - grpc
      independent: false
    files:
    - path: go.mod
      body: |
        module example.com/app

        go 1.26
    - path: http/http.go
      body: |
        package http

        import "example.com/app/grpc"

        func Serve() string { return grpc.Serve() }
    - path: grpc/grpc.go
      body: |
        package grpc

        func Serve() string { return "" }
  - name: go-submodules-of-one-glob
    language: go
    kind: valid
    files:
    - path: go.mod
      body: |
        module example.com/app

        go 1.26
    - path: http/api/api.go
      body: |
        package api

        import "example.com/app/http/wire"

        func Serve() string { return wire.Encode() }
    - path: http/wire/wire.go
      body: |
        package wire

        func Encode() string { return "" }
  - name: go-forbidden
    language: go
    kind: invalid
    options:
      forbidden:
      - from: '**/domain'
        to: '**/infra/db'
    files:
    - path: go.mod
      body: |
        module example.com/app

        go 1.26
    - path: domain/domain.go
      body: |
        package domain

        import "example.com/app/infra/db"

        func Load() string { return db.Read() }
    - path: infra/db/db.go
      body: |
        package db

        func Read() string { return "" }
    expect:
    - line: 3
  - name: go-ignored-with-a-reason
    language: go
    kind: valid
    files:
    - path: go.mod
      body: |
        module example.com/app

        go 1.26
    - path: domain/domain.go
      body: |
        package domain

        import "example.com/app/infra"

        func Load() string { return infra.Read() }
    - path: infra/infra.go
      body: |
        package infra

        func Read() string { return "" }
  - name: rust-mod-points-up
    language: rust
    kind: invalid
    options:
      layers:
      - - "**::infra"
      - - "**::domain"
    files:
    - path: Cargo.toml
      body: |-
        [package]
        name = "sample"
        version = "0.1.0"
        edition = "2024"
    - path: src/lib.rs
      body: |-
        pub mod domain;
        pub mod infra;
    - path: src/domain.rs
      body: |-
        use crate::infra::read;

        pub fn load() -> String {
            read()
        }
    - path: src/infra.rs
      body: |-
        pub fn read() -> String {
            String::new()
        }
    expect:
    - line: 1
  - name: rust-mod-points-down
    language: rust
    kind: valid
    options:
      layers:
      - - "**::domain"
      - - "**::infra"
    files:
    - path: Cargo.toml
      body: |-
        [package]
        name = "sample"
        version = "0.1.0"
        edition = "2024"
    - path: src/lib.rs
      body: |-
        pub mod domain;
        pub mod infra;
    - path: src/domain.rs
      body: |-
        use crate::infra::read;

        pub fn load() -> String {
            read()
        }
    - path: src/infra.rs
      body: |-
        pub fn read() -> String {
            String::new()
        }
    canonical: true
  - name: typescript-import-points-up
    language: typescript
    kind: invalid
    options:
      layers:
      - - infra/**
      - - domain/**
    files:
    - path: domain/domain.ts
      body: |-
        import { read } from "../infra/infra";

        export function load(): string {
          return read();
        }
    - path: infra/infra.ts
      body: |-
        export function read(): string {
          return "";
        }
    expect:
    - line: 1
  - name: typescript-import-points-down
    language: typescript
    kind: valid
    options:
      layers:
      - - domain/**
      - - infra/**
    files:
    - path: domain/domain.ts
      body: |-
        import { read } from "../infra/infra";

        export function load(): string {
          return read();
        }
    - path: infra/infra.ts
      body: |-
        export function read(): string {
          return "";
        }
  - name: typescript-peers
    language: typescript
    kind: invalid
    options:
      layers:
      - - http/**
        - grpc/**
    files:
    - path: http/http.ts
      body: |-
        import { serve as inner } from "../grpc/grpc";

        export function serve(): string {
          return inner();
        }
    - path: grpc/grpc.ts
      body: |-
        export function serve(): string {
          return "";
        }
    expect:
    - line: 1
  - name: javascript-import-points-up
    language: typescript
    kind: invalid
    options:
      layers:
      - - infra/**
      - - domain/**
    files:
    - path: domain/domain.js
      body: |-
        const { read } = require("../infra/infra");

        exports.load = function load() {
          return read();
        };
    - path: infra/infra.js
      body: |-
        exports.read = function read() {
          return "";
        };
    expect:
    - line: 1
