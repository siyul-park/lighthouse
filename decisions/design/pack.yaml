# yaml-language-server: $schema=../../schema/pack.schema.json
apiVersion: lighthouse/v1alpha1
kind: Pack
metadata:
  name: design
spec:
  title: Design Decisions
  intro: >-
    Language-neutral rules for structure, naming, APIs, ownership, errors and
    comments. Each decision states its requirement and how it is enforced;
    language-specific wording lives in its tuning.
  variables:
    # A declaration the file-order decisions place: a type, constant,
    # variable, function or method outside interfaces and function bodies.
    # Test code and generated code are not placed, except the fixtures of a
    # test file.
    - name: is_placed
      params: [n]
      expression: >-
        n.declaration && !n.generated
        && (n.file_test ? n.test_role == 'fixture' : !n.test)
    # The declaration group of a node, as `design/declaration-groups` orders
    # them: the index in `options.groups` of the first of the node's candidate
    # groups that the order names, -1 when none (or the node is no declaration
    # that is judged). A decision that has no `groups` option, such as
    # `design/layout`, reads the default order of its language.
    - name: declaration_group
      params: [n]
      expression: >-
        !is_placed(n) ? -1
        : cel.bind(open, n.visibility != 'private',
          cel.bind(order, has(options.groups) ? options.groups
              : n.lang == 'rust'
              ? ['const', 'var', 'type', 'public-function', 'private-function']
              : ['public-type', 'private-type', 'public-const', 'private-const', 'var', 'init',
                 'public-function', 'constructor', 'public-method', 'hook', 'private-function'],
          cel.bind(hooks, has(options.hookNames) ? options.hookNames
              : n.lang == 'rust' ? []
              : ['Clone', 'String', 'GoString', 'Error', 'Unwrap', 'MarshalJSON', 'UnmarshalJSON',
                 'MarshalText', 'UnmarshalText', 'MarshalBinary', 'UnmarshalBinary'],
          cel.bind(found, (
              n.kind == 'type' || n.kind == 'interface'
              ? [open ? 'public-type' : 'private-type', 'type']
              : n.kind == 'const'
              ? (n.owner_key != '' ? ['type'] : [open ? 'public-const' : 'private-const', 'const'])
              : n.kind == 'var' ? ['var']
              : n.kind == 'function'
              ? (n.name == 'init' ? ['init'] : [])
                + (open && n.constructor_named ? ['constructor'] : [])
                + [open ? 'public-function' : 'private-function']
              : n.kind == 'method'
              ? ['type'] + (open && n.name in hooks ? ['hook'] : [])
                + [open ? 'public-method' : 'private-function']
              : []
            ).map(c, order.indexOf(c)).filter(i, i >= 0),
            size(found) > 0 ? found[0] : -1))))
  sections:
    - name: principles
      title: Principles
      intro: >-
        Design minimizes conceptual surface while keeping responsibility and
        ownership boundaries explicit.
      decisions: [responsibility, duplication]
    - name: dependency-direction
      title: Dependency Direction
      intro: >-
        Dependency direction keeps stable, general code independent from
        specific policy and context.
      decisions: [layers]
    - name: functions
      title: Functions
      intro: >-
        Function structure should make meaningful behavior reusable and
        readable, not merely make functions smaller. Structural metrics are
        review signals, not proof of a design violation.
      decisions: [complexity, signature, prefer-method, symbols]
    - name: naming
      title: Naming
      intro: >-
        Names should expose role, contract, or ownership with the smallest
        vocabulary that preserves the required distinction.
      decisions: [naming]
    - name: types-and-apis
      title: Types and APIs
      intro: >-
        Public APIs are stable contracts: expose the minimum caller-facing
        abstraction and keep implementation state, and the ownership of mutable
        state and resources, behind its owner.
      decisions: [constructors, ownership]
    - name: concurrency
      title: Concurrency
      intro: >-
        Concurrency rules prevent races and leaks by making shared state and
        shutdown ownership explicit.
      decisions: [concurrency]
    - name: errors
      title: Errors
      intro: >-
        Errors are contracts: callers should be able to classify failures,
        preserve causes, and avoid leaking implementation state.
      decisions: [errors]
    - name: file-order
      title: File Order
      intro: >-
        Declaration order should let a reader follow ownership and behavior from
        public concepts to implementation mechanics.
      decisions: [layout, declaration-groups]
    - name: comments
      title: Comments
      intro: >-
        Comments preserve facts that code cannot express; they should not
        narrate code that is already visible.
      decisions: [exported-doc, comments]
