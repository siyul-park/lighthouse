# yaml-language-server: $schema=../../schema/pack.schema.json
apiVersion: lighthouse/v1alpha1
kind: Pack
metadata:
  name: design
spec:
  title: Design Decisions
  intro: >-
    Language-neutral rules for structure, naming, APIs, ownership, errors and
    comments. Each decision states its requirement and how it is enforced;
    language-specific wording lives in its tuning.
  sections:
    - name: principles
      title: Principles
      intro: >-
        Design minimizes conceptual surface while keeping responsibility and
        ownership boundaries explicit.
      decisions:
        - minimal-symbols
        - justified-symbols
        - single-implementation
        - coherent-responsibility
        - no-forced-reuse
    - name: dependency-direction
      title: Dependency Direction
      intro: >-
        Dependency direction keeps stable, general code independent from
        specific policy and context.
      decisions:
        - layers
        - general-lower-levels
        - no-caller-dependency
        - general-extraction
    - name: physical-cohesion
      title: Physical Cohesion
      intro: >-
        Physical layout should make ownership and collaboration visible while
        preserving real structural boundaries.
      decisions:
        - owner-file
        - misplaced-symbol
        - tiny-modules
        - contiguity
        - layout
        - meaningful-separation
    - name: structural-rules
      title: Structural Rules
      intro: >-
        These rules reduce accidental duplication and unnecessary boundaries
        without hiding genuine differences.
      decisions:
        - no-duplication
        - no-overlapping-symbols
        - boundary-splits
        - prefer-reuse
    - name: structural-signals
      title: Structural Signals
      intro: "Structural metrics are review signals, not proof of a design violation."
      decisions:
        - complexity
        - cognitive-complexity
        - max-statements
        - max-lines-per-function
        - max-depth
        - max-params
        - max-results
        - coupling
        - clones
        - adjacent-siblings
        - advisory-signals
    - name: functions
      title: Functions
      intro: >-
        Function structure should make meaningful behavior reusable and
        readable, not merely make functions smaller.
      decisions:
        - justified-helpers
        - private-helper-callers
        - no-single-use-wrapper
        - prefer-method
        - feature-envy
        - single-abstraction-level
        - callers-before-callees
    - name: naming
      title: Naming
      intro: >-
        Names should expose role, contract, or ownership with the smallest
        vocabulary that preserves the required distinction.
      decisions:
        - terminology
        - unique-type-names
        - minimal-names
        - max-name-words
        - no-redundant-qualifiers
        - standard-abbreviations
        - short-names
        - predicate-names
        - reserved-verbs
        - plural-collections
    - name: types-and-apis
      title: Types and APIs
      intro: >-
        Public APIs are stable contracts: expose the minimum caller-facing
        abstraction and keep implementation state behind its owner.
      decisions:
        - consumer-interfaces
        - narrow-inputs
        - no-private-types
        - no-exposed-state
        - validated-constructors
        - optional-options
        - no-speculative-api
    - name: ownership
      title: Ownership
      intro: >-
        Ownership makes it explicit who creates, changes, and ends mutable state
        or resources.
      decisions:
        - state-owner
        - encapsulated-state
        - scoped-borrows
        - resource-owner
        - stateless-layout
        - no-mutable-globals
    - name: concurrency
      title: Concurrency
      intro: >-
        Concurrency rules prevent races and leaks by making shared state and
        shutdown ownership explicit.
      decisions: [explicit-shutdown, context-first, no-stored-context]
    - name: errors
      title: Errors
      intro: >-
        Errors are contracts: callers should be able to classify failures,
        preserve causes, and avoid leaking implementation state.
      decisions:
        - error-categories
        - error-identity
        - error-translation
        - no-state-in-errors
        - no-panic
    - name: file-order
      title: File Order
      intro: >-
        Declaration order should let a reader follow ownership and behavior from
        public concepts to implementation mechanics.
      decisions: [declaration-groups, top-down-order, no-split-for-order]
    - name: comments
      title: Comments
      intro: >-
        Comments preserve facts that code cannot express; they should not
        narrate code that is already visible.
      decisions: [factual-comments, no-narration, no-banners, exported-doc]
    - name: generated-and-platform
      title: Generated and Platform Code
      intro: >-
        Generated and platform-specific code should remain behind the mechanism
        and boundary that own it.
      decisions: [no-generated-edits, encapsulated-platform]
