# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/meaningful-separation
  uid: 35a77216-def7-496b-bb65-6fda5ca9d747
  labels:
    lighthouse/pack: design
    lighthouse/section: physical-cohesion
spec:
  title: Separation marks a boundary
  context: >-
    A file or module split without a real boundary only adds navigation
    cost, and a small module that a single other module uses is that user's
    detail.
  scope:
    domain: code
    subject: module
  requirement: >-
    Physical separation MUST represent a real responsibility, ownership, or
    abstraction boundary: a module separated from its only user MUST be that
    kind of boundary, or be merged into the user.
  severity: info
  check:
    type: model
    # The old deterministic check of `design/tiny-modules` (0 of 20 sampled
    # findings were right) picks what the model is asked about. Widened for
    # recall: the size limit doubles from 300 to 600 lines and a module nobody
    # imports is asked about too.
    select: >-
      module.lines < 600
      && (size(module.dependents) <= 1 || module.declares == 0)
