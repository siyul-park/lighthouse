# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/contiguity
  uid: ac301679-ff07-4e28-a306-fd940ecf4a3c
  labels:
    lighthouse/pack: design
    lighthouse/section: physical-cohesion
  annotations:
    lighthouse/was-names: design/related-symbols-close
    lighthouse/was-builtin: design/related-symbols-close
spec:
  title: Collaborators stay close
  context: >-
    Distance between collaborators hides their relationship.

    Go: The methods of one receiver type are contiguous within their
    declaration group: no free function, type, constant or variable, and
    no method of another type of the same visibility, between two of them.

    Rust: The members of one type (its impl blocks, inherent and trait
    impls) are adjacent in a file: another type, a free function or an
    item of another owner between two impl blocks of a type is a finding;
    two impl blocks side by side are fine.
  scope:
    domain: code
    subject: file
  requirement: >-
    Strongly related symbols MUST be physically close; direct collaborators
    SHOULD be adjacent.
  severity: warn
  options:
    type: object
    properties:
      visibilityGroups:
        type: boolean
        default: true
        description: >-
          The layout groups methods by visibility (public methods of all types,
          then private ones), so a method of another owner in the other
          visibility group does not separate an owner's methods. Set to false
          when a file puts every owner's methods together, as impl blocks do.
    additionalProperties: false
  languages:
    rust:
      options:
        visibilityGroups: false
  check:
    type: builtin
    op: proximity
    group: "symbol.kind == 'method' ? symbol.owner_key : ''"
    separator: >-
      between.kind != 'method'
      || (between.owner_key != key
          && (!options.visibilityGroups
              || (between.visibility != 'private') == (member.visibility != 'private')))
    message: >-
      method {{ symbol.name }} is separated from the other methods of its type by
      {{ count }} other declaration{{ count == 1 ? '' : 's' }} ({{ separators[0].name }});
      keep an owner's methods together
    evidence:
      symbols: "[previous.id, separators[0].id, symbol.id]"
      distance: count
  fix:
    safety: suggested
    requires: [extent]
    type: ops
    ops:
      - op: move
        node: "finding.evidence.symbols[2]"
        after: "finding.evidence.symbols[0]"
  examples:
    - name: invalid
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            type A struct{}

            type B struct{}

            func (a A) One() int { return 1 }

            func (a A) Two() int { return 2 }

            func (b B) One() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            type A struct{}

            type B struct{}

            func (a A) One() int { return 1 }

            func (b B) One() int { return 1 }

            func (a A) Two() int { return 2 }
      expect:
        - line: 11
    - name: free-function-between
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            type A struct{}

            func (a A) One() int { return 1 }

            func (a A) Two() int { return 2 }

            func Other() int { return 0 }
      files:
        - path: example.go
          body: |-
            package sample

            type A struct{}

            func (a A) One() int { return 1 }

            func Other() int { return 0 }

            func (a A) Two() int { return 2 }
      expect:
        - line: 9
    - name: valid
      language: go
      kind: valid
      canonical: true
      files:
        - path: example.go
          body: |-
            package sample

            type A struct{}

            type B struct{}

            func (a A) One() int { return 1 }

            func (a A) Two() int { return 2 }

            func (b B) One() int { return 1 }

            func (a A) hidden() int { return 3 }
    - name: rust-invalid
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub struct A;

            pub struct B;

            impl A {
                pub fn one(&self) -> u8 {
                    1
                }
            }

            impl B {
                pub fn one(&self) -> u8 {
                    1
                }
            }

            impl A {
                pub fn two(&self) -> u8 {
                    2
                }
            }
      expect:
        - line: 18
    - name: rust-valid
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            pub struct A;

            pub struct B;

            impl A {
                pub fn one(&self) -> u8 {
                    1
                }
            }

            impl A {
                pub fn two(&self) -> u8 {
                    2
                }
            }

            impl B {
                pub fn one(&self) -> u8 {
                    1
                }
            }
