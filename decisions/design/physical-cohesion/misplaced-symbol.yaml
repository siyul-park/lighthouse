# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/misplaced-symbol
  uid: 7dcf82f2-2f39-452e-9a44-c3a2c0b20f75
  labels:
    lighthouse/pack: design
    lighthouse/section: physical-cohesion
    lighthouse/preset: strict
spec:
  title: A function lives with what it uses
  context: >-
    A function whose every use lies in one other module is that module's
    code, kept here by accident of history. This is Fowler's Move Function
    (Refactoring, 2nd ed.). No tool checks it: Sonar and PMD judge coupling
    of a class, not where a function belongs.

    A free function is reported when everything it calls or references in the
    project lies in one other module, at least `minUses` distinct functions,
    methods or fields of it (naming its constants and types ties nothing),
    and nothing in its own module, and nothing uses it as a value (a function
    that fills a table of handlers lives where the table is). Symbols outside
    the project are not counted, and neither is a module that contains the
    function's module: a submodule uses its parent as a matter of course.
    Types are not judged: the code model states no uses of a type.

    Go: A package function that uses only another package.

    Rust: A free function that uses only another module of the crate or
    another crate of the workspace.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A function SHOULD live in the module whose symbols it uses.
  severity: info
  options:
    type: object
    properties:
      minUses:
        type: integer
        default: 3
        description: Fewest distinct symbols of the other module the function must use.
      includeExported:
        type: boolean
        default: false
        description: Also judge exported functions, whose callers would have to change.
    additionalProperties: false
  check:
    type: cel
    select: function
    with:
      - name: envy
        expr: func.envy
    where: >-
      func.kind == 'function' && func.name != 'main' && func.name != 'init'
      && (func.visibility == 'private' || options.includeExported)
      && func.references == 0 && size(envy) > 0 && size(envy.module_target) > 0
      && size(envy.module_uses) >= options.minUses && envy.own_uses == 0
    message: >-
      {{ func.name }} uses only {{ envy.module_target }}
      ({{ envy.module_use_names.join(', ') }}); consider moving it to
      {{ envy.module_target }}
    evidence:
      module: envy.module_target
      uses: envy.module_uses
    identity:
      subject: func.id
  provenance:
    wasDerivedFrom:
      - "Fowler, Refactoring 2nd ed., Move Function"
  examples:
    - name: go-uses-only-another-package
      language: go
      kind: invalid
      files:
        - path: go.mod
          body: "module example.com/app\n\ngo 1.26\n"
        - path: app/app.go
          body: "package app\n\nimport \"example.com/app/store\"\n\nfunc Run() int { return load() }\n\nfunc load() int {\n\treturn store.Read() + store.Count() + store.Scan()\n}\n"
        - path: store/store.go
          body: "package store\n\nfunc Read() int { return 1 }\n\nfunc Count() int { return 2 }\n\nfunc Scan() int { return 3 }\n"
      expect:
        - line: 7
    - name: go-uses-its-own-package-too
      language: go
      kind: valid
      canonical: true
      files:
        - path: go.mod
          body: "module example.com/app\n\ngo 1.26\n"
        - path: app/app.go
          body: "package app\n\nimport \"example.com/app/store\"\n\nfunc Run() int { return load() }\n\nfunc load() int {\n\treturn store.Read() + store.Count() + store.Scan() + local()\n}\n\nfunc local() int { return 0 }\n"
        - path: store/store.go
          body: "package store\n\nfunc Read() int { return 1 }\n\nfunc Count() int { return 2 }\n\nfunc Scan() int { return 3 }\n"
    - name: rust-uses-only-another-module
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            mod store;

            use crate::store::{count, read, scan};

            pub fn run() -> i32 {
                load()
            }

            fn load() -> i32 {
                read() + count() + scan()
            }
        - path: src/store.rs
          body: |-
            pub fn read() -> i32 {
                1
            }

            pub fn count() -> i32 {
                2
            }

            pub fn scan() -> i32 {
                3
            }
      expect:
        - line: 9
    - name: rust-uses-one-symbol-of-another-module
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            mod store;

            use crate::store::read;

            pub fn run() -> i32 {
                load()
            }

            fn load() -> i32 {
                read()
            }
        - path: src/store.rs
          body: |-
            pub fn read() -> i32 {
                1
            }
