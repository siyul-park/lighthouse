# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/owner-file
  uid: e8b512d6-a343-4ee9-9059-f9748b597bc1
  labels:
    lighthouse/pack: design
    lighthouse/section: physical-cohesion
spec:
  title: "One owner, one file"
  context: >-
    A reader finds an owner and everything it owns in one place.

    A deterministic check read 0 of 22 sampled findings right: Go splits a
    type's methods by concern, Rust keeps impls in child modules, and no tool
    backs one file per receiver type. Whether a split follows a concern or an
    accident is a judgment, so the decision is judged by a model.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Symbols with one owner and cohesive responsibility MUST share a file,
    unless the split follows a concern of the owner.
  severity: info
  check:
    type: model
    # The old deterministic check (0 of 22 sampled findings were right) picks
    # what the model is asked about. Widened for recall: constructor-named
    # functions and the Rust module-tree exemption are no longer left out.
    select: >-
      (symbol.kind == 'method' || symbol.kind == 'function')
      && size(symbol.owner_home) > 0 && !symbol.implementation
      && symbol.owner_home.owner_file != symbol.file
