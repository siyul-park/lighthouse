# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/owner-file
  uid: e8b512d6-a343-4ee9-9059-f9748b597bc1
  labels:
    lighthouse/pack: design
    lighthouse/section: physical-cohesion
spec:
  title: "One owner, one file"
  context: >-
    A reader finds an owner and everything it owns in one place.

    This is a review signal: most findings are deliberate splits of an owner
    by concern, which the code model cannot tell from accidents, and no tool
    backs the Go convention of one file per receiver type.

    A method is reported when it is declared outside the unit of its type: its
    file, or its module and the modules below it (option `unit`). A
    private free function is reported the same way when every production
    caller of it is a method of one type that is declared outside the unit and
    the function calls or references that type or one of its members. A
    function named like a constructor is not reported.

    Go: All methods of a receiver type stay in the file of the type (`unit:
    file`). A method that implements an interface method is exempt, as a
    trait impl method is in Rust: the interface decides where it is written.

    Rust: The methods of an inherent `impl` stay in the module of the type or
    in a module below it (`unit: module-tree`): a type with a child module for
    its impls keeps them together. The code model names the module of a method
    after its type, not after the `impl`, so the module tree is read from files:
    `m.rs` holds `m/`, a crate root or `mod.rs` the directory it is in. An impl in a sibling or parent module is reported. A method of a
    trait impl is exempt, because the trait decides where it is written; the
    code model marks it by an id that carries the trait. A type that the
    project does not declare has no module to keep to.
  scope:
    domain: code
    subject: symbol
  requirement: Symbols with one owner and cohesive responsibility MUST share a file.
  severity: info
  options:
    type: object
    properties:
      unit:
        type: string
        default: file
        description: >-
          Where the members of a type must be: `file` (the file of the type) or
          `module-tree` (the module of the type or one below it).
    additionalProperties: false
  languages:
    rust:
      options:
        unit: module-tree
  check:
    type: cel
    with:
      - name: home
        expr: symbol.owner_home
    where: >-
      (symbol.kind == 'method' || symbol.kind == 'function')
      && size(home) > 0
      && !symbol.implementation && !symbol.constructor_named
      && home.owner_file != symbol.file
      && !(options.unit == 'module-tree' && home.owner_tree != ''
           && symbol.file.startsWith(home.owner_tree))
    message: >-
      {{ symbol.name }} belongs to {{ home.owner_name }} (declared in
      {{ home.owner_file }}); keep it in {{ options.unit == 'module-tree'
      ? 'that module or below' : 'that file' }}
    evidence:
      owner: home.owner
      owner_file: home.owner_file
      owner_module: home.owner_module
      owner_tree: home.owner_tree
    identity:
      subject: symbol.id
  examples:
    - name: go-method-in-another-file
      language: go
      kind: invalid
      files:
        - path: store.go
          body: "package sample\n\ntype Store struct{ items []int }\n"
        - path: total.go
          body: "package sample\n\nfunc (s *Store) Total() int { return len(s.items) }\n"
      expect:
        - line: 3
    - name: go-helper-in-another-file
      language: go
      kind: invalid
      files:
        - path: store.go
          body: "package sample\n\ntype Store struct{ items []int }\n\nfunc (s *Store) Total() int { return count(s) }\n"
        - path: count.go
          body: "package sample\n\nfunc count(s *Store) int { return len(s.items) }\n"
      expect:
        - line: 3
    - name: go-methods-with-the-type
      language: go
      kind: valid
      canonical: true
      files:
        - path: store.go
          body: "package sample\n\ntype Store struct{ items []int }\n\nfunc (s *Store) Total() int { return count(s) }\n\nfunc count(s *Store) int { return len(s.items) }\n"
    - name: rust-impl-in-another-file
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            mod store;
            mod total;
        - path: src/store.rs
          body: |-
            pub struct Store {
                pub items: Vec<i32>,
            }
        - path: src/total.rs
          body: |-
            use crate::store::Store;

            impl Store {
                pub fn total(&self) -> usize {
                    self.items.len()
                }
            }
      expect:
        - line: 4
    - name: rust-impl-in-a-child-module
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            mod store;
        - path: src/store.rs
          body: |-
            mod total;

            pub struct Store {
                pub items: Vec<i32>,
            }
        - path: src/store/total.rs
          body: |-
            use super::Store;

            impl Store {
                pub fn total(&self) -> usize {
                    self.items.len()
                }
            }
    - name: rust-impl-with-the-type
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            mod store;
        - path: src/store.rs
          body: |-
            pub struct Store {
                pub items: Vec<i32>,
            }

            impl Store {
                pub fn total(&self) -> usize {
                    self.items.len()
                }
            }
    - name: rust-trait-impl-in-another-file
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            mod store;
            mod display;
        - path: src/store.rs
          body: |-
            pub struct Store;
        - path: src/display.rs
          body: |-
            use crate::store::Store;
            use std::fmt;

            impl fmt::Display for Store {
                fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                    write!(f, "store")
                }
            }
    - name: go-interface-implementation-in-another-file
      language: go
      kind: valid
      files:
        - path: store.go
          body: "package sample\n\ntype Store struct{ items []int }\n\ntype totaler interface{ Total() int }\n"
        - path: total.go
          body: "package sample\n\nfunc (s *Store) Total() int { return len(s.items) }\n"
