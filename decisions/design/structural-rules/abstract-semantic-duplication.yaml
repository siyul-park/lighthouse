# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/abstract-semantic-duplication
  labels:
    lighthouse/pack: design
    lighthouse/section: structural-rules
spec:
  title: Abstract semantic duplication
  intent: Two implementations of one rule will diverge.
  scope:
    domain: code
    subject: project
  requirement: >-
    Multiple implementations of the same behavior or rule MUST converge on one
    owner; syntax similarity alone MUST NOT trigger abstraction.
  severity: info
  evidence: [owners, locations]
  check:
    type: model
