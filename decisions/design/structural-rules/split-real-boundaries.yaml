# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/split-real-boundaries
  labels:
    lighthouse/pack: design
    lighthouse/section: structural-rules
spec:
  title: Split real boundaries
  context: >-
    Differences in lifecycle or invariant deserve their own symbol.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Symbols MUST be separated only when responsibility, invariant, ownership,
    lifecycle, or abstraction level differs.
  severity: info
  check:
    type: model
