# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/reuse-before-extension
  labels:
    lighthouse/pack: design
    lighthouse/section: structural-rules
spec:
  title: Reuse before extension
  intent: Every extra layer or knob is a permanent cost.
  scope:
    domain: code
    subject: project
  requirement: >-
    Existing symbols and composition SHOULD be preferred before adding layers,
    extension points, policy knobs, or parallel mechanisms.
  severity: info
  check:
    type: model
