---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/no-panic
  uid: e1b4cc61-a188-4799-920e-d96cebe51b1b
spec:
  title: Production errors do not panic
  context: Panics and unwraps convert ordinary failures into process or task failure.
    Tests and entry points may have different conventions; configured Must-prefixed
    functions are explicit exceptions.
  scope:
    subject: symbol
  requirement: Production code SHOULD return errors instead of panicking or unwrapping
    fallible results, except for explicitly named Must constructors and entry points.
  severity: warn
  options:
    properties:
      kinds:
        type: array
        items:
          type: string
          enum:
          - panic
          - unwrap
        default: []
        description: 'What to report: panic-capable calls (`panic`) or fallible unwrap
          calls (`unwrap`). Both are enabled by the strict project.'
      allowPrefixes:
        type: array
        default:
        - Must
        - must
        description: Name prefixes of functions that may panic.
    additionalProperties: false
  check:
    type: cel
    select: event
    variables:
    - name: what
      expression: 'event.detail != '''' ? event.detail : event.kind'
    - name: production
      expression: event.func.role != 'test' && event.func.role != 'entrypoint' &&
        !options.allowPrefixes.exists(p, event.func.name.startsWith(p))
    - name: matched
      expression: "(production && event.kind == 'panic' ? ['panic'] : []) + (production
        && event.kind == 'unwrap' ? ['unwrap'] : [])"
    - name: found
      expression: matched.filter(k, k in options.kinds)
    where: size(found)>0
    message: "{{ found[0] == 'unwrap' ? '.' + what + '() can panic in ' + event.func.name
      + ': return an error instead' : what + ' can panic in ' + event.func.name +
      ': return an error instead' }}"
    evidence:
      kind: found[0]
      what: what
      detail: event.detail
      function: event.func.name
  fix:
    safety: unsafe
    type: model
  provenance:
    wasDerivedFrom:
    - 'go-errorlint comparison, asserts, errorf: https://github.com/polyfloyd/go-errorlint#readme'
    - 'golangci-lint errorlint: https://golangci-lint.run/usage/linters/#errorlint'
    - 'forbidigo patterns: https://github.com/ashanbrown/forbidigo#readme'
    - 'clippy panic: https://rust-lang.github.io/rust-clippy/master/index.html#panic'
    - 'clippy unwrap_used: https://rust-lang.github.io/rust-clippy/master/index.html#unwrap_used'
    - 'clippy expect_used: https://rust-lang.github.io/rust-clippy/master/index.html#expect_used'
    - 'clippy todo, unimplemented, unreachable: https://rust-lang.github.io/rust-clippy/master/index.html#todo'
    - 'errorlint: https://github.com/polyfloyd/go-errorlint'
    - Martin, Clean Code (2008), G2 Obvious Behavior Is Unimplemented
    - Martin, Clean Code (2008), G26 Be Precise
    - Martin, Clean Code (2008), ch. 7 Provide context with exceptions
    - Martin, Clean Code (2008), ch. 7 Define exceptions by the caller's needs
  examples:
  - name: go-panic
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        func Read(n int) int {
            if n < 0 {
                panic("negative")
            }
            return n
        }
    expect:
    - line: 5
    options:
      kinds:
      - panic
  - name: go-error
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        import "errors"

        func Read(n int) (int, error) {
            if n < 0 {
                return 0, errors.New("negative")
            }
            return n, nil
        }
    options:
      kinds:
      - panic
    canonical: true
  - name: go-must
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        func MustRead(n int) int {
            if n < 0 {
                panic("negative")
            }
            return n
        }
    options:
      kinds:
      - panic
    canonical: false
  - name: go-main
    language: go
    kind: valid
    files:
    - path: main.go
      body: |-
        package main

        func main() {
            panic("not implemented")
        }
    options:
      kinds:
      - panic
    canonical: false
  - name: go-test
    language: go
    kind: valid
    files:
    - path: example_test.go
      body: |-
        package sample

        import "testing"

        func TestRead(t *testing.T) {
            if false {
                panic("never")
            }
        }
    options:
      kinds:
      - panic
    canonical: false
  - name: rust-unwrap
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub fn first(items: &[u32]) -> u32 {
            items.first().copied().unwrap()
        }
    expect:
    - line: 2
      message: ".unwrap() can panic in first: return an error instead"
    options:
      kinds:
      - unwrap
  - name: rust-expect
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub fn parse(text: &str) -> u32 {
            text.parse().expect("a number")
        }
    expect:
    - line: 2
    options:
      kinds:
      - unwrap
  - name: rust-macros
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub fn check(code: u32) {
            if code > 3 {
                panic!("too big");
            }
            if code == 2 {
                todo!();
            }
        }
    expect:
    - line: 3
      message: 'panic can panic in check: return an error instead'
    - line: 6
    options:
      kinds:
      - panic
  - name: rust-result
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub fn parse(text: &str) -> Result<u32, std::num::ParseIntError> {
            text.parse()
        }
    options:
      kinds:
      - unwrap
    canonical: true
  - name: rust-main
    language: rust
    kind: valid
    files:
    - path: src/main.rs
      body: |-
        fn main() {
            let n: u32 = "3".parse().unwrap();
            println!("{n}");
        }
    options:
      kinds:
      - unwrap
    canonical: false
  - name: rust-in-tests
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub fn double(n: u32) -> u32 {
            n * 2
        }

        #[cfg(test)]
        mod tests {
            use super::*;

            #[test]
            fn doubles() {
                assert_eq!(Some(double(2)).unwrap(), 4);
            }
        }
    options:
      kinds:
      - unwrap
    canonical: false
  - name: rust-must-prefix
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub fn must_parse(text: &str) -> u32 {
            text.parse().unwrap()
        }
    options:
      kinds:
      - unwrap
    canonical: false
  - name: rust-helper-in-a-test-module
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub fn double(n: u32) -> u32 {
            n * 2
        }

        #[cfg(test)]
        mod tests {
            fn parse(text: &str) -> u32 {
                text.parse().unwrap()
            }

            #[test]
            fn doubles() {
                assert_eq!(super::double(parse("2")), 4);
            }
        }
    options:
      kinds:
      - unwrap
    canonical: false
