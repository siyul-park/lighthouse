# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/errors
  uid: fa640989-a0e2-452f-8880-8fa2e92804e4
spec:
  title: Errors keep their identity and are returned, not thrown
  context: >-
    Adding context must not hide the cause callers depend on, and a panic
    bypasses the caller's control flow (Martin, Clean Code ch. 7 and G26 Be
    Precise: use exceptions, not return codes, but keep what they carry).
    Error text and values are part of the public contract: callers classify
    failures by identity, not by message text.

    Kinds, one finding per event. `compare` (Go): an error compared with
    `==`, `!=` or a `switch`, which fails on a wrapped error (`errorlint`
    comparison, staticcheck): use `errors.Is`. `nil` and `io.EOF`-style
    sentinels returned unwrapped by contract are fine, and so is the body of
    an `Is` method. `assert` (Go): a type assertion or type switch on an
    error: use `errors.As`. `wrap` (Go): `fmt.Errorf` formatting an error
    without `%w`. Rust keeps identity through `?` and `From`, which the
    compiler checks, so these kinds leave it to review.

    Off by default and on in the strict preset, as clippy's restriction lints
    and forbidigo are opt-in for the same reason: `panic` and `unwrap`
    report every place production code can panic, one finding each
    (forbidigo `^panic$`; clippy `panic`, `unwrap_used`, `expect_used`,
    `todo`, `unimplemented`, `unreachable`). Go reports a call of `panic`;
    Rust reports the `panic!`, `unreachable!`, `todo!` and `unimplemented!`
    macros (`panic`) and any `.unwrap()`, `.expect(..)`, `.unwrap_err()` or
    `.expect_err(..)` call (`unwrap`; syntactically, on any receiver, as
    clippy does). The findings are candidates, not violations: impossible
    programmer errors, `Must*`-style APIs and documented hot-path invariants
    are allowed by the requirement and stay with review. Test code,
    entrypoints (`main`, `init`) and functions whose name starts with one of
    `allowPrefixes` are not reported. In Rust, a library that is not published
    and that only tests link in (no other package lists it in
    `[dependencies]`, and it has no binary) is test code.

    Categories, translation and state are judged: they need the meaning of an
    error, which no event carries, so the requirement and the examples are the
    question put to a model.
  scope:
    subject: symbol
  requirement: >-
    Dependency identity MUST be preserved when callers depend on it; context
    added to an error MUST keep the cause reachable: an error MUST be
    compared with `errors.Is`, asserted with `errors.As` and wrapped with
    `%w`. Semantic errors MUST use stable, named error values or types, and
    semantic categories MUST NOT be created from ad hoc formatted messages
    alone. Error categories MUST be translated only at their owning
    boundary. Errors MUST NOT expose private or sensitive process state.
    Panic MUST be limited to impossible programmer errors, `Must*`-style
    APIs, or documented hot-path invariants with one recovery boundary;
    normal runtime failures MUST return errors.
  severity: warn
  options:
    properties:
      kinds:
        type: array
        items: { type: string, enum: [compare, assert, wrap, panic, unwrap] }
        default: [compare, assert, wrap]
        description: >-
          What to report: Go errors compared with `==` (`compare`), asserted
          by type (`assert`) or formatted without `%w` (`wrap`), and the
          places production code can panic: a `panic` call or macro
          (`panic`) and a Rust `.unwrap()` or `.expect(..)` call (`unwrap`).
      allowPrefixes:
        type: array
        default: [Must, must]
        description: Name prefixes of functions that may panic.
    additionalProperties: false
  check:
    type: cel
    select: event
    with:
      - name: what
        expr: "event.detail != '' ? event.detail : event.kind"
      - name: production
        expr: >-
          event.func.role != 'test' && event.func.role != 'entrypoint'
          && !options.allowPrefixes.exists(p, event.func.name.startsWith(p))
      - name: matched
        expr: >-
          (event.func.lang == 'go' && event.kind == 'error-compare' ? ['compare'] : [])
          + (event.func.lang == 'go' && event.kind == 'error-assert' ? ['assert'] : [])
          + (event.func.lang == 'go' && event.kind == 'errorf-unwrapped' ? ['wrap'] : [])
          + (production && event.kind == 'panic' ? ['panic'] : [])
          + (production && event.kind == 'unwrap' ? ['unwrap'] : [])
      - name: found
        expr: matched.filter(k, k in options.kinds)
    where: size(found) > 0
    message: >-
      {{ size(found) == 0 ? ''
         : found[0] == 'compare' ? 'comparing with == will fail on wrapped errors. Use errors.Is to check for a specific error'
         : found[0] == 'assert' ? 'type assertion on error will fail on wrapped errors. Use errors.As to check for specific errors'
         : found[0] == 'wrap' ? 'non-wrapping format verb for fmt.Errorf. Use `%w` to format errors'
         : found[0] == 'unwrap' ? '.' + what + '() can panic in ' + event.func.name + ': return an error instead'
         : what + ' can panic in ' + event.func.name + ': return an error instead' }}
    evidence:
      kind: "size(found) > 0 ? found[0] : ''"
      kinds: found
      what: what
      detail: event.detail
      function: event.func.name
  provenance:
    wasDerivedFrom:
    - 'go-errorlint comparison, asserts, errorf: https://github.com/polyfloyd/go-errorlint#readme'
    - 'golangci-lint errorlint: https://golangci-lint.run/usage/linters/#errorlint'
    - 'forbidigo patterns: https://github.com/ashanbrown/forbidigo#readme'
    - 'clippy panic: https://rust-lang.github.io/rust-clippy/master/index.html#panic'
    - 'clippy unwrap_used: https://rust-lang.github.io/rust-clippy/master/index.html#unwrap_used'
    - 'clippy expect_used: https://rust-lang.github.io/rust-clippy/master/index.html#expect_used'
    - 'clippy todo, unimplemented, unreachable: https://rust-lang.github.io/rust-clippy/master/index.html#todo'
    - 'errorlint: https://github.com/polyfloyd/go-errorlint'
    - Martin, Clean Code (2008), G2 Obvious Behavior Is Unimplemented
    - Martin, Clean Code (2008), G26 Be Precise
    - Martin, Clean Code (2008), ch. 7 Provide context with exceptions
    - Martin, Clean Code (2008), ch. 7 Define exceptions by the caller's needs
  examples:
  - name: unwrapped-errorf
    language: go
    kind: invalid
    files:
    - path: example.go
      source: testdata/unwrapped-errorf.go
    expect:
    - line: 6
      message: non-wrapping format verb for fmt.Errorf. Use `%w` to format errors
    options:
      kinds:
      - wrap
  - name: wrapped-errorf
    language: go
    kind: valid
    canonical: true
    files:
    - path: example.go
      body: |-
        package sample

        import "fmt"

        func Load(name string, err error) error {
            return fmt.Errorf("load %s: %w", name, err)
        }
    options:
      kinds:
      - wrap
  - name: comparison
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        import "errors"

        var ErrNotFound = errors.New("not found")

        func Missing(err error) bool {
            return err == ErrNotFound
        }
    expect:
    - line: 8
      message: comparing with == will fail on wrapped errors. Use errors.Is to check
        for a specific error
    options:
      kinds:
      - compare
  - name: switch-on-an-error
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        import "errors"

        var ErrNotFound = errors.New("not found")

        func Code(err error) int {
            switch err {
            case ErrNotFound:
                return 404
            }
            return 500
        }
    expect:
    - line: 8
    options:
      kinds:
      - compare
  - name: errors-is
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        import "errors"

        var ErrNotFound = errors.New("not found")

        func Missing(err error) bool {
            return errors.Is(err, ErrNotFound)
        }
    options:
      kinds:
      - compare
  - name: nil-and-eof-are-fine
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        import (
            "database/sql"
            "io"
        )

        func Done(err error) bool { return err == io.EOF }

        func Empty(err error) bool { return err == sql.ErrNoRows }

        func Failed(err error) bool { return err != nil }
    options:
      kinds:
      - compare
  - name: assertion
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        type Timeout struct{}

        func (*Timeout) Error() string { return "timeout" }

        func IsTimeout(err error) bool {
            _, ok := err.(*Timeout)
            return ok
        }
    expect:
    - line: 8
      message: type assertion on error will fail on wrapped errors. Use errors.As to
        check for specific errors
    options:
      kinds:
      - assert
  - name: type-switch
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        type Timeout struct{}

        func (*Timeout) Error() string { return "timeout" }

        func Kind(err error) int {
            switch err.(type) {
            case *Timeout:
                return 1
            }
            return 0
        }
    expect:
    - line: 8
    options:
      kinds:
      - assert
  - name: errors-as
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        import "errors"

        type Timeout struct{}

        func (*Timeout) Error() string { return "timeout" }

        func IsTimeout(err error) bool {
            var t *Timeout
            return errors.As(err, &t)
        }
    options:
      kinds:
      - assert
  - name: inside-an-is-method
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        import "errors"

        var ErrNotFound = errors.New("not found")

        type Missing struct{}

        func (*Missing) Error() string { return "missing" }

        func (*Missing) Is(target error) bool { return target == ErrNotFound }
    options:
      kinds:
      - compare
  - name: comparison-switched-off
    language: go
    kind: valid
    options:
      kinds:
      - assert
      - wrap
    files:
    - path: example.go
      body: |-
        package sample

        import "errors"

        var ErrNotFound = errors.New("not found")

        func Missing(err error) bool {
            return err == ErrNotFound
        }
  - name: rust-is-judged-by-review
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |-
        #[derive(PartialEq)]
        pub enum Failure {
            Missing,
        }

        pub fn is_missing(err: &Failure) -> bool {
            *err == Failure::Missing
        }
    options:
      kinds:
      - compare
  - name: go-panic
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        func Read(n int) int {
            if n < 0 {
                panic("negative")
            }
            return n
        }
    expect:
    - line: 5
    options:
      kinds:
      - panic
  - name: go-error
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        import "errors"

        func Read(n int) (int, error) {
            if n < 0 {
                return 0, errors.New("negative")
            }
            return n, nil
        }
    options:
      kinds:
      - panic
  - name: go-must
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        func MustRead(n int) int {
            if n < 0 {
                panic("negative")
            }
            return n
        }
    options:
      kinds:
      - panic
  - name: go-main
    language: go
    kind: valid
    files:
    - path: main.go
      body: |-
        package main

        func main() {
            panic("not implemented")
        }
    options:
      kinds:
      - panic
  - name: go-test
    language: go
    kind: valid
    files:
    - path: example_test.go
      body: |-
        package sample

        import "testing"

        func TestRead(t *testing.T) {
            if false {
                panic("never")
            }
        }
    options:
      kinds:
      - panic
  - name: go-kinds-narrowed
    language: go
    kind: valid
    options:
      kinds:
      - unwrap
    files:
    - path: example.go
      body: |-
        package sample

        func Read(n int) int {
            if n < 0 {
                panic("negative")
            }
            return n
        }
  - name: rust-unwrap
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub fn first(items: &[u32]) -> u32 {
            items.first().copied().unwrap()
        }
    expect:
    - line: 2
      message: ".unwrap() can panic in first: return an error instead"
    options:
      kinds:
      - unwrap
  - name: rust-expect
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub fn parse(text: &str) -> u32 {
            text.parse().expect("a number")
        }
    expect:
    - line: 2
    options:
      kinds:
      - unwrap
  - name: rust-macros
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub fn check(code: u32) {
            if code > 3 {
                panic!("too big");
            }
            if code == 2 {
                todo!();
            }
        }
    expect:
    - line: 3
      message: 'panic can panic in check: return an error instead'
    - line: 6
    options:
      kinds:
      - panic
  - name: rust-result
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub fn parse(text: &str) -> Result<u32, std::num::ParseIntError> {
            text.parse()
        }
    options:
      kinds:
      - unwrap
  - name: rust-main
    language: rust
    kind: valid
    files:
    - path: src/main.rs
      body: |-
        fn main() {
            let n: u32 = "3".parse().unwrap();
            println!("{n}");
        }
    options:
      kinds:
      - unwrap
  - name: rust-in-tests
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub fn double(n: u32) -> u32 {
            n * 2
        }

        #[cfg(test)]
        mod tests {
            use super::*;

            #[test]
            fn doubles() {
                assert_eq!(Some(double(2)).unwrap(), 4);
            }
        }
    options:
      kinds:
      - unwrap
  - name: rust-must-prefix
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub fn must_parse(text: &str) -> u32 {
            text.parse().unwrap()
        }
    options:
      kinds:
      - unwrap
  - name: rust-helper-in-a-test-module
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub fn double(n: u32) -> u32 {
            n * 2
        }

        #[cfg(test)]
        mod tests {
            fn parse(text: &str) -> u32 {
                text.parse().unwrap()
            }

            #[test]
            fn doubles() {
                assert_eq!(super::double(parse("2")), 4);
            }
        }
    options:
      kinds:
      - unwrap
