# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/layout
  uid: 836f3261-1d9b-4fff-b121-b191bc8dbf36
spec:
  title: Declarations are laid out for reading
  context: >-
    Layout is documentation that cannot go stale: readers follow behavior
    from intent to mechanics, and distance between collaborators hides their
    relationship (Martin, Clean Code ch. 5 and G10 Vertical Separation: the
    newspaper metaphor, vertical distance and ordering).

    Kinds, in report order; a function is reported once. `callers-first`: a
    private function or method is declared before its caller (the first
    caller in the file, or with `sharedAfterLastCaller` the last one), so the
    caller must come first. The fix moves the callee after the caller. A
    function in a method group the layout orders by visibility is left as it
    is, and so is a Rust trait method before its implementation: those
    orders are decided by `design/declaration-groups`. `gap`: a method is
    separated from the previous method of its type by another declaration
    (a function, a type, or a method of another type; with
    `visibilityGroups`, a method of another type in the other visibility
    group is not a separation), so the methods of one owner are kept
    together. The fix moves the method after the previous one.

    Ordering never justifies splits: these rules MUST NOT justify artificial
    file splits, wrappers or duplicated helpers. Reading order within a
    cohesive implementation, symmetric siblings and where an owner's symbols
    live are judged: a method separated from nothing but shown out of order,
    and a function that lives in another file than its owner, are put to a
    model, with the requirement and the examples as the question.
  scope:
    subject: file
  requirement: >-
    Declarations MUST be ordered for reading: callers before callees, related
    symbols adjacent, and cohesive implementations together. Callers MUST
    precede their exclusive helpers, and shared leaves MUST follow the code
    that uses them. Strongly related symbols MUST be physically close; direct
    collaborators SHOULD be adjacent. A cohesive implementation MUST read from
    higher-level behavior toward shared machinery. Similar or symmetric
    siblings SHOULD be adjacent when they share an owner and implementation
    shape. Symbols with one owner and cohesive responsibility MUST share a
    file, unless the split follows a concern of the owner. Files and
    declaration order MUST make ownership, responsibility, and relationships
    easy to read. These ordering rules MUST NOT justify artificial file
    splits, wrappers, or duplicated helpers.
  severity: warn
  options:
    properties:
      kinds:
        type: array
        items: { type: string, enum: [callers-first, gap] }
        default: [callers-first, gap]
        description: What to report.
      sharedAfterLastCaller:
        type: boolean
        default: false
        description: Require a helper used by several functions of its file to follow all of them, not only the first.
      visibilityGroups:
        type: boolean
        default: true
        description: >-
          The layout groups methods by visibility (public methods of all
          types, then private ones), so a method of another owner in the
          other visibility group does not separate an owner's methods. Set to
          false when a file puts every owner's methods together, as impl
          blocks do.
    additionalProperties: false
  languages:
    rust:
      options:
        visibilityGroups: false
  check:
    type: cel
    select: function
    with:
      - name: local
        expr: func.local_callers
      - name: anchor
        expr: >-
          size(local) == 0 ? func
          : options.sharedAfterLastCaller ? local[size(local) - 1] : local[0]
      - name: separators
        expr: >-
          func.kind == 'method' && func.gap.previous != null
          ? func.gap.between.filter(b, b.kind != 'method'
              || (b.owner_key != func.owner_key
                  && (!options.visibilityGroups
                      || (b.visibility != 'private') == (func.visibility != 'private'))))
          : []
      - name: callee_first
        expr: >-
          'callers-first' in options.kinds
          && (func.kind == 'function' || func.kind == 'method') && size(local) > 0
          && func.pos <= anchor.pos
          && !(rank(func, 'design/group') >= 0 && rank(anchor, 'design/group') >= 0
               && rank(func, 'design/group') < rank(anchor, 'design/group'))
          && !(func.lang == 'rust' && func.kind == 'method' && !func.implementation
               && anchor.kind == 'method' && anchor.implementation)
      - name: separated
        expr: "'gap' in options.kinds && size(separators) > 0"
      - name: matched
        expr: "(callee_first ? ['callers-first'] : []) + (separated ? ['gap'] : [])"
    where: size(matched) > 0
    abstain: >-
      size(matched) == 0 && !func.test && !func.generated
      && ((func.kind == 'method' && func.gap.previous != null && size(func.gap.between) > 0)
          || ((func.kind == 'method' || func.kind == 'function') && !func.implementation
              && size(func.owner_home) > 0 && func.owner_home.owner_file != func.file))
    message: >-
      {{ size(matched) == 0 ? ''
         : matched[0] == 'callers-first'
         ? 'private ' + func.kind + ' ' + func.name + ' is declared before its caller ' + anchor.name + '; callers come first'
         : 'method ' + func.name + ' is separated from the other methods of its type by '
           + string(size(separators)) + ' other declaration' + (size(separators) == 1 ? '' : 's')
           + ' (' + separators[0].name + "); keep an owner's methods together" }}
    evidence:
      kind: "size(matched) > 0 ? matched[0] : ''"
      kinds: matched
      caller: "callee_first ? anchor.id : ''"
      callee: "callee_first ? func.id : ''"
      symbols: "separated ? [func.gap.previous, separators[0].id, func.id] : []"
      distance: "separated ? size(separators) : 0"
    identity:
      subject: func.id
  fix:
    safety: suggested
    requires:
      - extent
    type: ops
    ops:
      - op: move
        when: finding.evidence.kind == 'callers-first'
        node: finding.evidence.callee
        after: finding.evidence.caller
      - op: move
        when: finding.evidence.kind == 'gap'
        node: finding.evidence.symbols[2]
        after: finding.evidence.symbols[0]
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G10 Vertical Separation
    - Martin, Clean Code (2008), G11 Inconsistency
    - Martin, Clean Code (2008), G32 Don't Be Arbitrary
    - Martin, Clean Code (2008), ch. 5 Vertical distance
    - Martin, Clean Code (2008), ch. 5 Vertical size and ordering
  examples:
  - name: invalid
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        func Run() int { return helper() }

        func helper() int { return 1 }
    files:
    - path: example.go
      body: |-
        package sample

        func helper() int { return 1 }

        func Run() int { return helper() }
    expect:
    - line: 3
    options:
      kinds:
      - callers-first
  - name: valid
    language: go
    kind: valid
    canonical: true
    files:
    - path: example.go
      body: |-
        package sample

        func Run() int { return helper() }

        func helper() int { return 1 }
    options:
      kinds:
      - callers-first
  - name: shared-leaf-between-callers
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        func First() int { return leaf() }

        func Second() int { return leaf() + 1 }

        func leaf() int { return 1 }
    options:
      kinds:
      - callers-first
      sharedAfterLastCaller: true
    files:
    - path: example.go
      body: |-
        package sample

        func First() int { return leaf() }

        func leaf() int { return 1 }

        func Second() int { return leaf() + 1 }
    expect:
    - line: 5
  - name: used-elsewhere
    language: go
    kind: valid
    files:
    - path: a.go
      body: |-
        package sample

        func helper() int { return 1 }

        func Run() int { return helper() }
    - path: b.go
      body: |-
        package sample

        func Other() int { return helper() }
    options:
      kinds:
      - callers-first
  - name: mutual-recursion
    language: go
    kind: valid
    files:
    - path: example.go
      body: "package sample\n\nfunc even(n int) bool {\n\tif n == 0 {\n\t\treturn true\n\t}\n\treturn
        odd(n - 1)\n}\n\nfunc odd(n int) bool {\n\tif n == 0 {\n\t\treturn false\n\t}\n\treturn
        even(n - 1)\n}\n\nfunc Run(n int) bool { return even(n) }"
    options:
      kinds:
      - callers-first
  - name: rust-invalid
    language: rust
    kind: invalid
    fixed:
    - path: src/lib.rs
      body: |-
        pub fn run() -> u8 {
            helper()
        }

        fn helper() -> u8 {
            1
        }
    files:
    - path: src/lib.rs
      body: |-
        fn helper() -> u8 {
            1
        }

        pub fn run() -> u8 {
            helper()
        }
    expect:
    - line: 1
    options:
      kinds:
      - callers-first
  - name: rust-valid
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |-
        pub fn run() -> u8 {
            helper()
        }

        fn helper() -> u8 {
            1
        }
    options:
      kinds:
      - callers-first
  - name: go-method-group-fixes-the-order
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct{ n int }

        func Use(s *Store) int { return s.step() }

        func (s *Store) step() int { return s.n }
    options:
      kinds:
      - callers-first
  - name: rust-impl-precedes-free-function
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            n: u8,
        }

        impl Store {
            fn step(&self) -> u8 {
                self.n
            }
        }

        pub fn run(store: &Store) -> u8 {
            store.step()
        }
    options:
      kinds:
      - callers-first
  - name: rust-crate-function-after-private-methods
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            n: u8,
        }

        impl Store {
            fn second(&self) -> u8 {
                self.first() + 1
            }

            fn first(&self) -> u8 {
                self.n
            }
        }

        pub(crate) fn run(store: &Store) -> u8 {
            store.second()
        }
    options:
      kinds:
      - callers-first
  - name: rust-inherent-impl-precedes-trait-impl
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            n: u8,
        }

        impl Store {
            fn step(&self) -> u8 {
                self.n
            }
        }

        impl Drop for Store {
            fn drop(&mut self) {
                self.step();
            }
        }
    options:
      kinds:
      - callers-first
  - name: go-helper-before-an-interface-implementation
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        type runner interface{ Run() int }

        type job struct{}

        func (j job) helper() int { return 1 }

        func (j job) Run() int { return j.helper() }
    expect:
    - line: 7
    options:
      kinds:
      - callers-first
  - name: gap-invalid
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        type A struct{}

        type B struct{}

        func (a A) One() int { return 1 }

        func (a A) Two() int { return 2 }

        func (b B) One() int { return 1 }
    files:
    - path: example.go
      body: |-
        package sample

        type A struct{}

        type B struct{}

        func (a A) One() int { return 1 }

        func (b B) One() int { return 1 }

        func (a A) Two() int { return 2 }
    expect:
    - line: 11
    options:
      kinds:
      - gap
  - name: gap-free-function-between
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        type A struct{}

        func (a A) One() int { return 1 }

        func (a A) Two() int { return 2 }

        func Other() int { return 0 }
    files:
    - path: example.go
      body: |-
        package sample

        type A struct{}

        func (a A) One() int { return 1 }

        func Other() int { return 0 }

        func (a A) Two() int { return 2 }
    expect:
    - line: 9
    options:
      kinds:
      - gap
  - name: gap-valid
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        type A struct{}

        type B struct{}

        func (a A) One() int { return 1 }

        func (a A) Two() int { return 2 }

        func (b B) One() int { return 1 }

        func (a A) hidden() int { return 3 }
    options:
      kinds:
      - gap
  - name: gap-rust-invalid
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub struct A;

        pub struct B;

        impl A {
            pub fn one(&self) -> u8 {
                1
            }
        }

        impl B {
            pub fn one(&self) -> u8 {
                1
            }
        }

        impl A {
            pub fn two(&self) -> u8 {
                2
            }
        }
    expect:
    - line: 18
    options:
      kinds:
      - gap
  - name: gap-rust-valid
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct A;

        pub struct B;

        impl A {
            pub fn one(&self) -> u8 {
                1
            }
        }

        impl A {
            pub fn two(&self) -> u8 {
                2
            }
        }

        impl B {
            pub fn one(&self) -> u8 {
                1
            }
        }
    options:
      kinds:
      - gap
