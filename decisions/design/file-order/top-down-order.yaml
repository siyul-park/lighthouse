---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/top-down-order
  uid: 8540cfb5-879d-439f-a09e-6ddaae555f0f
spec:
  title: Callers precede private callees
  context: Readers follow a public operation into its private implementation. A callee
    placed first forces readers to understand a helper before the behavior that uses
    it.
  scope:
    subject: symbol
    examples: exclude
  languages:
    go: {}
    rust: {}
    typescript: {}
  requirement: A private function SHOULD be declared after the production callers
    that explain why it exists; public entry points and wiring remain in their appropriate
    declaration groups.
  severity: warn
  options:
    from: design/declaration-groups
    properties:
      sharedAfterLastCaller:
        type: boolean
        default: false
        description: Require a helper used by several functions of its file to follow
          all of them, not only the first.
    additionalProperties: false
  check:
    type: cel
    select: function
    variables:
    - name: local
      expression: func.local_callers
    - name: anchor
      expression: 'size(local) == 0 ? func : options.sharedAfterLastCaller ? local[size(local)
        - 1] : local[0]'
    - name: callee_first
      expression: |-
        (func.kind == 'function' || func.kind == 'method') && size(local) > 0 && func.pos <= anchor.pos && !cel.bind(own, declaration_group(func.id),
            cel.bind(later, declaration_group(anchor.id),
              own >= 0 && later >= 0 && own < later))
        && !(func.lang == 'rust' && func.kind == 'method' && !func.implementation
             && anchor.kind == 'method' && anchor.implementation)
    - name: matched
      expression: 'callee_first ? [''callers-first''] : []'
    where: size(matched)>0
    message: "{{ 'private ' + func.kind + ' ' + func.name + ' is declared before its
      caller ' + anchor.name + '; callers come first' }}"
    evidence:
      caller: anchor.id
      callee: func.id
    identity:
      subject: func.id
  fix:
    safety: unsafe
    type: cel
    edits: "[move(func, after(anchor))]"
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G10 Vertical Separation
    - Martin, Clean Code (2008), G11 Inconsistency
    - Martin, Clean Code (2008), G32 Don't Be Arbitrary
    - Martin, Clean Code (2008), ch. 5 Vertical distance
    - Martin, Clean Code (2008), ch. 5 Vertical size and ordering
  examples:
  - name: invalid
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        func Run() int { return helper() }

        func helper() int { return 1 }
    files:
    - path: example.go
      body: |-
        package sample

        func helper() int { return 1 }

        func Run() int { return helper() }
    expect:
    - line: 3
  - name: valid
    language: go
    kind: valid
    canonical: true
    files:
    - path: example.go
      body: |-
        package sample

        func Run() int { return helper() }

        func helper() int { return 1 }
  - name: shared-leaf-between-callers
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        func First() int { return leaf() }

        func Second() int { return leaf() + 1 }

        func leaf() int { return 1 }
    options:
      sharedAfterLastCaller: true
    files:
    - path: example.go
      body: |-
        package sample

        func First() int { return leaf() }

        func leaf() int { return 1 }

        func Second() int { return leaf() + 1 }
    expect:
    - line: 5
  - name: used-elsewhere
    language: go
    kind: valid
    files:
    - path: a.go
      body: |-
        package sample

        func helper() int { return 1 }

        func Run() int { return helper() }
    - path: b.go
      body: |-
        package sample

        func Other() int { return helper() }
    canonical: false
  - name: mutual-recursion
    language: go
    kind: valid
    files:
    - path: example.go
      body: "package sample\n\nfunc even(n int) bool {\n\tif n == 0 {\n\t\treturn
        true\n\t}\n\treturn odd(n - 1)\n}\n\nfunc odd(n int) bool {\n\tif n == 0 {\n\t\treturn
        false\n\t}\n\treturn even(n - 1)\n}\n\nfunc Run(n int) bool { return even(n)
        }"
    canonical: false
  - name: rust-invalid
    language: rust
    kind: invalid
    fixed:
    - path: src/lib.rs
      body: |-
        pub fn run() -> u8 {
            helper()
        }

        fn helper() -> u8 {
            1
        }
    files:
    - path: src/lib.rs
      body: |-
        fn helper() -> u8 {
            1
        }

        pub fn run() -> u8 {
            helper()
        }
    expect:
    - line: 1
  - name: rust-valid
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |-
        pub fn run() -> u8 {
            helper()
        }

        fn helper() -> u8 {
            1
        }
  - name: typescript-invalid
    language: typescript
    kind: invalid
    files:
    - path: example.ts
      body: |-
        function helper(): number {
          return 1;
        }

        export function run(): number {
          return helper();
        }
    expect:
    - line: 1
  - name: typescript-valid
    language: typescript
    kind: valid
    files:
    - path: example.ts
      body: |-
        export function run(): number {
          return helper();
        }

        function helper(): number {
          return 1;
        }
  - name: javascript-invalid
    language: typescript
    kind: invalid
    files:
    - path: example.js
      body: |-
        function helper() {
          return 1;
        }

        export function run() {
          return helper();
        }
    expect:
    - line: 1
