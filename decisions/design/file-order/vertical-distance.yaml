---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/vertical-distance
  uid: 574c530b-8980-4438-b573-9b701f24e8d1
spec:
  title: Related declarations stay close
  context: Vertical distance increases the effort required to compare related behavior.
    A declaration that interrupts its owner’s method block should move back beside
    its peers.
  scope:
    subject: symbol
  requirement: Related functions and methods SHOULD be physically close, and direct
    collaborators and symmetric siblings SHOULD be adjacent when practical.
  severity: warn
  check:
    type: cel
    select: function
    variables:
    - name: separators
      expression: 'func.kind == ''method'' && func.gap.previous != null ? func.gap.between.filter(b,
        b.kind != ''method'' || b.owner_key != func.owner_key) : []'
    - name: separated
      expression: size(separators) > 0
    - name: matched
      expression: 'separated ? [''gap''] : []'
    where: separated
    message: "{{ 'method ' + func.name + ' is separated from the other methods of
      its type by ' + string(size(separators)) + ' other declaration(s) (' + separators[0].name
      + '); keep an owner’s methods together' }}"
    evidence:
      symbols: "[func.gap.previous, separators[0].id, func.id]"
      distance: size(separators)
    identity:
      subject: func.id
  fix:
    safety: unsafe
    type: cel
    edits: "[move(func, after(func.gap.previous))]"
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G10 Vertical Separation
    - Martin, Clean Code (2008), G11 Inconsistency
    - Martin, Clean Code (2008), G32 Don't Be Arbitrary
    - Martin, Clean Code (2008), ch. 5 Vertical distance
    - Martin, Clean Code (2008), ch. 5 Vertical size and ordering
    - Martin, Clean Code (2008), ch. 5 Vertical openness and density
  examples:
  - name: gap-invalid
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        type A struct{}

        type B struct{}

        func (a A) One() int { return 1 }

        func (a A) Two() int { return 2 }

        func (b B) One() int { return 1 }
    files:
    - path: example.go
      body: |-
        package sample

        type A struct{}

        type B struct{}

        func (a A) One() int { return 1 }

        func (b B) One() int { return 1 }

        func (a A) Two() int { return 2 }
    expect:
    - line: 11
  - name: gap-free-function-between
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        type A struct{}

        func (a A) One() int { return 1 }

        func (a A) Two() int { return 2 }

        func Other() int { return 0 }
    files:
    - path: example.go
      body: |-
        package sample

        type A struct{}

        func (a A) One() int { return 1 }

        func Other() int { return 0 }

        func (a A) Two() int { return 2 }
    expect:
    - line: 9
  - name: gap-valid
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        type A struct{}

        type B struct{}

        func (a A) One() int { return 1 }

        func (a A) Two() int { return 2 }

        func (a A) hidden() int { return 3 }

        func (b B) One() int { return 1 }
    canonical: true
  - name: gap-rust-invalid
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub struct A;

        pub struct B;

        impl A {
            pub fn one(&self) -> u8 {
                1
            }
        }

        impl B {
            pub fn one(&self) -> u8 {
                1
            }
        }

        impl A {
            pub fn two(&self) -> u8 {
                2
            }
        }
    expect:
    - line: 18
  - name: gap-rust-valid
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct A;

        pub struct B;

        impl A {
            pub fn one(&self) -> u8 {
                1
            }
        }

        impl A {
            pub fn two(&self) -> u8 {
                2
            }
        }

        impl B {
            pub fn one(&self) -> u8 {
                1
            }
        }
    canonical: true
