# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/top-down-reading
  labels:
    lighthouse/pack: design
    lighthouse/section: file-order
spec:
  title: Read from behavior to machinery
  intent: The top of a cohesive implementation states what it does.
  scope:
    domain: code
    subject: file
  requirement: >-
    A cohesive implementation MUST read from higher-level behavior toward shared
    machinery.
  severity: info
  check:
    type: model
