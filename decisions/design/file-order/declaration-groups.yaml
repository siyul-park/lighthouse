# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/declaration-groups
  uid: 2ddd0282-b9b3-4537-8e54-b9c0fbfbc4ad
spec:
  title: Declarations follow ownership groups
  context: >-
    A fixed group order makes every file predictable.

    Go: types first, then methods grouped by owner, as `golangci-lint`
    `funcorder` and the Uber Go style guide (Function Grouping and Ordering:
    group by receiver, constructors before the other methods) ask. The type
    declarations stay together, a deliberate difference from the Uber example,
    which puts each type's methods right after the type. Fixtures of a test
    file (its types, constants, variables and functions that take no testing
    handle) follow the same order; tests and test helpers are placed by
    `testing/file-layout`. Order: public types; private types; public
    constants; private constants; variables; all `init` functions; one block
    per type, in the order the types are declared, each with the constructors
    of the type (a function named `NewType` where `Type` is a type declared in
    the same file), then its exported methods,
    then its clone, conversion and interface hooks, then its unexported
    methods; public functions; private functions.

    Rust: The same principle, from the concepts to the machinery, with a
    type kept next to its impl blocks because that is how Rust code reads.
    Order: constants; statics; types, traits and their impl blocks (types
    and impls are one group, `owner-contiguity` keeps an owner's impls
    together), where a constructor method (an associated function named like one)
    comes before the other methods of its type; public free functions; private
    free functions. The order of the other members of a type is left to
    `design/top-down-order`. Items of `#[cfg(test)]` modules are
    not ordered. Visibility counts as public when it is `pub` or `pub(crate)`.
  scope:
    subject: file
    generated: true
    tests: include
  requirement: >-
    Top-level declarations in a file MUST follow the language's ownership-group
    order, from public contract to private mechanics. Initializers MUST stay
    together and MUST precede non-initializer functions and methods. A
    constructor MUST precede the other methods of its type; where methods are
    grouped by owner, exported methods MUST precede unexported ones.
  severity: error
  options:
    properties:
      groups:
        type: array
        items:
          type: string
          enum:
            - public-type
            - private-type
            - type
            - public-const
            - private-const
            - const
            - var
            - init
            - method
            - public-function
            - private-function
        default:
          - public-type
          - private-type
          - public-const
          - private-const
          - var
          - init
          - method
          - public-function
          - private-function
        description: >-
          The group order of a file, first to last. A declaration belongs to the
          first of its candidate groups that this list names; one the list does
          not name is not ordered. Groups: `public-type`, `private-type`, `type`
          (types and the members of a type together, in the order they are
          written), `public-const`,
          `private-const`, `const`, `var`, `init`, `method` (the members of the
          types, one block per type, in the order the types are declared, each
          with the constructors of the type first, then its exported
          methods, its hooks and its unexported methods),
          `public-function`, `private-function`.
      hooks:
        type: array
        default:
          - Clone
          - String
          - GoString
          - Error
          - Unwrap
          - MarshalJSON
          - UnmarshalJSON
          - MarshalText
          - UnmarshalText
          - MarshalBinary
          - UnmarshalBinary
        description: >-
          Exported methods that implement clone, conversion or interface hooks;
          they follow the other exported methods of their type. Names are kept
          to ones that are never ordinary behavior.
    additionalProperties: false
  languages:
    go: {}
    rust:
      options:
        groups: [const, var, type, public-function, private-function]
        hooks: []
  check:
    type: cel
    select: symbol
    variables:
      # The placed declarations of each module, in file order, each as
      # [place, id, name].
      - name: modules
        expression: >-
          slots.map(r, r[0]).distinct().map(m,
            slots.filter(r, r[0] == m && r[1] >= 0).map(r, [r[1], r[2], r[3]]))
      # Per module, the placed declarations that are misplaced: the fewest
      # that, moved, put the module in order, each as
      # [id, group, after, before, late]: it is to follow the first later
      # declaration of an earlier place that stays in place, else the first
      # such declaration.
      - name: displaced
        expression: >-
          modules.map(at,
            cel.bind(g, at.map(r, r[0]),
            cel.bind(moved, g.misplaced(),
            cel.bind(kept, lists.range(size(g)).filter(i, !(i in moved)),
            cel.bind(follows, g.anchors(),
              moved.map(i,
                [at[i][1], g[i] / 1000000,
                 (kept.filter(j, j > i && g[j] < g[i]).map(j, at[j][2])
                  + (follows[i] < 0 ? [] : at.slice(follows[i], follows[i] + 1).map(r, r[2]))
                  + [''])[0], '', false])))))).flatten()
      # The methods of the owners, in file order; one value per file, each as
      # [id, name, owner and module, whether it is a constructor method (a
      # public method named like a constructor), position].
      - name: methods
        expression: >-
          placed.filter(s, s.kind == 'method' && s.owner_key != '')
            .map(s, [s.id, s.name, s.owner_key + '|' + s.module,
                     s.visibility != 'private' && s.constructor_named, s.pos])
      # Where methods and types are one group, a constructor method that
      # follows another method of its type: it is to come before the first of
      # them.
      - name: late
        expression: >-
          !('type' in groups) ? [] :
          methods.filter(c, c[3]
              && methods.exists(x, x[2] == c[2] && !x[3] && x[4] < c[4]))
            .map(c, cel.bind(earlier, methods.filter(x, x[2] == c[2] && !x[3] && x[4] < c[4]),
              [c[0], -1, earlier[0][1], earlier[0][0], true]))
      # The declarations of the file in the order of their places, the argument
      # of the reorder that fixes every finding of the file at once.
      - name: ordered
        expression: >-
          slots.filter(r, r[1] >= 0).sortBy(r, r[1]).map(r, r[2])
      # Every finding of the file, as [id, group, after, before, late], and
      # the ids they are about.
      - name: reported
        expression: displaced + late
      - name: reported_ids
        expression: reported.map(d, d[0])
      - name: report
        expression: >-
          symbol.id in reported_ids ? reported.filter(d, d[0] == symbol.id) : []
    where: size(report) > 0
    message: >-
      {{ report[0][4]
         ? 'constructor ' + symbol.name + ' must precede the other methods of its type, such as '
           + report[0][2]
         : symbol.kind + ' ' + symbol.name + ' belongs to the `' + options.groups[report[0][1]]
           + '` group and must '
           + (report[0][2] != '' ? 'follow ' + report[0][2]
              : 'come before the declarations above it') }}
    evidence:
      declaration: symbol.id
      group: "report[0][4] ? 'constructor' : options.groups[report[0][1]]"
      expected_after: "!report[0][4] && report[0][2] != '' ? report[0][2] : null"
      before: report[0][3]
    identity:
      subject: symbol.id
      snippet: "report[0][4] ? 'clause 1' : ''"
  fix:
    safety: safe
    type: cel
    edits: >-
      finding.evidence.before != ''
      ? [move(finding.evidence.declaration, before(finding.evidence.before))]
      : [reorder(ordered)]
  provenance:
    wasDerivedFrom:
      - "Martin, Clean Code (2008), G24 Follow Standard Conventions"
      - "Martin, Clean Code (2008), ch. 10 Class organization"
      - "Uber Go Style Guide, Function Grouping and Ordering"
      - "golangci-lint, funcorder"
  examples:
    - name: invalid
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return helper() }

            func helper() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            func helper() int { return 1 }

            type Service struct{}

            func (s *Service) Run() int { return helper() }
      expect:
        - line: 3
    - name: valid
      language: go
      kind: valid
      canonical: true
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return helper() }

            func helper() int { return 1 }
    - name: private-method-before-public
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return s.run() }

            func (s *Service) run() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) run() int { return 1 }

            func (s *Service) Run() int { return s.run() }
      expect:
        - line: 7
    - name: init-after-functions
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            var ready bool

            func init() { ready = true }

            func Run() bool { return ready }
      files:
        - path: example.go
          body: |-
            package sample

            var ready bool

            func Run() bool { return ready }

            func init() { ready = true }
      expect:
        - line: 7
    - name: groups-in-order
      language: go
      kind: valid
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{ ok bool }

            type state int

            const Limit = 3

            const floor = 1

            var ready bool

            func init() { ready = true }

            func NewService() *Service { return &Service{ok: true} }

            func (s *Service) Run() int { return floor + int(state(Limit)) }

            func (s *Service) String() string { return "service" }

            func (s *Service) check() bool { return s.ok }

            func Open() *Service { return NewService() }
    - name: owner-blocks
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            type Client struct{}

            func (s *Service) Run() int { return 1 }

            func (c *Client) Do() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return 1 }

            type Client struct{}

            func (c *Client) Do() int { return 1 }
      expect:
        - line: 7
    - name: constructor-after-methods
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func NewService() *Service { return &Service{} }

            func (s *Service) Run() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return 1 }

            func NewService() *Service { return &Service{} }
      expect:
        - line: 7
    - name: rust-invalid
      language: rust
      kind: invalid
      fixed:
        - path: src/lib.rs
          body: |-
            pub struct Store;

            pub fn run() -> u8 {
                1
            }
      files:
        - path: src/lib.rs
          body: |-
            pub fn run() -> u8 {
                1
            }

            pub struct Store;
      expect:
        - line: 5
    - name: rust-valid
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            const LIMIT: u8 = 3;

            pub struct Store;

            impl Store {
                pub fn new() -> Self {
                    Store
                }

                pub fn get(&self) -> u8 {
                    LIMIT
                }
            }

            pub fn run() -> u8 {
                helper()
            }

            fn helper() -> u8 {
                1
            }
    - name: rust-constructor-after-behavior
      language: rust
      kind: invalid
      fixed:
        - path: src/lib.rs
          body: |-
            pub struct Store;

            impl Store {
                pub fn new() -> Self {
                    Store
                }

                pub fn get(&self) -> u8 {
                    1
                }
            }
      files:
        - path: src/lib.rs
          body: |-
            pub struct Store;

            impl Store {
                pub fn get(&self) -> u8 {
                    1
                }

                pub fn new() -> Self {
                    Store
                }
            }
      expect:
        - line: 8
    - name: test-fixtures-out-of-order
      language: go
      kind: invalid
      fixed:
        - path: store_test.go
          body: |-
            package store

            import "testing"

            type sample struct{}

            var limit = 3

            func TestSample(t *testing.T) { _ = sample{} }
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store_test.go
          body: |-
            package store

            import "testing"

            var limit = 3

            type sample struct{}

            func TestSample(t *testing.T) { _ = sample{} }
      expect:
        - line: 7
