# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/declaration-groups
  uid: 2ddd0282-b9b3-4537-8e54-b9c0fbfbc4ad
spec:
  title: Declarations follow ownership groups
  context: >-
    A fixed group order makes every file predictable.

    Go: Fixtures of a test file (its types, constants, variables and
    functions that take no testing handle) follow the same order; tests
    and test helpers are placed by `testing/file-layout`. Order:
    public types; private types; public constants; private constants;
    variables; all `init` functions; public options and functions; public
    constructors; public methods; clone, conversion and interface hooks;
    private functions and methods.

    Rust: The same principle, from the concepts to the machinery, with a
    type kept next to its impl blocks because that is how Rust code reads.
    Order: constants; statics; types, traits and their impl blocks (types
    and impls are one group, `owner-contiguity` keeps an owner's impls
    together); public free functions; private free functions. Associated
    functions named `new` come before the other methods of their type.
    Items of `#[cfg(test)]` modules are not ordered. Visibility counts as
    public when it is `pub` or `pub(crate)`.
  scope:
    subject: file
    generated: true
    tests: include
  requirement: >-
    Top-level declarations in a file MUST follow the language's ownership-group
    order, from public contract to private mechanics. Initializers MUST stay
    together and MUST precede non-initializer functions and methods. Within one
    type, constructors MUST precede other behavior.
  severity: error
  options:
    properties:
      groups:
        type: array
        default:
          - public-type
          - private-type
          - public-const
          - private-const
          - var
          - init
          - public-function
          - constructor
          - public-method
          - hook
          - private-function
        description: >-
          The group order of a file, first to last. A declaration belongs to the
          first of its candidate groups that this list names; one the list does
          not name is not ordered. Groups: `public-type`, `private-type`, `type`
          (types and the members of a type together), `public-const`,
          `private-const`, `const`, `var`, `init`, `public-function`,
          `constructor`, `public-method`, `hook`, `private-function` (private
          functions and, where `type` is not listed, private methods).
      hookNames:
        type: array
        default:
          - Clone
          - String
          - GoString
          - Error
          - Unwrap
          - MarshalJSON
          - UnmarshalJSON
          - MarshalText
          - UnmarshalText
          - MarshalBinary
          - UnmarshalBinary
        description: >-
          Public methods that implement clone, conversion or interface hooks;
          they follow the other public methods. Names are kept to ones that are
          never ordinary behavior.
      constructorsFirst:
        type: boolean
        default: false
        description: >-
          A constructor method (a public method named like a constructor) must
          precede the other methods of its type in the file. Go constructors are
          functions, ordered by the `constructor` group instead.
    additionalProperties: false
  languages:
    rust:
      options:
        groups: [const, var, type, public-function, private-function]
        hookNames: []
        constructorsFirst: true
  check:
    type: cel
    select: symbol
    variables:
      # The declarations the order places, in file order; one value per file.
      - name: placed
        expression: >-
          file.symbols.filter(s, s.declaration && !s.generated).map(s, {'id': s.id, 'module': s.module, 'name': s.name, 'group': declaration_group(s)})
            .filter(p, p.group >= 0)
      # Per module, the placed declarations that are not in a longest run
      # already in order: the fewest that, moved, put the module in order.
      # Each is to follow the first later declaration of an earlier group that
      # stays in place, else the first such declaration.
      - name: displaced
        expression: >-
          placed.map(s, s.module).distinct().map(m,
            cel.bind(l, placed.filter(s, s.module == m),
            cel.bind(g, l.map(s, s.group),
            cel.bind(kept, lists.range(size(g)).filter(i, !(i in g.misplaced())),
              lists.range(size(l)).filter(i, !(i in kept)).map(i,
                {'id': l[i].id, 'late': false, 'group': g[i], 'before': '',
                 'after': (
                   lists.range(size(l)).filter(j, j > i && g[j] < g[i] && j in kept).map(j, l[j].name)
                   + lists.range(size(l)).filter(j, j > i && g[j] < g[i]).map(j, l[j].name)
                   + [''])[0]}))))).flatten()
      # The methods of the owners, in file order; one value per file.
      - name: methods
        expression: file.symbols.filter(s, is_placed(s) && s.kind == 'method' && s.owner_key != '')
      # A constructor method of a type that follows another method of its type.
      - name: late
        expression: >-
          !options.constructorsFirst ? [] :
          lists.range(size(methods))
            .filter(i, methods[i].visibility != 'private' && methods[i].constructor_named
              && lists.range(i).exists(j, methods[j].owner_key == methods[i].owner_key
                && methods[j].module == methods[i].module
                && !(methods[j].visibility != 'private' && methods[j].constructor_named)))
            .map(i, {'id': methods[i].id, 'late': true, 'group': -1,
              'before': (lists.range(i).filter(j, methods[j].owner_key == methods[i].owner_key
                  && methods[j].module == methods[i].module
                  && !(methods[j].visibility != 'private' && methods[j].constructor_named))
                .map(j, methods[j].id))[0],
              'after': (lists.range(i).filter(j, methods[j].owner_key == methods[i].owner_key
                  && methods[j].module == methods[i].module
                  && !(methods[j].visibility != 'private' && methods[j].constructor_named))
                .map(j, methods[j].name))[0]})
      - name: reported
        expression: displaced + late
      - name: report
        expression: reported.filter(d, d.id == symbol.id)
    where: size(report) > 0
    message: >-
      {{ report[0].late
         ? 'constructor ' + symbol.name + ' must precede the other methods of its type, such as '
           + report[0].after
         : symbol.kind + ' ' + symbol.name + ' belongs to the `' + options.groups[report[0].group]
           + '` group and must '
           + (report[0].after != '' ? 'follow ' + report[0].after
              : 'come before the declarations above it') }}
    evidence:
      declaration: symbol.id
      group: "report[0].late ? 'constructor' : options.groups[report[0].group]"
      expected_after: "!report[0].late && report[0].after != '' ? report[0].after : null"
      before: report[0].before
    identity:
      subject: symbol.id
      snippet: "report[0].late ? 'clause 1' : ''"
  fix:
    safety: safe
    type: cel
    edits: >-
      finding.evidence.before != ''
      ? [move(finding.evidence.declaration, before(finding.evidence.before))]
      : [reorder(placed.sortBy(s, s.group))]
  provenance:
    wasDerivedFrom:
      - "Martin, Clean Code (2008), G24 Follow Standard Conventions"
      - "Martin, Clean Code (2008), ch. 10 Class organization"
  examples:
    - name: invalid
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return helper() }

            func helper() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            func helper() int { return 1 }

            type Service struct{}

            func (s *Service) Run() int { return helper() }
      expect:
        - line: 3
    - name: valid
      language: go
      kind: valid
      canonical: true
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return helper() }

            func helper() int { return 1 }
    - name: private-method-before-public
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return s.run() }

            func (s *Service) run() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) run() int { return 1 }

            func (s *Service) Run() int { return s.run() }
      expect:
        - line: 7
    - name: init-after-functions
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            var ready bool

            func init() { ready = true }

            func Run() bool { return ready }
      files:
        - path: example.go
          body: |-
            package sample

            var ready bool

            func Run() bool { return ready }

            func init() { ready = true }
      expect:
        - line: 7
    - name: groups-in-order
      language: go
      kind: valid
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{ ok bool }

            type state int

            const Limit = 3

            const floor = 1

            var ready bool

            func init() { ready = true }

            func Open() *Service { return NewService() }

            func NewService() *Service { return &Service{ok: true} }

            func (s *Service) Run() int { return floor + int(state(Limit)) }

            func (s *Service) String() string { return "service" }

            func (s *Service) check() bool { return s.ok }
    - name: rust-invalid
      language: rust
      kind: invalid
      fixed:
        - path: src/lib.rs
          body: |-
            pub struct Store;

            pub fn run() -> u8 {
                1
            }
      files:
        - path: src/lib.rs
          body: |-
            pub fn run() -> u8 {
                1
            }

            pub struct Store;
      expect:
        - line: 5
    - name: rust-valid
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            const LIMIT: u8 = 3;

            pub struct Store;

            impl Store {
                pub fn new() -> Self {
                    Store
                }

                pub fn get(&self) -> u8 {
                    LIMIT
                }
            }

            pub fn run() -> u8 {
                helper()
            }

            fn helper() -> u8 {
                1
            }
    - name: rust-constructor-after-behavior
      language: rust
      kind: invalid
      fixed:
        - path: src/lib.rs
          body: |-
            pub struct Store;

            impl Store {
                pub fn new() -> Self {
                    Store
                }

                pub fn get(&self) -> u8 {
                    1
                }
            }
      files:
        - path: src/lib.rs
          body: |-
            pub struct Store;

            impl Store {
                pub fn get(&self) -> u8 {
                    1
                }

                pub fn new() -> Self {
                    Store
                }
            }
      expect:
        - line: 8
    - name: test-fixtures-out-of-order
      language: go
      kind: invalid
      fixed:
        - path: store_test.go
          body: |-
            package store

            import "testing"

            type sample struct{}

            var limit = 3

            func TestSample(t *testing.T) { _ = sample{} }
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store_test.go
          body: |-
            package store

            import "testing"

            var limit = 3

            type sample struct{}

            func TestSample(t *testing.T) { _ = sample{} }
      expect:
        - line: 7
