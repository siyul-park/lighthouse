# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/declaration-groups
  uid: 2ddd0282-b9b3-4537-8e54-b9c0fbfbc4ad
spec:
  title: Declarations follow ownership groups
  context: >-
    A fixed group order makes every file predictable.

    Go: types first, then methods grouped by owner, as `golangci-lint`
    `funcorder` and the Uber Go style guide (Function Grouping and Ordering:
    group by receiver, constructors before the other methods) ask. The type
    declarations stay together, a deliberate difference from the Uber example,
    which puts each type's methods right after the type. Fixtures of a test
    file (its types, constants, variables and functions that take no testing
    handle) follow the same order; tests and test helpers are placed by
    `testing/file-layout`. Order: public types; private types; public
    constants; private constants; variables; all `init` functions; one block
    per type, in the order the types are declared, each with the constructors
    of the type (functions named like `NewType`), then its exported methods,
    then its clone, conversion and interface hooks, then its unexported
    methods; public functions; private functions.

    Rust: The same principle, from the concepts to the machinery, with a
    type kept next to its impl blocks because that is how Rust code reads.
    Order: constants; statics; types, traits and their impl blocks (types
    and impls are one group, `owner-contiguity` keeps an owner's impls
    together); public free functions; private free functions. The order of an
    owner's own members is left to `design/layout`. Items of `#[cfg(test)]` modules are
    not ordered. Visibility counts as public when it is `pub` or `pub(crate)`.
  scope:
    subject: file
    generated: true
    tests: include
  requirement: >-
    Top-level declarations in a file MUST follow the language's ownership-group
    order, from public contract to private mechanics. Initializers MUST stay
    together and MUST precede non-initializer functions and methods. Where
    methods are grouped by owner, a type's constructors MUST precede its
    exported methods, and those MUST precede its unexported ones.
  severity: error
  options:
    properties:
      groups:
        type: array
        default:
          - public-type
          - private-type
          - public-const
          - private-const
          - var
          - init
          - method
          - public-function
          - private-function
        description: >-
          The group order of a file, first to last. A declaration belongs to the
          first of its candidate groups that this list names; one the list does
          not name is not ordered. Groups: `public-type`, `private-type`, `type`
          (types and the members of a type together, in the order they are
          written), `public-const`,
          `private-const`, `const`, `var`, `init`, `method` (the members of the
          types, one block per type, in the order the types are declared, each
          in the order of `type`: constructors, exported methods, hooks,
          unexported methods), `public-function`, `private-function`.
      hookNames:
        type: array
        default:
          - Clone
          - String
          - GoString
          - Error
          - Unwrap
          - MarshalJSON
          - UnmarshalJSON
          - MarshalText
          - UnmarshalText
          - MarshalBinary
          - UnmarshalBinary
        description: >-
          Exported methods that implement clone, conversion or interface hooks;
          they follow the other exported methods of their type. Names are kept
          to ones that are never ordinary behavior.
    additionalProperties: false
  languages:
    rust:
      options:
        groups: [const, var, type, public-function, private-function]
        hookNames: []
  check:
    type: cel
    select: symbol
    variables:
      # The declarations the order places, in file order; one value per file.
      - name: placed
        expression: >-
          file.symbols.filter(s, s.declaration && !s.generated).map(s, {'id': s.id, 'module': s.module, 'name': s.name, 'key': declaration_group(s)})
            .filter(p, p.key >= 0)
      # Per module, the placed declarations that are not in a longest run
      # already in order: the fewest that, moved, put the module in order.
      # Each is to follow the first later declaration of an earlier place that
      # stays in place, else the first such declaration.
      - name: displaced
        expression: >-
          placed.map(s, s.module).distinct().map(m,
            cel.bind(l, placed.filter(s, s.module == m),
            cel.bind(g, l.map(s, s.key),
            cel.bind(kept, lists.range(size(g)).filter(i, !(i in g.misplaced())),
              lists.range(size(l)).filter(i, !(i in kept)).map(i,
                {'id': l[i].id, 'group': g[i] / 1000000,
                 'after': (
                   lists.range(size(l)).filter(j, j > i && g[j] < g[i] && j in kept).map(j, l[j].name)
                   + lists.range(size(l)).filter(j, j > i && g[j] < g[i]).map(j, l[j].name)
                   + [''])[0]}))))).flatten()
      - name: report
        expression: displaced.filter(d, d.id == symbol.id)
    where: size(report) > 0
    message: >-
      {{ symbol.kind + ' ' + symbol.name + ' belongs to the `' + options.groups[report[0].group]
         + '` group and must '
         + (report[0].after != '' ? 'follow ' + report[0].after
            : 'come before the declarations above it') }}
    evidence:
      declaration: symbol.id
      group: options.groups[report[0].group]
      expected_after: "report[0].after != '' ? report[0].after : null"
    identity:
      subject: symbol.id
  fix:
    safety: safe
    type: cel
    edits: "[reorder(placed.sortBy(s, s.key))]"
  provenance:
    wasDerivedFrom:
      - "Martin, Clean Code (2008), G24 Follow Standard Conventions"
      - "Martin, Clean Code (2008), ch. 10 Class organization"
      - "Uber Go Style Guide, Function Grouping and Ordering"
      - "golangci-lint, funcorder"
  examples:
    - name: invalid
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return helper() }

            func helper() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            func helper() int { return 1 }

            type Service struct{}

            func (s *Service) Run() int { return helper() }
      expect:
        - line: 3
    - name: valid
      language: go
      kind: valid
      canonical: true
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return helper() }

            func helper() int { return 1 }
    - name: private-method-before-public
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return s.run() }

            func (s *Service) run() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) run() int { return 1 }

            func (s *Service) Run() int { return s.run() }
      expect:
        - line: 7
    - name: init-after-functions
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            var ready bool

            func init() { ready = true }

            func Run() bool { return ready }
      files:
        - path: example.go
          body: |-
            package sample

            var ready bool

            func Run() bool { return ready }

            func init() { ready = true }
      expect:
        - line: 7
    - name: groups-in-order
      language: go
      kind: valid
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{ ok bool }

            type state int

            const Limit = 3

            const floor = 1

            var ready bool

            func init() { ready = true }

            func NewService() *Service { return &Service{ok: true} }

            func (s *Service) Run() int { return floor + int(state(Limit)) }

            func (s *Service) String() string { return "service" }

            func (s *Service) check() bool { return s.ok }

            func Open() *Service { return NewService() }
    - name: owner-blocks
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            type Client struct{}

            func (s *Service) Run() int { return 1 }

            func (c *Client) Do() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return 1 }

            type Client struct{}

            func (c *Client) Do() int { return 1 }
      expect:
        - line: 7
    - name: constructor-after-methods
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func NewService() *Service { return &Service{} }

            func (s *Service) Run() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            type Service struct{}

            func (s *Service) Run() int { return 1 }

            func NewService() *Service { return &Service{} }
      expect:
        - line: 7
    - name: rust-invalid
      language: rust
      kind: invalid
      fixed:
        - path: src/lib.rs
          body: |-
            pub struct Store;

            pub fn run() -> u8 {
                1
            }
      files:
        - path: src/lib.rs
          body: |-
            pub fn run() -> u8 {
                1
            }

            pub struct Store;
      expect:
        - line: 5
    - name: rust-valid
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            const LIMIT: u8 = 3;

            pub struct Store;

            impl Store {
                pub fn new() -> Self {
                    Store
                }

                pub fn get(&self) -> u8 {
                    LIMIT
                }
            }

            pub fn run() -> u8 {
                helper()
            }

            fn helper() -> u8 {
                1
            }
    - name: test-fixtures-out-of-order
      language: go
      kind: invalid
      fixed:
        - path: store_test.go
          body: |-
            package store

            import "testing"

            type sample struct{}

            var limit = 3

            func TestSample(t *testing.T) { _ = sample{} }
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store_test.go
          body: |-
            package store

            import "testing"

            var limit = 3

            type sample struct{}

            func TestSample(t *testing.T) { _ = sample{} }
      expect:
        - line: 7
