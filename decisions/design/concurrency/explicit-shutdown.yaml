# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/explicit-shutdown
  labels:
    lighthouse/pack: design
    lighthouse/section: concurrency
spec:
  title: Long-lived tasks can be stopped
  context: >-
    A task nobody can stop leaks and blocks shutdown.

    Go: Applies to goroutines.
  scope:
    domain: code
    subject: symbol
  requirement: Long-lived concurrent tasks MUST have an explicit shutdown path.
  severity: warn
  check:
    type: model
