---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/no-stored-context
  uid: 665ca517-b0f3-43a9-b945-15d0262f10a6
spec:
  title: Types do not store request contexts
  context: A context carries request-scoped cancellation and deadlines. Storing it
    on a reusable object hides which operation owns that lifetime.
  scope:
    subject: symbol
  requirement: A type SHOULD NOT store `context.Context` in a field; pass the context
    to the operation that uses it.
  severity: warn
  check:
    type: cel
    select: symbol
    where: symbol.kind == 'field' && symbol.lang == 'go' && symbol.type.text == 'context.Context'
    message: "{{ 'found a struct that stores a context.Context field: ' + symbol.name
      }}"
    evidence:
      kind: "'stored-context'"
      symbol: symbol.id
    identity:
      subject: symbol.id
  provenance:
    wasDerivedFrom:
    - 'revive context-as-argument, option allow-types-before: https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#context-as-argument'
    - 'containedctx: https://github.com/sivchari/containedctx'
    - 'revive context-as-argument: https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#context-as-argument'
    - 'Martin, Clean Code (2008), ch. 13 Concurrency: SRP, limit shared data'
    - Martin, Clean Code (2008), ch. 13 Shared objects and shutdown
  examples:
  - name: stored-context-invalid
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        import "context"

        type Worker struct {
          ctx  context.Context
          name string
        }
    expect:
    - line: 6
  - name: stored-context-valid
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        import "context"

        type Worker struct{ name string }

        func (w *Worker) Run(ctx context.Context) error { return ctx.Err() }
    canonical: true
  - name: stored-context-a-cancel-function
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        import "context"

        type Holder struct{ cancel context.CancelFunc }
    canonical: false
  - name: stored-context-rust-is-judged-by-review
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Ctx;

        pub struct Worker {
            ctx: Ctx,
        }

        impl Worker {
            pub fn new(ctx: Ctx) -> Self {
                Self { ctx }
            }
        }
    canonical: true
