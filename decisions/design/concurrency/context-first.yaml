# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/context-first
  labels:
    lighthouse/pack: design
    lighthouse/section: concurrency
spec:
  title: Cancellation context comes first
  context: >-
    A uniform position makes cancellation visible and checkable.

    Go: `ctx context.Context` is the first parameter.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Blocking, I/O, and process-boundary operations MUST take the cancellation
    context as their first parameter.
  severity: warn
  check:
    type: model
  examples:
    - name: invalid
      language: go
      kind: invalid
      files:
        - path: example.go
          body: "func Fetch(url string, ctx context.Context) ([]byte, error)"
    - name: valid
      language: go
      kind: valid
      files:
        - path: example.go
          body: "func Fetch(ctx context.Context, url string) ([]byte, error)"
