---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/context-first
  uid: 473fa6d5-9307-490b-ad9b-fe7faed394ec
spec:
  title: Context is the first parameter
  context: Putting cancellation and deadlines first makes the lifetime of the operation
    visible at the call site. Framework types may be explicitly exempted.
  scope:
    subject: symbol
  requirement: A Go function that accepts `context.Context` SHOULD take it as its
    first parameter, except for explicitly allowed framework types.
  severity: warn
  options:
    properties:
      allowTypesBefore:
        type: array
        default: []
        description: Types, as written with their full package path (`*testing.T`),
          that may come before the context.
    additionalProperties: false
  check:
    type: cel
    select: symbol
    variables:
    - name: params
      expression: 'symbol.lang == ''go'' && symbol.func != null ? symbol.func.params
        : []'
    - name: matched
      expression: 'params.exists(c, c.text == ''context.Context'' && c.index > 0 &&
        params.exists(b, b.index < c.index && !(b.text in options.allowTypesBefore)))
        ? [''context-first''] : []'
    where: size(matched)>0
    message: "{{ 'context.Context should be the first parameter of ' + symbol.name
      }}"
    evidence:
      kind: "'context-first'"
      params: params.map(p,p.text)
    identity:
      subject: symbol.id
  provenance:
    wasDerivedFrom:
    - 'revive context-as-argument, option allow-types-before: https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#context-as-argument'
    - 'containedctx: https://github.com/sivchari/containedctx'
    - 'revive context-as-argument: https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#context-as-argument'
    - 'Martin, Clean Code (2008), ch. 13 Concurrency: SRP, limit shared data'
    - Martin, Clean Code (2008), ch. 13 Shared objects and shutdown
  examples:
  - name: context-first-invalid
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        import "context"

        func Fetch(url string, ctx context.Context) ([]byte, error) { return nil, ctx.Err() }
    expect:
    - line: 5
  - name: context-first-valid
    language: go
    kind: valid
    canonical: true
    files:
    - path: example.go
      body: |-
        package sample

        import "context"

        func Fetch(ctx context.Context, url string) ([]byte, error) { return nil, ctx.Err() }
  - name: context-first-allowed-type-before
    language: go
    kind: valid
    options:
      allowTypesBefore:
      - "*testing.T"
    files:
    - path: example.go
      body: |-
        package sample

        import (
          "context"
          "testing"
        )

        func Setup(t *testing.T, ctx context.Context) { _ = ctx.Err() }
    canonical: false
  - name: context-first-type-not-allowed
    language: go
    kind: invalid
    options:
      allowTypesBefore:
      - "*testing.T"
    files:
    - path: example.go
      body: |-
        package sample

        import (
          "context"
          "testing"
        )

        func Setup(t *testing.T, name string, ctx context.Context) { _ = ctx.Err() }
    expect:
    - line: 8
  - name: context-first-a-method
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        import "context"

        type Client struct{}

        func (c *Client) Get(url string, ctx context.Context) error { return ctx.Err() }
    expect:
    - line: 7
  - name: context-first-rust-is-judged-by-review
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |-
        pub struct Ctx;

        pub fn fetch(url: &str, ctx: &Ctx) -> usize {
            let _ = ctx;
            url.len()
        }
