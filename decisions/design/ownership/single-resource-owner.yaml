# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/single-resource-owner
  uid: 9ada8170-92b4-4a81-8bfe-b699b07303cc
  labels:
    lighthouse/pack: design
    lighthouse/section: ownership
spec:
  title: One owner per resource transition
  context: >-
    Resources leak when nobody, or two parties, ends them.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Retain/release and resource transitions MUST have one owner, and each
    resource MUST be released exactly once.
  severity: info
  check:
    type: model
