# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/private-state-behind-owner
  labels:
    lighthouse/pack: design
    lighthouse/section: ownership
spec:
  title: Private state stays behind its owner
  intent: State reachable from anywhere cannot keep an invariant.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    Private state belongs to its owner. An implementation component of an owner
    MAY access that owner's private state when it implements the owner's
    responsibility; unrelated code in the same package MUST use the owner's
    contract.
  enforcement: mechanical
  evidence: [owner, accessor, member]
  languages:
    go:
      tuning: >-
        An unexported implementation component may access its exported owner's
        private fields; unrelated same-package code uses the owner's methods.
