# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/no-hidden-target
  uid: bf1a4788-84da-43a4-98ff-8a2449c1dc71
  labels:
    lighthouse/pack: testing
    lighthouse/section: public-boundary
spec:
  title: Helpers do not hide the target call
  context: >-
    A helper that wraps the call hides the very thing being specified.

    Until the code model says whether a helper returns or asserts on the
    target's result, or only builds with it, this is a review signal: a setup
    helper that hands the target to a constructor is reported too.

    An owner test is named after its target (`TestStore_Get` is about
    `Store.Get`, by the naming of `testing/owner`). The test is reported when
    it neither calls nor references that target itself but calls a helper of
    the test code that does. A helper is a function of test code that is not a
    test case; it is followed one call deep, and a call made inside a closure or
    a `t.Run` helper counts as the test's own. The helper is taken to return the target's
    result or assert on it: the code model says that it calls the target, not
    what it does with the result. A test with no owner name, or that calls
    what it is named after, is not reported, and neither is a setup helper
    that only calls constructors or other code the test is not named after.

    Known limit: a setup helper that reaches the target as an argument, such
    as an environment builder that is handed the extension a test is named
    after, is reported although it only sets up; the code model does not say
    whether a helper asserts or builds.

    Go: The helper is a function that takes the test handle or a test fixture
    function.

    Rust: The helper is a function of the test crate or of an inline test
    module; the test is named after its target in snake case.
  scope:
    domain: code
    subject: test
    tests: only
  requirement: >-
    Wrappers, builders, or helpers MUST NOT hide the target call or result being
    specified, and MUST NOT be added merely for reuse. Setup helpers MAY exist
    only when the specified behavior remains visible.
  severity: info
  options:
    type: object
    properties:
      testPrefix:
        type: string
        default: Test
        description: "Prefix of the name of an owner test; a test without it is not one."
      snakeCase:
        type: boolean
        default: false
        description: "Compare names in snake case, as Rust tests are written."
      variantTests:
        type: boolean
        default: true
        description: >-
          Count `TestGet_Missing` as a test of `Get`; a name that adds a
          suffix to the symbol's own name restates the same contract.
      ancestorTests:
        type: boolean
        default: false
        description: >-
          Count the tests of a module that tests an ancestor module as tests of
          the nested module too: the integration tests of a Rust crate test all
          of it, private modules whose items the root re-exports included.
    additionalProperties: false
  languages:
    rust:
      options:
        testPrefix: ""
        snakeCase: true
        variantTests: false
        ancestorTests: true
  check:
    type: cel
    select: test
    with:
      - name: hidden
        expr: test.hidden_target
    where: size(hidden) > 0
    message: >-
      {{ test.name }} calls {{ hidden.target_name }} only through helper
      {{ hidden.helper_name }}; call {{ hidden.target_name }} in the case
    evidence:
      target: hidden.target
      helper: hidden.helper
    at:
      line: "hidden.site > 0 ? hidden.site : test.line"
    identity:
      subject: test.id
  provenance:
    wasDerivedFrom:
      - "Meszaros, xUnit Test Patterns, Obscure Test"
  examples:
    - name: go-helper-calls-the-target
      language: go
      kind: invalid
      files:
        - path: go.mod
          body: "module example.com/store\n\ngo 1.26\n"
        - path: store.go
          body: "package store\n\ntype Store struct{}\n\nfunc (s *Store) Get() int { return 1 }\n"
        - path: store_test.go
          body: "package store\n\nimport \"testing\"\n\nfunc TestStore_Get(t *testing.T) {\n\tcheck(t, 1)\n}\n\nfunc check(t *testing.T, want int) {\n\ts := &Store{}\n\tif s.Get() != want {\n\t\tt.Fatal(\"get\")\n\t}\n}\n"
      expect:
        - line: 6
    - name: go-test-calls-the-target
      language: go
      kind: valid
      canonical: true
      files:
        - path: go.mod
          body: "module example.com/store\n\ngo 1.26\n"
        - path: store.go
          body: "package store\n\ntype Store struct{}\n\nfunc (s *Store) Get() int { return 1 }\n"
        - path: store_test.go
          body: "package store\n\nimport \"testing\"\n\nfunc TestStore_Get(t *testing.T) {\n\ts := newStore(t)\n\tif s.Get() != 1 {\n\t\tt.Fatal(\"get\")\n\t}\n}\n\nfunc newStore(t *testing.T) *Store {\n\tt.Helper()\n\treturn &Store{}\n}\n"
    - name: rust-helper-calls-the-target
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub fn get() -> u8 {
                1
            }
        - path: tests/store.rs
          body: |-
            #[test]
            fn get() {
                check(1);
            }

            fn check(want: u8) {
                assert_eq!(workspace::get(), want);
            }
      expect:
        - line: 3
    - name: rust-test-calls-the-target
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            pub fn get() -> u8 {
                1
            }
        - path: tests/store.rs
          body: |-
            #[test]
            fn get() {
                assert_eq!(workspace::get(), expected());
            }

            fn expected() -> u8 {
                1
            }
