# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/no-private-symbol-access
  labels:
    lighthouse/pack: testing
    lighthouse/section: public-boundary
spec:
  title: Tests do not reach private symbols
  intent: Private-symbol tests freeze the implementation.
  scope:
    domain: code
    subject: test
  requirement: >-
    Tests MUST NOT reference private symbols of the target; private-symbol
    testing MUST be resolved at the public boundary rather than by exposing
    internals solely for tests.
  enforcement: mechanical
  evidence: [test_file, symbol]
