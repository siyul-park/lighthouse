  labels:
    lighthouse/pack: testing
    lighthouse/section: public-boundary
  annotations:
    lighthouse/was-enforcement: mechanical
spec:
  title: Tests do not reach private symbols
  context: >-
    Private-symbol tests freeze the implementation.
  scope:
    domain: code
    subject: test
    tests: only
  requirement: >-
    Tests MUST NOT reference private symbols of the target; private-symbol
    testing MUST be resolved at the public boundary rather than by exposing
