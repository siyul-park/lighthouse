# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/concern-owner
  uid: a6a0bb4b-06f8-4077-b8a2-64f0052fa0bc
  labels:
    lighthouse/pack: testing
    lighthouse/section: ownership
spec:
  title: One owner per concern
  context: >-
    A concern restated in two places drifts apart.
  scope:
    domain: code
    subject: project
  requirement: >-
    Each concern, such as test contracts and structure or general test code
    style, MUST have exactly one owning document; other documents MUST reference
    it instead of restating it.
