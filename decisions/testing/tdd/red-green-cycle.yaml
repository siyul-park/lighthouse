# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/red-green-cycle
  labels:
    lighthouse/pack: testing
    lighthouse/section: tdd
spec:
  title: Smallest failing contract first
  intent: Seeing the contract fail first proves the test can fail.
  scope:
    domain: code
    subject: test
  requirement: >-
    For each behavior change, the agent MUST state the contract and invariants,
    write the narrowest falsifying test, observe the expected failure when
    practical, implement the smallest owning change, and run focused checks
    followed by applicable structural and repository gates.
  enforcement: doc
