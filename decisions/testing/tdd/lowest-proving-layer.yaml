# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/lowest-proving-layer
  labels:
    lighthouse/pack: testing
    lighthouse/section: tdd
spec:
  title: Use the lowest layer that proves it
  context: >-
    Higher layers are slower and fail for more reasons.
  scope:
    domain: code
    subject: test
    tests: only
  requirement: The lowest test layer that proves the contract MUST be used.
  severity: info
  check:
    type: model
