# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/standard-assertions
  uid: 4428ab36-fed5-40eb-8ed3-6dcf7c1a1a15
  labels:
    lighthouse/pack: testing
    lighthouse/section: readability
spec:
  title: Assertions use the standard library
  context: >-
    A hand-written compare-and-fail repeats what the project's assertion
    library already states, with worse failure output.

    The decision applies to a module whose files import one of the
    `libraries` somewhere: where no assertion library is in use, a plain
    compare-and-fail is the standard form and there is nothing to prefer. A
    benchmark (`Benchmark*`) is not judged: its loop checks a result without
    an assertion library's overhead.

    Go: The library is `github.com/stretchr/testify/require`. A function
    of a test file that has an `if` with no `else` whose condition
    compares or negates and whose only effect is `t.Fatal`, `t.Fatalf`,
    `t.Error`, `t.Errorf`, `t.Fail` or `t.FailNow` is reported with the
    number of such checks. A check that does more than fail, such as one
    that also returns, is not a plain assertion.

    Rust: Use `assert_eq!`, `assert_ne!` and `assert!` with a message
    instead of helpers that compare and `panic!`. Not enforced for Rust,
    whose provider does not count hand-written checks.
  scope:
    domain: code
    subject: test
    tests: only
  requirement: >-
    Tests SHOULD assert through the project's standard assertion library, and a
    test helper SHOULD NOT reimplement a comparison and failure that the library
    already provides.
  severity: warn
  options:
    type: object
    properties:
      libraries:
        type: array
        items:
          type: string
        default: ["github.com/stretchr/testify"]
        description: >-
          Import paths (or their prefixes) of the assertion libraries; a module
          that imports none of them is not judged.
    additionalProperties: false
  check:
    type: cel
    select: function
    where: >-
      func.manual_assertions > 0 && !func.name.startsWith('Benchmark')
      && func.module_imports.exists(i, options.libraries.exists(l, i == l || i.startsWith(l + '/')))
    message: >-
      {{ func.kind == 'test' ? 'test' : func.test_role == 'test-helper' ? 'test helper' : 'function' }}
      {{ func.name }} compares and fails by hand {{ func.manual_assertions }} time(s);
      use the project's assertion library
    evidence:
      symbol: func.id
      manual_assertions: func.manual_assertions
    identity:
      subject: func.id
  examples:
    - name: hand-written-comparison
      language: go
      kind: invalid
      options:
        libraries: [testing]
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store.go
          body: |-
            package store

            func Get() int { return 1 }
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc TestGet(t *testing.T) {\n\tif got := store.Get(); got != 1 {\n\t\tt.Fatalf(\"got %d\", got)\n\t}\n}"
      expect:
        - line: 9
    - name: no-assertion-library-in-use
      language: go
      kind: valid
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store.go
          body: |-
            package store

            func Get() int { return 1 }
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc TestGet(t *testing.T) {\n\tif got := store.Get(); got != 1 {\n\t\tt.Fatalf(\"got %d\", got)\n\t}\n}"
    - name: benchmark-loop
      language: go
      kind: valid
      options:
        libraries: [testing]
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store.go
          body: |-
            package store

            func Get() int { return 1 }
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc BenchmarkGet(b *testing.B) {\n\tfor range b.N {\n\t\tif got := store.Get(); got != 1 {\n\t\t\tb.Fatalf(\"got %d\", got)\n\t\t}\n\t}\n}"
    - name: check-that-does-more
      language: go
      kind: valid
      canonical: true
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store.go
          body: |-
            package store

            func Get() int { return 1 }
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc TestGet(t *testing.T) {\n\tgot := store.Get()\n\tif got != 1 {\n\t\tt.Errorf(\"got %d\", got)\n\t\treturn\n\t}\n}"
    - name: rust-assert-macros
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            pub fn get() -> i32 {
                1
            }

            #[cfg(test)]
            mod tests {
                use super::*;

                #[test]
                fn get_returns_one() {
                    assert_eq!(get(), 1);
                }
            }
