# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/table-for-same-behavior
  labels:
    lighthouse/pack: testing
    lighthouse/section: organization
spec:
  title: Tables for one behavior over many inputs
  context: >-
    A table says the behavior is the same and only the data differs.

    Go: Use an inline anonymous struct table.
  scope:
    domain: code
    subject: test
    tests: only
  requirement: >-
    Same behavior over many inputs MUST use one inline table of named inputs and
    expected outputs, each entry one case; cases that specify the same behavior
    MUST be merged into one case or one table.
  severity: info
  check:
    type: model
