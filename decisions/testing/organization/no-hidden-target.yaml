---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/no-hidden-target
  uid: 66974a2c-a722-4e4e-acb8-5f16103aaa42
spec:
  title: Tests expose the behavior they exercise
  context: The test body should read like a specification. Helpers may remove repetition,
    but a reviewer must still see what production behavior is being tested.
  scope:
    subject: test
    tests: only
  languages:
    go: {}
    rust: {}
  requirement: A test SHOULD make the production call and its asserted result visible;
    helpers SHOULD NOT hide the target call, result, or expected value.
  severity: warn
  check:
    type: cel
    select: test
    where: 'false'
    abstain: test.target_count == 0 && test.callees.exists(c, c.test_role == 'test-helper')
    message: "{{ test.name + ' reaches production code only through test helpers; review whether the target call and the expected value are visible' }}"
    evidence:
      helpers: test.callees.filter(c, c.test_role == 'test-helper').map(c, c.name)
    identity:
      subject: test.id
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#readability-668c9a46'
    - 'Lighthouse, testing#contract-31731df3'
    - 'Meszaros, xUnit Test Patterns, Obscure Test'
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: go.mod
      body: |
        module sample

        go 1.23
    - path: sample.go
      body: |
        package sample

        func Get() int { return 1 }
    - path: sample_test.go
      body: |
        package sample

        import "testing"

        func assertGetIsOne(t *testing.T) {
        	t.Helper()
        	if Get() != 1 {
        		t.Fatal("Get is not 1")
        	}
        }

        func TestGet(t *testing.T) { assertGetIsOne(t) }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: go.mod
      body: |
        module sample

        go 1.23
    - path: sample.go
      body: |
        package sample

        func Get() int { return 1 }
    - path: sample_test.go
      body: |
        package sample

        import "testing"

        func TestGet(t *testing.T) {
        	if got := Get(); got != 1 {
        		t.Fatalf("got %d want 1", got)
        	}
        }
  - name: visible-target-rust
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |
        pub fn get() -> i32 {
            1
        }

        #[test]
        fn gets_one() {
            assert_eq!(get(), 1);
        }
