# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/owner-test
  uid: b503cb4a-f138-4e9f-8c4a-6a645b6e408f
  labels:
    lighthouse/pack: testing
    lighthouse/section: organization
  annotations:
    lighthouse/was-builtin: testing/owner-test
spec:
  title: Every public symbol has an owner test
  context: >-
    A contract without an owner test has no place to read or extend its
    specification.

    Go: The owner of a function or type is `TestName`, of a method
    `TestType_Method`. A symbol that no test names and no test code calls
    or references is reported; a type counts as tested when one of its
    members is. Only modules that have tests are judged. Types without
    methods and interfaces are not required to have one.

    Rust: The owner of a function or type is the test named after it in
    snake case (`get`, `store`), of a method `type_method`. A public item
    that no test code, in `tests/` or inline, calls or references is
    reported, in crates that have tests. The integration tests of a crate
    count for every module of it, including public items that the crate
    root re-exports from private modules, and a method call on a value of
    unknown type counts for the public methods of that name. Methods of
    trait impls and types without methods are not required to have one.
  scope:
    domain: code
    subject: test
  requirement: >-
    Each public symbol SHOULD have one top-level test function, and exported
    contracts MUST have an owning test.
  severity: warn
  options:
    type: object
    properties:
      testPrefix:
        type: string
        default: Test
        description: "Prefix of the name of an owner test; a test without it is not one."
      snakeCase:
        type: boolean
        default: false
        description: "Compare names in snake case, as Rust tests are written."
      variantTests:
        type: boolean
        default: true
        description: >-
          Count `TestGet_Missing` as a second owner of `Get`; a name that adds a
          suffix to the symbol's own name restates the same contract.
      ancestorTests:
        type: boolean
        default: false
        description: >-
          Count the tests of a module that tests an ancestor module as tests of
          the nested module too: the integration tests of a Rust crate test all
          of it, private modules whose items the root re-exports included.
      kinds:
        type: array
        default: [function, method, type]
        description: >-
          Kinds of public symbols that need an owner test. Interfaces are tested
          through their implementations and are left out by default.
      includeInternal:
        type: boolean
        default: false
        description: Also require owner tests for symbols public only inside the project.
      includeDataTypes:
        type: boolean
        default: false
        description: >-
          Also require owner tests for types that declare no method; such a type
          is specified by the functions that build and read it.
      exemptMethods:
        type: array
        default: [String, Error, Unwrap, GoString]
        description: Method names that implement well-known interfaces.
    additionalProperties: false
  languages:
    go:
      options:
        includeInternal: true
    rust:
      options:
        testPrefix: ""
        snakeCase: true
        variantTests: false
        ancestorTests: true
        exemptMethods:
          - fmt
          - source
          - from
          - try_from
          - from_str
          - default
          - drop
          - clone
          - eq
          - ne
          - partial_cmp
          - cmp
          - hash
          - deref
          - deref_mut
          - as_ref
          - as_mut
          - borrow
          - next
          - into_iter
          - index
          - index_mut
          - serialize
          - deserialize
  check:
    type: cel
    select: symbol
    with:
      - name: owner
        expr: owner(symbol)
    where: >-
      (symbol.kind == 'method'
          ? (owner.kind == 'type' && exposed(owner, options.includeInternal))
          : owner.kind == '')
      && !symbol.implements_trait
      && (options.includeDataTypes || !symbol.data_only)
      && exposed(symbol, options.includeInternal)
      && options.kinds.exists(k, k == symbol.kind)
      && !(symbol.kind == 'method' && options.exemptMethods.exists(m, m == symbol.name))
      && symbol.module_tested
      && size(tests(symbol)) == 0 && !symbol.touched_by_tests
    message: "public {{ symbol.kind }} {{ symbol.name }} has no owner test; add one top-level test for it"
    evidence:
      symbol: symbol.id
    identity:
      subject: symbol.id
  examples:
    - name: invalid
      language: go
      kind: invalid
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store.go
          body: |-
            package store

            func Get() int { return 1 }

            func Put() int { return 2 }
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc TestGet(t *testing.T) {\n\tif store.Get() != 1 {\n\t\tt.Fatal(\"get\")\n\t}\n}"
      expect:
        - line: 5
    - name: valid
      language: go
      kind: valid
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store.go
          body: |-
            package store

            func Get() int { return 1 }

            func Put() int { return 2 }
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc TestGet(t *testing.T) {\n\tif store.Get() != 1 {\n\t\tt.Fatal(\"get\")\n\t}\n}\n\nfunc TestPutFlow(t *testing.T) {\n\tif store.Put() != 2 {\n\t\tt.Fatal(\"put\")\n\t}\n}"
    - name: no-tests-at-all
      language: go
      kind: valid
      canonical: true
      files:
        - path: store.go
          body: |-
            package store

            func Get() int { return 1 }
    - name: rust-invalid
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub fn get() -> u8 {
                1
            }

            pub fn put() -> u8 {
                2
            }
        - path: tests/store.rs
          body: |-
            #[test]
            fn get() {
                assert_eq!(workspace::get(), 1);
            }
      expect:
        - line: 5
    - name: rust-valid
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            pub fn get() -> u8 {
                1
            }
        - path: tests/store.rs
          body: |-
            #[test]
            fn get() {
                assert_eq!(workspace::get(), 1);
            }
    - name: rust-submodule-invalid
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            mod shapes;

            pub use shapes::{area, perimeter};
        - path: src/shapes.rs
          body: |-
            pub fn area() -> u8 {
                1
            }

            pub fn perimeter() -> u8 {
                4
            }
        - path: tests/shapes.rs
          body: |-
            #[test]
            fn area() {
                assert_eq!(workspace::area(), 1);
            }
      expect:
        - line: 5
    - name: rust-reexport-from-private-module
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            mod shapes;

            pub use shapes::area;
        - path: src/shapes.rs
          body: |-
            pub fn area() -> u8 {
                1
            }
        - path: tests/shapes.rs
          body: |-
            #[test]
            fn area() {
                assert_eq!(workspace::area(), 1);
            }
    - name: rust-method-on-unknown-receiver
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub struct Registry;

            impl Registry {
                pub fn register(&self) {}
            }

            pub fn get() -> u8 {
                1
            }
        - path: tests/registry.rs
          body: |-
            #[test]
            fn get() {
                assert_eq!(workspace::get(), 1);
                let registry = unknown::build();
                registry.register();
            }
