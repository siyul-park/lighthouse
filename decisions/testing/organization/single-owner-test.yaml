# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/single-owner-test
  labels:
    lighthouse/pack: testing
    lighthouse/section: organization
  annotations:
    lighthouse/was-builtin: testing/single-owner-test
spec:
  title: One owner test per public symbol
  intent: >-
    Several semantic owners split one contract across places and let them
    contradict.
  scope:
    domain: code
    subject: test
  requirement: A public symbol MUST NOT have multiple semantic owner test functions.
  severity: error
  evidence: [symbol, owner_tests]
  options:
    type: object
    properties:
      test_prefix:
        type: string
        default: Test
        description: "Prefix of the name of an owner test; a test without it is not one."
      snake_case:
        type: boolean
        default: false
        description: "Compare names in snake case, as Rust tests are written."
      variant_tests:
        type: boolean
        default: true
        description: >-
          Count `TestGet_Missing` as a second owner of `Get`; a name that adds a
          suffix to the symbol's own name restates the same contract.
    additionalProperties: false
  languages:
    go:
      tuning: >-
        `TestGet` and `TestGet_Missing` both own `Get`: the second is a case of
        the first, written with `t.Run`. A name matches the longest symbol it
        starts with, so `TestStore_Get_Missing` belongs to the method `Get`, not
        to the type `Store`.
    rust:
      options:
        test_prefix: ""
        snake_case: true
        variant_tests: false
      tuning: >-
        A test is an owner of the item it is named after in snake case. Rust
        tests are many small functions, so names that merely extend a symbol's
        name are not owners; two tests with exactly the name of one item (in
        different test crates, or inline and in `tests/`) are.
  check:
    type: cel
    select: symbol
    with:
      - name: owners
        expr: tests(symbol)
    where: >-
      !symbol.file_test && !symbol.generated && !symbol.test
      && symbol.visibility == 'public'
      && (symbol.kind == 'function' || symbol.kind == 'method'
          || symbol.kind == 'type' || symbol.kind == 'interface')
      && size(owners) >= 2
    message: >-
      public {{ symbol.kind }} {{ symbol.name }} has {{ size(owners) }} owner tests;
      keep one top-level test and make the rest cases of it
    evidence:
      symbol: symbol.id
      owner_tests: owners.map(t, t.symbol)
    identity:
      subject: symbol.id
  examples:
    - name: invalid
      language: go
      kind: invalid
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store.go
          body: |-
            package store

            func Get() int { return 1 }
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc TestGet(t *testing.T) {\n\tif store.Get() != 1 {\n\t\tt.Fatal(\"get\")\n\t}\n}\n\nfunc TestGet_Missing(t *testing.T) {\n\tif store.Get() != 1 {\n\t\tt.Fatal(\"missing\")\n\t}\n}"
      expect:
        - line: 3
    - name: valid
      language: go
      kind: valid
      canonical: true
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store.go
          body: |-
            package store

            type Store struct{}

            func (s *Store) Get() int { return 1 }
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc TestStore(t *testing.T) {\n\ts := &store.Store{}\n\t_ = s\n}\n\nfunc TestStore_Get(t *testing.T) {\n\ts := &store.Store{}\n\tif s.Get() != 1 {\n\t\tt.Fatal(\"get\")\n\t}\n}"
    - name: rust-invalid
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub fn get() -> u8 {
                1
            }
        - path: tests/first.rs
          body: |-
            #[test]
            fn get() {
                assert_eq!(workspace::get(), 1);
            }
        - path: tests/second.rs
          body: |-
            #[test]
            fn get() {
                assert_eq!(workspace::get(), 1);
            }
      expect:
        - line: 1
    - name: rust-valid
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            pub fn get() -> u8 {
                1
            }
        - path: tests/store.rs
          body: |-
            #[test]
            fn get() {
                assert_eq!(workspace::get(), 1);
            }

            #[test]
            fn get_is_stable() {
                assert_eq!(workspace::get(), workspace::get());
            }
