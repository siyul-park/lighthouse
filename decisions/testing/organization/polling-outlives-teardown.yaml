# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/polling-outlives-teardown
  labels:
    lighthouse/pack: testing
    lighthouse/section: organization
  annotations:
    lighthouse/was-enforcement: mechanical
spec:
  title: Polling does not outlive teardown
  context: >-
    Polling that continues after teardown races with released resources.
  scope:
    domain: code
    subject: test
    tests: only
  requirement: >-
    Readiness polling MUST NOT outlive teardown or retain resources after the
    case closes them.
  severity: warn
  check:
    type: model
