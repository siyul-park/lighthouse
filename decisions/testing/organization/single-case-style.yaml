# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/single-case-style
  uid: 59ccf46d-aa0d-4192-be00-7eeb78b7d29b
  labels:
    lighthouse/pack: testing
    lighthouse/section: organization
spec:
  title: One case style and one writing style
  context: >-
    Table and scenario cases answer different questions and mixed styles
    force readers to relearn the test at every step.
  scope:
    domain: code
    subject: test
    tests: only
  requirement: >-
    A test function MUST use either table cases or scenario cases, never both,
    and SHOULD use one case style per level. Tests MUST NOT mix different
    writing styles or abstraction levels at one level.
  severity: warn
  check:
    type: model
