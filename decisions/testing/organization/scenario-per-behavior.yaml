# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/scenario-per-behavior
  labels:
    lighthouse/pack: testing
    lighthouse/section: organization
spec:
  title: One case per scenario
  intent: Different scenarios are different specifications and need different names.
  scope:
    domain: code
    subject: test
  requirement: >-
    Different scenarios MUST use one case per scenario, named for the behavior
    it states.
  severity: info
  check:
    type: model
