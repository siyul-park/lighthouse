# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/coverage
  uid: 73b63cd4-d32a-4e62-9b41-9c5b72867db7
  labels:
    lighthouse/pack: testing
    lighthouse/section: evidence
spec:
  title: Every contract dimension has evidence from the right layer
  context: >-
    Untested failure and boundary behavior is unspecified behavior. Different
    test layers prove different facts; evidence is complete only when each
    required fact has an appropriate proof. Coverage proves reachability, not
    quality or completeness. Judged: the requirement and the examples are the
    question put to a model for every test.
  scope:
    domain: code
    subject: test
    tests: only
  requirement: >-
    Tests MUST cover applicable success, failure, boundaries, ownership and
    lifecycle, compatibility, parity, and architecture contracts. Each
    required fact MUST be proven by the layer that owns it, and the lowest test
    layer that proves the contract MUST be used. Architecture-specific
    contracts MUST have architecture-specific evidence. Parity MUST be tested
    wherever multiple execution paths are required to implement the same public
    contract. Golden tests MUST define expected low-level output independently
    of the implementation that produced it. Coverage proves reachability, not
    quality or completeness; when no red phase is available, coverage SHOULD
    prove execution without changing production behavior to manufacture
    failure. Structure-only tests MUST NOT be added merely to exercise
    implementation details.
  severity: info
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), T1 Insufficient Tests
    - Martin, Clean Code (2008), T5 Test Boundary Conditions
