# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/reliability
  uid: cc6c495d-7112-4b74-918f-3ae0237ca7d4
spec:
  title: Tests are reliable evidence
  context: >-
    Order-dependent, manual, slow or timing-dependent tests fail
    intermittently and stop being evidence (Martin, Clean Code ch. 9:
    F.I.R.S.T.; van Deursen et al. 2001; Peruma et al., tsDetect 2020).
    Judged: the requirement and the examples are the question put to a model
    for every test.
  scope:
    subject: test
    tests: only
  requirement: >-
    Tests MUST be Fast, Independent, Repeatable, Self-validating, and Timely.
    Tests MUST NOT depend on other tests, uncontrolled mutable state, manual
    inspection, or unnecessary setup. Readiness polling MUST NOT outlive
    teardown or retain resources after the case closes them. Polling
    conditions MUST return readiness and observed results or errors only;
    assertions belong after readiness is established.
  severity: warn
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - van Deursen et al. 2001; Peruma et al., tsDetect 2020
    - Martin, Clean Code (2008), ch. 9 F.I.R.S.T.
    - Martin, Clean Code (2008), T9 Tests Should Be Fast
