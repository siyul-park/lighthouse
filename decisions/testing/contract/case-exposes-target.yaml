# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/case-exposes-target
  labels:
    lighthouse/pack: testing
    lighthouse/section: contract
spec:
  title: A case exposes its target
  intent: "A reader should see what is called, with what, and what is expected."
  scope:
    domain: code
    subject: test
  requirement: >-
    A test MUST expose the target, input, operation, and expected result in the
    case; the target and its behavior MUST remain visible.
  enforcement: judgment
