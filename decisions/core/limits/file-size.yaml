# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: core/file-size
  uid: e6ca5b54-89c2-4528-b9a1-8db7d6de564b
  labels:
    lighthouse/pack: core
    lighthouse/section: limits
spec:
  title: Files stay small and cohesive
  context: >-
    Large files tend to mix responsibilities, and splitting by size alone
    creates arbitrary boundaries. The count is the file's lines (revive
    `file-length-limit`), reported once per file with the kind `lines`.

    Kind `width` (off by default and on in the strict preset): a line wider
    than `maxWidth` columns, counted in characters with a tab as one (ESLint
    `max-len`, Checkstyle `LineLength`). A comment that is one URL, a single
    string literal and an import line cannot be wrapped and are not counted.
    A file reports once, with the kind that matched first.
  scope:
    domain: code
    subject: file
    generated: true
    tests: include
  requirement: >-
    A file SHOULD stay at or below the configured line limit (option `max`). A
    file that is over the limit MUST be split along cohesion boundaries, not by
    size alone. A line that can be wrapped SHOULD NOT be wider than the
    configured number of columns (option `maxWidth`).
  severity: warn
  options:
    type: object
    properties:
      kinds:
        type: array
        items: { type: string, enum: [lines, width] }
        default: [lines]
        description: What to report.
      max:
        type: integer
        default: 1000
        description: Largest number of lines a file may have.
      maxWidth:
        type: integer
        default: 120
        description: Widest a line may be, in characters.
    additionalProperties: false
  check:
    type: cel
    with:
      - name: wide
        expr: >-
          'width' in options.kinds
          ? file.line_widths.filter(l, l.width > options.maxWidth && !l.exempt)
          : []
      - name: matched
        expr: >-
          ('lines' in options.kinds && file.lines > options.max ? ['lines'] : [])
          + (size(wide) > 0 ? ['width'] : [])
    where: size(matched) > 0
    message: >-
      {{ size(matched) == 0 ? ''
         : matched[0] == 'lines'
         ? 'file has ' + string(file.lines) + ' lines, limit is ' + string(options.max)
         : string(size(wide)) + ' lines are wider than ' + string(options.maxWidth)
           + ' columns (first: line ' + string(wide[0].line) + ')' }}
    evidence:
      kind: "size(matched) > 0 ? matched[0] : ''"
      kinds: matched
      lines: file.lines
      max: options.max
    at:
      line: "size(matched) > 0 && matched[0] == 'width' ? wide[0].line : options.max + 1"
      endLine: "size(matched) > 0 && matched[0] == 'width' ? wide[0].line : file.lines"
    identity:
      subject: file.path
  provenance:
    wasDerivedFrom:
    - 'revive file-length-limit: https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#file-length-limit'
    - Martin, Clean Code (2008), ch. 5 Vertical size and ordering
    - Martin, Clean Code (2008), ch. 5 Horizontal size
    - 'ESLint max-len: https://eslint.org/docs/latest/rules/max-len'
  examples:
  - name: over-limit
    language: text
    kind: invalid
    options:
      max: 2
    files:
    - path: big.txt
      body: |-
        a
        b
        c
    expect:
    - line: 3
  - name: within-limit
    language: text
    kind: valid
    options:
      max: 2
    files:
    - path: small.txt
      body: |-
        a
        b
  - name: wide-line
    language: text
    kind: invalid
    options:
      kinds: [width]
      maxWidth: 10
    files:
    - path: wide.txt
      body: |-
        short
        a line that is far too wide
    expect:
    - line: 2
  - name: wide-exempt
    language: text
    kind: valid
    options:
      kinds: [width]
      maxWidth: 10
    files:
    - path: exempt.txt
      body: |-
        short
        // https://example.com/a/very/long/address
        "a single string literal that cannot wrap",
        import some.very.long.module.path
