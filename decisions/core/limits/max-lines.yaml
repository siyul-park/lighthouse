# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: core/max-lines
  uid: e6ca5b54-89c2-4528-b9a1-8db7d6de564b
spec:
  title: Files stay small and cohesive
  context: >-
    Large files tend to mix responsibilities, and splitting by size alone
    creates arbitrary boundaries. The remedy is simpler code or a concept
    that is reused, never the same code moved elsewhere. A file over the limit is
    made simpler, or split along a boundary whose halves are used apart, never by
    size alone or by moving code to a file that remains tied to the first. A half moved to
    another file that stays tied to the first through private items is not a
    boundary (Ousterhout, A Philosophy of Software Design chs. 4 and 9;
    Fowler, Refactoring 2nd ed.: Inline Function, Lazy Element, Middle Man).
  scope:
    subject: file
    generated: true
    tests: include
  requirement: >-
    A file SHOULD stay at or below the configured line limit (option `max`).
  severity: warn
  options:
    properties:
      max:
        type: integer
        default: 1000
        description: Largest number of lines a file may have.
    additionalProperties: false
  check:
    type: cel
    where: file.lines > options.max
    message: "file has {{ file.lines }} lines, limit is {{ options.max }}"
    evidence:
      kind: "'lines'"
      lines: file.lines
      max: options.max
    at:
      line: options.max + 1
      endLine: file.lines
    identity:
      subject: file.path
  provenance:
    wasDerivedFrom:
    - 'revive file-length-limit: https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#file-length-limit'
    - Martin, Clean Code (2008), ch. 5 Vertical size and ordering
    - Ousterhout, A Philosophy of Software Design (2018), chs. 4 and 9
    - Fowler, Refactoring (2nd ed., 2018), Inline Function, Lazy Element, Middle Man
  examples:
  - name: over-limit
    language: text
    kind: invalid
    options: { max: 2 }
    files:
    - path: big.txt
      body: |-
        a
        b
        c
    expect: [{ line: 3 }]
  - name: within-limit
    language: text
    kind: valid
    canonical: true
    options: { max: 2 }
    files:
    - path: small.txt
      body: |-
        a
        b
