# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: core/formatted
  uid: 826aab0e-2462-44af-b11d-94def41ae66b
spec:
  title: A file is as its formatter writes it
  context: >-
    Vertical and horizontal openness, indentation and the placement of braces
    are team rules, and a team keeps them by letting one tool decide, not by
    reviewing them (Martin, Clean Code ch. 5 Team rules). The check runs the
    formatter the project configures for the language of the file
    (`[languages.<id>] formatter`) and compares the result with the file: one
    finding per file, at the first line that differs, whose evidence names the
    formatter (`formatter`) and the line (`line`). A language with no
    formatter is not judged. A formatter that fails, times out or prints more
    than it may leaves the analysis incomplete, never clean, and runs only in
    a trusted project.
  scope:
    subject: file
    generated: false
    tests: include
  requirement: >-
    A file MUST equal the output of the formatter configured for its language.
  severity: warn
  check:
    type: builtin
    id: core/formatted
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G24 Follow Standard Conventions
    - Martin, Clean Code (2008), ch. 5 Vertical openness and density
    - Martin, Clean Code (2008), ch. 5 Horizontal openness and indentation
    - Martin, Clean Code (2008), ch. 5 Team rules
    - 'gofmt: https://pkg.go.dev/cmd/gofmt'
    - 'rustfmt: https://rust-lang.github.io/rustfmt/'
  examples:
  - name: go-unformatted
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |
        package sample

        func  Run( ) int {return 1}
    expect:
    - line: 3
  - name: go-formatted
    language: go
    kind: valid
    canonical: true
    files:
    - path: example.go
      body: |
        package sample

        func Run() int { return 1 }
  - name: rust-unformatted
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |
        pub fn run()->i32{1}
    expect:
    - line: 1
  - name: rust-formatted
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |
        pub fn run() -> i32 {
            1
        }
