# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: core/allow-reason
  uid: cd28a077-d029-4c54-b691-6ede8c9c6c9c
  labels:
    lighthouse/pack: core
    lighthouse/section: annotations
  annotations:
    lighthouse/was-builtin: core/annotation-reason
    lighthouse/was-names: core/annotation-reason
spec:
  title: An allow annotation states its reason
  context: >-
    An exception without a reason cannot be reviewed or revisited.
  scope:
    domain: code
    subject: file
    generated: true
    tests: include
  requirement: >-
    An allow annotation MUST give a reason after `--`; an annotation without one
    is ignored and reported.
  severity: error
  check:
    type: builtin
    id: core/allow-reason
  examples:
    - name: go-missing-reason
      language: go
      kind: invalid
      files:
        - path: example.go
          body: |-
            package sample

            // lighthouse:allow design/exported-doc
            func Open() {}
      expect:
        - line: 3
    - name: go-with-reason
      language: go
      kind: valid
      canonical: true
      files:
        - path: example.go
          body: |-
            package sample

            // lighthouse:allow design/exported-doc -- generated shim
            func Open() {}
    - name: rust-missing-reason
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            // lighthouse:allow design/exported-doc
            pub fn open() {}
      expect:
        - line: 1
    - name: rust-with-reason
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            // lighthouse:allow design/exported-doc -- re-exported shim
            pub fn open() {}
    - name: rust-disable-missing-reason
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            // lighthouse-disable design/exported-doc
            pub fn open() {}
      expect:
        - line: 1
    - name: rust-disable-line-missing-reason
      language: rust
      kind: invalid
      files:
        - path: src/lib.rs
          body: |-
            pub fn open() {} // lighthouse-disable-line design/exported-doc
      expect:
        - line: 1
    - name: rust-disable-next-line-with-reason
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            // lighthouse-disable-next-line design/exported-doc -- re-exported shim
            pub fn open() {}
