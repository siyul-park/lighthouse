# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: core/no-unused-allow
  uid: e4844ffb-3e36-43c0-96fd-1c75662969bb
spec:
  title: Allow annotations suppress something
  context: >-
    An exception that no longer applies is noise that hides the next real
    one. A `lighthouse-disable` range that covers no finding is as stale as a
    single directive, and so is a `lighthouse-enable` that closes no range, or
    a directive that names no decision (there is no form without ids).
  scope:
    subject: file
    generated: true
    tests: include
  requirement: >-
    An allow annotation SHOULD suppress a finding; one whose rule no longer
    fires there, or is not enabled, SHOULD be removed.
  severity: warn
  check:
    type: cel
    select: annotation
    variables:
      - name: said
        expression: >-
          annotation.rules.size() == 0
            ? '`' + annotation.marker + '` names no decision; there is no form without ids, name the decisions it is for'
            : annotation.form == 'enable'
              ? '`' + annotation.marker + ' ' + annotation.rule + '` has no matching `lighthouse-disable`; remove it'
              : '`' + annotation.marker + ' ' + annotation.rule + '` suppresses nothing ' +
                (annotation.range ? 'in its range' : 'here') + '; remove it'
    # A directive that names no rule, an `enable` that ends no range, or a
    # claim whose rule could have fired and that suppressed nothing.
    where: >-
      annotation.rules.size() == 0 ||
      (annotation.form == 'enable'
        ? !annotation.closes
        : annotation.reason != null && annotation.settled && !annotation.used)
    message: "{{ said }}"
    evidence:
      rules: annotation.rules
      reason: annotation.reason
      annotation: annotation.ruleExtent
  fix:
    safety: unsafe
    type: cel
    edits: "[remove(finding.evidence.annotation)]"
  provenance:
    wasDerivedFrom:
      - "Martin, Clean Code (2008), G4 Overridden Safeties"
      - "Martin, Clean Code (2008), G12 Clutter"
  examples:
    - name: go-stale-allow
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            func open() {}
      files:
        - path: example.go
          body: |-
            package sample

            // lighthouse-disable-next-line design/exported-doc -- stale
            func open() {}
      expect:
        - line: 3
    - name: go-plain-comment
      language: go
      kind: valid
      canonical: true
      files:
        - path: example.go
          body: |-
            package sample

            // open is not exported.
            func open() {}
    - name: rust-stale-allow
      language: rust
      kind: invalid
      fixed:
        - path: src/lib.rs
          body: "fn open() {}"
      files:
        - path: src/lib.rs
          body: |-
            // lighthouse-disable-next-line design/exported-doc -- stale
            fn open() {}
      expect:
        - line: 1
    - name: rust-plain-comment
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            // open is not exported.
            fn open() {}
    - name: rust-stale-range
      language: rust
      kind: invalid
      fixed:
        - path: src/lib.rs
          body: |-
            /// Documented.
            pub fn open() {}
      files:
        - path: src/lib.rs
          body: |-
            // lighthouse-disable design/exported-doc -- stale
            /// Documented.
            pub fn open() {}
      expect:
        - line: 1
    - name: rust-unmatched-enable
      language: rust
      kind: invalid
      fixed:
        - path: src/lib.rs
          body: "fn open() {}"
      files:
        - path: src/lib.rs
          body: |-
            // lighthouse-enable design/exported-doc
            fn open() {}
      expect:
        - line: 1
