# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: core/allow-annotation
  uid: 0adcde0d-4016-47d7-be24-2c9829955f43
  labels:
    lighthouse/pack: core
    lighthouse/section: annotations
spec:
  title: Allow a finding in source
  context: >-
    A decision to accept a finding belongs next to the code it is about,
    where a reviewer sees it change.

    The forms are ESLint's directives, with ESLint's `--` before the
    description, which is required here on every form that disables, and
    there is no form without ids. `lighthouse-disable-next-line <id>[, <id>]
    -- <reason>` covers the next line and the symbol declared there (the
    requirement's `lighthouse:allow` is its alias), `lighthouse-disable-line
    <id> -- <reason>` its own line, and `lighthouse-disable <id> -- <reason>`
    everything from the comment to a matching `lighthouse-enable <id>` or to
    the end of the file (the whole file above the first line that is neither
    blank nor a comment; imports are code).


    ` -- ` separates the ids from the reason, as in ESLint, and ids are
    separated by commas: `lighthouse-disable a/b, c/d -- why`. A documentation
    comment (`///`, `//!`, `/** */`) never holds a directive. A directive
    still written with an id a decision was renamed from works, with a
    notice, until `spec migrate` rewrites it.
  scope:
    domain: code
    subject: symbol
  requirement: >-
    A finding that is right to leave in place MAY be allowed by a comment on the
    symbol, the line before it or the same line, written `lighthouse:allow
    <rule>[, <rule>] -- <reason>`. The comment suppresses the named rules there,
    whatever their severity, and the reason is required. Allowed findings are
    counted in the report.
  examples:
    - name: go-allow
      language: go
      kind: valid
      files:
        - path: example.go
          body: |-
            package sample

            // lighthouse:allow design/exported-doc -- generated shim, documented in the generator
            func Open() {}
    - name: rust-allow
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            // lighthouse:allow design/exported-doc -- re-exported and documented at its origin
            pub fn open() {}
    - name: go-disable-range
      language: go
      kind: valid
      files:
        - path: example.go
          body: |-
            package sample

            // lighthouse-disable design/exported-doc -- generated shims, documented in the generator
            func Open() {}

            func Close() {}
            // lighthouse-enable design/exported-doc
    - name: rust-disable-line
      language: rust
      kind: valid
      files:
        - path: src/lib.rs
          body: |-
            pub fn open() {} // lighthouse-disable-line design/exported-doc -- re-exported and documented at its origin
