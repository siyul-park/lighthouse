# The configuration the baseline runs a Rust and Go workspace with: the strict
# preset of the design decisions. scripts/baseline.sh fills in @PLUGINS@.
apiVersion = "lighthouse/v1alpha1"
kind = "Project"
[metadata]
name = "lighthouse-strict"
[spec]
plugins = ["core","design","testing",
  { id = "lang-go", path = "@PLUGINS@/lang-go" },
  { id = "lang-rust", path = "@PLUGINS@/lang-rust" }]
extends = ["core/recommended","design/strict","testing/recommended"]
