select = "$.documents[*]?(@.kind == \"Decision\" && @.spec.check.type == \"cel\").spec.check.where"
language = "cel"
context = { declared = true, identity = { kind = "$.documents[*].kind", name = "$.documents[*].metadata.name" } }

