# The `sources` the repository declared before `core/authoring` shared them,
# in the shape of `injections`. The test beside it holds today's entries to the
# regions of these.

[[injections]]
id = "pack-variables"
files = ["**/decisions/**/*.yaml", "**/decisions/**/*.yml"]
select = "$.documents[*]?(@.kind == \"Pack\").spec.variables[*]"
language = "cel"
context = { identity = { kind = "$.documents[*].kind", name = "$.documents[*].metadata.name" }, variable = { value = "$.expression", name = "$.name", params = "$.params[*]", shared = true } }

[[injections]]
id = "decision-variables"
files = ["**/decisions/**/*.yaml", "**/decisions/**/*.yml", ".lighthouse/**/*.yaml", ".lighthouse/**/*.yml", "**/.lighthouse/**/*.yaml", "**/.lighthouse/**/*.yml"]
select = "$.documents[*]?(@.kind == \"Decision\" && @.spec.check.type == \"cel\").spec.check.variables[*]"
language = "cel"
context = { identity = { kind = "$.documents[*].kind", name = "$.documents[*].metadata.name" }, variable = { value = "$.expression", name = "$.name", params = "$.params[*]", shared = false } }

[[injections]]
