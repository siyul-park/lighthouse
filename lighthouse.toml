apiVersion = "lighthouse/v1alpha1"
kind = "Project"

[metadata]
name = "lighthouse"

[spec]
plugins = [
  { id = "lang-go", path = "target/plugins/lang-go" },
  { id = "lang-rust", path = "target/plugins/lang-rust" },
  { id = "lang-typescript", path = "target/plugins/lang-typescript" },
  { id = "lang-python", path = "target/plugins/lang-python" },
  { id = "lang-yaml", path = "target/plugins/lang-yaml" },
  { id = "lang-toml", path = "target/plugins/lang-toml" },
  { id = "lang-markdown", path = "target/plugins/lang-markdown" },
]
extends = ["core/authoring", "core/recommended", "design/recommended", "testing/recommended", "go/recommended", "rust/recommended", "markdown/recommended"]
injections = [
  { id = "markdown-code", files = ["**/*.md"], select = "$..?(@.kind == \"code_block\" && @.attributes[*] != \"ignore\" && @.attributes[*] != \"compile_fail\" && @.attributes[*] != \"invalid\")", languageFrom = "$.lang", context = { example = true, info = { select = "$.info" } } },
]


# Fixture projects of the plugin conformance suite: broken or incomplete on
# purpose, and checked against their goldens instead of by lint.
ignores = ["crates/lighthouse-rpc/tests/conformance/*/*/project/"]

[spec.generated]
# What `lighthouse docs generate` writes: edited in its generator.
files = ["docs/cli.md", "docs/mcp.md", "docs/decisions/**", "skills/lighthouse/SKILL.md"]

[spec.rules]
# Keep line width off in this repository; max-lines remains the default size check.
"core/max-len" = "off"
# Four words: visitor methods and field names from external formats are not ours to rename.
"design/max-name-words" = { level = "warn", options = { enabled = true, maxWords = 4 } }

# The workspace layers, top down: a crate imports crates of the layers below
# it and never a peer of its own layer. The crate labels of binaries carry
# their target (`lighthouse_cli[bin:lighthouse]`), so those globs end in `*`.
[spec.rules."design/layers"]
level = "error"
# The core never knows the code model: the modules of `lighthouse_model`
# other than `ucm`, the store, the ml crate, reports and sessions import
# nothing of `ucm`.
options.forbidden = [
  { from = "lighthouse_model/**", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_store/**", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_ml/**", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_report/**", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_session/**", to = "lighthouse_model/ucm/**" },
]
options.ignore = [
  { from = "lighthouse_model/ucm/**", to = "lighthouse_model/ucm/**", reason = "the code model is one module; its parts import each other" },
]
options.layers = [
  ["lighthouse_cli*/**", "lang_rust*/**"],
  ["lighthouse_session/**"],
  ["lighthouse_report/**", "lighthouse_store/**", "lighthouse_ml/**"],
  ["lighthouse_engine/**", "lighthouse_checks/**", "lighthouse_rpc/**"],
  ["lang_cel/**"],
  ["lighthouse_plugin/**", "lighthouse_spec/**"],
  ["lighthouse_model/**", "lighthouse_process/**", "lighthouse_graph/**"],
  ["lighthouse_protocol/**"],
  ["plugins/lang-go/cmd/**"],
  ["plugins/lang-go/provider/**"],
  ["plugins/lang-go/sdk/**"],
]

# Fixtures and their goldens describe code on purpose; they are not the
# project's own design.
[[spec.overrides]]
files = ["crates/lighthouse-rpc/tests/conformance/**"]
rules = { "core/max-lines" = "off", "design/complexity" = { level = "info", options = { kinds = ["lines", "statements", "cognitive", "nesting"] } }, "design/exported-doc" = "off", "design/no-unused-symbol" = "off", "design/no-redundant-symbol" = "off", "design/declaration-groups" = "off", "design/top-down-order" = "off", "design/vertical-distance" = "off", "design/no-noise-comment" = "off", "design/no-todo" = "off", "design/no-detached-comment" = "off", "design/no-redundant-qualifier" = "off", "design/max-name-words" = "off", "design/no-type-encoding" = "off", "design/no-mutable-globals" = "off", "design/context-first" = "off", "design/no-stored-context" = "off", "design/error-identity" = "off", "design/no-panic" = "off", "design/single-responsibility" = "off", "design/no-conjoined-modules" = "off", "design/coupling" = "off", "design/signature-size" = "off", "design/no-private-types" = "off", "design/prefer-method" = "off", "design/feature-envy" = "off", "testing/public-boundary" = "off", "testing/no-missing-owner" = "off", "testing/no-duplicate-owner" = "off" }

[[spec.overrides]]
files = ["docs/cli.md", "docs/decisions/**", "schema/**", "protocol/schema/**", "crates/*/tests/it/snapshots/**"]
rules = { "core/max-lines" = "off" }

[[spec.overrides]]
files = ["**/*.lock"]
rules = { "core/max-lines" = "off" }
