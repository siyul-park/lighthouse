apiVersion = "lighthouse/v1alpha1"
kind = "Project"

[metadata]
name = "lighthouse"

[spec]
plugins = [
  "core",
  "design",
  "testing",
  { id = "lang-go", path = "target/plugins/lang-go" },
  { id = "lang-rust", path = "target/plugins/lang-rust" },
]
extends = ["core/recommended", "design/recommended", "testing/recommended"]

# What `lighthouse check --fix` runs on a file it changed.
[spec.languages.go]
formatter = { argv = ["gofmt"], stdin = "file", output = "text" }

[spec.languages.rust]
formatter = { argv = ["rustfmt", "--edition", "2024", "--emit", "stdout"], stdin = "file", output = "text" }

[spec.rules]
"core/file-size" = { level = "warn", options = { max = 1000 } }
# Four words: the visitor methods of syn and the field names of SARIF are not ours to rename.
"design/naming" = { level = "warn", options = { kinds = ["qualifier", "words"], maxWords = 4 } }

# The workspace layers, top down: a crate imports crates of the layers below
# it and never a peer of its own layer. The crate labels of binaries carry
# their target (`lighthouse_cli[bin:lighthouse]`), so those globs end in `*`.
[spec.rules."design/layers"]
level = "warn"
# The core never knows the code model: the modules of `lighthouse_model` other
# than `ucm`, the store, the ml crate, reports and sessions import nothing of
# `ucm`. The core modules are listed because a glob cannot say "all but ucm".
options.forbidden = [
  { from = "lighthouse_model/annotation", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_model/clock", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_model/diagnostic", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_model/document", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_model/fix", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_model/model_ref", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_model/review", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_model/scope", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_model/text", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_model/vocabulary", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_store/**", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_ml/**", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_report/**", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_session/**", to = "lighthouse_model/ucm/**" },
]
options.layers = [
  ["lighthouse_cli*/**", "lang_rust*/**"],
  ["lighthouse_session/**"],
  ["lighthouse_report/**", "lighthouse_store/**", "lighthouse_ml/**"],
  ["lighthouse_engine/**", "lighthouse_checks/**", "lighthouse_rpc/**"],
  ["lighthouse_plugin/**", "lighthouse_spec/**"],
  ["lighthouse_model/**", "lighthouse_resource/**", "lighthouse_process/**"],
  ["lighthouse_protocol/**"],
  ["plugins/lang-go/cmd/**"],
  ["plugins/lang-go/provider/**"],
  ["plugins/lang-go/sdk/**"],
]

# Fixtures and their goldens describe code on purpose; they are not the
# project's own design.
[[spec.overrides]]
files = ["crates/lighthouse-rpc/tests/conformance/**"]
rules = { "core/file-size" = "off", "design/complexity" = { level = "warn", options = { kinds = ["lines", "statements", "cognitive", "nesting"] } }, "design/exported-doc" = "off", "design/symbols" = "off", "design/declaration-groups" = "off", "design/layout" = "off", "design/comments" = "off", "design/naming" = "off", "design/ownership" = "off", "testing/public-boundary" = "off", "testing/owner" = "off" }

[[spec.overrides]]
files = ["docs/cli.md", "docs/decisions/**", "schema/**", "protocol/schema/**", "crates/*/tests/it/snapshots/**"]
rules = { "core/file-size" = "off" }

[[spec.overrides]]
files = ["**/*.lock"]
rules = { "core/file-size" = "off" }
