plugins = [
  "core",
  "design",
  "testing",
  { id = "lang-go", path = "target/plugins/lang-go" },
  { id = "lang-rust", path = "target/plugins/lang-rust" },
]
extends = ["core/recommended", "design/recommended", "testing/recommended"]

[rules]
"core/max-file-lines" = { level = "warn", max = 1000 }

# Fixtures and their goldens describe code on purpose; they are not the
# project's own design.
[[overrides]]
files = ["plugins/conformance/**"]
rules = { "core/max-file-lines" = "off", "design/complexity-signal" = "off", "design/coupling-signal" = "off", "design/exported-doc" = "off", "design/single-use-wrapper" = "off", "design/declaration-groups" = "off", "design/related-symbols-close" = "off", "design/callers-before-callees" = "off", "design/private-helper-callers" = "off", "design/section-banners" = "off", "design/no-redundant-qualifiers" = "off", "design/no-exported-mutable-global" = "off", "testing/external-test-package" = "off", "testing/owner-test" = "off", "testing/single-owner-test" = "off" }

[[overrides]]
files = ["docs/patterns/**"]
rules = { "core/max-file-lines" = "off" }

[[overrides]]
files = ["**/*.lock"]
rules = { "core/max-file-lines" = "off" }
