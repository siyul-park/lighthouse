apiVersion = "lighthouse/v1alpha1"
kind = "Project"

[metadata]
name = "lighthouse"

[spec]
plugins = [
  "core",
  "design",
  "testing",
  "lang-cel",
  "go",
  "rust",
  "markdown",
  { id = "lang-go", path = "target/plugins/lang-go" },
  { id = "lang-rust", path = "target/plugins/lang-rust" },
  { id = "lang-yaml", path = "target/plugins/lang-yaml" },
  { id = "lang-toml", path = "target/plugins/lang-toml" },
  { id = "lang-markdown", path = "target/plugins/lang-markdown" },
]
extends = ["core/recommended", "design/recommended", "testing/recommended", "go/recommended", "rust/recommended", "markdown/recommended"]
sources = [
  { id = "pack-variables", files = ["decisions/**/*.yaml", "decisions/**/*.yml"], select = "$.documents[*]?(@.kind == \"Pack\").spec.variables[*]", language = { provider = "cel", context = { identity = { kind = "$.documents[*].kind", name = "$.documents[*].metadata.name" }, variable = { value = "$.expression", name = "$.name", params = "$.params[*]", shared = true } } } },
  { id = "decision-variables", files = ["decisions/**/*.yaml", "decisions/**/*.yml", ".lighthouse/**/*.yaml", ".lighthouse/**/*.yml", "**/.lighthouse/**/*.yaml", "**/.lighthouse/**/*.yml"], select = "$.documents[*]?(@.kind == \"Decision\" && @.spec.check.type == \"cel\").spec.check.variables[*]", language = { provider = "cel", context = { identity = { kind = "$.documents[*].kind", name = "$.documents[*].metadata.name" }, variable = { value = "$.expression", name = "$.name", params = "$.params[*]", shared = false } } } },
  { id = "decision-where", files = ["decisions/**/*.yaml", "decisions/**/*.yml", ".lighthouse/**/*.yaml", ".lighthouse/**/*.yml", "**/.lighthouse/**/*.yaml", "**/.lighthouse/**/*.yml"], select = "$.documents[*]?(@.kind == \"Decision\" && @.spec.check.type == \"cel\").spec.check.where", language = { provider = "cel", context = { declared = true, identity = { kind = "$.documents[*].kind", name = "$.documents[*].metadata.name" } } } },
  { id = "decision-abstain", files = ["decisions/**/*.yaml", "decisions/**/*.yml", ".lighthouse/**/*.yaml", ".lighthouse/**/*.yml", "**/.lighthouse/**/*.yaml", "**/.lighthouse/**/*.yml"], select = "$.documents[*]?(@.kind == \"Decision\" && @.spec.check.type == \"cel\").spec.check.abstain", language = { provider = "cel", context = { declared = true, identity = { kind = "$.documents[*].kind", name = "$.documents[*].metadata.name" } } } },
  { id = "decision-evidence", files = ["decisions/**/*.yaml", "decisions/**/*.yml", ".lighthouse/**/*.yaml", ".lighthouse/**/*.yml", "**/.lighthouse/**/*.yaml", "**/.lighthouse/**/*.yml"], select = "$.documents[*]?(@.kind == \"Decision\" && @.spec.check.type == \"cel\").spec.check.evidence.*", language = { provider = "cel", context = { declared = true, identity = { kind = "$.documents[*].kind", name = "$.documents[*].metadata.name" } } } },
  { id = "decision-identity", files = ["decisions/**/*.yaml", "decisions/**/*.yml", ".lighthouse/**/*.yaml", ".lighthouse/**/*.yml", "**/.lighthouse/**/*.yaml", "**/.lighthouse/**/*.yml"], select = "$.documents[*]?(@.kind == \"Decision\" && @.spec.check.type == \"cel\").spec.check.identity.*", language = { provider = "cel", context = { declared = true, identity = { kind = "$.documents[*].kind", name = "$.documents[*].metadata.name" } } } },
  { id = "decision-at", files = ["decisions/**/*.yaml", "decisions/**/*.yml", ".lighthouse/**/*.yaml", ".lighthouse/**/*.yml", "**/.lighthouse/**/*.yaml", "**/.lighthouse/**/*.yml"], select = "$.documents[*]?(@.kind == \"Decision\" && @.spec.check.type == \"cel\").spec.check.at.*", language = { provider = "cel", context = { declared = true, identity = { kind = "$.documents[*].kind", name = "$.documents[*].metadata.name" } } } },
  { id = "decision-message", files = ["decisions/**/*.yaml", "decisions/**/*.yml", ".lighthouse/**/*.yaml", ".lighthouse/**/*.yml", "**/.lighthouse/**/*.yaml", "**/.lighthouse/**/*.yml"], select = "$.documents[*]?(@.kind == \"Decision\" && @.spec.check.type == \"cel\").spec.check.message", language = { provider = "cel", syntax = "template", context = { declared = true, identity = { kind = "$.documents[*].kind", name = "$.documents[*].metadata.name" } } } },
  { id = "decision-fix", files = ["decisions/**/*.yaml", "decisions/**/*.yml", ".lighthouse/**/*.yaml", ".lighthouse/**/*.yml", "**/.lighthouse/**/*.yaml", "**/.lighthouse/**/*.yml"], select = "$.documents[*]?(@.kind == \"Decision\" && @.spec.fix.type == \"cel\").spec.fix.edits", language = { provider = "cel", context = { declared = true, identity = { kind = "$.documents[*].kind", name = "$.documents[*].metadata.name" } } } },
  { id = "recipe-select", files = ["lighthouse.toml", "recipes/**/*.toml", ".lighthouse/**/*.toml", "**/.lighthouse/**/*.toml"], select = "$.models.providers.*.events.select", language = { provider = "cel" } },
  { id = "recipe-each", files = ["lighthouse.toml", "recipes/**/*.toml", ".lighthouse/**/*.toml", "**/.lighthouse/**/*.toml"], select = "$.models.providers.*.events.each", language = { provider = "cel" } },
  { id = "recipe-tool", files = ["lighthouse.toml", "recipes/**/*.toml", ".lighthouse/**/*.toml", "**/.lighthouse/**/*.toml"], select = "$.models.providers.*.events.tool", language = { provider = "cel" } },
  { id = "recipe-path", files = ["lighthouse.toml", "recipes/**/*.toml", ".lighthouse/**/*.toml", "**/.lighthouse/**/*.toml"], select = "$.models.providers.*.events.path", language = { provider = "cel" } },
  { id = "recipe-pattern", files = ["lighthouse.toml", "recipes/**/*.toml", ".lighthouse/**/*.toml", "**/.lighthouse/**/*.toml"], select = "$.models.providers.*.events.pattern", language = { provider = "cel" } },
  { id = "recipe-command", files = ["lighthouse.toml", "recipes/**/*.toml", ".lighthouse/**/*.toml", "**/.lighthouse/**/*.toml"], select = "$.models.providers.*.events.command", language = { provider = "cel" } },
  { id = "recipe-said", files = ["lighthouse.toml", "recipes/**/*.toml", ".lighthouse/**/*.toml", "**/.lighthouse/**/*.toml"], select = "$.models.providers.*.events.said", language = { provider = "cel" } },
  { id = "project-event-select", files = ["lighthouse.toml"], select = "$.spec.models.providers.*.events.select", language = { provider = "cel" } },
  { id = "project-event-each", files = ["lighthouse.toml"], select = "$.spec.models.providers.*.events.each", language = { provider = "cel" } },
  { id = "project-event-tool", files = ["lighthouse.toml"], select = "$.spec.models.providers.*.events.tool", language = { provider = "cel" } },
  { id = "project-event-path", files = ["lighthouse.toml"], select = "$.spec.models.providers.*.events.path", language = { provider = "cel" } },
  { id = "project-event-pattern", files = ["lighthouse.toml"], select = "$.spec.models.providers.*.events.pattern", language = { provider = "cel" } },
  { id = "project-event-command", files = ["lighthouse.toml"], select = "$.spec.models.providers.*.events.command", language = { provider = "cel" } },
  { id = "project-event-said", files = ["lighthouse.toml"], select = "$.spec.models.providers.*.events.said", language = { provider = "cel" } },
  { id = "markdown-code", files = ["**/*.md"], select = "$..?(@.kind == \"code_block\" && @.attributes[*] != \"ignore\" && @.attributes[*] != \"compile_fail\" && @.attributes[*] != \"invalid\")", language = { from = "$.lang", context = { example = true, info = { select = "$.info" } } } },
]


[spec.generated]
# What `lighthouse docs generate` writes: edited in its generator.
files = ["docs/cli.md", "docs/mcp.md", "docs/decisions/**", "skills/lighthouse/SKILL.md"]

[spec.rules]
"core/max-lines" = { level = "warn", options = { max = 1000 } }
# Keep line width off in this repository; max-lines remains the default size check.
"core/max-len" = "off"
# Four words: visitor methods and field names from external formats are not ours to rename.
"design/max-name-words" = { level = "warn", options = { enabled = true, maxWords = 4 } }

# The workspace layers, top down: a crate imports crates of the layers below
# it and never a peer of its own layer. The crate labels of binaries carry
# their target (`lighthouse_cli[bin:lighthouse]`), so those globs end in `*`.
[spec.rules."design/layers"]
level = "error"
# The core never knows the code model: the modules of `lighthouse_model`
# other than `ucm`, the store, the ml crate, reports and sessions import
# nothing of `ucm`.
options.forbidden = [
  { from = "lighthouse_model/**", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_store/**", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_ml/**", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_report/**", to = "lighthouse_model/ucm/**" },
  { from = "lighthouse_session/**", to = "lighthouse_model/ucm/**" },
]
options.ignore = [
  { from = "lighthouse_model/ucm/**", to = "lighthouse_model/ucm/**", reason = "the code model is one module; its parts import each other" },
]
options.layers = [
  ["lighthouse_cli*/**", "lang_rust*/**"],
  ["lighthouse_session/**"],
  ["lighthouse_report/**", "lighthouse_store/**", "lighthouse_ml/**"],
  ["lighthouse_engine/**", "lighthouse_checks/**", "lighthouse_rpc/**"],
  ["lighthouse_cel/**"],
  ["lighthouse_plugin/**", "lighthouse_spec/**"],
  ["lighthouse_model/**", "lighthouse_resource/**", "lighthouse_process/**"],
  ["lighthouse_protocol/**"],
  ["plugins/lang-go/cmd/**"],
  ["plugins/lang-go/provider/**"],
  ["plugins/lang-go/sdk/**"],
]

# Fixtures and their goldens describe code on purpose; they are not the
# project's own design.
[[spec.overrides]]
files = ["crates/lighthouse-rpc/tests/conformance/**"]
rules = { "core/max-lines" = "off", "design/complexity" = { level = "warn", options = { kinds = ["lines", "statements", "cognitive", "nesting"] } }, "design/exported-doc" = "off", "design/no-unused-symbol" = "off", "design/no-redundant-symbol" = "off", "design/declaration-groups" = "off", "design/top-down-order" = "off", "design/vertical-distance" = "off", "design/no-noise-comment" = "off", "design/no-todo" = "off", "design/no-detached-comment" = "off", "design/no-redundant-qualifier" = "off", "design/max-name-words" = "off", "design/no-type-encoding" = "off", "design/no-mutable-globals" = "off", "design/context-first" = "off", "design/no-stored-context" = "off", "design/error-identity" = "off", "design/no-panic" = "off", "design/single-responsibility" = "off", "design/no-conjoined-modules" = "off", "design/coupling" = "off", "design/signature-size" = "off", "design/no-private-types" = "off", "design/prefer-method" = "off", "design/feature-envy" = "off", "testing/public-boundary" = "off", "testing/no-missing-owner" = "off", "testing/no-duplicate-owner" = "off" }

[[spec.overrides]]
files = ["docs/cli.md", "docs/decisions/**", "schema/**", "protocol/schema/**", "crates/*/tests/it/snapshots/**"]
rules = { "core/max-lines" = "off" }

[[spec.overrides]]
files = ["**/*.lock"]
rules = { "core/max-lines" = "off" }
