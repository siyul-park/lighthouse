apiVersion = "lighthouse/v1alpha1"
kind = "Project"
metadata = { name = "smoke" }

[spec]
plugins = [
  "lang-go",
  "lang-rust",
  "lang-typescript",
  "lang-python",
  "lang-yaml",
  "lang-toml",
  "lang-markdown",
]
# Only packs that need no outside program: the smoke test proves the build, not the runner's tools.
extends = ["design/recommended", "go/recommended", "rust/recommended"]
