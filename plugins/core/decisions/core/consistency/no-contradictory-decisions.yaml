# yaml-language-server: $schema=../../../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: core/no-contradictory-decisions
  uid: cff7abbe-c6e8-472a-90e3-d34c909f112a
spec:
  title: Decisions do not contradict each other
  context: >-
    Two decisions about the order of declarations can each be right and still
    be impossible to satisfy together: one wants types above functions, the
    other functions above types, so every order of such a file is flagged by
    one of them. Nobody finds this by reading, and the contradiction costs a
    fix that undoes the other's. The engine looks for it: it renders every
    small set of declarations (up to two of them) and every order they can be
    written in, runs the order decisions in force over them, and reports the
    smallest set of declarations whose every order is flagged, with the
    decisions that, between them, flag it. Removing any one of those decisions
    makes the set satisfiable (de Kleer's minimal inconsistent environments).
    What is found is proven by that code, and nothing beyond the bound is
    claimed: the absence of a finding is not a proof that the decisions
    agree.


    A decision that flags every order of a set of declarations by itself is
    reported the same way, alone. A contradiction that one of its decisions
    settles by superseding the other is a note, not a finding. The search
    holds the decisions whose fix moves or reorders declarations within a
    file, in the languages it can render (Go and Rust); the contradictions
    among the packs that ship are checked where the packs are authored, so a
    project is told only of those that involve a decision it writes itself.


    The search is on by default. It starts only when the project writes a
    decision of that kind, runs once per distinct configuration of a language
    and is kept in the project's graph (the cache), so a project without such
    a decision never pays for it; a cold search of the order decisions of this repository costs about
    a second and a half (Go and Rust), and a warm one a few milliseconds. The
    bundled decisions have no contradiction up to two declarations. When the
    search of a language cannot be done in full (a decision whose behaviour
    needs more than two declarations to show, or a language without a
    renderer), the run says so in a notice that names the language and why,
    and says nothing of what it did not search.
  scope:
    subject: decision
  languages:
    go: {}
    rust: {}
  requirement: >-
    The order decisions in force together MUST be satisfiable: for every set of
    up to two declarations some order must exist that none of them flags.
  severity: error
  check:
    type: cel
    select: decision
    variables:
      - name: open
        expression: "decision.conflicts.filter(c, c.basis == 'proven' && !c.resolved)"
    where: size(open) > 0
    message: "on code shaped like {{ open[0].witness.shape }}, no order satisfies {{ open[0].names.join(', ') }}"
    evidence:
      kind: open[0].kind
      shape: open[0].witness.shape
      decisions: open[0].names.join(', ')
    identity:
      subject: "open[0].uids.join(',')"
  provenance:
    wasDerivedFrom:
      - de Kleer, An Assumption-based TMS, Artificial Intelligence 28(2) (1986)
      - Vasconcelos, Kollingbaum and Norman, Normative conflict resolution in multi-agent systems, Autonomous Agents and Multi-Agent Systems 19(2) (2009)
      - van Lamsweerde, Darimont and Letier, Managing conflicts in goal-driven requirements engineering, IEEE Transactions on Software Engineering 24(11) (1998)
      - Jackson, Software Abstractions (2006)
  examples:
    - name: go-order-contradiction
      language: go
      kind: invalid
      files:
        - path: item.go
          body: |-
            package sample

            // Item is part of the example.
            type Item struct{}
        - path: decisions/types-first.yaml
          body: |-
            apiVersion: lighthouse/v1alpha1
            kind: Decision
            metadata:
              name: local/types-first
            spec:
              title: Types come first
              context: Readers meet the types a file defines before the functions that use them.
              scope:
                subject: symbol
              requirement: A type MUST be declared above the functions of its file.
              severity: warn
              check:
                type: cel
                select: symbol
                where: "symbol.kind == 'function' && file.symbols.exists(t, t.kind == 'type' && t.pos > symbol.pos)"
                message: "function {{ symbol.name }} is declared above a type"
                identity:
                  subject: symbol.id
              fix:
                type: cel
                safety: unsafe
                edits: "[move(symbol, after(file.symbols.filter(t, t.kind == 'type')[0]))]"
              examples:
                - name: bad
                  language: text
                  kind: invalid
                  files: [{ path: a.txt, body: x }]
                  fixed: [{ path: a.txt, body: y }]
                  expect: [{ line: 1 }]
                - name: good
                  language: text
                  kind: valid
                  files: [{ path: a.txt, body: x }]
        - path: decisions/functions-first.yaml
          body: |-
            apiVersion: lighthouse/v1alpha1
            kind: Decision
            metadata:
              name: local/functions-first
            spec:
              title: Functions come first
              context: Readers meet the functions a file defines before the types they work on.
              scope:
                subject: symbol
              requirement: A function MUST be declared above the types of its file.
              severity: warn
              check:
                type: cel
                select: symbol
                where: "symbol.kind == 'type' && file.symbols.exists(f, f.kind == 'function' && f.pos > symbol.pos)"
                message: "type {{ symbol.name }} is declared above a function"
                identity:
                  subject: symbol.id
              fix:
                type: cel
                safety: unsafe
                edits: "[move(symbol, after(file.symbols.filter(f, f.kind == 'function')[0]))]"
              examples:
                - name: bad
                  language: text
                  kind: invalid
                  files: [{ path: a.txt, body: x }]
                  fixed: [{ path: a.txt, body: y }]
                  expect: [{ line: 1 }]
                - name: good
                  language: text
                  kind: valid
                  files: [{ path: a.txt, body: x }]
      expect:
        - line: 4
          message: "on code shaped like a public type A, a public function B, no order satisfies local/functions-first, local/types-first"
        - line: 4
          message: "on code shaped like a public type A, a public function B, no order satisfies local/functions-first, local/types-first"
    - name: go-compatible-orders
      language: go
      kind: valid
      canonical: true
      files:
        - path: item.go
          body: |-
            package sample

