                where: "symbol.kind == 'function' && symbol.visibility == 'private' && file.symbols.exists(f, f.kind == 'function' && f.visibility == 'public' && f.pos > symbol.pos)"
                message: "private function {{ symbol.name }} is declared above a public function"
                identity:
