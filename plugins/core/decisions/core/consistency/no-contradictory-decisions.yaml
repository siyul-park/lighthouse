        - path: decisions/public-first.yaml
          body: |-
            apiVersion: lighthouse/v1alpha1
            kind: Decision
            metadata:
              name: local/public-first
            spec:
              title: Public functions come first
              context: Readers meet the public functions of a file before its private ones.
              scope:
