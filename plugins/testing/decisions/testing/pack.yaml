# yaml-language-server: $schema=../../schema/pack.schema.json
apiVersion: lighthouse/v1alpha1
kind: Pack
metadata:
  name: testing
spec:
  title: Testing Decisions
  intro: >-
    Tests are the executable specification of a feature. They define the
    contracts, structure, evidence, and validation required to establish correct
    behavior.
  variables:
    - name: visible_symbols
      params: [internal]
      expression: "internal ? ['public', 'internal'] : ['public']"
  sections:
    - name: organization
      title: Organization
      intro: >-
        Test structure should provide one obvious owner for each public contract
        and keep case structure shallow, direct and readable.
      decisions: [no-missing-owner, no-duplicate-owner, standard-assertions, behavior-cases, case-assertions, consistent-case-style, max-case-depth, prefer-table, scenario-cases, simple-tables, no-hidden-target, file-layout, owner-file, file-pair]
    - name: public-boundary
      title: Public Boundary
      intro: >-
        Contract tests should prove behavior through the same public boundary
        available to callers.
      decisions: [public-boundary]
    - name: evidence
      title: Evidence
      intro: >-
        Tests are reliable evidence, different test layers prove different
        facts, and validation starts with the smallest useful falsification and
        expands only as far as the affected contract requires.
      decisions: [independent-tests, self-validating, no-polling-after-teardown, pure-polling, contract-coverage, lowest-layer, specific-evidence, path-parity, independent-golden, no-structure-tests]
