---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/path-parity
  uid: e86fd435-3839-4ffb-ba5f-0845f7908a5e
spec:
  title: Equivalent paths have parity tests
  context: Cache, fallback, protocol, platform, or implementation paths may drift
    independently despite passing their local tests.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: When multiple execution paths implement the same public contract, tests
    SHOULD prove parity across those paths.
  severity: info
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#native-jit-20e6de03'
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestBehavior(t *testing.T) { run(); if got := state(); got != "unexpected" { t.Fatal() } }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestBehavior(t *testing.T) { run(); if got := state(); got != "expected" { t.Fatalf("got %q", got) } }
  - name: python-one-of-two-stores-tested
    language: python
    kind: invalid
    files:
    - path: store.py
      body: |-
        from pathlib import Path
        from typing import Protocol


        class Store(Protocol):
            def get(self, key: str) -> str | None: ...

            def put(self, key: str, value: str) -> None: ...


        class MemoryStore:
            def __init__(self) -> None:
                self._items: dict[str, str] = {}

            def get(self, key: str) -> str | None:
                return self._items.get(key)

            def put(self, key: str, value: str) -> None:
                self._items[key] = value


        class FileStore:
            def __init__(self, directory: Path) -> None:
                self._directory = directory

            def get(self, key: str) -> str | None:
                path = self._directory / key
                return path.read_text() if path.exists() else None

            def put(self, key: str, value: str) -> None:
                (self._directory / key).write_text(value)
    - path: test_store.py
      body: |-
        from store import MemoryStore


        def test_get_returns_what_was_put() -> None:
            store = MemoryStore()
            store.put("a", "1")
            assert store.get("a") == "1"
  - name: python-both-stores-share-the-tests
    language: python
    kind: valid
    canonical: true
    files:
    - path: store.py
      body: |-
        from pathlib import Path
        from typing import Protocol


        class Store(Protocol):
            def get(self, key: str) -> str | None: ...

            def put(self, key: str, value: str) -> None: ...


        class MemoryStore:
            def __init__(self) -> None:
                self._items: dict[str, str] = {}

            def get(self, key: str) -> str | None:
                return self._items.get(key)

            def put(self, key: str, value: str) -> None:
                self._items[key] = value


        class FileStore:
            def __init__(self, directory: Path) -> None:
                self._directory = directory

            def get(self, key: str) -> str | None:
                path = self._directory / key
                return path.read_text() if path.exists() else None

            def put(self, key: str, value: str) -> None:
                (self._directory / key).write_text(value)
    - path: test_store.py
      body: |-
        from pathlib import Path

        import pytest

        from store import FileStore, MemoryStore, Store


        @pytest.fixture(params=["memory", "file"])
        def store(request: pytest.FixtureRequest, tmp_path: Path) -> Store:
            if request.param == "memory":
                return MemoryStore()
            return FileStore(tmp_path)


        def test_get_returns_what_was_put(store: Store) -> None:
            store.put("a", "1")
            assert store.get("a") == "1"


        def test_get_of_a_missing_key_is_none(store: Store) -> None:
            assert store.get("b") is None
