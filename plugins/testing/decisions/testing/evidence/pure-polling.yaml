---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/pure-polling
  uid: a08f1f60-64be-4301-b2fe-6a1a5249bebf
spec:
  title: Polling predicates are pure observations
  context: A polling predicate may execute many times. Side effects make success depend
    on the scheduler and the number of polls.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: A polling predicate SHOULD observe state without mutating it or consuming
    a one-shot result.
  severity: warn
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#organization-5dabb856'
    - Martin, Clean Code (2008), T9 Tests Should Be Fast
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: sample_test.go
      body: |
        package sample
        require.Eventually(t, func() bool { counter++; return counter > 1 }, time.Second, time.Millisecond)
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample_test.go
      body: |
        package sample
        require.Eventually(t, func() bool { return store.Ready() }, time.Second, time.Millisecond)
  - name: python-poll-consumes-the-result
    language: python
    kind: invalid
    files:
    - path: test_worker.py
      body: |-
        import time

        from worker import Worker


        def wait_for(predicate, timeout: float = 5.0) -> bool:
            deadline = time.monotonic() + timeout
            while time.monotonic() < deadline:
                if predicate():
                    return True
                time.sleep(0.05)
            return False


        def test_worker_reports_done() -> None:
            worker = Worker()
            worker.start()
            assert wait_for(lambda: worker.take_result() == "done")
  - name: python-poll-observes-the-status
    language: python
    kind: valid
    canonical: true
    files:
    - path: test_worker.py
      body: |-
        import time

        from worker import Worker


        def wait_for(predicate, timeout: float = 5.0) -> bool:
            deadline = time.monotonic() + timeout
            while time.monotonic() < deadline:
                if predicate():
                    return True
                time.sleep(0.05)
            return False


        def test_worker_reports_done() -> None:
            worker = Worker()
            worker.start()
            assert wait_for(lambda: worker.status() == "done")
            assert worker.take_result() == "done"
