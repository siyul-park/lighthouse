---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/specific-evidence
  uid: fa67da60-6daa-4285-98b2-731c94b706da
spec:
  title: Architecture contracts have specific evidence
  context: A generic test may prove behavior but miss the module, platform, backend,
    or lifecycle condition that defines the architectural contract.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: Architecture-specific contracts SHOULD have evidence that exercises
    the relevant architecture boundary rather than only a generic success path.
  severity: info
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#completeness-f61f5237'
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestBehavior(t *testing.T) { run(); if got := state(); got != "unexpected" { t.Fatal() } }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestBehavior(t *testing.T) { run(); if got := state(); got != "expected" { t.Fatalf("got %q", got) } }
  - name: python-only-the-generic-success-path
    language: python
    kind: invalid
    files:
    - path: fetch.py
      body: |-
        from typing import Protocol


        class FetchError(Exception):
            """The fetch failed."""


        class Client(Protocol):
            def get(self, url: str, timeout: float) -> str: ...


        def fetch(client: Client, url: str) -> str:
            try:
                return client.get(url, timeout=3.0)
            except TimeoutError as e:
                raise FetchError(url) from e
    - path: test_fetch.py
      body: |-
        from fetch import fetch


        class OkClient:
            def get(self, url: str, timeout: float) -> str:
                return "ok"


        def test_fetch_returns_the_body() -> None:
            assert fetch(OkClient(), "http://x") == "ok"
  - name: python-exercises-the-timeout-boundary
    language: python
    kind: valid
    canonical: true
    files:
    - path: fetch.py
      body: |-
        from typing import Protocol


        class FetchError(Exception):
            """The fetch failed."""


        class Client(Protocol):
            def get(self, url: str, timeout: float) -> str: ...


        def fetch(client: Client, url: str) -> str:
            try:
                return client.get(url, timeout=3.0)
            except TimeoutError as e:
                raise FetchError(url) from e
    - path: test_fetch.py
      body: |-
        import pytest

        from fetch import FetchError, fetch


        class OkClient:
            def get(self, url: str, timeout: float) -> str:
                return "ok"


        class SlowClient:
            def get(self, url: str, timeout: float) -> str:
                raise TimeoutError


        def test_fetch_returns_the_body() -> None:
            assert fetch(OkClient(), "http://x") == "ok"


        def test_fetch_turns_a_client_timeout_into_a_fetch_error() -> None:
            with pytest.raises(FetchError):
                fetch(SlowClient(), "http://x")
