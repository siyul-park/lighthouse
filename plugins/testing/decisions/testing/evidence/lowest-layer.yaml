---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/lowest-layer
  uid: ab8f3021-ba64-4713-9984-8aa3a435c16a
spec:
  title: Tests use the lowest proving layer
  context: Lower-level tests localize failures and run faster; choosing a higher layer
    is justified only when the contract itself crosses that boundary.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: The lowest test layer that can prove a contract SHOULD be used, while
    integration tests remain for contracts that cross component boundaries.
  severity: info
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#tdd-9cd4d927'
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestBehavior(t *testing.T) { run(); if got := state(); got != "unexpected" { t.Fatal() } }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestBehavior(t *testing.T) { run(); if got := state(); got != "expected" { t.Fatalf("got %q", got) } }
  - name: python-rule-tested-only-through-the-api
    language: python
    kind: invalid
    files:
    - path: rules.py
      body: |-
        def is_adult(age: int) -> bool:
            return age >= 18
    - path: api.py
      body: |-
        from rules import is_adult


        def check(age: int) -> dict:
            return {"adult": is_adult(age)}
    - path: test_api.py
      body: |-
        from api import check


        def test_check_adult() -> None:
            assert check(18) == {"adult": True}
  - name: python-rule-tested-at-its-layer
    language: python
    kind: valid
    canonical: true
    files:
    - path: rules.py
      body: |-
        def is_adult(age: int) -> bool:
            return age >= 18
    - path: test_rules.py
      body: |-
        from rules import is_adult


        def test_is_adult_at_eighteen() -> None:
            assert is_adult(18)
