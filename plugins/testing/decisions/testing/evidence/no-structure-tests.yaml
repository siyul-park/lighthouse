---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/no-structure-tests
  uid: 44a497d8-5df1-4a4e-90c4-30ccf6f50856
spec:
  title: Tests prove contracts, not structure
  context: Coverage proves reachability, not quality. Tests should fail for a contract
    violation rather than an arbitrary refactor.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: Tests SHOULD NOT be added solely to exercise implementation structure
    when they cannot establish an externally meaningful contract.
  severity: info
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#tdd-64ebcce6'
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestBehavior(t *testing.T) { run(); if got := state(); got != "unexpected" { t.Fatal() } }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestBehavior(t *testing.T) { run(); if got := state(); got != "expected" { t.Fatalf("got %q", got) } }
  - name: python-asserts-private-layout
    language: python
    kind: invalid
    files:
    - path: cache.py
      body: |-
        class Cache:
            def __init__(self) -> None:
                self._slots: dict[str, int] = {}

            def put(self, key: str, value: int) -> None:
                self._slots[key] = value
    - path: test_cache.py
      body: |-
        from cache import Cache


        def test_put_uses_a_dict() -> None:
            cache = Cache()
            cache.put("a", 1)
            assert isinstance(cache._slots, dict)
  - name: python-asserts-behavior
    language: python
    kind: valid
    canonical: true
    files:
    - path: cache.py
      body: |-
        class Cache:
            def __init__(self) -> None:
                self._slots: dict[str, int] = {}

            def put(self, key: str, value: int) -> None:
                self._slots[key] = value

            def get(self, key: str) -> int | None:
                return self._slots.get(key)
    - path: test_cache.py
      body: |-
        from cache import Cache


        def test_put_then_get() -> None:
            cache = Cache()
            cache.put("a", 1)
            assert cache.get("a") == 1
