---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/independent-tests
  uid: 0305fc51-13cd-45a6-b29b-0c9becbbb45b
spec:
  title: Tests are independent and repeatable
  context: Shared mutable state and order dependence make tests flaky and conceal
    missing setup.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: Each test SHOULD produce the same result regardless of execution order
    and SHOULD NOT depend on mutable state left by another test.
  severity: warn
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#f-i-r-s-t-5e44df14'
    - 'Martin, Clean Code (2008), ch. 9 F.I.R.S.T.'
    - Martin, Clean Code (2008), ch. 9 F.I.R.S.T.
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: sample_test.go
      body: |
        package sample
        var shared int
        func TestFirst(t *testing.T) { shared++; if shared != 1 { t.Fatal() } }
        func TestSecond(t *testing.T) { if shared != 1 { t.Fatal() } }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestFirst(t *testing.T) { got := compute(); if got != 1 { t.Fatal() } }
        func TestSecond(t *testing.T) { got := compute(); if got != 2 { t.Fatal() } }
  - name: python-test-reimplements-the-code
    language: python
    kind: invalid
    files:
    - path: sums.py
      body: |-
        def total(values: list[int]) -> int:
            return sum(values)
    - path: test_sums.py
      body: |-
        from sums import total


        def test_total() -> None:
            values = [1, 2, 3]
            expected = 0
            for v in values:
                expected += v
            assert total(values) == expected
  - name: python-test-literal-expectation
    language: python
    kind: valid
    canonical: true
    files:
    - path: sums.py
      body: |-
        def total(values: list[int]) -> int:
            return sum(values)
    - path: test_sums.py
      body: |-
        from sums import total


        def test_total() -> None:
            assert total([1, 2, 3]) == 6
