---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/independent-tests
  uid: 0305fc51-13cd-45a6-b29b-0c9becbbb45b
spec:
  title: Tests are independent and repeatable
  context: Shared mutable state and order dependence make tests flaky and conceal
    missing setup.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: Each test SHOULD produce the same result regardless of execution order
    and SHOULD NOT depend on mutable state left by another test.
  severity: warn
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#f-i-r-s-t-5e44df14'
    - 'Martin, Clean Code (2008), ch. 9 F.I.R.S.T.'
    - Martin, Clean Code (2008), ch. 9 F.I.R.S.T.
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: sample_test.go
      body: |
        package sample
        var shared int
        func TestFirst(t *testing.T) { shared++; if shared != 1 { t.Fatal() } }
        func TestSecond(t *testing.T) { if shared != 1 { t.Fatal() } }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestFirst(t *testing.T) { got := compute(); if got != 1 { t.Fatal() } }
        func TestSecond(t *testing.T) { got := compute(); if got != 2 { t.Fatal() } }
  - name: python-tests-share-a-module-level-object
    language: python
    kind: invalid
    files:
    - path: tally.py
      body: |-
        class Tally:
            def __init__(self) -> None:
                self.count = 0

            def add(self) -> int:
                self.count += 1
                return self.count
    - path: test_tally.py
      body: |-
        from tally import Tally

        shared = Tally()


        def test_first_add_returns_one() -> None:
            assert shared.add() == 1


        def test_second_add_returns_two() -> None:
            assert shared.add() == 2
  - name: python-each-test-builds-its-own-fixture
    language: python
    kind: valid
    canonical: true
    files:
    - path: tally.py
      body: |-
        class Tally:
            def __init__(self) -> None:
                self.count = 0

            def add(self) -> int:
                self.count += 1
                return self.count
    - path: test_tally.py
      body: |-
        import pytest

        from tally import Tally


        @pytest.fixture
        def tally() -> Tally:
            return Tally()


        def test_first_add_returns_one(tally: Tally) -> None:
            assert tally.add() == 1


        def test_second_add_returns_two(tally: Tally) -> None:
            tally.add()
            assert tally.add() == 2
