---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/independent-golden
  uid: b2f2b83e-58fa-418b-96af-1c5139b16835
spec:
  title: Golden expectations are independent
  context: Generating expected output with the same code under test can reproduce
    the same defect in both actual and expected values.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: Golden tests SHOULD define expected low-level output independently
    of the implementation that produced it.
  severity: info
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#native-jit-7e35f7e0'
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestBehavior(t *testing.T) { run(); if got := state(); got != "unexpected" { t.Fatal() } }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestBehavior(t *testing.T) { run(); if got := state(); got != "expected" { t.Fatalf("got %q", got) } }
  - name: python-expected-from-the-code-under-test
    language: python
    kind: invalid
    files:
    - path: pricing.py
      body: |-
        def total(cents: int, rate: int) -> int:
            return cents + cents * rate // 100
    - path: test_pricing.py
      body: |-
        from pricing import total


        def test_total_with_tax() -> None:
            assert total(100, 20) == 100 + 100 * 20 // 100
  - name: python-expected-literal
    language: python
    kind: valid
    canonical: true
    files:
    - path: pricing.py
      body: |-
        def total(cents: int, rate: int) -> int:
            return cents + cents * rate // 100
    - path: test_pricing.py
      body: |-
        from pricing import total


        def test_total_with_tax() -> None:
            assert total(100, 20) == 120
