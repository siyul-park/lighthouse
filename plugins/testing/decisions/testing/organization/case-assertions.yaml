---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/case-assertions
  uid: 0df7d395-14c1-4bbf-8665-d4600166beab
spec:
  title: Assertions stay inside their cases
  context: Assertions outside a subtest may fail without naming which scenario failed,
    and their result can depend on case order.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: Assertions that belong to a scenario SHOULD be inside that scenario’s
    test case; setup outside cases SHOULD only establish shared preconditions.
  severity: warn
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#organization-2aa48e36'
    - 'Martin, Clean Code (2008), ch. 9 One assert per test'
    - Martin, Clean Code (2008), ch. 9 One assert per test
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestStore(t *testing.T) { got := store.Get(); if got != want { t.Fatal() }; t.Run("missing", func(t *testing.T) { store.GetMissing() }) }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestStore(t *testing.T) { t.Run("present", func(t *testing.T) { got := store.Get(); if got != want { t.Fatal() } }) }
  - name: python-assertion-outside-a-case
    language: python
    kind: invalid
    files:
    - path: store.py
      body: |-
        class Store:
            def __init__(self) -> None:
                self._items: dict[str, int] = {}

            def put(self, key: str, value: int) -> None:
                self._items[key] = value

            def get(self, key: str) -> int | None:
                return self._items.get(key)
    - path: test_store.py
      body: |-
        from store import Store

        store = Store()
        store.put("a", 1)
        assert store.get("a") == 1


        def test_get_of_a_missing_key_is_none() -> None:
            assert store.get("b") is None
  - name: python-setup-in-a-fixture-assertions-in-cases
    language: python
    kind: valid
    canonical: true
    files:
    - path: store.py
      body: |-
        class Store:
            def __init__(self) -> None:
                self._items: dict[str, int] = {}

            def put(self, key: str, value: int) -> None:
                self._items[key] = value

            def get(self, key: str) -> int | None:
                return self._items.get(key)
    - path: test_store.py
      body: |-
        import pytest

        from store import Store


        @pytest.fixture
        def store() -> Store:
            result = Store()
            result.put("a", 1)
            return result


        def test_get_of_a_present_key(store: Store) -> None:
            assert store.get("a") == 1


        def test_get_of_a_missing_key_is_none(store: Store) -> None:
            assert store.get("b") is None
