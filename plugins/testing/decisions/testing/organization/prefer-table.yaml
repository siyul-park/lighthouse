---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/prefer-table
  uid: 3b918d83-7fe6-4913-9341-302455a42083
spec:
  title: Repeated inputs share one table
  context: A table keeps the invariant and assertion visible once while making the
    input/output differences explicit.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: Tests of the same behavior with different inputs SHOULD use a named
    table of inputs and expected outputs.
  severity: warn
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#organization-dac1a854'
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestGetOne(t *testing.T) { if Get(1) != "one" { t.Fatal() } }
        func TestGetTwo(t *testing.T) { if Get(2) != "two" { t.Fatal() } }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestGet(t *testing.T) { tests := []struct{ input int; want string }{{1,"one"},{2,"two"}}; for _, tt := range tests { t.Run(tt.want, func(t *testing.T) { if got := Get(tt.input); got != tt.want { t.Fatal() } }) } }
  - name: python-three-near-identical-tests
    language: python
    kind: invalid
    files:
    - path: test_sample.py
      body: |-
        from sample import get


        def test_get_empty() -> None:
            assert get("") == 0


        def test_get_one() -> None:
            assert get("a") == 1


        def test_get_two() -> None:
            assert get("ab") == 2
  - name: python-one-parametrized-test
    language: python
    kind: valid
    canonical: true
    files:
    - path: test_sample.py
      body: |-
        import pytest

        from sample import get


        @pytest.mark.parametrize(("text", "want"), [("", 0), ("a", 1), ("ab", 2)])
        def test_get(text: str, want: int) -> None:
            assert get(text) == want
