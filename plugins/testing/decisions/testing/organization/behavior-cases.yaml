---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/behavior-cases
  uid: c8fa02e4-f183-45a5-9f89-557291b9c540
spec:
  title: Each test case specifies one behavior
  context: A test that mixes unrelated behaviors is hard to interpret when it fails.
    Fixtures and setup may be shared, but a case should state one outcome.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: A test case SHOULD specify one behavior and contain the actions and
    assertions that establish that behavior.
  severity: warn
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#readability-71cbc25a'
    - 'Martin, Clean Code (2008), ch. 9 Single concept per test'
    - Martin, Clean Code (2008), ch. 9 Clean tests
    - Martin, Clean Code (2008), ch. 9 Single concept per test
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestStore(t *testing.T) { store.Open(); store.Close(); if store.Status() != "closed" { t.Fatal() } }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample_test.go
      body: |
        package sample
        func TestStoreOpen(t *testing.T) { store.Open(); if !store.IsOpen() { t.Fatal() } }
        func TestStoreClose(t *testing.T) { store.Close(); if store.IsOpen() { t.Fatal() } }
  - name: python-one-test-two-behaviors
    language: python
    kind: invalid
    files:
    - path: store.py
      body: |-
        class Store:
            def __init__(self) -> None:
                self._open = False

            def open(self) -> None:
                self._open = True

            def close(self) -> None:
                self._open = False

            def is_open(self) -> bool:
                return self._open
    - path: test_store.py
      body: |-
        from store import Store


        def test_store() -> None:
            store = Store()
            store.open()
            assert store.is_open()
            store.close()
            assert not store.is_open()
  - name: python-one-test-per-behavior
    language: python
    kind: valid
    canonical: true
    files:
    - path: store.py
      body: |-
        class Store:
            def __init__(self) -> None:
                self._open = False

            def open(self) -> None:
                self._open = True

            def close(self) -> None:
                self._open = False

            def is_open(self) -> bool:
                return self._open
    - path: test_store.py
      body: |-
        from store import Store


        def test_open_makes_the_store_open() -> None:
            store = Store()
            store.open()
            assert store.is_open()


        def test_close_makes_the_store_closed() -> None:
            store = Store()
            store.open()
            store.close()
            assert not store.is_open()
