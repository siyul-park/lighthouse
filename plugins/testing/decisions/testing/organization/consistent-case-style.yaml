---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/consistent-case-style
  uid: 8eaefa28-47f4-494f-a867-0cc24bae1eec
spec:
  title: A test level uses one case style
  context: Mixing table and scenario styles at the same level obscures which inputs
    are data and which are distinct behaviors.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    typescript: {}
  requirement: A test level SHOULD use either data-driven table cases or individually
    named scenario cases, not a mixture for the same behavior.
  severity: warn
  check:
    type: cel
    select: test
    where: 'false'
    abstain: test.style_mix
    message: "{{ test.name + ' uses a different case style than a test beside it; review whether they cover the same behavior' }}"
    evidence:
      style: test.style
    identity:
      subject: test.id
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, testing#organization-17ab163b'
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: go.mod
      body: |
        module sample

        go 1.23
    - path: sample.go
      body: |
        package sample

        func Get(s string) int { return len(s) }
    - path: sample_test.go
      body: |
        package sample

        import "testing"

        func TestGetEmpty(t *testing.T) {
        	if Get("") != 0 {
        		t.Fatal("empty")
        	}
        }

        func TestGetCases(t *testing.T) {
        	cases := []struct {
        		name  string
        		input string
        		want  int
        	}{{"one", "a", 1}, {"two", "ab", 2}}
        	for _, tc := range cases {
        		t.Run(tc.name, func(t *testing.T) {
        			if got := Get(tc.input); got != tc.want {
        				t.Fatalf("got %d want %d", got, tc.want)
        			}
        		})
        	}
        }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: go.mod
      body: |
        module sample

        go 1.23
    - path: sample.go
      body: |
        package sample

        // Get is part of the example.
        func Get(s string) int { return len(s) }
    - path: sample_test.go
      body: |
        package sample

        import "testing"

        func TestGet(t *testing.T) {
        	cases := []struct {
        		name  string
        		input string
        		want  int
        	}{{"empty", "", 0}, {"one", "a", 1}}
        	for _, tc := range cases {
        		t.Run(tc.name, func(t *testing.T) {
        			if got := Get(tc.input); got != tc.want {
        				t.Fatalf("got %d want %d", got, tc.want)
        			}
        		})
        	}
        }
  - name: mixed-typescript-invalid
    language: typescript
    kind: invalid
    files:
    - path: sample.ts
      body: |-
        export function get(input: string): number {
          return input.length;
        }
    - path: sample.test.ts
      body: |-
        import { describe, expect, it } from "vitest";
        import { get } from "./sample";

        describe("get", () => {
          it("handles empty", () => {
            expect(get("")).toBe(0);
          });
        });

        describe("get cases", () => {
          it.each([
            ["a", 1],
            ["ab", 2],
          ])("measures %s", (input, want) => {
            expect(get(input)).toBe(want);
          });
        });
  - name: table-typescript-valid
    language: typescript
    kind: valid
    files:
    - path: sample.ts
      body: |-
        /** Part of the example. */
        export function get(input: string): number {
          return input.length;
        }
    - path: sample.test.ts
      body: |-
        import { describe, expect, it } from "vitest";
        import { get } from "./sample";

        describe("get", () => {
          it.each([
            ["", 0],
            ["a", 1],
          ])("measures %j", (input, want) => {
            expect(get(input)).toBe(want);
          });
        });
  - name: python-mixed-invalid
    language: python
    kind: invalid
    files:
    - path: sample.py
      body: |-
        def get(text: str) -> int:
            return len(text)
    - path: test_sample.py
      body: |-
        import pytest

        from sample import get


        def test_get_handles_empty() -> None:
            assert get("") == 0


        @pytest.mark.parametrize(("text", "want"), [("a", 1), ("ab", 2)])
        def test_get_measures(text: str, want: int) -> None:
            assert get(text) == want
  - name: python-table-valid
    language: python
    kind: valid
    canonical: true
    files:
    - path: sample.py
      body: |-
        def get(text: str) -> int:
            """Part of the example."""
            return len(text)
    - path: test_sample.py
      body: |-
        import pytest

        from sample import get


        @pytest.mark.parametrize(("text", "want"), [("", 0), ("a", 1)])
        def test_get_measures(text: str, want: int) -> None:
            assert get(text) == want
