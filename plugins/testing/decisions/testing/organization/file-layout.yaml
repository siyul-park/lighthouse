# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/file-layout
  uid: 3991db6f-6ce4-4590-83ad-22b7b7d0daf0
spec:
  title: "A test file reads fixtures, tests, helpers"
  context: >-
    A test file reads top-down: what the tests use, then the
    specification, then how it checks.

    Go: A fixture is a type, constant, variable or function without a
    `*testing.T`, `*testing.B`, `*testing.F` or `testing.TB` parameter; a
    helper is a function with one. Fixtures follow `design/declaration-
    groups`. Methods are judged with their type. Test entry points are
    `Test`, `Benchmark`, `Fuzz` and `Example` functions; a helper that no
    test or helper of the same file uses may sit anywhere below the
    fixtures.

    The owner tests of a file (`TestGet` for `Get`, as in
    `testing/no-missing-owner`) follow the order in which their targets are
    declared in the source file, as `design/declaration-groups` orders the
    methods inside its groups: `compile_test.go` orders its tests the way
    `compile.go` declares the symbols they test. The source file is the one
    most of the owner tests of the file test (see `testing/owner-file`); tests
    that own nothing, or whose target is in another file, are not ordered, and
    tests of one target keep their order. No tool orders tests this way; it is
    the project's decision, which Uber's "Function Grouping and Ordering" gives
    for the source side.

    Rust: The same reading order applies to a `#[cfg(test)]` module and to
    files of `tests/`: fixtures and builders first, then the `#[test]`
    functions, then the helpers that check. It is not enforced for Rust,
    whose provider does not tell fixtures from helpers.

    Scope: the decision is about test code (`tests: only`), which is a symbol
    of a test file or of a module that exists to test another, such as a
    `#[cfg(test)]` module in a production file; the Rust example below has
    one.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: >-
    A test file MUST declare its fixtures (test types, constants, variables and
    the functions that build them without the test framework's handle) above its
    tests, and its test helpers (functions that take the test framework's handle
    and are called from tests) below the tests that use them. Fixtures keep the
    declaration-group order among themselves and sit next to the fixtures they
    compose. Its owner tests SHOULD follow the declaration order of their
    targets in the source file.
  severity: error
  check:
    type: cel
    select: symbol
    variables:
      - name: tests
        expression: "file.symbols.filter(s, s.kind == 'test')"
      - name: first
        expression: "size(tests) > 0 ? tests[0] : {}"
      - name: group_rank
        params: [s]
        expression: >-
          s.kind == 'type' || s.kind == 'interface' ? 0
            : s.kind == 'const' ? 1 : s.kind == 'var' ? 2 : 3
      # The fixture is put before the first declaration of a later group, or
      # the first test; below the declarations it needs as the file loads.
      - name: floor_of
        params: [s]
        expression: "size(s.load_after) > 0 ? s.load_after[size(s.load_after) - 1].pos : 0"
      - name: anchor_after
        params: [s, below]
        expression: >-
          cel.bind(c, file.symbols.filter(d, d.id != s.id && 1000 * d.pos > below
              && (d.kind == 'test' || d.declaration && group_rank(d) > group_rank(s))).sortBy(d, d.pos),
            size(c) > 0 ? c[0] : first)
      - name: anchor_of
        params: [s]
        expression: "anchor_after(s, 1000 * floor_of(s))"
      - name: anchor
        expression: "anchor_of(symbol)"
      # The first use of the helper below it, for the message.
      - name: user
        expression: >-
          cel.bind(c, (symbol.callers + symbol.references).filter(u, u.file == symbol.file && u.pos > symbol.pos),
            size(c) > 0 ? c.sortBy(u, u.pos)[0] : {})
      # Python, JavaScript and TypeScript evaluate a file in the order it is
      # written: `load_after` are the declarations a declaration needs bound
      # above it as the file loads, `load_before` the code that needs it bound
      # above that. A move that breaks one is not asked for.
      - name: late_fixture
        params: [s]
        expression: >-
          s.test_role == 'fixture' && size(first) > 0 && first.pos < s.pos
            && s.load_after.all(b, b.pos < first.pos)
      # The uses a helper can go below: the first is the one it is reported
      # for, the last the one it is moved after.
      - name: sinks
        params: [s]
        expression: >-
          file.symbols.filter(u, u.id in s.file_users && u.pos > s.pos
              && s.load_before.all(x, x.pos > u.pos)).sortBy(u, u.pos)
      - name: late_helper
        params: [s]
        expression: "s.test_role == 'test-helper' && size(sinks(s)) > 0"
      - name: misplaced_fixture
        expression: "late_fixture(symbol)"
      - name: misplaced_helper
        expression: "late_helper(symbol)"
      - name: owner_tests
        expression: "tests.filter(t, has(t.owned) && t.owned != null && t.owned.file != '')"
      - name: homes
        expression: "owner_tests.map(t, t.owned.file)"
      - name: home
        expression: "size(homes) > 0 ? homes.distinct().sortBy(f, -size(homes.filter(x, x == f)))[0] : ''"
      - name: comparable
        expression: "owner_tests.filter(t, t.owned.file == home)"
      - name: targets
        expression: "comparable.map(t, t.owned.pos)"
      - name: out_of_order
        expression: "targets.misplaced()"
      - name: at_index
        expression: "comparable.map(t, t.id).indexOf(symbol.id)"
      - name: misplaced_order
        expression: >-
          symbol.kind == 'test' && at_index >= 0 && at_index in out_of_order
            && comparable.all(t, size(t.load_after) == 0)
      - name: mine
        expression: "misplaced_order ? comparable.filter(u, u.id == symbol.id)[0] : {}"
      - name: above
        expression: "misplaced_order ? comparable.filter(u, u.pos < mine.pos && u.owned.pos > mine.owned.pos) : []"
      - name: below
        expression: "misplaced_order ? comparable.filter(u, u.pos > mine.pos && u.owned.pos < mine.owned.pos) : []"
      - name: sorted_tests
        expression: "comparable.sortBy(t, t.owned.pos).map(t, t.id)"
      # The order of the file that fixes every finding of it at once: what the
      # file-layout does not touch keeps its place, a fixture goes before its
      # anchor, a helper after the last use it can go below and the owner tests
      # take the places of the owner tests in the order of their targets. A
      # place is a number of thousandths of a position; a helper that is used
      # by a helper is placed after that one (chains of three are placed in one
      # step, longer ones in the next round).
      - name: slots
        expression: "comparable.map(t, t.pos).sortBy(p, p)"
      - name: base
        params: [s]
        expression: >-
          1000 * (s.kind == 'test' && s.id in sorted_tests && comparable.all(t, size(t.load_after) == 0)
            ? slots[sorted_tests.indexOf(s.id)] : s.pos)
      - name: sink_of
        params: [s]
        expression: "sinks(s)[size(sinks(s)) - 1]"
      - name: below_1
        params: [s]
        expression: "late_helper(s) ? base(sink_of(s)) + 1 : base(s)"
      - name: below_2
        params: [s]
        expression: "late_helper(s) ? below_1(sink_of(s)) + 1 : base(s)"
      - name: below_3
        params: [s]
        expression: "late_helper(s) ? below_2(sink_of(s)) + 1 : base(s)"
      # A fixture goes before its anchor, the fixtures of one anchor in the
      # order of their groups. One that needs a fixture below the tests goes
      # after it: the fixtures that move are found step by step (a fixture
      # whose needs are above the tests, then one whose needs are those, and so
      # on to three steps; a longer chain is met in the next round).
      - name: below_tests
        params: [s]
        expression: "s.test_role == 'fixture' && size(first) > 0 && first.pos < s.pos"
      - name: top
        params: [places]
        expression: "size(places) > 0 ? places.sort()[size(places) - 1] : 0"
      - name: lift
        params: [s]
        expression: >-
          1000 * anchor_after(s, 1000 * top(s.load_after.filter(c, c.pos < first.pos).map(c, c.pos))).pos
            - 500 + group_rank(s)
      - name: step_1
        expression: "file.symbols.filter(d, late_fixture(d))"
      - name: step_2
        expression: >-
          file.symbols.filter(d, below_tests(d)
            && d.load_after.all(c, c.pos < first.pos || c.id in step_1.map(e, e.id)))
      - name: step_3
        expression: >-
          file.symbols.filter(d, below_tests(d)
            && d.load_after.all(c, c.pos < first.pos || c.id in step_2.map(e, e.id)))
      # The place of each fixture of a step, as [id, place].
      - name: places_1
        expression: "step_1.map(d, [d.id, lift(d)])"
      - name: places_2
        expression: >-
          step_2.map(d, [d.id, top([lift(d)]
            + d.load_after.filter(c, places_1.exists(p, p[0] == c.id))
                .map(c, places_1.filter(p, p[0] == c.id)[0][1] + 1))])
      - name: places_3
        expression: >-
          step_3.map(d, [d.id, top([lift(d)]
            + d.load_after.filter(c, places_2.exists(p, p[0] == c.id))
                .map(c, places_2.filter(p, p[0] == c.id)[0][1] + 1))])
      - name: place
        params: [s]
        expression: >-
          cel.bind(f, places_3.filter(p, p[0] == s.id), size(f) > 0 ? f[0][1] : below_3(s))
      - name: ordered
        expression: >-
          file.symbols.filter(s, s.declaration || s.kind == 'test').sortBy(s, s.pos)
            .sortBy(s, place(s)).map(s, s.id)
    where: >-
      (misplaced_fixture || misplaced_helper || misplaced_order)
    message: >-
      {{ misplaced_fixture
         ? 'fixture ' + symbol.name + ' must be declared above the tests, before ' + first.name
         : misplaced_helper
         ? 'test helper ' + symbol.name + ' must be declared below ' + user.name + ', which uses it'
         : size(above) > 0
         ? symbol.name + ' tests ' + mine.owned.name + ', declared before ' + above[0].owned.name
           + '; it belongs above ' + above[0].name
         : symbol.name + ' tests ' + mine.owned.name + ', declared after ' + below[0].owned.name
           + '; it belongs below ' + below[0].name }}
    evidence:
      symbol: symbol.id
      role: symbol.test_role
      before: "misplaced_fixture ? anchor.id : misplaced_order && size(above) > 0 ? above[0].id : ''"
      after: "misplaced_helper ? user.id : misplaced_order && size(below) > 0 ? below[0].id : ''"
    identity:
      subject: symbol.id
  fix:
    safety: safe
    type: cel
    edits: "[reorder(ordered)]"
  provenance:
    wasDerivedFrom:
      - "Martin, Clean Code (2008), ch. 5 Vertical size and ordering"
      - "Martin, Clean Code (2008), G24 Follow Standard Conventions"
  examples:
    - name: tests-in-target-order
      language: go
      kind: valid
      files:
        - path: store.go
          body: |-
            package sample

            // Get is part of the example.
            func Get() int { return 1 }

            // Set is part of the example.
            func Set() int { return 2 }
        - path: store_test.go
          body: |-
            package sample

            import "testing"

            func TestGet(t *testing.T) {
            	if Get() != 1 {
            		t.Fatal("get")
            	}
            }

            func TestScenario(t *testing.T) {
            	if Set() != 2 {
            		t.Fatal("set")
            	}
            }

            func TestSet(t *testing.T) {
            	if Set() != 2 {
            		t.Fatal("set")
            	}
            }
    - name: tests-out-of-target-order
      language: go
      kind: invalid
      fixed:
        - path: store.go
          body: |-
