# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/file-layout
  uid: 3991db6f-6ce4-4590-83ad-22b7b7d0daf0
spec:
  title: "A test file reads fixtures, tests, helpers"
  context: >-
    A test file reads top-down: what the tests use, then the
    specification, then how it checks.

    Go: A fixture is a type, constant, variable or function without a
    `*testing.T`, `*testing.B`, `*testing.F` or `testing.TB` parameter; a
    helper is a function with one. Fixtures follow `design/declaration-
    groups`. Methods are judged with their type. Test entry points are
    `Test`, `Benchmark`, `Fuzz` and `Example` functions; a helper that no
    test or helper of the same file uses may sit anywhere below the
    fixtures.

    The owner tests of a file (`TestGet` for `Get`, as in
    `testing/no-missing-owner`) follow the order in which their targets are
    declared in the source file, as `design/declaration-groups` orders the
    methods inside its groups: `compile_test.go` orders its tests the way
    `compile.go` declares the symbols they test. The source file is the one
    most of the owner tests of the file test (see `testing/owner-file`); tests
    that own nothing, or whose target is in another file, are not ordered, and
    tests of one target keep their order. No tool orders tests this way; it is
    the project's decision, which Uber's "Function Grouping and Ordering" gives
    for the source side.

    Rust: The same reading order applies to a `#[cfg(test)]` module and to
    files of `tests/`: fixtures and builders first, then the `#[test]`
    functions, then the helpers that check. It is not enforced for Rust,
    whose provider does not tell fixtures from helpers.

    Scope: the decision is about test code (`tests: only`), which is a symbol
    of a test file or of a module that exists to test another, such as a
    `#[cfg(test)]` module in a production file; the Rust example below has
    one.
  scope:
    subject: test
    tests: only
    examples: exclude
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: >-
    A test file MUST declare its fixtures (test types, constants, variables and
    the functions that build them without the test framework's handle) above its
    tests, and its test helpers (functions that take the test framework's handle
    and are called from tests) below the tests that use them. Fixtures keep the
    declaration-group order among themselves and sit next to the fixtures they
    compose. Its owner tests SHOULD follow the declaration order of their
    targets in the source file.
  severity: error
  check:
    type: cel
    select: symbol
    variables:
      - name: tests
        expression: "file.symbols.filter(s, s.kind == 'test')"
      - name: first
        expression: "size(tests) > 0 ? tests[0] : {}"
      - name: user
        expression: >-
          cel.bind(c, (symbol.callers + symbol.references).filter(u, u.file == symbol.file && u.pos > symbol.pos),
            size(c) > 0 ? c.sortBy(u, u.pos)[0] : {})
      - name: misplaced_fixture
        expression: symbol.test_role == 'fixture' && size(first) > 0 && first.pos < symbol.pos
      - name: misplaced_helper
        expression: symbol.test_role == 'test-helper' && size(user) > 0
      - name: owner_tests
        expression: "tests.filter(t, has(t.owned) && t.owned != null && t.owned.file != '')"
      - name: homes
        expression: "owner_tests.map(t, t.owned.file)"
      - name: home
        expression: "size(homes) > 0 ? homes.distinct().sortBy(f, -size(homes.filter(x, x == f)))[0] : ''"
      - name: comparable
        expression: "owner_tests.filter(t, t.owned.file == home)"
      - name: targets
        expression: "comparable.map(t, t.owned.pos)"
      - name: out_of_order
        expression: "targets.misplaced()"
      - name: at_index
        expression: "comparable.map(t, t.id).indexOf(symbol.id)"
      - name: misplaced_order
        expression: "symbol.kind == 'test' && at_index >= 0 && at_index in out_of_order"
      - name: mine
        expression: "misplaced_order ? comparable[at_index] : {}"
      - name: above
        expression: "misplaced_order ? comparable.filter(u, u.pos < mine.pos && u.owned.pos > mine.owned.pos) : []"
      - name: below
        expression: "misplaced_order ? comparable.filter(u, u.pos > mine.pos && u.owned.pos < mine.owned.pos) : []"
      - name: sorted_tests
        expression: "comparable.sortBy(t, t.owned.pos).map(t, t.id)"
    where: >-
      (misplaced_fixture || misplaced_helper || misplaced_order)
    message: >-
      {{ misplaced_fixture
         ? 'fixture ' + symbol.name + ' must be declared above the tests, before ' + first.name
         : misplaced_helper
         ? 'test helper ' + symbol.name + ' must be declared below ' + user.name + ', which uses it'
         : size(above) > 0
         ? symbol.name + ' tests ' + mine.owned.name + ', declared before ' + above[0].owned.name
           + '; it belongs above ' + above[0].name
         : symbol.name + ' tests ' + mine.owned.name + ', declared after ' + below[0].owned.name
           + '; it belongs below ' + below[0].name }}
    evidence:
      symbol: symbol.id
      role: symbol.test_role
      before: "misplaced_fixture ? first.id : misplaced_order && size(above) > 0 ? above[0].id : ''"
      after: "misplaced_helper ? user.id : misplaced_order && size(below) > 0 ? below[0].id : ''"
    identity:
      subject: symbol.id
  fix:
    safety: safe
    type: cel
    edits: >-
      misplaced_fixture ? [move(symbol, before(first))]
      : misplaced_helper ? [move(symbol, after(user))]
      : misplaced_order ? [reorder(sorted_tests)]
      : []
  provenance:
    wasDerivedFrom:
      - "Martin, Clean Code (2008), ch. 5 Vertical size and ordering"
      - "Martin, Clean Code (2008), G24 Follow Standard Conventions"
  examples:
    - name: tests-in-target-order
      language: go
      kind: valid
      files:
        - path: store.go
          body: |-
            package sample

            func Get() int { return 1 }

            func Set() int { return 2 }
        - path: store_test.go
          body: |-
            package sample

            import "testing"

            func TestGet(t *testing.T) {
            	if Get() != 1 {
            		t.Fatal("get")
            	}
            }

            func TestScenario(t *testing.T) {
            	if Set() != 2 {
            		t.Fatal("set")
            	}
            }

            func TestSet(t *testing.T) {
            	if Set() != 2 {
            		t.Fatal("set")
            	}
            }
    - name: tests-out-of-target-order
      language: go
      kind: invalid
      fixed:
        - path: store.go
          body: |-
            package sample

            func Get() int { return 1 }

            func Set() int { return 2 }
        - path: store_test.go
          body: |-
            package sample

            import "testing"

            func TestGet(t *testing.T) {
            	if Get() != 1 {
            		t.Fatal("get")
            	}
            }

            func TestSet(t *testing.T) {
            	if Set() != 2 {
            		t.Fatal("set")
            	}
            }
      files:
        - path: store.go
          body: |-
            package sample

            func Get() int { return 1 }

            func Set() int { return 2 }
        - path: store_test.go
          body: |-
            package sample

            import "testing"

            func TestSet(t *testing.T) {
            	if Set() != 2 {
            		t.Fatal("set")
            	}
            }

            func TestGet(t *testing.T) {
            	if Get() != 1 {
            		t.Fatal("get")
            	}
            }
      expect:
        - line: 11
    - name: fixture-after-test
      language: go
      kind: invalid
      fixed:
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nconst want = 1\n\nfunc TestGet(t *testing.T) {\n\tif store.Get() != want {\n\t\tt.Fatal(\"get\")\n\t}\n}"
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store.go
          body: |-
            package store

            func Get() int { return 1 }
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc TestGet(t *testing.T) {\n\tif store.Get() != want {\n\t\tt.Fatal(\"get\")\n\t}\n}\n\nconst want = 1"
      expect:
        - line: 15
    - name: helper-above-its-test
      language: go
      kind: invalid
      fixed:
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc TestGet(t *testing.T) { checkGet(t) }\n\nfunc checkGet(t *testing.T) {\n\tt.Helper()\n\t_ = store.Get()\n}"
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store.go
          body: |-
            package store

            func Get() int { return 1 }
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc checkGet(t *testing.T) {\n\tt.Helper()\n\t_ = store.Get()\n}\n\nfunc TestGet(t *testing.T) { checkGet(t) }"
      expect:
        - line: 9
    - name: fixtures-tests-helpers
      language: go
      kind: valid
      canonical: true
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store.go
          body: |-
            package store

            func Get() int { return 1 }
        - path: store_test.go
          body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nconst want = 1\n\nfunc TestGet(t *testing.T) { checkGet(t, want) }\n\nfunc checkGet(t *testing.T, want int) {\n\tt.Helper()\n\t_ = store.Get() + want\n}"
    - name: rust-fixtures-tests-helpers
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            pub fn get() -> i32 {
                1
            }

            #[cfg(test)]
            mod tests {
                use super::*;

                const WANT: i32 = 1;

                #[test]
                fn get_returns_one() {
                    check(get());
                }

                fn check(got: i32) {
                    assert_eq!(got, WANT);
                }
            }
    - name: fixture-after-test-typescript
      language: typescript
      kind: invalid
      files:
      - path: store.ts
        body: |-
          export function get(): number {
            return 1;
          }
      - path: store.test.ts
        body: |-
          import { describe, expect, it } from "vitest";
          import { get } from "./store";

          describe("get", () => {
            it("returns the wanted value", () => {
              expect(get()).toBe(want);
            });
          });

          const want = 1;
      expect:
      - line: 10
    - name: fixtures-tests-helpers-typescript
      language: typescript
      kind: valid
      files:
      - path: store.ts
        body: |-
          export function get(): number {
            return 1;
          }
      - path: store.test.ts
        body: |-
          import { describe, expect, it } from "vitest";
          import { get } from "./store";

          const want = 1;

          describe("get", () => {
            it("returns the wanted value", () => {
              expect(get()).toBe(want);
            });
          });
    - name: python-fixture-after-test-invalid
      language: python
      kind: invalid
      files:
      - path: test_store.py
        body: |-
          import pytest

          from store import Store


          def test_get_is_one(store: Store) -> None:
              assert store.get() == 1


          @pytest.fixture
          def store() -> Store:
              return Store()
      expect:
      - line: 10
    - name: python-fixture-above-test-valid
      language: python
      kind: valid
      canonical: true
      files:
      - path: test_store.py
        body: |-
          import pytest

          from store import Store


          @pytest.fixture
          def store() -> Store:
              return Store()


          def test_get_is_one(store: Store) -> None:
              assert store.get() == 1
