    - name: fixtures-tests-helpers
      language: go
      kind: valid
      canonical: true
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store.go
          body: |-
            package store

            // Get is part of the example.
            func Get() int { return 1 }
        - path: store_test.go
          body: |-
            package store_test

            import (
            	"testing"

            	"example.com/store"
            )

            const want = 1

            func TestGet(t *testing.T) { checkGet(t, want) }

            func checkGet(t *testing.T, want int) {
            	t.Helper()
            	_ = store.Get() + want
            }
    - name: rust-fixtures-tests-helpers
