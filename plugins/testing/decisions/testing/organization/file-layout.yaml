                1
            }

            #[cfg(test)]
            mod tests {
                use super::*;

                const WANT: i32 = 1;

                #[test]
                fn get_returns_one() {
                    check(get());
                }

                fn check(got: i32) {
                    assert_eq!(got, WANT);
                }
            }
