# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/no-duplicate-owner
  uid: f3a388b2-43aa-4079-a172-337a6116737f
spec:
  title: A public symbol has at most one owner test
  context: >-
    Several semantic owner tests split one public contract across places and
    let those specifications contradict. Keep one top-level owner test; make
    the rest cases of it.

    The naming convention is the language's, not a policy: its provider
    declares it (`conventions.test_naming`) and a project replaces parts of it
    in `[languages.<id>] testNaming` (`prefix`, `snakeCase`, `variants`,
    `ancestors`).

    Go: A function or type is owned by `TestName`, a method by
    `TestType_Method`. `TestGet` and `TestGet_Missing` both own `Get`: with
    variants enabled, the latter is a second owner and should instead be a
    case of the first, written with `t.Run`. A name matches the longest symbol
    it starts with, so `TestStore_Get_Missing` belongs to `Get`, not `Store`.

    Rust: A function or type is owned by the test with its snake-case name
    (`get`, `store`), a method by `type_method`. Names that merely extend a
    symbol name are not owners; two tests with exactly the same owner name in
    different test crates, or inline and in `tests/`, are duplicate owners.
  scope:
    subject: test
    examples: exclude
  requirement: >-
    A public symbol MUST NOT have multiple semantic owner test functions.
  severity: error
  options:
    properties:
      includeInternal:
        type: boolean
        default: false
        description: Also judge symbols public only inside the project.
    additionalProperties: false
  languages:
    go:
      options:
        includeInternal: true
    python:
      options:
        includeInternal: true
    rust: {}
    typescript:
      options:
        includeInternal: true
  check:
    type: cel
    select: symbol
    variables:
      - name: visible
        expression: visible_symbols(options.includeInternal)
      - name: owners
        expression: symbol.tests
    where: >-
      symbol.visibility in visible
      && (symbol.kind == 'function' || symbol.kind == 'method'
          || symbol.kind == 'type' || symbol.kind == 'interface')
      && size(owners) >= 2
    message: >-
      {{ 'public ' + symbol.kind + ' ' + symbol.name + ' has ' + string(size(owners))
         + ' owner tests; keep one top-level test and make the rest cases of it' }}
    evidence:
      symbol: symbol.id
      owner_tests: owners.map(t, t.id)
    identity:
      subject: symbol.id
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), T3 Don't Skip Trivial Tests
  examples:
  - name: duplicate-invalid
    language: go
    kind: invalid
    files:
    - path: go.mod
      body: |-
        module example.com/store

        go 1.26
    - path: store.go
      body: |-
        package store

        func Get() int { return 1 }
    - path: store_test.go
      body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc
        TestGet(t *testing.T) {\n\tif store.Get() != 1 {\n\t\tt.Fatal(\"get\")\n\t}\n}\n\nfunc
        TestGet_Missing(t *testing.T) {\n\tif store.Get() != 1 {\n\t\tt.Fatal(\"missing\")\n\t}\n}"
    expect:
    - line: 3
  - name: duplicate-valid
    language: go
    kind: valid
    canonical: true
    files:
    - path: go.mod
      body: |-
        module example.com/store

        go 1.26
    - path: store.go
      body: |-
        package store

        type Store struct{}

        func (s *Store) Get() int { return 1 }
    - path: store_test.go
      body: "package store_test\n\nimport (\n\t\"testing\"\n\n\t\"example.com/store\"\n)\n\nfunc
        TestStore(t *testing.T) {\n\ts := &store.Store{}\n\t_ = s\n}\n\nfunc TestStore_Get(t
        *testing.T) {\n\ts := &store.Store{}\n\tif s.Get() != 1 {\n\t\tt.Fatal(\"get\")\n\t}\n}"
  - name: duplicate-rust-invalid
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub fn get() -> u8 {
            1
        }
    - path: tests/first.rs
      body: |-
        #[test]
        fn get() {
            assert_eq!(workspace::get(), 1);
        }
    - path: tests/second.rs
      body: |-
        #[test]
        fn get() {
            assert_eq!(workspace::get(), 1);
        }
    expect:
    - line: 1
  - name: duplicate-rust-valid
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |-
        pub fn get() -> u8 {
            1
        }
    - path: tests/store.rs
      body: |-
        #[test]
        fn get() {
            assert_eq!(workspace::get(), 1);
        }

        #[test]
        fn get_is_stable() {
            assert_eq!(workspace::get(), workspace::get());
        }
  - name: duplicate-typescript-invalid
    language: typescript
    kind: invalid
    files:
    - path: store.ts
      body: |-
        export function get(): number {
          return 1;
        }
    - path: store.test.ts
      body: |-
        import { describe, expect, it } from "vitest";
        import { get } from "./store";

        describe("get", () => {
          it("returns one", () => {
            expect(get()).toBe(1);
          });
        });
    - path: store.spec.ts
      body: |-
        import { describe, expect, it } from "vitest";
        import { get } from "./store";

        describe("get", () => {
          it("is stable", () => {
            expect(get()).toBe(1);
          });
        });
    expect:
    - line: 1
  - name: duplicate-typescript-valid
    language: typescript
    kind: valid
    files:
    - path: store.ts
      body: |-
        export class Store {
          get(): number {
            return 1;
          }
        }
    - path: store.test.ts
      body: |-
        import { describe, expect, it } from "vitest";
        import { Store } from "./store";

        describe("Store", () => {
          it("is constructed", () => {
            expect(new Store()).toBeDefined();
          });
        });

        describe("Store.get", () => {
          it("returns one", () => {
            expect(new Store().get()).toBe(1);
          });
        });
  - name: python-duplicate-owner-invalid
    language: python
    kind: invalid
    files:
    - path: store.py
      body: |-
        def get() -> int:
            return 1
    - path: test_store.py
      body: |-
        from store import get


        def test_get() -> None:
            assert get() == 1
    - path: store_test.py
      body: |-
        from store import get


        def test_get() -> None:
            assert get() == 1
    expect:
    - line: 1
  - name: python-owner-with-cases-valid
    language: python
    kind: valid
    canonical: true
    files:
    - path: store.py
      body: |-
        class Store:
            def get(self) -> int:
                return 1
    - path: test_store.py
      body: |-
        from store import Store


        class TestStore:
            def test_is_constructed(self) -> None:
                assert Store() is not None

            def test_get_returns_one(self) -> None:
                assert Store().get() == 1
