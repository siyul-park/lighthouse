# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: testing/file-pair
  uid: b3d94e17-52c8-4a60-8e1f-7a0c6d2b5e48
spec:
  title: A test file is named after a source file
  context: >-
    A test file is read next to the source file it tests, so its name says
    which one. A test file named after no source file (a `helpers_test.go`
    that only holds a share of the tests of a large file) hides where the
    tests of a symbol are; see `testing/owner-file` for the tests themselves
    and `core/max-lines`, which asks for no split by size.

    Go: `x_test.go` pairs with `x.go` in the same directory; both
    `package x` and `package x_test` count. `export_test.go` (the file that
    exports internals to the external test package), `example_test.go` and
    `main_test.go` are Go conventions with no source file of that name.

    Rust, TypeScript and Python are not judged yet.

    There is no tool precedent; the severity is `info` until precision is
    measured at 80% or more and the project approves a stronger level.
  scope:
    subject: file
    tests: only
    examples: exclude
  languages:
    go: {}
  requirement: >-
    A test file MUST be named after a source file of its package.
  severity: info
  options:
    properties:
      allow:
        type: array
        items:
          type: string
        default: [export, example, main]
        description: >-
          Base names of test files that need no source file: Go's
          `export_test.go` and example-file conventions.
    additionalProperties: false
  check:
    type: cel
    select: file
    where: >-
      file.pair != null && file.pair.found == '' && !(file.pair.base in options.allow)
    message: >-
      {{ 'test file ' + file.path + ' has no source file ' + file.pair.base + '.go' }}
    evidence:
      test_file: file.path
      expected: file.pair.expected
    identity:
      subject: file.path
  provenance:
    wasDerivedFrom:
      - "Go standard library layout: tests of x.go are in x_test.go (https://pkg.go.dev/cmd/go#hdr-Test_packages)"
  examples:
    - name: valid-pair
      language: go
      kind: valid
      canonical: true
      files:
        - path: store.go
          body: |-
            package sample

            func Get() int { return 1 }
        - path: store_test.go
          body: |-
            package sample

            import "testing"

            func TestGet(t *testing.T) {
            	if Get() != 1 {
            		t.Fatal("get")
            	}
            }
    - name: unpaired-helpers
      language: go
      kind: invalid
      files:
        - path: store.go
          body: |-
            package sample

            func Get() int { return 1 }
        - path: helpers_test.go
          body: |-
            package sample

            import "testing"

            func TestGet(t *testing.T) {
            	if Get() != 1 {
            		t.Fatal("get")
            	}
            }
      expect:
        - line: 1
