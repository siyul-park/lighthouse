    text: "Assertions outside cases SHOULD describe setup, preconditions, or test-wide invariants, not case behavior."
    decisions:
    - testing/case-assertions
  - ref: testing#organization-05384f94
    text: "Readiness polling MUST NOT outlive teardown or retain resources after the case closes them."
