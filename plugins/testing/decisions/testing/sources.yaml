    text: "A case MUST contain the behavior it claims to specify."
    decisions:
    - testing/behavior-cases
  - ref: testing#organization-4b4e2627
    text: "Owner | Each public symbol SHOULD have one top-level test function; a missing owner test is a warning, and multiple semantic owner tests are an error."
    decisions:
    - testing/no-missing-owner
    - testing/no-duplicate-owner
  - ref: testing#organization-c3e1ee9a
    text: "Depth | At most two levels: the test function and its direct cases."
    decisions:
    - testing/max-case-depth
  - ref: testing#organization-dac1a854
    text: "Same behavior, many inputs | Use an inline anonymous struct table of named inputs and expected outputs; each entry is one case."
    decisions:
    - testing/prefer-table
  - ref: testing#organization-bd4d8f2c
    text: "Different scenarios | Use one case per scenario, named for the behavior it states."
    decisions:
    - testing/scenario-cases
  - ref: testing#organization-a47f4191
    text: "Similar cases | Merge cases that specify the same behavior into one case or one table."
    decisions:
    - testing/prefer-table
  - ref: testing#organization-17ab163b
    text: "Style | A test function uses either table cases or scenario cases, never both."
    decisions:
    - testing/consistent-case-style
  - ref: testing#organization-abc40ec2
    text: "A test SHOULD use one case style per level."
    decisions:
    - testing/consistent-case-style
