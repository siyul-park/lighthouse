---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/abbreviations
  uid: 18203a14-0d67-4227-b659-57dbe5594f03
spec:
  title: Standard abbreviations keep their spelling
  context: Nonstandard abbreviations increase the number of terms readers must learn
    and make the same concept appear under multiple spellings. Go writes common initialisms
    in capitals (golint `commonInitialisms`, revive `var-naming`); Rust writes an acronym
    as one word (Rust API Guidelines, C-CASE), so its list is empty; TypeScript does the same (Google
    TypeScript Style Guide, treat acronyms as words, so `loadHttpUrl` and not `loadHTTPURL`).
  scope:
    subject: symbol
  requirement: Names SHOULD use standard abbreviations and initialisms in their conventional
    form, such as `HTTP`, `URL`, `ID`, and `JSON`.
  severity: warn
  check:
    type: cel
    select: symbol
    variables:
    - name: spelled
      expression: "!symbol.generated ? options.initialisms.filter(w, options.style == 'lowerCamel'
        ? symbol.name.matches('[a-z0-9]' + w + '([A-Z0-9_]|$)')
        : symbol.name.matches('(^|[a-z0-9])' + w.substring(0, 1) + w.substring(1).lowerAscii()
          + '([A-Z0-9_]|$)')) : []"
    where: size(spelled) > 0
    message: "{{ symbol.name + (options.style == 'lowerCamel' ? ' uses the upper-case initialism '
      + spelled[0] + '; write it in lower camel case' : ' spells the initialism ' + spelled[0]
      + ' in lower case; write it ' + spelled[0]) }}"
    evidence:
      name: symbol.name
      initialism: spelled[0]
    identity:
      subject: symbol.id
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, coding-patterns#naming-49da70c5'
    - 'Google TypeScript Style Guide, Naming, Camel case: treat acronyms as words: https://google.github.io/styleguide/tsguide.html#naming-camel-case-defined'
  options:
    properties:
      style:
        type: string
        enum: [upper, lowerCamel]
        default: upper
        description: Whether initialisms must be uppercase or follow lowerCamelCase.
      initialisms:
        type: array
        items:
          type: string
        default:
        - ACL
        - API
        - ASCII
        - CPU
        - CSS
        - DNS
        - EOF
        - GUID
        - HTML
        - HTTP
        - HTTPS
        - ID
        - IP
        - JSON
        - LHS
        - QPS
        - RAM
        - RHS
        - RPC
        - SLA
        - SMTP
        - SQL
        - SSH
        - TCP
        - TLS
        - TTL
        - UDP
        - UI
        - UID
        - UUID
        - URI
        - URL
        - UTF8
        - VM
        - XML
        - XMPP
        - XSRF
        - XSS
        description: Initialisms that must be written in capitals, as upper-case words.
    additionalProperties: false
  languages:
    go: {}
    python: {}
    rust:
      options:
        initialisms: []
    cel:
      options:
        style: lowerCamel
    typescript:
      options:
        style: lowerCamel
  examples:
  - name: lower-case-initialism
    language: go
    kind: invalid
    files:
    - path: sample.go
      body: |
        package sample

        type Config struct{ httpUrl string }
    expect:
    - line: 3
  - name: capital-initialism
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample.go
      body: |
        package sample

        type Config struct{ httpURL string }

        func Identity() string { return "" }
  - name: acronym-as-word-rust
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |
        pub struct Config {
            pub http_url: String,
            pub uuid: String,
        }
  - name: cel-upper-case-initialism
    language: cel
    kind: invalid
    files:
    - path: decisions/example.yaml
      body: |-
        apiVersion: lighthouse/v1alpha1
        kind: Decision
        metadata: { name: example/decision }
        spec:
          title: Example
          context: Example
          scope: { subject: symbol }
          requirement: Names stay clear.
          severity: warn
          check:
            type: cel
            select: symbol
            variables:
            - name: httpURL
              expression: 'true'
            where: symbol.name == 'example'
            message: Example
    expect: [{ line: 14 }]
  - name: cel-lower-camel-initialism
    language: cel
    kind: valid
    canonical: true
    files:
    - path: decisions/example.yaml
      body: |-
        apiVersion: lighthouse/v1alpha1
        kind: Decision
        metadata: { name: example/decision }
        spec:
          title: Example
          context: Example
          scope: { subject: symbol }
          requirement: Names stay clear.
          severity: warn
          check:
            type: cel
            select: symbol
            variables:
            - name: httpUrl
              expression: 'true'
            where: symbol.name == 'example'
            message: Example

  - name: rust-configured-initialism
    language: rust
    kind: invalid
    options:
      initialisms: [HTTP]
    files:
    - path: src/lib.rs
      body: 'pub struct HttpClient;'
    expect: [{ line: 1 }]
  - name: lower-camel-typescript-invalid
    language: typescript
    kind: invalid
    files:
    - path: sample.ts
      body: |-
        export class Config {
          httpURL = "";
        }
    expect:
    - line: 2
  - name: lower-camel-typescript-valid
    language: typescript
    kind: valid
    files:
    - path: sample.ts
      body: |-
        export class Config {
          httpUrl = "";
        }

        export function userId(): string {
          return "";
        }
  - name: python-function-camel-initialism
    language: python
    kind: invalid
    files:
    - path: web/fetch.py
      body: |-
        def fetchUrl(address: str) -> str:
            return address
    expect:
    - line: 1
  - name: python-function-snake-case
    language: python
    kind: valid
    canonical: true
    files:
    - path: web/fetch.py
      body: |-
        def fetch_url(address: str) -> str:
            return address
  - name: python-class-acronym-capitalized
    language: python
    kind: valid
    files:
    - path: web/client.py
      body: |-
        class HTTPClient:
            pass
