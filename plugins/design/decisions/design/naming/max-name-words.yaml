---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/max-name-words
  uid: 5aaa4903-d259-4b31-8365-5933925d72c8
spec:
  title: Names stay within the word limit
  context: Long names cost more to read. Name words split at underscores, lower-to-upper
    transitions, and acronym boundaries (for example, `parseHTTPRequest` has three
    words).
  scope:
    subject: symbol
  languages:
    go: {}
    python: {}
    rust: {}
    cel: {}
    typescript: {}
  requirement: A name SHOULD contain no more than the configured number of words and
    SHOULD use only the qualifiers needed to distinguish its meaning.
  severity: warn
  options:
    properties:
      enabled:
        type: boolean
        default: false
        strictDefault: true
        description: Enable name-length findings in the strict project.
      maxWords:
        type: integer
        default: 3
        description: Most words a name may have.
    additionalProperties: false
  check:
    type: cel
    select: symbol
    variables:
    - name: word_count
      expression: size(symbol.words)
    where: options.enabled && word_count > options.maxWords
    message: "{{ symbol.kind + ' ' + symbol.name + ' has ' + string(word_count) +
      ' words, limit is ' + string(options.maxWords) }}"
    evidence:
      name: symbol.name
      words: word_count
      max: options.maxWords
    identity:
      subject: symbol.id
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G20 Function Names Should Say What They Do
    - Martin, Clean Code (2008), N1 Choose Descriptive Names
    - Martin, Clean Code (2008), N2 Choose Names at the Appropriate Level of Abstraction
    - Martin, Clean Code (2008), N3 Use Standard Nomenclature Where Possible
    - Martin, Clean Code (2008), N4 Unambiguous Names
    - Martin, Clean Code (2008), N6 Avoid Encodings
  examples:
  - name: words-go-long-name
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        func parseHTTPRequestBodyBytes() {}
    expect:
    - line: 3
    options:
      enabled: true
  - name: words-go-short-name
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        func parseHTTPRequest() {}
    options:
      enabled: true
    canonical: true
  - name: words-go-higher-limit
    language: go
    kind: valid
    options:
      maxWords: 5
      enabled: true
    files:
    - path: example.go
      body: |-
        package sample

        func parseHTTPRequestBodyBytes() {}
    canonical: false
  - name: words-rust-long-name
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: fn parse_http_request_body_bytes() {}
    expect:
    - line: 1
    options:
      enabled: true
  - name: words-rust-short-name
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: fn parse_http_request() {}
    options:
      enabled: true
    canonical: true
  - name: cel-too-many-name-words
    language: cel
    kind: invalid
    options: { enabled: true, maxWords: 2 }
    files:
    - path: decisions/example.yaml
      body: |-
        apiVersion: lighthouse/v1alpha1
        kind: Decision
        metadata: { name: example/decision }
        spec:
          title: Example
          context: Example
          scope: { subject: symbol }
          requirement: Names stay clear.
          severity: warn
          check:
            type: cel
            select: symbol
            variables:
            - name: veryLongIdentifierName
              expression: 'true'
            where: symbol.name == 'example'
            message: Example
    expect: [{ line: 14 }]
  - name: cel-short-name
    language: cel
    kind: valid
    canonical: true
    options: { enabled: true, maxWords: 2 }
    files:
    - path: decisions/example.yaml
      body: |-
        apiVersion: lighthouse/v1alpha1
        kind: Decision
        metadata: { name: example/decision }
        spec:
          title: Example
          context: Example
          scope: { subject: symbol }
          requirement: Names stay clear.
          severity: warn
          check:
            type: cel
            select: symbol
            variables:
            - name: shortName
              expression: 'true'
            where: symbol.name == 'example'
            message: Example
  - name: words-typescript-long-name
    language: typescript
    kind: invalid
    options:
      enabled: true
    files:
    - path: example.ts
      body: |-
        export function parseHttpRequestBodyBytes(): void {}
    expect:
    - line: 1
  - name: words-typescript-short-name
    language: typescript
    kind: valid
    options:
      enabled: true
    files:
    - path: example.ts
      body: |-
        /** Part of the example. */
        export function parseHttpRequest(): void {}
  - name: words-typescript-higher-limit
    language: typescript
    kind: valid
    options:
      maxWords: 5
      enabled: true
    files:
    - path: example.ts
      body: |-
        /** Part of the example. */
        export function parseHttpRequestBodyBytes(): void {}
  - name: python-long-name
    language: python
    kind: invalid
    options:
      enabled: true
    files:
    - path: http/parse.py
      body: |-
        def parse_http_request_body_bytes() -> None:
            ...
    expect:
    - line: 1
  - name: python-short-name
    language: python
    kind: valid
    options:
      enabled: true
    canonical: true
    files:
    - path: http/parse.py
      body: |-
        def parse_http_request() -> None:
            """Part of the example."""
            ...
  - name: python-higher-limit
    language: python
    kind: valid
    options:
      maxWords: 5
      enabled: true
    files:
    - path: http/parse.py
      body: |-
        def parse_http_request_body_bytes() -> None:
            """Part of the example."""
            ...
