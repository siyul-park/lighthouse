---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/consistent-terms
  uid: a3ada4a1-fc51-4b67-9081-0cfeb7ea23f8
spec:
  title: One concept has one term
  context: Consistent vocabulary makes cross-package APIs easier to discover. Same-named
    types are appropriate only when they represent the same concept.
  scope:
    subject: symbol
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: One term SHOULD represent one concept across packages, and one concept
    SHOULD have one term; unrelated exported types SHOULD NOT share a name.
  severity: warn
  check:
    type: cel
    select: symbol
    where: 'false'
    abstain: "!symbol.test && !symbol.generated && size(symbol.homonyms) > 0"
    message: "{{ symbol.name + ' is also exported by ' + symbol.homonyms[0] + '; review whether it names the same concept' }}"
    evidence:
      name: symbol.name
      homonyms: symbol.homonyms
    identity:
      subject: symbol.id
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, coding-patterns#naming-1fc2961d'
    - Martin, Clean Code (2008), N3 Use Standard Nomenclature Where Possible
    - Martin, Clean Code (2008), N4 Unambiguous Names
    - Martin, Clean Code (2008), G11 Inconsistency
  examples:
  - name: homonym-go
    language: go
    kind: invalid
    files:
    - path: go.mod
      body: |
        module example.com/sample

        go 1.26
    - path: first/first.go
      body: |
        package first

        type Account struct{}
    - path: second/second.go
      body: |
        package second

        type Account struct{}
  - name: distinct-names-go
    language: go
    kind: valid
    canonical: true
    files:
    - path: go.mod
      body: |
        module example.com/sample

        go 1.26
    - path: first/first.go
      body: |
        package first

        // Account is part of the example.
        type Account struct{}
    - path: second/second.go
      body: |
        package second

        // Ledger is part of the example.
        type Ledger struct{}
  - name: distinct-names-rust
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |
        pub mod first {
            /// Part of the example.
            pub struct Account;
        }
        pub mod second {
            /// Part of the example.
            pub struct Ledger;
        }

  - name: rust-inconsistent-public-terms
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Customer { pub id: u64 }
        pub fn find_client(id: u64) -> Option<Customer> { None }
        pub fn save_user(value: Customer) { let _ = value; }
  - name: rust-consistent-public-terms
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        /// Part of the example.
        pub struct Customer { pub id: u64 }
        /// Part of the example.
        pub fn find_customer(id: u64) -> Option<Customer> { None }
        /// Part of the example.
        pub fn save_customer(value: Customer) { let _ = value; }
  - name: homonym-typescript
    language: typescript
    kind: invalid
    files:
    - path: first/first.ts
      body: |-
        export class Account {}
    - path: second/second.ts
      body: |-
        export class Account {}
  - name: distinct-names-typescript
    language: typescript
    kind: valid
    files:
    - path: first/first.ts
      body: |-
        /** Part of the example. */
        export class Account {}
    - path: second/second.ts
      body: |-
        /** Part of the example. */
        export class Ledger {}
  - name: python-homonym-classes
    language: python
    kind: invalid
    files:
    - path: first/first.py
      body: |-
        class Account:
            pass
    - path: second/second.py
      body: |-
        class Account:
            pass
  - name: python-distinct-names
    language: python
    kind: valid
    canonical: true
    files:
    - path: first/first.py
      body: |-
        class Account:
            """Part of the example."""
            pass
    - path: second/second.py
      body: |-
        class Ledger:
            """Part of the example."""
            pass
