# yaml-language-server: $schema=../../schema/pack.schema.json
apiVersion: lighthouse/v1alpha1
kind: Pack
metadata:
  name: design
spec:
  title: Design Decisions
  intro: >-
    Language-neutral rules for structure, naming, APIs, ownership, errors and
    comments. Each decision states its requirement and how it is enforced;
    language-specific wording lives in its tuning.
  variables:
    # The declarations the file-order decisions place, in file order: types,
    # constants, variables, functions and methods outside interfaces and
    # function bodies. Test code and generated code are not placed, except the
    # fixtures of a test file. One value per file.
    - name: placed
      expression: >-
        file.symbols.filter(s, s.declaration && !s.generated
          && (s.file_test ? s.test_role == 'fixture' : !s.test))
    # The types a file declares, and the owners its methods name, in the order
    # the owner blocks follow each other: the types in declaration order, then
    # the owners of types declared elsewhere in the order of their methods.
    - name: owner_types
      expression: >-
        placed.filter(s, s.kind == 'type' || s.kind == 'interface')
          .map(s, {'id': s.id, 'name': s.name, 'module': s.module})
    - name: owners
      expression: >-
        (owner_types.map(t, t.id)
          + placed.filter(s, s.kind == 'method' && s.owner_key != '').map(s, s.owner_key)).distinct()
    # The group order and the hook names of the file: the options `groups` and
    # `hooks` of `design/declaration-groups`, which `design/top-down-order` reads from
    # it (`options.from`), so that the project sets them once.
    - name: groups
      expression: options.groups
    - name: hooks
      expression: options.hooks
    # The place of each placed declaration in the order of
    # `design/declaration-groups`, a number to compare: the index in `groups`
    # of the first of the declaration's candidate groups that the order names,
    # times a million, plus, in the group `method`, the rank of the declaration
    # in the block of its owner: 4 per owner block, and in the block its
    # constructors, its exported methods, its hooks, its unexported methods.
    # -1 when no group names the declaration.
    - name: place
      params: [s]
      expression: >-
        cel.bind(open, s.visibility != 'private',
        cel.bind(owner, s.kind == 'method' ? s.owner_key
            : s.kind == 'type' || s.kind == 'interface' ? s.id
            : s.kind == 'function' && open && s.constructor_named
            ? (owner_types.filter(t, t.name == s.built && t.module == s.module).map(t, t.id) + [''])[0]
            : '',
        cel.bind(inner,
            open && s.kind == 'function' && s.constructor_named ? 0
            : open && s.kind == 'method' && s.name in hooks ? 2
            : open ? 1 : 3,
        cel.bind(chosen, (
            s.kind == 'type' || s.kind == 'interface'
            ? [open ? 'public-type' : 'private-type', 'type']
            : s.kind == 'const'
            ? (s.owner_key != '' ? ['type'] : [open ? 'public-const' : 'private-const', 'const'])
            : s.kind == 'var' ? ['var']
            : s.kind == 'function'
            ? (s.name == 'init' ? ['init'] : [])
              + (owner != '' ? ['method'] : [])
              + [open ? 'public-function' : 'private-function']
            : s.kind == 'method' ? ['type', 'method']
            : []
          ).filter(c, c in groups),
          size(chosen) == 0 ? -1
          : groups.indexOf(chosen[0]) * 1000000
            + (chosen[0] == 'method'
               ? (owners.indexOf(owner) < 0 ? 0 : owners.indexOf(owner)) * 4 + inner
               : 0)))))
    # Per placed declaration, [module, place, id, name].
    - name: slots
      expression: placed.map(s, [s.module, place(s), s.id, s.name])
    - name: keys
      expression: slots.map(r, r[1])
    - name: placed_ids
      expression: slots.map(r, r[2])
    # The place of the declaration with this id, -1 when it is not placed.
    - name: declaration_group
      params: [id]
      expression: >-
        cel.bind(at, placed_ids.indexOf(id), at < 0 ? -1 : keys.slice(at, at + 1)[0])
  sections:
    - name: principles
      title: Principles
      intro: >-
        Design minimizes conceptual surface while keeping responsibility and
        ownership boundaries explicit.
      decisions: [single-responsibility, meaningful-separation, no-conjoined-modules, no-duplication, prefer-reuse, general-extraction, module-layout]
    - name: dependency-direction
      title: Dependency Direction
      intro: >-
        Dependency direction keeps stable, general code independent from
        specific policy and context.
      decisions: [layers, consumer-interfaces, no-caller-dependency]
    - name: functions
      title: Functions
      intro: >-
        Function structure should make meaningful behavior reusable and
        readable, not merely make functions smaller. Structural metrics are
        review signals, not proof of a design violation.
      decisions: [complexity, coupling, abstraction-level, signature-size, no-private-types, narrow-inputs, prefer-method, feature-envy, no-unused-symbol, no-redundant-symbol, no-speculative-generality]
    - name: naming
      title: Naming
      intro: >-
        Names should expose role, contract, or ownership with the smallest
        vocabulary that preserves the required distinction.
      decisions: [no-redundant-qualifier, max-name-words, no-type-encoding, plural-collections, predicate-names, reserved-verbs, short-names, abbreviations, consistent-terms]
    - name: types-and-apis
      title: Types and APIs
      intro: >-
        Public APIs are stable contracts: expose the minimum caller-facing
        abstraction and keep implementation state, and the ownership of mutable
        state and resources, behind its owner.
      decisions: [constructor-validation, optional-options, no-mutable-globals, state-owner, encapsulated-state, no-hybrid-type, resource-owner, scoped-borrows, stateless-layout, no-generated-edits, encapsulated-platform]
    - name: concurrency
      title: Concurrency
      intro: >-
        Concurrency rules prevent races and leaks by making shared state and
        shutdown ownership explicit.
      decisions: [context-first, no-stored-context, task-shutdown]
    - name: errors
      title: Errors
      intro: >-
        Errors are contracts: callers should be able to classify failures,
        preserve causes, and avoid leaking implementation state.
      decisions: [error-identity, no-panic, error-categories, error-translation, no-state-in-errors]
    - name: file-order
      title: File Order
      intro: >-
        Declaration order should let a reader follow ownership and behavior from
        public concepts to implementation mechanics.
      decisions: [top-down-order, vertical-distance, owner-file, declaration-groups]
    - name: comments
      title: Comments
      intro: >-
        Comments preserve facts that code cannot express; they should not
        narrate code that is already visible.
      decisions: [exported-doc, no-noise-comment, no-detached-comment, no-todo]
