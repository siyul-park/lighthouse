# yaml-language-server: $schema=../../schema/pack.schema.json
apiVersion: lighthouse/v1alpha1
kind: Pack
metadata:
  name: design
spec:
  title: Design Decisions
  intro: >-
    Language-neutral rules for structure, naming, APIs, ownership, errors and
    comments. Each decision states its requirement and how it is enforced;
    language-specific wording lives in its tuning.
  variables:
    # The declarations the file-order decisions place, in file order: types,
    # constants, variables, functions and methods outside interfaces and
    # function bodies. Test code and generated code are not placed, except the
    # fixtures of a test file. One value per file.
    - name: placed
      expression: >-
        file.symbols.filter(s, s.declaration && !s.generated
          && (s.file_test ? s.test_role == 'fixture' : !s.test))
    # The types a file declares, and the owners its methods name, in the order
    # the owner blocks follow each other: the types in declaration order, then
    # the owners of types declared elsewhere in the order of their methods.
    - name: owner_types
      expression: >-
        placed.filter(s, s.kind == 'type' || s.kind == 'interface')
          .map(s, {'id': s.id, 'name': s.name, 'module': s.module})
    # The owners, in the order the method blocks follow each other: by the
    # group of the owner's own visibility (`public-type` before `private-type`
    # as `groups` orders them; declaration order when it names neither), and
    # within a group the types in declaration order, then the owners of types
    # declared elsewhere in the order of their methods. A type declared in
    # another file ranks by its own visibility, as its methods report it.
    - name: owner_ids
      expression: >-
        (owner_types.map(t, t.id)
          + placed.filter(s, s.kind == 'method' && s.owner_key != '').map(s, s.owner_key)).distinct()
    - name: private_owner_ids
      expression: >-
        (placed.filter(s, (s.kind == 'type' || s.kind == 'interface') && s.visibility == 'private').map(s, s.id)
          + placed.filter(s, s.kind == 'method' && s.owner_visibility == 'private').map(s, s.owner_key)).distinct()
    - name: owners
      expression: >-
        !('public-type' in options.groups) && !('private-type' in options.groups) ? owner_ids
        : cel.bind(private_first, 'private-type' in options.groups
            && (!('public-type' in options.groups)
                || options.groups.indexOf('private-type') < options.groups.indexOf('public-type')),
          private_first
          ? owner_ids.filter(o, o in private_owner_ids) + owner_ids.filter(o, !(o in private_owner_ids))
          : owner_ids.filter(o, !(o in private_owner_ids)) + owner_ids.filter(o, o in private_owner_ids))
    # The owners that have a method in the file. An option builder of an owner
    # without one (`type options struct` that only `Option` configures) leads no
    # method block: it is a public function.
    - name: method_owners
      expression: placed.filter(s, s.kind == 'method' && s.owner_key != '').map(s, s.owner_key).distinct()
    # The group order and the hook names of the file: the options `groups` and
    # `hooks` of `design/declaration-groups`, which `design/top-down-order` reads from
    # it (`options.from`), so that the project sets them once.
    - name: groups
      expression: options.groups
    - name: hooks
      expression: options.hooks
    # How the `method` group is laid out: one block per owner type (`type`), or
    # by rank first and then by owner (`kind`): the option `blocks` of
    # `design/declaration-groups`.
    - name: blocks
      expression: options.blocks
    # The owner block of a declaration: the type of its module that a method,
    # a constructor or an option builder belongs to, else empty. A private free
    # function never joins an owner block: it stays in `private-function`.
    - name: owner_of
      params: [s]
      expression: >-
        s.kind == 'method' ? s.owner_key
          : s.kind == 'type' || s.kind == 'interface' ? s.id
          : s.kind == 'function' && s.configures != ''
          ? (owner_types.filter(t, t.name == s.configures && t.module == s.module).map(t, t.id) + [''])[0]
          : s.kind == 'function' && s.constructor_named
          ? (owner_types.filter(t, t.name == s.built && t.module == s.module).map(t, t.id) + [''])[0]
          : ''
    # The rank of a declaration in the block of its owner.
    - name: block_rank
      params: [s]
      expression: >-
        s.kind == 'function' && s.configures != '' ? 0
          : s.kind == 'function' && s.constructor_named ? 1
          : s.visibility != 'private' && s.kind == 'method' && s.name in hooks ? 3
          : s.visibility != 'private' ? 2 : 4
    # The groups a declaration may belong to, best first, that the order names.
    - name: candidate_groups
      params: [s, owner]
      expression: >-
        (s.kind == 'type' || s.kind == 'interface'
          ? [s.visibility != 'private' ? 'public-type' : 'private-type', 'type']
          : s.kind == 'const'
          ? (s.owner_key != '' ? ['type']
             : [s.visibility != 'private' ? 'public-const' : 'private-const', 'const'])
          : s.kind == 'var' ? ['var']
          : s.kind == 'function'
          ? (s.name == 'init' ? ['init'] : [])
            + (s.constructor_named && s.configures == '' && s.visibility == 'private' ? ['private'] : [])
            + (owner != '' && (s.configures == '' || owner in method_owners) ? ['method'] : [])
            + (s.visibility != 'private' ? ['public-function'] : ['private', 'private-function'])
          : s.kind == 'method'
          ? ['type'] + (s.visibility == 'private' ? ['private'] : []) + ['method']
          : []
        ).filter(c, c in groups)
    # The declarations of the group `private`, in file order: the private free
    # functions and the unexported methods, which that group takes out of
    # their owner blocks. Each follows every one of the declarations of the
    # group that use it (call or reference it); the ranks are the order that
    # keeps file order except for that (`list.usersFirst()`). An unexported
    # constructor is a member too, and it precedes the unexported methods of the
    # type it constructs, so that the type's block reads constructor first.
    - name: private_members
      expression: >-
        !('private' in groups) ? []
        : placed.filter(s, (candidate_groups(s, owner_of(s)) + [''])[0] == 'private')
    - name: private_ids
      expression: private_members.map(s, s.id)
    - name: private_ranks
      expression: >-
        private_members.map(s, (s.file_uses.map(u, private_ids.indexOf(u))
              + (s.kind == 'function' && s.constructor_named && owner_of(s) != ''
                 ? private_members.filter(m, m.kind == 'method' && m.owner_key == owner_of(s))
                     .map(m, private_ids.indexOf(m.id))
                 : [])).filter(i, i >= 0))
          .usersFirst()
    # The rank of a declaration of the group `private` among its users.
    - name: private_rank
      params: [id]
      expression: >-
        cel.bind(at, private_ids.indexOf(id), private_ranks.slice(at, at + 1)[0])
    # The place of each placed declaration in the order of
    # `design/declaration-groups`, a number to compare: the index in `groups`
    # of the first of the declaration's candidate groups that the order names,
    # times a million, plus, in the group `method`, the rank of the declaration
    # in the block of its owner: 5 per owner block (or, under `blocks: kind`,
    # one rank after another, each over the owners in turn), and in the block its
    # option builders (functional options: a function that returns a func
    # taking the owner, Pike 2014), its constructors (of any visibility, as
    # Uber's `newXYZ()` may follow the type), its exported methods, its hooks,
    # its unexported methods. In the group `public-function` the option builders
    # that belong to no method block (their type has no method in the file)
    # come first, then the other functions.
    # In the group `private` it is the rank among its callers (`private_ranks`).
    # -1 when no group names the declaration.
    - name: place
      params: [s]
      expression: >-
        cel.bind(owner, owner_of(s),
        cel.bind(chosen, candidate_groups(s, owner),
          size(chosen) == 0 ? -1
          : groups.indexOf(chosen[0]) * 1000000
            + (chosen[0] == 'method'
               ? cel.bind(index, owners.indexOf(owner) < 0 ? 0 : owners.indexOf(owner),
                   blocks == 'kind' ? block_rank(s) * size(owners) + index
                   : index * 5 + block_rank(s))
               : chosen[0] == 'private' ? private_rank(s.id)
               : chosen[0] == 'public-function' && s.kind == 'function' && s.configures == '' ? 1
               : 0)))
    # The blank package variables of the file (`var _ I = T`), each as [line,
    # the type it declares or asserts, empty when it has none].
    - name: blank_types
      expression: >-
        file.blocks.map(b, b.specs.filter(s, '_' in s.names)
          .map(s, [s.line, size(s.keys) == 0 ? ''
                  : s.keys[0].split('.').slice(size(s.keys[0].split('.')) - 1, size(s.keys[0].split('.')))[0]])).flatten()
    - name: blank_ids
      expression: placed.filter(s, s.kind == 'var' && s.name == '_').map(s, s.id)
    # What messages call a declaration: its name, and for a blank variable what
    # it declares or asserts, `var _ Value`, never a bare `_`.
    - name: display
      params: [s]
      expression: >-
        s.id in blank_ids
          ? 'var _' + (blank_types.filter(b, b[0] == s.line).map(b, b[1] == '' ? '' : ' ' + b[1]) + [''])[0]
          : s.name
    # Per placed declaration, [module, place, id, name, line].
    - name: slots
      expression: placed.map(s, [s.module, place(s), s.id, display(s), s.line])
    - name: keys
      expression: slots.map(r, r[1])
    - name: placed_ids
      expression: slots.map(r, r[2])
    # The place of the declaration with this id, -1 when it is not placed.
    - name: declaration_group
      params: [id]
      expression: >-
        cel.bind(at, placed_ids.indexOf(id), at < 0 ? -1 : keys.slice(at, at + 1)[0])
    # Whether the declaration `id` lies, in the layout of the `method` group,
    # between the members `first` and `last` (both of the group, `first` not
    # after `last`): under `blocks: kind` a type's members are spread over the
    # rank segments, and what the layout puts between them belongs there.
    # Under `blocks: type` a type's members are one block: nothing but its own
    # lies between them.
    - name: laid_between
      params: [first, last, id]
      expression: >-
        blocks == 'kind' && groups.indexOf('method') >= 0
          ? cel.bind(lo, declaration_group(first),
            cel.bind(hi, declaration_group(last),
            cel.bind(at, declaration_group(id),
              lo >= 0 && at >= lo && at <= hi
              && lo / 1000000 == groups.indexOf('method') && hi / 1000000 == lo / 1000000
              && at / 1000000 == lo / 1000000)))
          : false
    # The name of the caller in the group `private` that comes last in the
    # order of its ranks, for the declaration with this id; empty when it has
    # none: the declaration it must follow.
    - name: last_user
      params: [id]
      expression: >-
        cel.bind(at, private_ids.indexOf(id),
          at < 0 ? ''
          : cel.bind(callers, private_members.filter(m, id in m.file_uses)
                .sortBy(m, private_rank(m.id)),
            size(callers) == 0 ? '' : callers.slice(size(callers) - 1, size(callers))[0].name))
    # Whether the declaration with this id is in the group `private`, where the
    # callers decide the order of the members, not their owners.
    - name: in_private
      params: [id]
      expression: private_ids.indexOf(id) >= 0
    # The anchor of a declaration, by id: the first declaration above it in its
    # module whose place is greater, with its id, name, line and place; empty
    # when none is, or the declaration is not placed.
    - name: anchor
      params: [id]
      expression: >-
        cel.bind(at, placed_ids.indexOf(id),
          at < 0 ? {}
          : cel.bind(me, slots.slice(at, at + 1)[0],
            (slots.slice(0, at).filter(r, r[0] == me[0] && r[1] > me[1])
              .map(r, {'id': r[2], 'name': r[3], 'line': r[4], 'place': r[1]}) + [{}])[0]))
  sections:
    - name: principles
      title: Principles
      intro: >-
        Design minimizes conceptual surface while keeping responsibility and
        ownership boundaries explicit.
      decisions: [single-responsibility, meaningful-separation, no-conjoined-modules, no-duplication, prefer-reuse, general-extraction, module-layout]
    - name: dependency-direction
      title: Dependency Direction
      intro: >-
        Dependency direction keeps stable, general code independent from
        specific policy and context.
      decisions: [layers, consumer-interfaces, no-caller-dependency]
    - name: functions
      title: Functions
      intro: >-
        Function structure should make meaningful behavior reusable and
        readable, not merely make functions smaller. Structural metrics are
        review signals, not proof of a design violation.
      decisions: [complexity, no-single-line-bodies, coupling, abstraction-level, signature-size, no-private-types, narrow-inputs, prefer-method, feature-envy, no-unused-symbol, no-redundant-symbol, no-speculative-generality]
    - name: naming
      title: Naming
      intro: >-
        Names should expose role, contract, or ownership with the smallest
        vocabulary that preserves the required distinction.
      decisions: [no-redundant-qualifier, max-name-words, no-type-encoding, plural-collections, predicate-names, reserved-verbs, short-names, abbreviations, consistent-terms]
    - name: types-and-apis
      title: Types and APIs
      intro: >-
        Public APIs are stable contracts: expose the minimum caller-facing
        abstraction and keep implementation state, and the ownership of mutable
        state and resources, behind its owner.
      decisions: [constructor-validation, optional-options, no-mutable-globals, state-owner, encapsulated-state, no-hybrid-type, resource-owner, scoped-borrows, stateless-layout, no-generated-edits, encapsulated-platform]
    - name: concurrency
      title: Concurrency
      intro: >-
        Concurrency rules prevent races and leaks by making shared state and
        shutdown ownership explicit.
      decisions: [context-first, no-stored-context, task-shutdown]
    - name: errors
      title: Errors
      intro: >-
        Errors are contracts: callers should be able to classify failures,
        preserve causes, and avoid leaking implementation state.
      decisions: [error-identity, no-panic, error-categories, error-translation, no-state-in-errors]
    - name: file-order
      title: File Order
      intro: >-
        Declaration order should let a reader follow ownership and behavior from
        public concepts to implementation mechanics.
      decisions: [top-down-order, vertical-distance, owner-file, declaration-groups, declaration-blocks]
    - name: comments
      title: Comments
      intro: >-
        Comments preserve facts that code cannot express; they should not
        narrate code that is already visible.
      decisions: [exported-doc, no-noise-comment, no-detached-comment, no-todo]
