---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/no-unused-symbol
  uid: 4f502549-fd00-41e2-a2f4-017f7afad2ad
spec:
  title: Unused private symbols are removed
  context: A private symbol that is not called or referenced is dead code. Interface
    declarations, bodyless functions, generated declarations and test fixtures are
    not unused implementations; Rust dead-code analysis stays with rustc because it
    understands type positions and macro arguments.
  scope:
    subject: symbol
    examples: exclude
  requirement: An unused private function, method, variable or other configured symbol
    MUST be removed unless it is a fixture, an entry point, or a declaration implemented
    elsewhere.
  severity: error
  options:
    properties:
      symbols:
        type: array
        items:
          type: string
          enum:
          - function
          - method
          - type
          - interface
          - const
          - var
        default:
        - function
        - method
        - var
        description: Private symbol kinds checked for dead code.
    additionalProperties: false
  languages:
    go: {}
    python: {}
    rust:
      options:
        symbols: []
    cel: {}
    typescript: {}
  check:
    type: cel
    select: symbol
    variables:
    - name: declared
      expression: symbol.owner_kind == 'interface' || (symbol.func == null && symbol.kind
        in ['function', 'method'])
    - name: matched
      expression: |-
        symbol.visibility == 'private'
        && symbol.kind in options.symbols
        && !declared
        && size(symbol.callers) == 0 && size(symbol.references) == 0
        && !symbol.implementation && symbol.test_role == ''
        && !(symbol.name in ['main','init','_']) ? ['dead'] : []
    where: size(matched) > 0
    message: "{{ symbol.name + ' is never used; delete it' }}"
    evidence:
      kind: "'dead'"
      symbol: symbol.id
    identity:
      subject: symbol.id
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G9 Dead Code
    - Martin, Clean Code (2008), F4 Dead Function
    - Martin, Clean Code (2008), G12 Clutter
    - Martin, Clean Code (2008), ch. 12 Beck's four rules
    - Ousterhout, A Philosophy of Software Design (2018), chs. 4 and 9
    - Fowler, Refactoring (2nd ed., 2018), Inline Function, Lazy Element, Middle Man
  examples:
  - name: dead-go-invalid
    language: go
    kind: invalid
    files:
    - path: example.go
      body: |-
        package sample

        func Run() int { return helper() }

        func helper() int { return 1 }

        func unused() int { return 2 }
    expect:
    - line: 7
  - name: dead-go-valid
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        func Run() int { return helper() }

        func helper() int { return 1 }
    canonical: true
  - name: dead-go-interface-member
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        type marker interface {
            isMarker()
        }

        type node struct{}

        func (node) isMarker() {}

        func Mark(m marker) bool { return m != nil }
  - name: go-used-private-helper
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        func exit() {}

        func Run() int {
            exit()
            return 1
        }
  - name: dead-rust-off
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub fn run() -> i32 {
            helper()
        }

        fn helper() -> i32 {
            1
        }

        fn unused() -> i32 {
            2
        }
    canonical: true
  - name: cel-unused-variable
    language: cel
    kind: invalid
    files:
    - path: decisions/example.yaml
      body: |-
        apiVersion: lighthouse/v1alpha1
        kind: Decision
        metadata: { name: example/decision }
        spec:
          title: Example
          context: Example
          scope: { subject: symbol }
          requirement: Declare only used variables.
          severity: warn
          check:
            type: cel
            select: symbol
            variables:
            - name: unusedValue
              expression: '1'
            where: symbol.name == 'example'
            message: Example
    expect: [{ line: 14 }]
  - name: cel-used-variable
    language: cel
    kind: valid
    canonical: true
    files:
    - path: decisions/example.yaml
      body: |-
        apiVersion: lighthouse/v1alpha1
        kind: Decision
        metadata: { name: example/decision }
        spec:
          title: Example
          context: Example
          scope: { subject: symbol }
          requirement: Declare only used variables.
          severity: warn
          check:
            type: cel
            select: symbol
            variables:
            - name: usedValue
              expression: '1'
            where: usedValue == 1
            message: Example

  - name: rust-unused-private-function
    language: rust
    kind: invalid
    options:
      symbols: [function]
    files:
    - path: src/lib.rs
      body: |-
        pub fn used() {}
        fn unused() {}
    expect: [{ line: 2 }]
  - name: rust-private-functions-used
    language: rust
    kind: valid
    options:
      symbols: [function]
    files:
    - path: src/lib.rs
      body: |-
        fn helper() {}
        pub fn used() { helper(); }
    canonical: false
  - name: dead-typescript-invalid
    language: typescript
    kind: invalid
    files:
    - path: example.ts
      body: |-
        export function run(): number {
          return helper();
        }

        function helper(): number {
          return 1;
        }

        function unused(): number {
          return 2;
        }
    expect:
    - line: 9
  - name: dead-typescript-valid
    language: typescript
    kind: valid
    files:
    - path: example.ts
      body: |-
        export function run(): number {
          return helper();
        }

        function helper(): number {
          return 1;
        }
  - name: dead-typescript-private-method-invalid
    language: typescript
    kind: invalid
    files:
    - path: example.ts
      body: |-
        export class Store {
          get(): number {
            return this.read();
          }

          private read(): number {
            return 1;
          }

          private unused(): number {
            return 2;
          }
        }
    expect:
    - line: 10
  - name: used-as-a-value-typescript-valid
    language: typescript
    kind: valid
    files:
    - path: example.ts
      body: |-
        export function run(items: number[]): number[] {
          return items.map(double);
        }

        function double(n: number): number {
          return n * 2;
        }
  - name: dead-javascript-invalid
    language: typescript
    kind: invalid
    files:
    - path: example.js
      body: |-
        function run() {
          return helper();
        }

        function helper() {
          return 1;
        }

        function unused() {
          return 2;
        }

        module.exports = { run };
    expect:
    - line: 9
  - name: python-unused-private-function
    language: python
    kind: invalid
    files:
    - path: text/trim.py
      body: |-
        def _collapse(text: str) -> str:
            return " ".join(text.split())


        def trim(text: str) -> str:
            return text.strip()
    expect:
    - line: 1
  - name: python-used-private-function
    language: python
    kind: valid
    canonical: true
    files:
    - path: text/trim.py
      body: |-
        def _collapse(text: str) -> str:
            return " ".join(text.split())


        def trim(text: str) -> str:
            return _collapse(text.strip())
