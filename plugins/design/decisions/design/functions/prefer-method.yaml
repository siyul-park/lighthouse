---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/prefer-method
  uid: de49963a-a976-4135-8cf0-a9ec748353bc
spec:
  title: Behavior lives with its owner
  context: Where a function lives tells readers who owns behavior. A private free
    function called only by methods of one type and that uses or takes that owner
    is likely that type's behavior under a separate name. Constructors, main and init
    are not reported. Feature envy and cross-module placement are separate review
    decisions.
  scope:
    subject: symbol
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: Methods SHOULD express receiver-owned behavior; a private free function
    called only by methods of one type SHOULD be a method of that type unless it is
    a genuine reusable helper.
  severity: warn
  options:
    properties:
      requireOwnerParam:
        type: boolean
        default: false
        description: Report only functions that take a value of the owner type as
          a parameter, the strongest sign that the owner should be the receiver. By
          default a function that takes one or calls or references the owner or one
          of its members is reported; a function that does neither is a helper with
          no more to do with the owner than with any other type.
    additionalProperties: false
  check:
    type: cel
    select: function
    variables:
    - name: affinity
      expression: func.receiver_affinity
    - name: free
      expression: func.kind == 'function' && func.name != 'main' && func.name != 'init'
    - name: method
      expression: free && func.visibility == 'private' && !func.constructor_named
        && size(func.references) == 0 && size(affinity) > 0 && (affinity.takes_owner_param
        || affinity.uses_owner) && !(options.requireOwnerParam && !affinity.takes_owner_param)
    where: method
    message: "{{ 'private function ' + func.name + ' is called only by methods of
      ' + affinity.owner_name + '; consider making it a method of ' + affinity.owner_name
      }}"
    evidence:
      kind: "'method'"
      owner: affinity.owner
      callers: affinity.callers
      takes_owner_param: affinity.takes_owner_param
      uses_owner: affinity.uses_owner
    identity:
      subject: func.id
  fix:
    type: model
    safety: unsafe
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G14 Feature Envy
    - Martin, Clean Code (2008), G17 Misplaced Responsibility
    - Martin, Clean Code (2008), G18 Inappropriate Static
  examples:
  - name: only-one-owner-calls
    language: go
    kind: invalid
    files:
    - path: example.go
      body: "package sample\n\ntype Store struct{ items []int }\n\nfunc (s *Store)
        Total() int { return sum(s) }\n\nfunc (s *Store) Count() int { return len(s.items)
        + sum(s) - sum(s) }\n\nfunc sum(s *Store) int {\n\ttotal := 0\n\tfor _, i
        := range s.items {\n\t\ttotal += i\n\t}\n\treturn total\n}"
    expect:
    - line: 9
  - name: shared-by-a-free-function
    language: go
    kind: valid
    files:
    - path: example.go
      body: "package sample\n\ntype Store struct{ items []int }\n\nfunc (s *Store)
        Total() int { return sum(s) }\n\nfunc Sum(s *Store) int { return sum(s) }\n\nfunc
        sum(s *Store) int {\n\ttotal := 0\n\tfor _, i := range s.items {\n\t\ttotal
        += i\n\t}\n\treturn total\n}"
    canonical: true
  - name: helper-unrelated-to-the-owner
    language: go
    kind: valid
    files:
    - path: example.go
      body: "package sample\n\ntype Store struct{ items []int }\n\nfunc (s *Store)
        Total() int { return sum(s.items) }\n\nfunc sum(items []int) int {\n\ttotal
        := 0\n\tfor _, i := range items {\n\t\ttotal += i\n\t}\n\treturn total\n}"
    canonical: false
  - name: constructor-called-by-method
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        type Store struct{ items []int }

        func (s *Store) Reset() *Store { return newStore() }

        func newStore() *Store { return &Store{items: []int{}} }
    canonical: false
  - name: rust-only-one-owner-calls
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            items: Vec<i32>,
        }

        impl Store {
            pub fn total(&self) -> i32 {
                sum(self)
            }

            pub fn count(&self) -> i32 {
                self.items.len() as i32 + sum(self)
            }
        }

        fn sum(store: &Store) -> i32 {
            let mut total = 0;
            for i in &store.items {
                total += i;
            }
            total
        }
    expect:
    - line: 15
  - name: rust-shared-by-a-free-function
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
            items: Vec<i32>,
        }

        impl Store {
            pub fn total(&self) -> i32 {
                sum(self)
            }
        }

        pub fn total_of(store: &Store) -> i32 {
            sum(store)
        }

        fn sum(store: &Store) -> i32 {
            let mut total = 0;
            for i in &store.items {
                total += i;
            }
            total
        }
    canonical: true
  - name: only-one-owner-calls-typescript
    language: typescript
    kind: invalid
    files:
    - path: example.ts
      body: |-
        export class Store {
          items: number[] = [];

          total(): number {
            return sum(this);
          }

          count(): number {
            return this.items.length + sum(this) - sum(this);
          }
        }

        function sum(store: Store): number {
          let total = 0;
          for (const item of store.items) {
            total += item;
          }
          return total;
        }
    expect:
    - line: 13
  - name: shared-by-an-exported-function-typescript
    language: typescript
    kind: valid
    files:
    - path: example.ts
      body: |-
        export class Store {
          items: number[] = [];

          total(): number {
            return sum(this);
          }
        }

        export function totalOf(store: Store): number {
          return sum(store);
        }

        function sum(store: Store): number {
          let total = 0;
          for (const item of store.items) {
            total += item;
          }
          return total;
        }
  - name: helper-unrelated-to-the-owner-typescript
    language: typescript
    kind: valid
    files:
    - path: example.ts
      body: |-
        export class Store {
          items: number[] = [];

          total(): number {
            return sum(this.items);
          }
        }

        function sum(items: number[]): number {
          let total = 0;
          for (const item of items) {
            total += item;
          }
          return total;
        }
  - name: python-only-one-owner-calls
    language: python
    kind: invalid
    files:
    - path: stock/store.py
      body: |-
        class Store:
            def __init__(self) -> None:
                self.items: list[int] = []

            def total(self) -> int:
                return _sum_store(self)

            def count(self) -> int:
                return len(self.items) + _sum_store(self) - _sum_store(self)


        def _sum_store(store: Store) -> int:
            return sum(store.items)
    expect:
    - line: 12
  - name: python-shared-by-exported-function
    language: python
    kind: valid
    canonical: true
    files:
    - path: stock/store.py
      body: |-
        class Store:
            def __init__(self) -> None:
                self.items: list[int] = []

            def total(self) -> int:
                return _sum_store(self)


        def total_of(store: Store) -> int:
            return _sum_store(store)


        def _sum_store(store: Store) -> int:
            return sum(store.items)
