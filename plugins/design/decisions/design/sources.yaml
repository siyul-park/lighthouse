---
apiVersion: lighthouse/v1alpha1
kind: SourceMap
metadata:
  name: sources
spec:
  sources:
  - ref: coding-patterns#design-f6344382
    text: "Required behavior MUST use the fewest necessary symbols and least necessary code without weakening boundaries."
    decisions:
    - design/no-unused-symbol
    - design/no-redundant-symbol
  - ref: coding-patterns#design-de507f87
    text: "Every symbol MUST earn its existence through a distinct responsibility, invariant, ownership boundary, or reusable abstraction."
    decisions:
    - design/no-unused-symbol
    - design/no-redundant-symbol
  - ref: coding-patterns#design-dc82328b
    text: "Each behavior MUST have one implementation and each semantic rule MUST have one owner."
    decisions:
    - design/no-duplication
    - design/no-redundant-symbol
  - ref: coding-patterns#design-596525ee
    text: "Each symbol MUST have one coherent responsibility, a narrow contract, and sufficient scope for every legitimate caller."
    decisions:
    - design/single-responsibility
    - design/meaningful-separation
  - ref: coding-patterns#design-b19af147
    text: "Unrelated roles MUST NOT be combined merely to force reuse."
    decisions:
    - design/meaningful-separation
    - design/no-conjoined-modules
  - ref: coding-patterns#dependency-direction-cbed7b1d
    text: "A symbol MUST NOT depend on code that is more specific, more context-dependent, or less stable than itself."
    decisions:
    - design/layers
  - ref: coding-patterns#dependency-direction-278c4f1e
    text: "Lower-level or reusable symbols MUST express their responsibility in the most general form that fully fits it and MUST NOT depend on caller-specific policy, types, lifecycle, or semantics."
    decisions:
    - design/no-caller-dependency
  - ref: coding-patterns#dependency-direction-1f1b1fc1
    text: "Higher-level code MAY depend on lower-level code when that code is general and context-independent; lower-level code MUST NOT depend on its callers."
    decisions:
    - design/layers
    - design/no-caller-dependency
  - ref: coding-patterns#dependency-direction-53be7fb8
    text: "Shared functionality MUST be generalized when extracted; it MUST NOT be moved downward merely to relocate complexity."
    decisions:
    - design/general-extraction
  - ref: coding-patterns#physical-cohesion-547f3a8e
    text: "Symbols with one owner and cohesive responsibility MUST share a file."
    decisions:
    - design/owner-file
  - ref: coding-patterns#physical-cohesion-65fb9347
    text: "Strongly related symbols MUST be physically close; direct collaborators SHOULD be adjacent."
    decisions:
    - design/vertical-distance
  - ref: coding-patterns#physical-cohesion-ca6a85dd
    text: "Files and declaration order MUST make ownership, responsibility, and relationships easy to read."
    decisions:
    - design/top-down-order
    - design/owner-file
  - ref: coding-patterns#physical-cohesion-9cf2f03b
    text: "Physical separation MUST represent a real responsibility, ownership, or abstraction boundary."
    decisions:
    - design/meaningful-separation
    - design/owner-file
  - ref: coding-patterns#structural-rules-598c8922
    text: "**Abstract semantic duplication.** Multiple implementations of the same behavior or rule MUST converge on one owner; syntax similarity alone MUST NOT trigger abstraction."
    decisions:
    - design/no-duplication
  - ref: coding-patterns#structural-rules-94592840
    text: "**Merge overlapping symbols.** Symbols with substantially the same responsibility at the same abstraction level MUST be consolidated; prefer one general symbol over parallel variants, wrappers, aliases, or coordinators."
    decisions:
    - design/no-redundant-symbol
  - ref: coding-patterns#structural-rules-dbd77a89
    text: "**Split real boundaries.** Separate symbols only when responsibility, invariant, ownership, lifecycle, or abstraction level differs."
    decisions:
    - design/meaningful-separation
    - design/no-conjoined-modules
  - ref: coding-patterns#structural-rules-8036b176
    text: "**Reuse before extension.** Prefer existing symbols and composition before adding layers, extension points, policy knobs, or parallel mechanisms."
    decisions:
    - design/prefer-reuse
  - ref: coding-patterns#structural-signals-a6200267
    text: "Consider cyclomatic complexity with statement count and nesting depth."
    decisions:
    - design/complexity
  - ref: coding-patterns#structural-signals-01978ee3
    text: "Consider coupling with direct fan-in, fan-out, and dependency depth."
    decisions:
    - design/coupling
  - ref: coding-patterns#structural-signals-e07fba6b
    text: "Near-clone analysis SHOULD require meaningful body size and a semantic or naming relation; syntax similarity alone MUST NOT require abstraction."
    decisions:
    - design/no-duplication
  - ref: coding-patterns#structural-signals-83834735
    text: "Similar or symmetric siblings SHOULD be adjacent when they share an owner and implementation shape."
    decisions:
    - design/vertical-distance
  - ref: coding-patterns#structural-signals-6343159a
    text: "Metrics MUST NOT define universal declaration order, justify automatic reordering, or prove single responsibility."
    decisions:
    - design/complexity
  - ref: coding-patterns#structural-signals-bccfd6a4
    text: "Prefer mechanical checks for directly expressible rules; heuristic signals SHOULD remain advisory and use deliberately high thresholds."
    omitted: "catalog policy, not a code property"
  - ref: coding-patterns#functions-30019ba3
    text: "A helper MUST be extracted only to remove semantic duplication, name reusable behavior or policy, isolate an abstraction level, or serve as a function value."
    decisions:
    - design/no-redundant-symbol
    - design/general-extraction
  - ref: coding-patterns#functions-be8f45fd
    text: "A private helper SHOULD have at least two callers."
    decisions:
    - design/no-redundant-symbol
  - ref: coding-patterns#functions-3419f6c9
    text: "A simple single-use wrapper SHOULD be inlined unless its name expresses a real policy or mechanic; complex one-use mechanics require review rather than mechanical removal."
    decisions:
    - design/no-redundant-symbol
  - ref: coding-patterns#functions-366c92d3
    text: "Methods SHOULD express receiver-owned behavior; package functions SHOULD express construction or behavior with no natural receiver."
    decisions:
    - design/prefer-method
    - design/feature-envy
  - ref: coding-patterns#functions-7ff6fb85
    text: "One function MUST stay at one abstraction level."
    decisions:
    - design/abstraction-level
  - ref: coding-patterns#physical-cohesion-7201ff97
    text: "Direct implementation files and child modules SHOULD form one coherent abstraction level."
    decisions:
    - design/module-layout
  - ref: coding-patterns#functions-2623228e
    text: "Declarations MUST be ordered for reading: callers before callees, related symbols adjacent, and cohesive implementations together."
    decisions:
    - design/top-down-order
    - design/vertical-distance
  - ref: coding-patterns#naming-1fc2961d
    text: "One term MUST represent one concept across packages."
    decisions:
    - design/consistent-terms
  - ref: coding-patterns#naming-7293803e
    text: "One word SHOULD be the default; a multi-word name MUST add only the minimum qualifier needed to express a distinction."
    decisions:
    - design/max-name-words
    - design/no-redundant-qualifier
  - ref: coding-patterns#naming-3fa87af5
    text: "Package, receiver, phase, or representation MUST NOT be repeated without meaning."
    decisions:
    - design/no-redundant-qualifier
    - design/no-type-encoding
  - ref: coding-patterns#naming-49da70c5
    text: "Standard abbreviations MUST be kept: `ID`, `IP`, `ABI`, `JIT`, `VM`, `SSA`, `CFG`, `GVN`, `DCE`."
    decisions:
    - design/abbreviations
  - ref: coding-patterns#naming-eb4a4ae5
    text: "One-letter names MUST be limited to conventional receivers, indexes, and tiny scopes."
    decisions:
    - design/short-names
  - ref: coding-patterns#naming-6cd80925
    text: "`HasX` | contains or registers X"
    decisions:
    - design/predicate-names
  - ref: coding-patterns#naming-88b5f6bb
    text: "`IsX` | state predicate"
    decisions:
    - design/predicate-names
  - ref: coding-patterns#naming-1daea9c6
    text: "`MatchX` | comparison or validation against X"
    decisions:
    - design/predicate-names
  - ref: coding-patterns#naming-a0778391
    text: "`X` | direct boolean value"
    decisions:
    - design/predicate-names
  - ref: coding-patterns#naming-a99c562e
    text: "`At` MUST be used for position/time predicates."
    decisions:
    - design/predicate-names
  - ref: coding-patterns#naming-f81fdf16
    text: "`Build`, `Compile`, `Publish`, `Capture`, and `Use` MUST be reserved for actions or transitions."
    decisions:
    - design/reserved-verbs
  - ref: coding-patterns#naming-ab64e5fb
    text: "Capability names MUST be singular; collections and stores MUST be plural."
    decisions:
    - design/plural-collections
  - ref: coding-patterns#types-and-apis-99a0c39c
    text: "Interfaces MUST be used only when callers supply behavior and MUST be defined where that behavior is consumed."
    decisions:
    - design/consumer-interfaces
  - ref: coding-patterns#types-and-apis-f4a27ffd
    text: "Public inputs SHOULD use the narrowest reusable abstraction that fully expresses the contract; public outputs SHOULD use the most concrete public type unless polymorphism is itself the contract."
    decisions:
    - design/narrow-inputs
  - ref: coding-patterns#types-and-apis-aed3aa66
    text: "Public APIs MUST be usable without callers naming private types."
    decisions:
    - design/no-private-types
  - ref: coding-patterns#types-and-apis-0e075b7e
    text: "Exported types SHOULD expose contract rather than mutable implementation state; data-only values and ABI bridge types MAY expose their fields."
    decisions:
    - design/encapsulated-state
    - design/no-hybrid-type
  - ref: coding-patterns#types-and-apis-411f8630
    text: "Constructors MUST require inputs with no safe default and MUST validate required dependencies and shape; `Build` MUST validate a complete builder."
    decisions:
    - design/constructor-validation
  - ref: coding-patterns#types-and-apis-6bc1728e
    text: "Required constructor values MUST be passed as arguments; optional values MUST be injected through functional options."
    decisions:
    - design/optional-options
  - ref: coding-patterns#types-and-apis-3c270f36
    text: "Generic parameter-group types, speculative options, extension points, aliases, and pass-through wrappers MUST NOT be exposed without a distinct contract."
    decisions:
    - design/no-speculative-generality
  - ref: coding-patterns#ownership-b242fb18
    text: "One symbol MUST own each mutable state and its transitions."
    decisions:
    - design/state-owner
  - ref: coding-patterns#ownership-79f5e61f
    text: "Private state belongs to its owner."
    decisions:
    - design/encapsulated-state
  - ref: coding-patterns#ownership-1b398d4a
    text: "An unexported implementation component MAY access its exported owner's private state when it implements that owner's responsibility; unrelated same-package code MUST use the owner's contract."
    decisions:
    - design/encapsulated-state
  - ref: coding-patterns#ownership-c85ed7a6
    text: "Borrowed values MUST NOT cross or outlive their ownership boundary."
    decisions:
    - design/scoped-borrows
  - ref: coding-patterns#ownership-91d95023
    text: "Retain/release and resource transitions MUST have one owner, and each resource MUST be released exactly once."
    decisions:
    - design/resource-owner
  - ref: coding-patterns#ownership-0b016255
    text: "Layout-only declarations MAY name private members but MUST NOT access runtime state."
    decisions:
    - design/stateless-layout
  - ref: coding-patterns#concurrency-ac98e6a0
    text: "Shared mutable state MUST have one owner and one synchronization strategy."
    decisions:
    - design/state-owner
  - ref: coding-patterns#concurrency-c49e7b37
    text: "Long-lived goroutines MUST have an explicit shutdown path."
    decisions:
    - design/task-shutdown
  - ref: coding-patterns#concurrency-e88afbda
    text: "Blocking, I/O, and process-boundary operations MUST take context first."
    decisions:
    - design/context-first
  - ref: coding-patterns#concurrency-162fbcb1
    text: "Request contexts MUST NOT be stored in long-lived objects."
    decisions:
    - design/no-stored-context
  - ref: coding-patterns#errors-c53f8cf1
    text: "Semantic errors MUST use stable `ErrXxx` sentinels."
    decisions:
    - design/error-identity
  - ref: coding-patterns#errors-013589e0
    text: "Dependency identity MUST be preserved when callers depend on it; use `%w` when adding context."
    decisions:
    - design/error-identity
  - ref: coding-patterns#errors-2de6c4b7
    text: "Error categories MUST be translated only at their owning boundary."
    decisions:
    - design/error-translation
  - ref: coding-patterns#errors-b0da56b2
    text: "Semantic categories MUST NOT be created with `fmt.Errorf` alone."
    decisions:
    - design/error-categories
  - ref: coding-patterns#errors-c039c75d
    text: "Errors MUST NOT expose private or sensitive process state."
    decisions:
    - design/no-state-in-errors
  - ref: coding-patterns#errors-fc4988d9
    text: "Panic MUST be limited to impossible programmer errors, `Must*` APIs, or documented hot-path invariants with one recovery boundary."
    decisions:
    - design/no-panic
  - ref: coding-patterns#errors-4d6e8249
    text: "Normal runtime failures MUST return errors."
    decisions:
    - design/no-panic
  - ref: coding-patterns#file-order-4ab2e7c7
    text: "Within a Go file, package-level declarations MUST appear in this order:"
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-1aefb9e2
    text: "public types"
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-a64ea628
    text: "private types"
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-d68c8bb6
    text: "public constants"
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-1a985fed
    text: "private constants"
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-7af0b3e4
    text: "variables"
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-c3e11131
    text: "all `init` functions"
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-b29e522a
    text: "public options/functions"
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-81faa7b6
    text: "public constructors"
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-06a43229
    text: "public methods"
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-7edda99c
    text: "clone/conversion and interface hooks"
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-ab2964f6
    text: "private functions/methods"
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-c6b09a72
    text: "`init` functions MUST stay together and MUST precede non-`init` functions and methods."
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-f1941732
    text: "A cohesive implementation MUST read from higher-level behavior toward shared machinery."
    decisions:
    - design/top-down-order
  - ref: coding-patterns#file-order-f4da8d4a
    text: "Callers MUST precede exclusive helpers; symmetric counterparts SHOULD be adjacent; shared leaves MUST follow the code that uses them."
    decisions:
    - design/top-down-order
    - design/vertical-distance
  - ref: coding-patterns#file-order-3990c601
    text: "Within one type, constructors MUST precede other behavior."
    decisions:
    - design/declaration-groups
  - ref: coding-patterns#file-order-91cd3473
    text: "These ordering rules MUST NOT justify artificial file splits, wrappers, or duplicated helpers."
    decisions:
    - design/owner-file
    - design/no-redundant-symbol
  - ref: coding-patterns#comments-fc101736
    text: "Comments MAY be added only when clearly necessary to preserve:"
    decisions:
    - design/no-noise-comment
  - ref: coding-patterns#comments-a59ae8e3
    text: "invariants and consequences;"
    decisions:
    - design/no-noise-comment
  - ref: coding-patterns#comments-de4382f9
    text: "external or cross-package constraints;"
    decisions:
    - design/no-noise-comment
  - ref: coding-patterns#comments-9c2d685b
    text: "rejected alternatives with evidence;"
    decisions:
    - design/no-noise-comment
  - ref: coding-patterns#comments-a385f170
    text: "external contracts or specifications."
    decisions:
    - design/no-noise-comment
  - ref: coding-patterns#comments-d0e247e3
    text: "Necessary comments MUST state the smallest sufficient fact, constraint, invariant, or consequence."
    decisions:
    - design/no-noise-comment
  - ref: coding-patterns#comments-1246d21a
    text: "Comments MUST NOT narrate code, restate names, label control-flow phases, or explain obvious behavior. Prefer a better name, type, or structure."
    decisions:
    - design/no-noise-comment
  - ref: coding-patterns#comments-f522539c
    text: "Exported symbols SHOULD have normal Go doc comments. Public API changes SHOULD document user-visible behavior, constraints, ownership, or other facts the code cannot express."
    decisions:
    - design/exported-doc
  - ref: coding-patterns#generated-and-platform-code-fc6a81b6
    text: "Generated files MUST change only through their generator."
    decisions:
    - design/no-generated-edits
  - ref: coding-patterns#generated-and-platform-code-0669c79d
    text: "Platform mechanics MUST stay behind matching build constraints and owner packages."
    decisions:
    - design/encapsulated-platform
