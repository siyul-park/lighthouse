# yaml-language-server: $schema=../../../schema/decision.schema.json
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/declaration-groups
  uid: 2ddd0282-b9b3-4537-8e54-b9c0fbfbc4ad
spec:
  title: Declarations follow ownership groups
  context: >-
    A fixed group order makes every file predictable.

    Go: types first, then methods grouped by owner, as `golangci-lint`
    `funcorder` and the Uber Go style guide (Function Grouping and Ordering:
    group by receiver, constructors before the other methods) ask. The type
    declarations stay together, a deliberate difference from the Uber example,
    which puts each type's methods right after the type. Fixtures of a test
    file (its types, constants, variables and functions that take no testing
    handle) follow the same order; tests and test helpers are placed by
    `testing/file-layout`. Order: public types; private types; public
    constants; private constants; variables; all `init` functions; one block
    per type, in the order the types are declared, each with the functional
    option builders of the type first (a function that returns a func taking
    the type or a pointer to it, or a named type of that kind, such as
    `func WithHandlers(...) func(*Program)`: Pike, "Self-referential functions
    and the design of options", and Cheney, "Functional options for friendly
    APIs"; the interface form of an option, `apply(*T)`, is not recognized) and then the constructors
    of the type (a function named `NewType` or `newType`, of any visibility,
    where `Type` or `type` is a type declared in the same file: Uber, "newXYZ()/NewXYZ()
    may appear after the type is defined, but before the rest of the methods on
    the receiver"; and the bare `New` of a package that exports one type, the
    Go idiom of Effective Go, "Package names": `ring.New` — a function with no
    receiver that returns the type), then its exported methods,
    then its clone, conversion and interface hooks, then its unexported
    methods; public functions; private functions.

    Rust: The same principle, from the concepts to the machinery, with a
    type kept next to its impl blocks because that is how Rust code reads.
    Order: constants; statics; types, traits and their impl blocks (types
    and impls are one group, `owner-contiguity` keeps an owner's impls
    together), where a constructor method (an associated function named like one)
    comes before the other methods of its type; public free functions; private
    free functions. The order of the other members of a type is left to
    `design/top-down-order`. Items of `#[cfg(test)]` modules are
    not ordered. Visibility counts as public when it is `pub` or `pub(crate)`.

    TypeScript and JavaScript: not applicable. No guide or tool orders the
    top-level declarations of a file, and the only ordering that exists for
    class members, typescript-eslint `member-ordering`, separates fields from
    methods and static from instance members, which a group of methods does not
    express: measured on excalidraw, the public-before-private subset flagged
    arrow-function fields and private static methods that `member-ordering`
    accepts.
  scope:
    subject: file
    generated: true
    tests: include
    examples: exclude
  requirement: >-
    Top-level declarations in a file MUST follow the language's ownership-group
    order, from public contract to private mechanics. Initializers MUST stay
    together and MUST precede non-initializer functions and methods. An
    option builder MUST precede the constructors of its type; a
    constructor MUST precede the other methods of its type; where methods are
    grouped by owner, exported methods MUST precede unexported ones.
  severity: error
  options:
    properties:
      groups:
        type: array
        items:
          type: string
          enum:
            - public-type
            - private-type
            - type
            - public-const
            - private-const
            - const
            - var
            - init
            - method
            - public-function
            - private-function
        default:
          - public-type
          - private-type
          - public-const
          - private-const
          - var
          - init
          - method
          - public-function
          - private-function
        description: >-
          The group order of a file, first to last. A declaration belongs to the
          first of its candidate groups that this list names; one the list does
          not name is not ordered. Groups: `public-type`, `private-type`, `type`
          (types and the members of a type together, in the order they are
          written), `public-const`,
          `private-const`, `const`, `var`, `init`, `method` (the members of the
          types, one block per type, in the order the types are declared, each
          with the option builders of the type first, then the constructors of the type (`NewType` or `newType`, any visibility), then its exported
          methods, its hooks and its unexported methods),
          `public-function`, `private-function`.
      hooks:
        type: array
        default:
          - Clone
          - String
          - GoString
          - Error
          - Unwrap
          - MarshalJSON
          - UnmarshalJSON
          - MarshalText
          - UnmarshalText
          - MarshalBinary
          - UnmarshalBinary
        description: >-
          Exported methods that implement clone, conversion or interface hooks;
          they follow the other exported methods of their type. Names are kept
          to ones that are never ordinary behavior.
      blocks:
        type: string
        enum: [type, kind]
        default: type
        description: >-
          How the members of the `method` group are laid out. `type`: one block
          per owner type, each with its option builders, constructors, exported
          methods, hooks and unexported methods. `kind`: by rank first, then by
          owner: all option builders, then all constructors, and so on.
    additionalProperties: false
  languages:
    go: {}
    rust:
      options:
        groups: [const, var, type, public-function, private-function]
        hooks: []
  check:
    type: cel
    select: symbol
    variables:
      # The placed declarations with the tests, in file order, each as
      # [module, place, id, name]: the tests come after every group, as
      # `testing/file-layout` has the fixtures above them, so that a move
      # never puts a fixture below a test.
      - name: laid
        expression: >-
          (placed + file.symbols.filter(s, s.kind == 'test')).sortBy(s, s.pos)
            .map(s, [s.module, s.kind == 'test' ? size(groups) * 1000000 : place(s), s.id, s.name])
      # The placed declarations of each module, in file order, each as
      # [place, id, name].
      - name: modules
        expression: >-
          laid.map(r, r[0]).distinct().map(m,
            laid.filter(r, r[0] == m && r[1] >= 0).map(r, [r[1], r[2], r[3]]))
      # Per module, the placed declarations that are misplaced: the fewest
      # that, moved, put the module in order, each as
      # [id, group, after, before, late]: it is to follow the first later
      # declaration of an earlier place that stays in place, else the first
      # such declaration.
      - name: displaced
        expression: >-
          modules.map(at,
            cel.bind(g, at.map(r, r[0]),
            cel.bind(moved, g.misplaced(),
            cel.bind(kept, lists.range(size(g)).filter(i, !(i in moved)),
            cel.bind(follows, g.anchors(),
              moved.map(i,
                [at[i][1], g[i] / 1000000,
                 (kept.filter(j, j > i && g[j] < g[i]).map(j, at[j][2])
                  + (follows[i] < 0 ? [] : at.slice(follows[i], follows[i] + 1).map(r, r[2]))
                  + [''])[0], '', false])))))).flatten()
            .filter(d, d[1] < size(groups))
      # The methods of the owners, in file order; one value per file, each as
      # [id, name, owner and module, whether it is a constructor method (a
      # public method named like a constructor), position].
      - name: methods
        expression: >-
          placed.filter(s, s.kind == 'method' && s.owner_key != '')
            .map(s, [s.id, s.name, s.owner_key + '|' + s.module,
                     s.visibility != 'private' && s.constructor_named, s.pos])
      # Where methods and types are one group, a constructor method that
      # follows another method of its type: it is to come before the first of
      # them.
      - name: late
        expression: >-
          !('type' in groups) ? [] :
          methods.filter(c, c[3]
              && methods.exists(x, x[2] == c[2] && !x[3] && x[4] < c[4]))
            .map(c, cel.bind(earlier, methods.filter(x, x[2] == c[2] && !x[3] && x[4] < c[4]),
              [c[0], -1, earlier[0][1], earlier[0][0], true]))
      # The declarations of the file in the order of their places, the argument
      # of the reorder that fixes every finding of the file at once.
      - name: ordered
        expression: >-
          laid.filter(r, r[1] >= 0).sortBy(r, r[1]).map(r, r[2])
      # Every finding of the file, as [id, group, after, before, late], and
      # the ids they are about.
      - name: reported
        expression: displaced + late
      - name: reported_ids
        expression: reported.map(d, d[0])
      - name: report
        expression: >-
          symbol.id in reported_ids ? reported.filter(d, d[0] == symbol.id) : []
      # Where the finding sends the declaration: after the declaration it must
      # follow, when it has one that stays in place, else above its anchor.
      - name: found
        expression: anchor(symbol.id)
      - name: target
        expression: >-
          report[0][2] != '' ? ', after ' + report[0][2]
            : size(found) > 0 ? ', above ' + found.name + ' (line ' + string(found.line) + ')' : ''
      # The owner block of the declaration, its role there and where in the block
      # it goes, by block rank.
      - name: owner_name
        expression: >-
          cel.bind(parts, owner_of(symbol).split('#')[0].split('::'),
            parts.slice(size(parts) - 1, size(parts))[0])
      # The role, plural and place in the block, by block rank.
      - name: words
        expression: >-
          cel.bind(by, options.blocks == 'kind' ? 'the ' : 'its ',
            [['an option builder', 'option builders', 'first'],
             ['a constructor', 'constructors', 'after ' + by + 'option builders'],
             ['an exported method', 'exported methods', 'after ' + by + 'constructors'],
             ['a hook', 'hooks', 'after ' + by + 'exported methods'],
             symbol.kind == 'function' ? ['a helper', 'helpers', 'last']
               : ['an unexported method', 'unexported methods', 'last']]
            .slice(block_rank(symbol), block_rank(symbol) + 1)[0])
      - name: block_rule
        expression: >-
          options.blocks == 'kind' ? words[1] + ' come ' + words[2]
          : 'it goes in ' + owner_name + "'s block " + words[2]
    where: size(report) > 0
    message: >-
      {{ report[0][4]
         ? 'constructor ' + symbol.name + ' must precede the other methods of its type, such as '
           + report[0][2]
         : options.groups[report[0][1]] == 'method' && owner_of(symbol) != ''
         ? symbol.name + ' is ' + words[0] + ' of ' + owner_name + ': ' + block_rule + target
         : symbol.kind + ' ' + symbol.name + ' belongs to the ' + options.groups[report[0][1]]
           + ' group'
           + (report[0][2] != '' ? ' and must follow ' + report[0][2]
              : size(found) > 0
              ? ', which comes before ' + options.groups[found.place / 1000000]
                + ': move it above ' + found.name + ' (line ' + string(found.line) + ')'
              : '') }}
    evidence:
      declaration: symbol.id
      group: "report[0][4] ? 'constructor' : options.groups[report[0][1]]"
      expected_after: "!report[0][4] && report[0][2] != '' ? report[0][2] : null"
      before: report[0][3]
      anchor: "size(found) > 0 ? found.id : ''"
    identity:
      subject: symbol.id
      snippet: "report[0][4] ? 'clause 1' : ''"
  fix:
    safety: safe
    type: cel
    edits: >-
      finding.evidence.before != ''
      ? [move(finding.evidence.declaration, before(finding.evidence.before))]
      : [reorder(ordered)]
  provenance:
    wasDerivedFrom:
      - "Martin, Clean Code (2008), G24 Follow Standard Conventions"
      - "Martin, Clean Code (2008), ch. 10 Class organization"
      - "Uber Go Style Guide, Function Grouping and Ordering"
      - "golangci-lint, funcorder"
      - "Rob Pike, Self-referential functions and the design of options (2014): https://commandcenter.blogspot.com/2014/01/self-referential-functions-and-design.html"
      - "Dave Cheney, Functional options for friendly APIs (2014): https://dave.cheney.net/2014/10/17/functional-options-for-friendly-apis"
      - "typescript-eslint, member-ordering (TypeScript is unlisted: its default order, fields before constructors before methods and static before instance, is not a group order): https://typescript-eslint.io/rules/member-ordering/"
  examples:
    - name: option-after-constructor
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            // Program is a compiled program.
            type Program struct{ name string }

            // WithName names the program.
            func WithName(name string) func(*Program) {
            	return func(p *Program) {
            		p.name = name
            	}
            }

            // New returns a program with the options applied.
            func New(options ...func(*Program)) *Program {
            	p := &Program{}
            	for _, option := range options {
            		option(p)
            	}
            	return p
            }

            // Name returns the name of the program.
            func (p *Program) Name() string {
            	return p.name
            }
      files:
        - path: example.go
          body: |-
            package sample

            // Program is a compiled program.
            type Program struct{ name string }

            // New returns a program with the options applied.
            func New(options ...func(*Program)) *Program {
            	p := &Program{}
            	for _, option := range options {
            		option(p)
            	}
            	return p
            }

            // WithName names the program.
            func WithName(name string) func(*Program) {
            	return func(p *Program) {
            		p.name = name
            	}
            }

            // Name returns the name of the program.
            func (p *Program) Name() string {
            	return p.name
            }
      expect:
        - line: 16
          message: "WithName is an option builder of Program: it goes in Program's block first, above New (line 7)"
    - name: option-builders-before-consumer-in-function-group
      language: go
      kind: valid
      options:
        groups: [public-type, private-type, public-const, private-const, var, init, public-function, method, private-function]
      files:
        - path: example.go
          body: |-
            package sample

            // Option configures Run.
            type Option func(*options)

            type options struct{ name string }

            // WithName names the run.
            func WithName(name string) Option {
            	return func(o *options) { o.name = name }
            }

            // Run applies the options and returns the name.
            func Run(opts ...Option) string {
            	o := options{}
            	for _, opt := range opts {
            		opt(&o)
            	}
            	return o.name
            }
    - name: methods-of-a-public-type-declared-elsewhere-lead
      language: go
      kind: valid
      files:
        - path: module.go
          body: |-
            package sample

            // Module is analyzed in fact.go.
            type Module struct{ n int }
        - path: fact.go
          body: |-
            package sample

            type fact struct{ n int }

            // Analyze reads the facts of the module.
            func (m *Module) Analyze() int {
            	f := fact{n: m.n}
            	return f.merge()
            }

            func (f fact) merge() int {
            	return f.n
            }
    - name: bare-new-constructor
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            // Program is a compiled program.
            type Program struct{}

            // New returns an empty program.
            func New() *Program {
            	return &Program{}
            }

            // Run runs the program.
            func (p *Program) Run() int {
            	return 1
            }
      files:
        - path: example.go
          body: |-
            package sample

            // Program is a compiled program.
            type Program struct{}

            // Run runs the program.
            func (p *Program) Run() int {
            	return 1
            }

            // New returns an empty program.
            func New() *Program {
            	return &Program{}
            }
      expect:
        - line: 12
          message: "New is a constructor of Program: it goes in Program's block after its option builders, above Run (line 7)"
    - name: invalid
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            // Service is part of the example.
            type Service struct{}

            // Run is part of the example.
            func (s *Service) Run() int { return helper() }

            func helper() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            func helper() int { return 1 }

            // Service is part of the example.
            type Service struct{}

            // Run is part of the example.
            func (s *Service) Run() int { return helper() }
      expect:
        - line: 3
    - name: valid
      language: go
      kind: valid
      canonical: true
      files:
        - path: example.go
          body: |-
            package sample

            // Service is part of the example.
            type Service struct{}

            // Run is part of the example.
            func (s *Service) Run() int { return helper() }

            func helper() int { return 1 }
    - name: private-method-before-public
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            // Service is part of the example.
            type Service struct{}

            // Run is part of the example.
            func (s *Service) Run() int { return s.run() }

            func (s *Service) run() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            // Service is part of the example.
            type Service struct{}

            func (s *Service) run() int { return 1 }

            // Run is part of the example.
            func (s *Service) Run() int { return s.run() }
      expect:
        - line: 9
    - name: init-after-functions
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            var ready bool

            func init() { ready = true }

            // Run is part of the example.
            func Run() bool { return ready }
      files:
        - path: example.go
          body: |-
            package sample

            var ready bool

            // Run is part of the example.
            func Run() bool { return ready }

            func init() { ready = true }
      expect:
        - line: 8
    - name: groups-in-order
      language: go
      kind: valid
      files:
        - path: example.go
          body: |-
            package sample

            // Service is part of the example.
            type Service struct{ ok bool }

            type state int

            // Limit is part of the example.
            const Limit = 3

            const floor = 1

            var ready bool

            func init() { ready = true }

            // NewService is part of the example.
            func NewService() *Service { return &Service{ok: true} }

            // Run is part of the example.
            func (s *Service) Run() int { return floor + int(state(Limit)) }

            func (s *Service) String() string { return "service" }

            func (s *Service) check() bool { return s.ok }

            // Open is part of the example.
            func Open() *Service { return NewService() }
    - name: owner-blocks
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            // Service is part of the example.
            type Service struct{}

            // Client is part of the example.
            type Client struct{}

            // Run is part of the example.
            func (s *Service) Run() int { return 1 }

            // Do is part of the example.
            func (c *Client) Do() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            // Service is part of the example.
            type Service struct{}

            // Run is part of the example.
            func (s *Service) Run() int { return 1 }

            // Client is part of the example.
            type Client struct{}

            // Do is part of the example.
            func (c *Client) Do() int { return 1 }
      expect:
        - line: 10
    - name: constructor-after-methods
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            // Service is part of the example.
            type Service struct{}

            type lowering struct{}

            // NewService is part of the example.
            func NewService() *Service { return &Service{} }

            // Run is part of the example.
            func (s *Service) Run() int { return 1 }

            func newLowering() *lowering { return &lowering{} }

            func (l *lowering) run() int { return 1 }
      files:
        - path: example.go
          body: |-
            package sample

            // Service is part of the example.
            type Service struct{}

            type lowering struct{}

            // Run is part of the example.
            func (s *Service) Run() int { return 1 }

            // NewService is part of the example.
            func NewService() *Service { return &Service{} }

            func (l *lowering) run() int { return 1 }

            func newLowering() *lowering { return &lowering{} }
      expect:
        - line: 12
        - line: 16
          message: "newLowering is a constructor of lowering: it goes in lowering's block after its option builders, above run (line 14)"
    - name: rust-invalid
      language: rust
      kind: invalid
      fixed:
        - path: src/lib.rs
          body: |-
            /// Part of the example.
            pub struct Store;

            /// Part of the example.
            pub fn run() -> u8 {
                1
            }
      files:
        - path: src/lib.rs
          body: |-
            /// Part of the example.
            pub fn run() -> u8 {
                1
            }

            /// Part of the example.
            pub struct Store;
      expect:
        - line: 7
          message: "type Store belongs to the type group, which comes before public-function: move it above run (line 2)"
    - name: rust-valid
      language: rust
      kind: valid
      canonical: true
      files:
        - path: src/lib.rs
          body: |-
            const LIMIT: u8 = 3;

            /// Part of the example.
            pub struct Store;

            impl Store {
                /// Part of the example.
                pub fn new() -> Self {
                    Store
                }

                /// Part of the example.
                pub fn get(&self) -> u8 {
                    LIMIT
                }
            }

            /// Part of the example.
            pub fn run() -> u8 {
                helper()
            }

            fn helper() -> u8 {
                1
            }
    - name: rust-constructor-after-behavior
      language: rust
      kind: invalid
      fixed:
        - path: src/lib.rs
          body: |-
            /// Part of the example.
            pub struct Store;

            impl Store {
                /// Part of the example.
                pub fn new() -> Self {
                    Store
                }

                /// Part of the example.
                pub fn get(&self) -> u8 {
                    1
                }
            }
      files:
        - path: src/lib.rs
          body: |-
            /// Part of the example.
            pub struct Store;

            impl Store {
                /// Part of the example.
                pub fn get(&self) -> u8 {
                    1
                }

                /// Part of the example.
                pub fn new() -> Self {
                    Store
                }
            }
      expect:
        - line: 11
          message: "constructor new must precede the other methods of its type, such as get"
    - name: test-fixtures-out-of-order
      language: go
      kind: invalid
      fixed:
        - path: store_test.go
          body: |-
            package store

            import "testing"

            type sample struct{}

            var limit = 3

            func TestSample(t *testing.T) { _ = sample{} }
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store_test.go
          body: |-
            package store

            import "testing"

            var limit = 3

            type sample struct{}

            func TestSample(t *testing.T) { _ = sample{} }
      expect:
        - line: 7
    - name: test-fixture-below-a-test
      language: go
      kind: invalid
      fixed:
        - path: store_test.go
          body: |
            package store

            import "testing"

            type one struct{}

            type two struct{}

            type three struct{}

            var limit = 3

            func TestSample(t *testing.T) { _ = one{}; _ = two{}; _ = three{}; _ = limit }
      files:
        - path: go.mod
          body: |-
            module example.com/store

            go 1.26
        - path: store_test.go
          body: |-
            package store

            import "testing"

            var limit = 3

            func TestSample(t *testing.T) { _ = one{}; _ = two{}; _ = three{}; _ = limit }

            type one struct{}

            type two struct{}

            type three struct{}
      expect:
        - line: 5
    - name: private-helper-after-every-type-block
      language: go
      kind: invalid
      fixed:
        - path: example.go
          body: |-
            package sample

            // Pass rewrites a program.
            type Pass struct{ n int }

            type pool struct{ n int }

            // NewPass returns a pass.
            func NewPass() *Pass { return &Pass{} }

            // Run runs the pass.
            func (p *Pass) Run() bool { return p.roundtrip() }

            func (p *Pass) roundtrip() bool { return expressible(p.n) }

            func newPool() *pool { return &pool{} }

            func (p *pool) module() int { return p.n }

            func expressible(n int) bool { return n > 0 }
      files:
        - path: example.go
          body: |-
            package sample

            // Pass rewrites a program.
            type Pass struct{ n int }

            type pool struct{ n int }

            // NewPass returns a pass.
            func NewPass() *Pass { return &Pass{} }

            // Run runs the pass.
            func (p *Pass) Run() bool { return p.roundtrip() }

