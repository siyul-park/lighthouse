---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/top-down-order
  uid: 8540cfb5-879d-439f-a09e-6ddaae555f0f
spec:
  title: Users precede what they use
  context: Readers follow a public operation into its private implementation. A callee
    placed first forces readers to understand a helper before the behavior that uses
    it. The step-down rule applies to types alike (Martin, Clean Code, ch. 5,
    vertical ordering, dependent declarations below), so a type that is held
    as a field, directly or inside a pointer, slice, map or generic type, follows
    the type that holds it; no tool orders types this way, and the severity is the
    decision's. A group order of `design/declaration-groups` wins (a public type
    before the private type that holds it is fine), and types that hold each other,
    directly or through others, are not ordered, as
    functions that call each other are not, since step-down orders what depends on
    what only across a cycle and never inside it. TypeScript and JavaScript are not covered, since ESLint `no-use-before-define`,
    whose default warns on every reference to a function before
    its declaration, asks for the opposite order, and neither the Google TypeScript
    Style Guide nor the TypeScript Handbook orders functions by their callers.
  scope:
    subject: symbol
    examples: exclude
  languages:
    go: {}
    rust: {}
  requirement: A private function SHOULD be declared after the production callers
    that explain why it exists, and a type SHOULD be declared after the types of
    the same file that hold it as a field or embed it; public entry points and
    wiring remain in their appropriate declaration groups.
  severity: warn
  options:
    from: design/declaration-groups
    properties:
      sharedAfterLastCaller:
        type: boolean
        default: false
        description: Require a helper used by several functions of its file to follow
          all of them, not only the first.
    additionalProperties: false
  check:
    type: cel
    select: symbol
    variables:
    - name: local
      expression: "symbol.func != null ? symbol.local_callers : []"
    # The types of the file that hold this one, but not those in a cycle of
    # holding with it: inside a cycle there is no order to keep.
    - name: held_by
      expression: "symbol.kind == 'type' ? symbol.holders.filter(h, !(h in symbol.hold_cycle)) : []"
    - name: holders
      expression: "size(held_by) == 0 ? [] : file.symbols.filter(a, a.kind == 'type' && a.id in held_by)"
    - name: users
      expression: "symbol.func != null ? local : holders.sortBy(a, a.pos)"
    - name: lead
      expression: 'size(users) == 0 ? symbol : options.sharedAfterLastCaller ? users[size(users)
        - 1] : users[0]'
    - name: used_first
      expression: |-
        (symbol.kind == 'function' || symbol.kind == 'method' || symbol.kind == 'type') && size(users) > 0 && symbol.pos <= lead.pos && !cel.bind(own, declaration_group(symbol.id),
            cel.bind(later, declaration_group(lead.id),
              own >= 0 && later >= 0 && own < later))
        && !(in_private(symbol.id) && in_private(lead.id))
        && !(symbol.lang == 'rust' && symbol.kind == 'method' && !symbol.implementation
             && lead.kind == 'method' && lead.implementation)
    - name: matched
      expression: 'used_first ? [''callers-first''] : []'
    # A function that is a method of a type in all but name is reported by
    # `design/prefer-method`; its order says nothing until its place agrees.
    where: size(matched)>0 && !(symbol.func != null && symbol.func.placement.level == 'owner')
    message: "{{ symbol.kind == 'type' ? 'type ' + symbol.name + ' is declared above ' + lead.name + ' (line ' + string(lead.line) + '), which holds it; holders come first'
      : 'private ' + symbol.kind + ' ' + symbol.name + ' is declared above its ' + (options.sharedAfterLastCaller ? 'last' : 'first') + ' caller ' + lead.name + ' (line ' + string(lead.line) + '); callers come first' }}"
    evidence:
      caller: lead.id
      callee: symbol.id
    identity:
      subject: symbol.id
  fix:
    safety: unsafe
    type: cel
    edits: "symbol.kind != 'type' || symbol.lang == 'go' ? [move(symbol, after(lead))] : []"
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G10 Vertical Separation
    - Martin, Clean Code (2008), G11 Inconsistency
    - Martin, Clean Code (2008), G32 Don't Be Arbitrary
    - Martin, Clean Code (2008), ch. 5 Vertical distance
    - Martin, Clean Code (2008), ch. 5 Vertical size and ordering
    - 'ESLint, no-use-before-define (TypeScript is unlisted, the default asks for callees first): https://eslint.org/docs/latest/rules/no-use-before-define'
  examples:
  - name: invalid
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        // Run is part of the example.
        func Run() int { return helper() }

        func helper() int { return 1 }
    files:
    - path: example.go
      body: |-
        package sample

        func helper() int { return 1 }

        // Run is part of the example.
        func Run() int { return helper() }
    expect:
    - line: 3
      message: private function helper is declared above its first caller Run (line 6); callers come first
  - name: valid
    language: go
    kind: valid
    canonical: true
    files:
    - path: example.go
      body: |-
        package sample

        // Run is part of the example.
        func Run() int { return helper() }

        func helper() int { return 1 }
  - name: shared-leaf-between-callers
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        // First is part of the example.
        func First() int { return leaf() }

        // Second is part of the example.
        func Second() int { return leaf() + 1 }

        func leaf() int { return 1 }
    options:
      sharedAfterLastCaller: true
    files:
    - path: example.go
      body: |-
        package sample

        // First is part of the example.
        func First() int { return leaf() }

        func leaf() int { return 1 }

        // Second is part of the example.
        func Second() int { return leaf() + 1 }
    expect:
    - line: 6
  - name: used-elsewhere
    language: go
    kind: valid
    files:
    - path: a.go
      body: |-
        package sample

        func helper() int { return 1 }

        // Run is part of the example.
        func Run() int { return helper() }
    - path: b.go
      body: |-
        package sample

        // Other is part of the example.
        func Other() int { return helper() }
    canonical: false
  - name: mutual-recursion
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        func even(n int) bool {
        	if n == 0 {
        		return true
        	}
        	return odd(n - 1)
        }

        func odd(n int) bool {
        	if n == 0 {
        		return false
        	}
        	return even(n - 1)
        }

        // Run is part of the example.
        func Run(n int) bool { return even(n) }
    canonical: false
  - name: type-before-its-holder
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        // Order is part of the example.
        type Order struct{ Lines []Line }

        // Line is part of the example.
        type Line struct{}
    files:
    - path: example.go
      body: |-
        package sample

        // Line is part of the example.
        type Line struct{}

        // Order is part of the example.
        type Order struct{ Lines []Line }
    expect:
    - line: 4
  - name: type-after-its-holder
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        // Order is part of the example.
        type Order struct{ Lines map[string]*Line }

        // Line is part of the example.
        type Line struct{}
  - name: types-that-hold-each-other
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        // Node is part of the example.
        type Node struct{ Edges []*Edge }

        // Edge is part of the example.
        type Edge struct{ To *Node }
  - name: types-that-hold-each-other-in-a-cycle
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        // Account is part of the example.
        type Account struct{ Owner *Owner }

        // Owner is part of the example.
        type Owner struct{ Group *Group }

        // Group is part of the example.
        type Group struct{ Members []*Account }
  - name: rust-types-that-hold-each-other-in-a-cycle
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        /// Part of the example.
        pub struct Account {
            owner: Option<Box<Owner>>,
        }

        /// Part of the example.
        pub struct Owner {
            group: Option<Box<Group>>,
        }

        /// Part of the example.
        pub struct Group {
            members: Vec<Account>,
        }
  - name: a-long-cycle-of-types
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        // N0 is part of the example.
        type N0 struct{ Next *N1 }

        // N1 is part of the example.
        type N1 struct{ Next *N2 }

        // N2 is part of the example.
        type N2 struct{ Next *N3 }

        // N3 is part of the example.
        type N3 struct{ Next *N4 }

        // N4 is part of the example.
        type N4 struct{ Next *N5 }

        // N5 is part of the example.
        type N5 struct{ Next *N6 }

        // N6 is part of the example.
        type N6 struct{ Next *N7 }

        // N7 is part of the example.
        type N7 struct{ Next *N8 }

        // N8 is part of the example.
        type N8 struct{ Next *N9 }

        // N9 is part of the example.
        type N9 struct{ Next *N0 }
  - name: rust-a-long-cycle-of-types
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        /// Part of the example.
        pub struct N0 {
            next: Option<Box<N1>>,
        }

        /// Part of the example.
        pub struct N1 {
            next: Option<Box<N2>>,
        }

        /// Part of the example.
        pub struct N2 {
            next: Option<Box<N3>>,
        }

        /// Part of the example.
        pub struct N3 {
            next: Option<Box<N4>>,
        }

        /// Part of the example.
        pub struct N4 {
            next: Option<Box<N5>>,
        }

        /// Part of the example.
        pub struct N5 {
            next: Option<Box<N6>>,
        }

        /// Part of the example.
        pub struct N6 {
            next: Option<Box<N7>>,
        }

        /// Part of the example.
        pub struct N7 {
            next: Option<Box<N8>>,
        }

        /// Part of the example.
        pub struct N8 {
            next: Option<Box<N9>>,
        }

        /// Part of the example.
        pub struct N9 {
            next: Option<Box<N0>>,
        }
  - name: public-type-before-the-private-type-that-holds-it
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        // Line is part of the example.
        type Line struct{}

        type order struct{ lines []Line }
  - name: rust-type-before-its-holder
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Line;

        impl Line {
            pub fn new() -> Self {
                Line
            }
        }

        pub struct Order {
            lines: Vec<Line>,
        }
    expect:
    - line: 1
  - name: rust-invalid
    language: rust
    kind: invalid
    fixed:
    - path: src/lib.rs
      body: |-
        /// Part of the example.
        pub fn run() -> u8 {
            helper()
        }

        fn helper() -> u8 {
            1
        }
    files:
    - path: src/lib.rs
      body: |-
        fn helper() -> u8 {
            1
        }

        /// Part of the example.
        pub fn run() -> u8 {
            helper()
        }
    expect:
    - line: 1
  - name: rust-valid
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |-
        /// Part of the example.
        pub fn run() -> u8 {
            helper()
        }

        fn helper() -> u8 {
            1
        }
