---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/top-down-order
  uid: 8540cfb5-879d-439f-a09e-6ddaae555f0f
spec:
  title: Users precede what they use
  context: Readers follow a public operation into its private implementation. A callee
    placed first forces readers to understand a helper before the behavior that uses
    it. The step-down rule applies to types alike (Martin, Clean Code, ch. 5,
    vertical ordering, dependent declarations below), so a type that is held
    as a field, directly or inside a pointer, slice, map or generic type, follows
    the type that holds it; no tool orders types this way, and the severity is the
    decision's. A group order of `design/declaration-groups` wins (a public type
    before the private type that holds it is fine), and types that hold each other
    are not ordered. TypeScript and JavaScript are not covered, since ESLint `no-use-before-define`,
    whose default warns on every reference to a function before
    its declaration, asks for the opposite order, and neither the Google TypeScript
    Style Guide nor the TypeScript Handbook orders functions by their callers.
  scope:
    subject: symbol
    examples: exclude
  languages:
    go: {}
    rust: {}
  requirement: A private function SHOULD be declared after the production callers
    that explain why it exists, and a type SHOULD be declared after the types of
    the same file that hold it as a field or embed it; public entry points and
    wiring remain in their appropriate declaration groups.
  severity: warn
  options:
    from: design/declaration-groups
    properties:
      sharedAfterLastCaller:
        type: boolean
        default: false
        description: Require a helper used by several functions of its file to follow
          all of them, not only the first.
    additionalProperties: false
  check:
    type: cel
    select: symbol
    variables:
    - name: local
      expression: "symbol.func != null ? symbol.local_callers : []"
    - name: fields
      expression: "symbol.kind == 'type' ? file.symbols.filter(f, f.kind == 'field') : []"
    - name: mentions
      params: [f, b]
      expression: |-
        f.type != null && (f.type.symbol == b.id.split('#')[0]
          || (f.type.symbol == '' && f.type.text.matches(
                b.lang == 'go'
                ? (b.module == '.' ? '\\.' : '/' + b.module.replace('.', '\\.') + '\\.')
                  + b.name + '($|[^A-Za-z0-9_])'
                : '(^|[^A-Za-z0-9_])' + b.name + '($|[^A-Za-z0-9_])')))
    - name: holders
      expression: |-
        symbol.kind == 'type'
          ? file.symbols.filter(a, a.kind == 'type' && a.id != symbol.id
              && fields.exists(f, f.owner_key == a.id && mentions(f, symbol))
              && !fields.exists(f, f.owner_key == symbol.id && mentions(f, a)))
          : []
    - name: users
      expression: "symbol.func != null ? local : holders.sortBy(a, a.pos)"
    - name: anchor
      expression: 'size(users) == 0 ? symbol : options.sharedAfterLastCaller ? users[size(users)
        - 1] : users[0]'
    - name: used_first
      expression: |-
        (symbol.kind == 'function' || symbol.kind == 'method' || symbol.kind == 'type') && size(users) > 0 && symbol.pos <= anchor.pos && !cel.bind(own, declaration_group(symbol.id),
            cel.bind(later, declaration_group(anchor.id),
              own >= 0 && later >= 0 && own < later))
        && !(symbol.lang == 'rust' && symbol.kind == 'method' && !symbol.implementation
             && anchor.kind == 'method' && anchor.implementation)
    - name: matched
      expression: 'used_first ? [''callers-first''] : []'
    where: size(matched)>0
    message: "{{ symbol.kind == 'type' ? 'type ' + symbol.name + ' is declared before ' + anchor.name + ', which holds it; holders come first'
      : 'private ' + symbol.kind + ' ' + symbol.name + ' is declared before its caller ' + anchor.name + '; callers come first' }}"
    evidence:
      caller: anchor.id
      callee: symbol.id
    identity:
      subject: symbol.id
  fix:
    safety: unsafe
    type: cel
    edits: "symbol.kind != 'type' || symbol.lang == 'go' ? [move(symbol, after(anchor))] : []"
  provenance:
    wasDerivedFrom:
    - Martin, Clean Code (2008), G10 Vertical Separation
    - Martin, Clean Code (2008), G11 Inconsistency
    - Martin, Clean Code (2008), G32 Don't Be Arbitrary
    - Martin, Clean Code (2008), ch. 5 Vertical distance
    - Martin, Clean Code (2008), ch. 5 Vertical size and ordering
    - 'ESLint, no-use-before-define (TypeScript is unlisted, the default asks for callees first): https://eslint.org/docs/latest/rules/no-use-before-define'
  examples:
  - name: invalid
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        func Run() int { return helper() }

        func helper() int { return 1 }
    files:
    - path: example.go
      body: |-
        package sample

        func helper() int { return 1 }

        func Run() int { return helper() }
    expect:
    - line: 3
  - name: valid
    language: go
    kind: valid
    canonical: true
    files:
    - path: example.go
      body: |-
        package sample

        func Run() int { return helper() }

        func helper() int { return 1 }
  - name: shared-leaf-between-callers
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        func First() int { return leaf() }

        func Second() int { return leaf() + 1 }

        func leaf() int { return 1 }
    options:
      sharedAfterLastCaller: true
    files:
    - path: example.go
      body: |-
        package sample

        func First() int { return leaf() }

        func leaf() int { return 1 }

        func Second() int { return leaf() + 1 }
    expect:
    - line: 5
  - name: used-elsewhere
    language: go
    kind: valid
    files:
    - path: a.go
      body: |-
        package sample

        func helper() int { return 1 }

        func Run() int { return helper() }
    - path: b.go
      body: |-
        package sample

        func Other() int { return helper() }
    canonical: false
  - name: mutual-recursion
    language: go
    kind: valid
    files:
    - path: example.go
      body: "package sample\n\nfunc even(n int) bool {\n\tif n == 0 {\n\t\treturn
        true\n\t}\n\treturn odd(n - 1)\n}\n\nfunc odd(n int) bool {\n\tif n == 0 {\n\t\treturn
        false\n\t}\n\treturn even(n - 1)\n}\n\nfunc Run(n int) bool { return even(n)
        }"
    canonical: false
  - name: type-before-its-holder
    language: go
    kind: invalid
    fixed:
    - path: example.go
      body: |-
        package sample

        type Order struct{ Lines []Line }

        type Line struct{}
    files:
    - path: example.go
      body: |-
        package sample

        type Line struct{}

        type Order struct{ Lines []Line }
    expect:
    - line: 3
  - name: type-after-its-holder
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        type Order struct{ Lines map[string]*Line }

        type Line struct{}
  - name: types-that-hold-each-other
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        type Node struct{ Edges []*Edge }

        type Edge struct{ To *Node }
  - name: public-type-before-the-private-type-that-holds-it
    language: go
    kind: valid
    files:
    - path: example.go
      body: |-
        package sample

        type Line struct{}

        type order struct{ lines []Line }
  - name: rust-type-before-its-holder
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Line;

        impl Line {
            pub fn new() -> Self {
                Line
            }
        }

        pub struct Order {
            lines: Vec<Line>,
        }
    expect:
    - line: 1
  - name: rust-invalid
    language: rust
    kind: invalid
    fixed:
    - path: src/lib.rs
      body: |-
        pub fn run() -> u8 {
            helper()
        }

        fn helper() -> u8 {
            1
        }
    files:
    - path: src/lib.rs
      body: |-
        fn helper() -> u8 {
            1
        }

        pub fn run() -> u8 {
            helper()
        }
    expect:
    - line: 1
  - name: rust-valid
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |-
        pub fn run() -> u8 {
            helper()
        }

        fn helper() -> u8 {
            1
        }
