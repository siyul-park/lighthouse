    language: typescript
    kind: invalid
    fixed:
    - path: sample.js
      body: |-
        function helper() {
          return 1;
        }

        module.exports = { helper };
    files:
    - path: sample.js
      body: |-
        // ---- Helpers ----

        function helper() {
          return 1;
        }

        module.exports = { helper };
    expect:
    - line: 1
