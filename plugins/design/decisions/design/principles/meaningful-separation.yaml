---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/meaningful-separation
  uid: 41496cc6-b32e-4ca0-842e-acf25e8426c7
spec:
  title: Modules represent meaningful boundaries
  context: A small module with one user may be a real abstraction or merely that user’s
    implementation detail. Evaluate the contract and dependencies, not size alone.
  scope:
    subject: module
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: A module SHOULD be separate from its users only when it provides an
    independent responsibility, invariant, lifecycle, or reusable abstraction.
  severity: info
  check:
    type: cel
    select: module
    where: 'false'
    abstain: 'module.lines < 600 && (size(module.dependents) == 1 || module.declares
      == 0 || (size(module.dependents) == 0 && module.name != ''main'' && !module.path.contains(''[bin:''))) '
    message: "{{ 'review whether module ' + module.path + ' is an independent boundary
      or merely its user’s implementation detail' }}"
    evidence:
      module: module.path
      lines: module.lines
      dependents: module.dependents
      declares: module.declares
    identity:
      subject: module.path
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, coding-patterns#structural-rules-dbd77a89'
    - 'Lighthouse, coding-patterns#physical-cohesion-9cf2f03b'
    - 'Martin, Clean Code (2008), ch. 10 Single responsibility and cohesion'
  examples:
  - name: single-user-go-invalid
    language: go
    kind: invalid
    files:
    - path: go.mod
      body: |-
        module example.com/sample

        go 1.26
    - path: main.go
      body: |-
        package main

        import "example.com/sample/helper"

        func main() { helper.Run() }
    - path: helper/helper.go
      body: |-
        package helper

        func Run() {}
    expect: []
  - name: single-user-go-valid
    language: go
    kind: valid
    canonical: true
    files:
    - path: go.mod
      body: |-
        module example.com/sample

        go 1.26
    - path: main.go
      body: |-
        package main

        func main() {}
  - name: single-user-rust-invalid
    language: rust
    kind: invalid
    files:
    - path: src/lib.rs
      body: |-
        mod part;

        pub fn run() -> i32 { part::work() }
    - path: src/part.rs
      body: |-
        pub fn work() -> i32 { 1 }
    expect: []
  - name: single-user-rust-valid
    language: rust
    kind: valid
    canonical: true
    files:
    - path: src/lib.rs
      body: |-
        /// Part of the example.
        pub fn run() -> i32 { 1 }
  - name: single-user-typescript-invalid
    language: typescript
    kind: invalid
    files:
    - path: src/main.ts
      body: |-
        import { work } from "./part";

        export function run(): number {
          return work();
        }
    - path: src/part.ts
      body: |-
        export function work(): number {
          return 1;
        }
    expect: []
  - name: single-user-typescript-valid
    language: typescript
    kind: valid
    canonical: true
    files:
    - path: src/main.ts
      body: |-
        /** Part of the example. */
        export function run(): number {
          return 1;
        }
  - name: python-single-user-module
    language: python
    kind: invalid
    files:
    - path: src/main.py
      body: |-
        from src.part import work


        def run() -> int:
            return work()
    - path: src/part.py
      body: |-
        def work() -> int:
            return 1
  - name: python-single-module
    language: python
    kind: valid
    canonical: true
    files:
    - path: src/main.py
      body: |-
        def run() -> int:
            """Part of the example."""
            return 1
  options:
    properties: {}
    additionalProperties: false
