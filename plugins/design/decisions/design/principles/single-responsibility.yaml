            fn add_name(&mut self, n: String) { self.names.push(n); }
            fn count_names(&self) -> usize { self.names.len() }
        }
    expect:
    - line: 1
  - name: cohesion-rust-valid
    language: rust
    kind: valid
    files:
    - path: src/lib.rs
      body: |-
        pub struct Store {
