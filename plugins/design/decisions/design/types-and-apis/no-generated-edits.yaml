---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/no-generated-edits
  uid: 7d1d7f74-18d4-40ad-9423-68a1fbb3742d
spec:
  title: Generated files change through their generator
  context: Direct edits disappear on regeneration and create two competing sources
    of truth. The code model holds the file, not the edit, so only a model that sees
    the change can judge it.
  scope:
    subject: symbol
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: Generated files MUST be changed through their generator or source definition,
    not by editing generated output directly.
  severity: error
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, coding-patterns#generated-and-platform-code-fc6a81b6'
  examples:
  - name: hand-edited-generated-file
    language: go
    kind: invalid
    files:
    - path: kind_string.go
      body: |
        // Code generated by "stringer -type=Kind"; DO NOT EDIT.

        package sample

        // Hand-patched: the generator would write "unknown" here.
        func (k Kind) String() string { return "other" }
  - name: regenerated-file
    language: go
    kind: valid
    canonical: true
    files:
    - path: kind_string.go
      body: |
        // Code generated by "stringer -type=Kind"; DO NOT EDIT.

        package sample

        func (k Kind) String() string { return "unknown" }
  - name: python-edited-generated-file
    language: python
    kind: invalid
    files:
    - path: api/client_pb2.py
      body: |-
        # Code generated by protoc. DO NOT EDIT.
        # Patched by hand to add a retry field.
        RETRY_LIMIT = 5
  - name: python-generated-file-untouched
    language: python
    kind: valid
    canonical: true
    files:
    - path: api/client_pb2.py
      body: |-
        # Code generated by protoc. DO NOT EDIT.
        MESSAGE_NAME = "Client"
