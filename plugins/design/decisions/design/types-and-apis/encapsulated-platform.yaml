---
apiVersion: lighthouse/v1alpha1
kind: Decision
metadata:
  name: design/encapsulated-platform
  uid: 271c1e2f-da50-4cd0-8393-d8ecbda71db0
spec:
  title: Platform-specific code stays behind a boundary
  context: Scattered platform branches make common behavior harder to test and platform
    constraints harder to audit.
  scope:
    subject: symbol
  languages:
    go: {}
    python: {}
    rust: {}
    typescript: {}
  requirement: Platform-specific behavior SHOULD be isolated behind a narrow interface
    or implementation boundary.
  severity: warn
  check:
    type: model
  provenance:
    wasDerivedFrom:
    - 'Lighthouse, coding-patterns#generated-and-platform-code-0669c79d'
  examples:
  - name: invalid-contract
    language: go
    kind: invalid
    files:
    - path: sample.go
      body: |
        package sample
        func Load() { if runtime.GOOS == "windows" { /* windows code */ } else { /* unix code */ } }
        func Save() { if runtime.GOOS == "windows" { /* windows code */ } else { /* unix code */ } }
  - name: valid-contract
    language: go
    kind: valid
    canonical: true
    files:
    - path: sample.go
      body: |
        package sample
        type Platform interface { Load(); Save() }
        func NewPlatform() Platform { if runtime.GOOS == "windows" { return windowsPlatform{} }; return unixPlatform{} }
  - name: python-platform-checks-in-every-function
    language: python
    kind: invalid
    files:
    - path: config/paths.py
      body: |-
        import os
        import sys


        def config_file() -> str:
            if sys.platform == "win32":
                return os.path.join(os.environ["APPDATA"], "tool", "config.toml")
            return os.path.expanduser("~/.config/tool/config.toml")


        def cache_dir() -> str:
            if sys.platform == "win32":
                return os.path.join(os.environ["LOCALAPPDATA"], "tool")
            return os.path.expanduser("~/.cache/tool")
  - name: python-platform-behind-an-interface
    language: python
    kind: valid
    canonical: true
    files:
    - path: config/paths.py
      body: |-
        import os
        import sys
        from typing import Protocol


        class Platform(Protocol):
            def config_file(self) -> str: ...

            def cache_dir(self) -> str: ...


        class WindowsPlatform:
            def config_file(self) -> str:
                return os.path.join(os.environ["APPDATA"], "tool", "config.toml")

            def cache_dir(self) -> str:
                return os.path.join(os.environ["LOCALAPPDATA"], "tool")


        class PosixPlatform:
            def config_file(self) -> str:
                return os.path.expanduser("~/.config/tool/config.toml")

            def cache_dir(self) -> str:
                return os.path.expanduser("~/.cache/tool")


        def current() -> Platform:
            return WindowsPlatform() if sys.platform == "win32" else PosixPlatform()
