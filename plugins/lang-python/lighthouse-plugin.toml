apiVersion = "lighthouse/v1alpha1"
kind = "Plugin"

[metadata]
name = "lang-python"

[spec]
version = "0.1.0"
# Bytecode caches (PEP 3147) and installed packages (`site-packages`, the
# PEP 405 virtual environment directory `.venv`).
ignores = ["__pycache__/", "site-packages/", ".venv/"]

[spec.runtime]
command = "./lang-python"

# The header of protoc's Python output (`*_pb2.py`), which says DO NOT EDIT
# without the `@generated` of `core`.
[spec.generated]
markers = ['Generated by the protocol buffer compiler\.\s+DO NOT EDIT!']
