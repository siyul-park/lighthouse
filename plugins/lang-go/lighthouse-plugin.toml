apiVersion = "lighthouse/v1alpha1"
kind = "Plugin"

[metadata]
name = "lang-go"

[spec]
version = "0.1.0"
# What the go command leaves out of `./...`: directories named `testdata` or
# `vendor`, and those whose name starts with `.` or `_` (`go help packages`).
# `.lighthouse` is re-included: it holds the decisions of the project.
ignores = ["testdata/", "vendor/", "_*/", ".*/", "!/.lighthouse/"]
catalog = "decisions"

[spec.runtime]
command = "./lang-go"

# `Code generated` and `DO NOT EDIT` on separate lines of one comment, as
# protoc-gen-gogo writes them (the three-line header of gogoproto output),
# which the standard marker of `core` (one line) misses.
[spec.generated]
markers = ['(?s)Code generated .*DO NOT EDIT']
