apiVersion = "lighthouse/v1alpha1"
kind = "Plugin"

[metadata]
name = "lang-go"

[spec]
version = "0.1.0"
# What the go command leaves out of `./...` in any language's files:
# directories named `testdata` or `vendor` (`go help packages`). Those it
# ignores by a leading `.` or `_` are the `ignores` of the Go language, which
# the provider declares: `__tests__/` or `.github/` stay files of the project
# for the other languages.
ignores = ["testdata/", "vendor/"]
# goenv selects the Go version of the directory from `.go-version`
# (https://github.com/go-nv/goenv/blob/master/docs/COMMANDS.md#goenv-local).
versionFiles = [".go-version"]
# goenv 3 points GOCACHE at a directory of its own per version
# (`$GOENV_ROOT/versions/<v>/go-build-<os>-<arch>`), which the sandbox of a
# program cannot create. With this the go command keeps its default build
# cache in the user's cache directory, which the sandbox allows
# (https://github.com/go-nv/goenv/blob/master/docs/ENVIRONMENT_VARIABLES.md).
env = { GOENV_DISABLE_GOCACHE = "1" }
catalog = "decisions"

[spec.runtime]
command = "./lang-go"

# `Code generated` and `DO NOT EDIT` on separate lines of one comment, as
# protoc-gen-gogo writes them (the three-line header of gogoproto output),
# which the standard marker of `core` (one line) misses.
[spec.generated]
markers = ['(?s)Code generated .*DO NOT EDIT']
