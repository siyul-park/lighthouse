[workspace]
resolver = "3"
members = ["crates/*", "plugins/lang-rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
libc = "0.2"
ignore = "0.4"
include_dir = "0.7"
insta = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
thiserror = "2"
toml = "0.9"

lighthouse-builtin = { path = "crates/lighthouse-builtin" }
lighthouse-config = { path = "crates/lighthouse-config" }
lighthouse-design = { path = "crates/lighthouse-design" }
lighthouse-engine = { path = "crates/lighthouse-engine" }
lighthouse-metrics = { path = "crates/lighthouse-metrics" }
lighthouse-model = { path = "crates/lighthouse-model" }
lighthouse-plugin = { path = "crates/lighthouse-plugin" }
lighthouse-protocol = { path = "crates/lighthouse-protocol" }
lighthouse-report = { path = "crates/lighthouse-report" }
lighthouse-rpc = { path = "crates/lighthouse-rpc" }
lighthouse-spec = { path = "crates/lighthouse-spec" }
