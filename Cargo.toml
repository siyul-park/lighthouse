[workspace]
resolver = "3"
members = ["crates/*", "plugins/fake-model", "plugins/lang-cel", "plugins/lang-markdown", "plugins/lang-rust", "plugins/lang-toml", "plugins/lang-yaml", "plugins/model-http", "plugins/model-local"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
assert_cmd = "2"
async-openai = { version = "=0.42.0", default-features = false, features = ["chat-completion-types"] }
base64 = "0.22"
cel = "0.15"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
comrak = { version = "=0.59.0", default-features = false }
globset = "0.4"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }
ignore = "0.4"
include_dir = "0.7"
insta = "1"
jsonschema = "0.58"
libc = "0.2"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-24", "download-binaries", "tls-native"] }
predicates = "3"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rayon = "1"
regex = "1"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
saphyr = "0.2.2"
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_norway = "0.9"
sha2 = "0.11"
similar = "2"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.9"
toml_edit = "0.25"
ureq = { version = "3.4.2", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

lang-cel = { path = "plugins/lang-cel" }
lighthouse-checks = { path = "crates/lighthouse-checks" }
lighthouse-engine = { path = "crates/lighthouse-engine" }
lighthouse-ml = { path = "crates/lighthouse-ml" }
lighthouse-model = { path = "crates/lighthouse-model" }
lighthouse-plugin = { path = "crates/lighthouse-plugin" }
lighthouse-process = { path = "crates/lighthouse-process" }
lighthouse-protocol = { path = "crates/lighthouse-protocol" }
lighthouse-report = { path = "crates/lighthouse-report" }
lighthouse-resource = { path = "crates/lighthouse-resource" }
lighthouse-rpc = { path = "crates/lighthouse-rpc" }
lighthouse-session = { path = "crates/lighthouse-session" }
lighthouse-spec = { path = "crates/lighthouse-spec" }
lighthouse-store = { path = "crates/lighthouse-store" }
